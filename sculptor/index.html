<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spatial Sculptor AR - Motion Logo Reveal</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #050508; font-family: 'Segoe UI', sans-serif; color: #fff; }
        #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        
        /* Cinematic Typography Overlay */
        #brandingOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }
        
        .logo-text {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0;
            transform: translateY(20px);
            transition: all 1.5s cubic-bezier(0.25, 1, 0.5, 1);
            text-shadow: 0 0 20px rgba(0, 229, 255, 0.6);
        }
        
        .logo-subtext {
            font-size: 11px;
            font-weight: 400;
            letter-spacing: 4px;
            text-transform: uppercase;
            color: #00e5ff;
            margin-top: 8px;
            opacity: 0;
            transition: all 2s cubic-bezier(0.25, 1, 0.5, 1) 0.5s;
        }
        
        #replayBtn {
            position: absolute;
            bottom: 30px;
            z-index: 3;
            background: rgba(26, 26, 36, 0.8);
            border: 1px solid #333;
            color: #aaa;
            padding: 10px 20px;
            border-radius: 4px;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        #replayBtn:hover { border-color: #00e5ff; color: #fff; box-shadow: 0 0 15px rgba(0,229,255,0.3); }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="brandingOverlay">
        <div id="mainTitle" class="logo-text">Spatial Sculptor</div>
        <div id="subTitle" class="logo-subtext">Augmented Reality</div>
    </div>

    <button id="replayBtn">Trigger Reveal Sequence</button>
    <canvas id="canvas3d"></canvas>

    <script>
        let scene, camera, renderer, clock;
        let gridHelper, blocks = [];
        const totalBlockCount = 200;
        const blockGroup = new THREE.Group();
        
        // Target structural layout positions forming a giant geometric monogram 'S'
        const logoStructurePoints = [
            {x:-2, y:4, z:0},  {x:-1, y:4, z:0},  {x:0, y:4, z:0},  {x:1, y:4, z:0},  {x:2, y:4, z:0},
            {x:-2, y:3, z:0},                                                         {x:2, y:3, z:1},
            {x:-2, y:2, z:0},                                                         {x:2, y:2, z:-1},
            {x:-2, y:1, z:0},  {x:-1, y:1, z:0},  {x:0, y:1, z:0},  {x:1, y:1, z:0},  {x:2, y:1, z:0},
                                                                                      {x:2, y:0, z:0},
                                                                                      {x:2, y:-1, z:0},
            {x:-2, y:-2, z:0}, {x:-1, y:-2, z:0}, {x:0, y:-2, z:0}, {x:1, y:-2, z:0}, {x:2, y:-2, z:0},
            // Generates structural thickness anchoring into depth axes
            {x:-2, y:4, z:-1}, {x:0, y:4, z:-1}, {x:2, y:4, z:-1}, {x:-2, y:1, z:-1}, {x:2, y:-2, z:-1}
        ];

        function init() {
            const canvas = document.getElementById('canvas3d');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x040407);
            scene.fog = new THREE.FogExp2(0x040407, 0.015);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            // Dramatic low-angle cinematic camera placement framing the grid horizon
            camera.position.set(0, 8, 35);
            camera.lookAt(0, 1, 0);

            renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.shadowMap.enabled = true;

            clock = new THREE.Clock();

            // Architectural Construction Reference Grid System
            gridHelper = new THREE.GridHelper(60, 60, 0x00e5ff, 0x1a1a26);
            gridHelper.position.y = -3;
            gridHelper.material.opacity = 0;
            gridHelper.material.transparent = true;
            scene.add(gridHelper);

            // Studio Ambient and Neon Highlights
            scene.add(new THREE.AmbientLight(0xffffff, 0.1));
            
            const dynamicKeyLight = new THREE.DirectionalLight(0xffffff, 1.5);
            dynamicKeyLight.position.set(20, 40, 20);
            scene.add(dynamicKeyLight);

            const neonRimLight = new THREE.PointLight(0x00e5ff, 3, 50);
            neonRimLight.position.set(0, 5, -5);
            scene.add(neonRimLight);

            const amberAccentLight = new THREE.PointLight(0xffea00, 2, 40);
            amberAccentLight.position.set(-10, -2, 10);
            scene.add(amberAccentLight);

            buildRevealBlocks();
            scene.add(blockGroup);

            document.getElementById('replayBtn').addEventListener('click', restartRevealSequence);
            window.addEventListener('resize', onWindowResize);

            animate();
        }

        function buildRevealBlocks() {
            // High-fidelity physical materials showing refraction and structural alignment properties
            const materialPalette = [
                new THREE.MeshPhysicalMaterial({ color: 0x00e5ff, roughness: 0.1, metalness: 0.1, transmission: 0.6, thickness: 0.5, transparent: true }),
                new THREE.MeshPhysicalMaterial({ color: 0xffea00, roughness: 0.2, metalness: 0.8, clearcoat: 1.0 }),
                new THREE.MeshStandardMaterial({ color: 0x181824, roughness: 0.4, metalness: 0.9 }),
                new THREE.MeshPhysicalMaterial({ color: 0xffffff, roughness: 0.0, metalness: 0.2, transmission: 0.9, transparent: true })
            ];

            const boxGeometry = new THREE.BoxGeometry(0.8, 0.8, 0.8);

            for (let i = 0; i < totalBlockCount; i++) {
                const randomMaterial = materialPalette[Math.floor(Math.random() * materialPalette.length)];
                const mesh = new THREE.Mesh(boxGeometry, randomMaterial.clone());
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                // Capture structural initial, randomized, and terminal data maps
                const originalPhotoX = (Math.random() - 0.5) * 16;
                const originalPhotoY = (Math.random() - 0.5) * 12 + 4;
                const originalPhotoZ = 12; // Formulates a flat floating window slice relative to perspective axis

                mesh.position.set(originalPhotoX, originalPhotoY, originalPhotoZ);
                
                // Seed secondary scattered flight paths 
                const scatterVector = new THREE.Vector3(
                    (Math.random() - 0.5) * 35,
                    Math.random() * 15 - 2,
                    (Math.random() - 0.5) * 35
                );

                // Map target coordinates using the structural logo template array safely
                const targetPoint = logoStructurePoints[i % logoStructurePoints.length];
                const logoVector = new THREE.Vector3(
                    targetPoint.x * 1.1, 
                    targetPoint.y * 1.1 + 2, 
                    targetPoint.z * 1.1
                );

                mesh.userData = {
                    photoPos: new THREE.Vector3(originalPhotoX, originalPhotoY, originalPhotoZ),
                    scatterPos: scatterVector,
                    logoPos: logoVector,
                    randomRotationSpeed: new THREE.Euler(Math.random()*0.02, Math.random()*0.02, Math.random()*0.02)
                };

                blocks.push(mesh);
                blockGroup.add(mesh);
            }
        }

        function restartRevealSequence() {
            clock.stop();
            clock.start();
            
            // Re-zero interface overlay visibility classes cleanly
            const title = document.getElementById('mainTitle');
            const subtitle = document.getElementById('subTitle');
            title.style.opacity = '0';
            title.style.transform = 'translateY(20px)';
            subtitle.style.opacity = '0';
            
            camera.position.set(0, 8, 35);
            camera.lookAt(0, 1, 0);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsedTime = clock.getElapsedTime();

            // PHASE 1: The Live View Baseline (0.0s -> 1.5s)
            if (elapsedTime < 1.5) {
                const progress = elapsedTime / 1.5;
                gridHelper.material.opacity = progress * 0.25; // Subtle architectural reference grid warmup
                
                blocks.forEach(block => {
                    block.position.copy(block.userData.photoPos);
                    block.rotation.set(0, 0, 0);
                    block.material.opacity = 1.0;
                });
            } 
            // PHASE 2: Volumetric Voxelization Explosion (1.5s -> 4.0s)
            else if (elapsedTime >= 1.5 && elapsedTime < 4.0) {
                const phaseProgress = (elapsedTime - 1.5) / 2.5;
                // Custom smooth sinusoidal acceleration curve profiling
                const easeOutCurve = Math.sin(phaseProgress * Math.PI * 0.5);

                gridHelper.material.opacity = 0.25 + (easeOutCurve * 0.35);

                blocks.forEach(block => {
                    block.position.lerpVectors(block.userData.photoPos, block.userData.scatterPos, easeOutCurve);
                    block.rotation.x += block.userData.randomRotationSpeed.x;
                    block.rotation.y += block.userData.randomRotationSpeed.y;
                });
                
                // Sweep camera position dynamically down the grid pipeline
                camera.position.z = 35 - (easeOutCurve * 8);
                camera.position.y = 8 - (easeOutCurve * 3);
                camera.lookAt(0, 1, 0);
            } 
            // PHASE 3 & 4: Structural Architecture Assembly and Logo Freeze (4.0s+)
            else {
                const phaseProgress = Math.min((elapsedTime - 4.0) / 3.0, 1.0);
                const easeInOutCurve = phaseProgress * phaseProgress * (3.0 - 2.0 * phaseProgress);

                blocks.forEach(block => {
                    block.position.lerpVectors(block.userData.scatterPos, block.userData.logoPos, easeInOutCurve);
                    
                    // Smoothly arrest block rotational momentums down to target orientation metrics
                    block.rotation.x = THREE.MathUtils.lerp(block.rotation.x, 0, easeInOutCurve * 0.1);
                    block.rotation.y = THREE.MathUtils.lerp(block.rotation.y, 0, easeInOutCurve * 0.1);
                    block.rotation.z = THREE.MathUtils.lerp(block.rotation.z, 0, easeInOutCurve * 0.1);
                });

                // Slowly orbit the structured asset during structural locking sequence
                const slowOrbitAngle = (elapsedTime - 4.0) * 0.05;
                blockGroup.rotation.y = easeInOutCurve * slowOrbitAngle;

                camera.position.z = 27 - (easeInOutCurve * 3);
                camera.lookAt(0, 2, 0);

                // Reveal typography overlay directly matching animation step convergence
                if (phaseProgress > 0.5) {
                    const title = document.getElementById('mainTitle');
                    const subtitle = document.getElementById('subTitle');
                    title.style.opacity = '1';
                    title.style.transform = 'translateY(0)';
                    subtitle.style.opacity = '1';
                }
            }

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
    </script>
</body>
</html>
