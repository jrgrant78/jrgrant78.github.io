<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project A.R.I.S. - Tactical Intercept Matrix</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #020205;
            color: #00ffcc;
            user-select: none;
        }

        /* Video Pass-Through Layer */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: block;
            pointer-events: auto;
        }

        /* Landscape Orientation Strict Enforcement Override Overlay */
        #portrait-warning {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #04060f;
            color: #00ffcc;
            z-index: 99999;
            box-sizing: border-box;
            padding: 40px;
            justify-content: center;
            align-items: center;
            text-align: center;
            border: 4px solid #ff0055;
            letter-spacing: 1px;
        }
        @media (orientation: portrait) {
            #portrait-warning { display: flex; }
        }

        /* Tactical Cyber Visor HUD Overlay Architecture */
        #hud-visor-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            box-sizing: border-box;
            border: 20px solid rgba(0, 255, 204, 0.03);
        }

        .hud-panel {
            position: absolute;
            background: rgba(4, 6, 15, 0.9);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            padding: 12px;
            border-radius: 4px;
            pointer-events: auto;
        }

        #hud-top-left {
            top: 25px;
            left: 25px;
            min-width: 260px;
        }

        #hud-top-right {
            top: 25px;
            right: 25px;
            text-align: right;
            min-width: 240px;
        }

        #hud-top-center {
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            min-width: 300px;
            text-align: center;
        }

        /* Tactical Vitals & Threat Assessment HUD Bars */
        .vitals-container {
            margin-top: 8px;
            width: 100%;
            background: rgba(255, 255, 255, 0.1);
            height: 10px;
            border: 1px solid #00ffcc;
            border-radius: 2px;
            overflow: hidden;
            position: relative;
        }

        .vitals-bar-fill {
            height: 100%;
            width: 100%;
            background: #00ffcc;
            box-shadow: 0 0 8px #00ffcc;
            transition: width 0.1s linear, background-color 0.3s ease;
        }

        .vitals-bar-fill.danger {
            background: #ff0055;
            box-shadow: 0 0 8px #ff0055;
        }

        #seen-status-indicator {
            font-weight: bold;
            letter-spacing: 1px;
            transition: all 0.2s ease;
        }

        .status-clear { color: #00ffcc; text-shadow: 0 0 4px #00ffcc; }
        .status-alert { color: #ff0055; text-shadow: 0 0 8px #ff0055; animation: pulse-text 1s infinite alternate; }

        @keyframes pulse-text {
            from { opacity: 0.6; } to { opacity: 1; }
        }

        /* 2D Track-Up Minimap & Integrated Compass Layout */
        #minimap-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 150px;
            height: 150px;
            z-index: 100;
            pointer-events: none;
        }

        #minimapCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: block;
        }

        #compass-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 162px;
            height: 162px;
            border: 2px dashed rgba(0, 255, 204, 0.25);
            border-radius: 50%;
            transform-origin: center;
            will-change: transform;
        }

        .compass-marker {
            position: absolute;
            font-family: monospace;
            font-size: 11px;
            font-weight: 900;
            color: #00ffcc;
        }

        #marker-n { top: 2px; left: 50%; transform: translateX(-50%); color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        #marker-s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        #marker-e { right: 4px; top: 50%; transform: translateY(-50%); }
        #marker-w { left: 4px; top: 50%; transform: translateY(-50%); }

        .hud-header {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff0055;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .hud-readout {
            font-size: 11px;
            line-height: 1.5;
            color: #00ffcc;
            text-shadow: 0 0 4px rgba(0, 255, 204, 0.5);
        }

        /* Crosshair Reticle Matrix */
        #targeting-matrix {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        #targeting-matrix::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff0055;
        }

        #action-dashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .visor-btn {
            background: rgba(6, 10, 25, 0.85);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
            transition: all 0.2s ease;
        }

        .visor-btn:active {
            transform: scale(0.95);
        }

        .visor-btn.active {
            background: #00ffcc;
            color: #020205;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>

<body>

        <div id="minimap-container">

    <div id="action-dashboard">

    <script>
        let scene, camera, renderer;
        let cameraStream = null;
        let isARActive = false;
        
        let isFirstGyroFrame = true;
        let gyroYawOffset = 0;
        let lookYaw = 0;
        let lookPitch = 0;
        let isDragging = false;
        let previousPointerX = 0;
        let previousPointerY = 0;

        let currentCoordinates = { lat: 40.7580, lon: -73.9855 };
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 };
        let hasLockedInitialAnchor = false;
        let mapLoadedForAnchor = false;
        let osmFetchController = null;
        const R_EARTH = 6378137;

        // Gameplay Parameters Matrix
        let playerHealth = 100.0;
        let timeLastSeenByThreat = 0; // Timestamp tracking disengagement timers
        let isCurrentlyDetected = false;
        let alertStateActive = false;
        const ALERT_COOLDOWN_MS = 5000;

        // Visual Layout Databases
        const spatialAnomaliesCollection = [];
        const mapStructuralMeshes = new THREE.Group();
        const globalTrafficNodes = [];
        const renderedStreetsList = [];
        const renderedBuildingsList = [];
        const renderedPedestrianList = []; 
        const tacticalDronesCollection = []; 
        let anomaliesCollectedCount = 0;

        // Pre-calculated geometric angles for optimization
        const CONE_RADIUS = 3.8;
        const CONE_HEIGHT = 35.0;
        const CONE_SEMI_ANGLE = Math.atan(CONE_RADIUS / CONE_HEIGHT); 

        /* ==========================================================================
           MATHEMATICAL CORE: INERTIAL SENSOR QUATERNION CONVERTER
           ========================================================================= */
        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3(0, 0, 1);
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 

            return function (alpha, beta, gamma, orient) {
                const q = new THREE.Quaternion();
                euler.set(beta, alpha, -gamma, 'YXZ'); 
                q.setFromEuler(euler); 
                q.multiply(q1); 
                q.multiply(q0.setFromAxisAngle(zee, -orient)); 
                return q;
            };
        })();

        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        /* ==========================================================================
           AUTOMATIC HARDWARE ORIENTATION & SCREEN LOCK INJECTION
           ========================================================================= */
        function autoInitializeSensors() {
            const viewportCanvas = document.getElementById('canvas3d');

            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;
                
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;

                lookYaw -= deltaX * 0.003;
                lookPitch -= deltaY * 0.003;
                lookPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lookPitch));
                
                if (isFirstGyroFrame) {
                    const eulerRotation = new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ');
                    camera.quaternion.setFromEuler(eulerRotation);
                }
            });

            window.addEventListener('pointerup', () => isDragging = false);

            const requestHardwareSensors = () => {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(e => console.warn("Orientation lock sandbox constraint:", e));
                        }
                    }).catch(e => console.warn("Fullscreen error:", e));
                }

                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
                        }
                    }).catch(err => console.error("Hardware calibration blocked:", err));
                } else {
                    window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
                }
            };

            window.addEventListener('pointerdown', requestHardwareSensors, { once: true });
            
            document.getElementById('arToggleBtn').addEventListener('click', toggleARCameraStream);
            document.getElementById('stepSimBtn').addEventListener('click', simulateGpsMovementUpdate);
        }

        function handleVisorHardwareOrientation(e) {
            if (e.alpha === null) return;
            
            let alpha = THREE.MathUtils.degToRad(e.alpha);
            let beta = THREE.MathUtils.degToRad(e.beta);
            let gamma = THREE.MathUtils.degToRad(e.gamma);
            let orient = (window.orientation || window.screen.orientation?.angle || 0) * Math.PI / 180;

            let qSensor = getSensorQuaternion(alpha, beta, gamma, orient);
            
            if (isFirstGyroFrame) {
                let currentEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                let sensorEuler = new THREE.Euler().setFromQuaternion(qSensor, 'YXZ');
                gyroYawOffset = currentEuler.y - sensorEuler.y;
                isFirstGyroFrame = false;
            }

            let finalEuler = new THREE.Euler().setFromQuaternion(qSensor, 'YXZ');
            finalEuler.y += gyroYawOffset;
            camera.quaternion.setFromEuler(finalEuler);
        }

        /* ==========================================================================
           REAL-WORLD MAP DOWNLOAD ENGINE (3-MILE STRATEGY)
           ========================================================================= */
        async function fetchLiveOpenStreetMapData(lat, lon) {
            if (osmFetchController) osmFetchController.abort();
            osmFetchController = new AbortController();

            updateTelemetryDisplay("STREAMING DATA...");

            const overpassEndpoints = [
                `https://overpass-api.de/api/interpreter`,
                `https://overpass.kumi.systems/api/interpreter`,
                `https://lz4.overpass-api.de/api/interpreter`
            ];

            const boundingBoxRange = 0.0435; 
            const minLat = lat - boundingBoxRange;
            const minLon = lon - boundingBoxRange;
            const maxLat = lat + boundingBoxRange;
            const maxLon = lon + boundingBoxRange;

            const query = `[out:json][timeout:35];(way["building"](${minLat},${minLon},${maxLat},${maxLon});way["highway"](${minLat},${minLon},${maxLat},${maxLon}););out body;>;out skel qt;`;
            
            let data = null;
            let success = false;

            for (let i = 0; i < overpassEndpoints.length; i++) {
                const localMirrorController = new AbortController();
                const globalSignalListener = () => localMirrorController.abort();
                osmFetchController.signal.addEventListener('abort', globalSignalListener);
                const networkTimeoutId = setTimeout(() => localMirrorController.abort(), 12000);

                try {
                    const fetchUrl = `${overpassEndpoints[i]}?data=${encodeURIComponent(query)}`;
                    const response = await fetch(fetchUrl, {
                        method: 'GET',
                        signal: localMirrorController.signal
                    });
                    
                    clearTimeout(networkTimeoutId);
                    osmFetchController.signal.removeEventListener('abort', globalSignalListener);
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    data = await response.json();
                    if (data && data.elements && data.elements.length > 0) {
                        success = true;
                        break; 
                    }
                } catch (err) {
                    clearTimeout(networkTimeoutId);
                    osmFetchController.signal.removeEventListener('abort', globalSignalListener);
                    if (osmFetchController.signal.aborted) return;
                }
            }

            if (success && data) {
                mapLoadedForAnchor = true;
                parseAndBuildOSMWorld(data, anchorCoordinates.lat, anchorCoordinates.lon);
            } else {
                updateTelemetryDisplay("FALLBACK ACTIVE");
                generateProceduralBackupInfrastructure();
            }
        }

        function parseAndBuildOSMWorld(osmData, anchorLat, anchorLon) {
            while(mapStructuralMeshes.children.length > 0) {
                const mesh = mapStructuralMeshes.children[0];
                if (mesh.geometry) mesh.geometry.dispose();
                if (mesh.material) mesh.material.dispose();
                mapStructuralMeshes.remove(mesh);
            }
            globalTrafficNodes.length = 0;
            renderedStreetsList.length = 0;
            renderedBuildingsList.length = 0;
            renderedPedestrianList.length = 0;

            if (!osmData || !osmData.elements) return;

            const nodesLookup = {};
            osmData.elements.forEach(element => {
                if (element.type === 'node') {
                    const localMeters = latLonToLocalMeters(element.lat, element.lon, anchorLat, anchorLon);
                    nodesLookup[element.id] = { x: localMeters.x, z: localMeters.z };
                }
            });

            osmData.elements.forEach(element => {
                if (element.type === 'way' && element.nodes) {
                    const points = [];
                    let sumX = 0, sumZ = 0;
                    
                    element.nodes.forEach(nodeId => {
                        if (nodesLookup[nodeId]) {
                            points.push(nodesLookup[nodeId]);
                            sumX += nodesLookup[nodeId].x;
                            sumZ += nodesLookup[nodeId].z;
                        }
                    });

                    if (points.length < 2) return;

                    const cx = sumX / points.length;
                    const cz = sumZ / points.length;
                    
                    const distanceRadiusMetric = Math.hypot(cx, cz);
                    if (distanceRadiusMetric > 600) return;

                    if (element.tags && element.tags.building) {
                        buildNeonStructuralHulls(points, element.tags, cx, cz);
                    } else if (element.tags && element.tags.highway) {
                        const pedTiers = ['footway', 'pedestrian', 'path', 'sidewalk'];
                        if (pedTiers.includes(element.tags.highway) || element.tags.footway) {
                            buildPedestrianConduits(points, element.tags);
                        } else {
                            buildNeonVectorPathways(points, element.tags);
                        }
                    }
                }
            });

            updateTelemetryDisplay("MATRIX COMPILED");
            spawnQuantumAnomalies();
            deployTacticalDronePlatoon();
        }

        /* ==========================================================================
           HIGH-PERFORMANCE COMPILERS: OCCLUSION HULLS, STREETS & PEDESTRIAN PATHS
           ========================================================================= */
        function buildNeonStructuralHulls(points, tags, cx, cz) {
            if (points.length < 3) return;

            const shapeOutline = new THREE.Shape();
            shapeOutline.moveTo(points[0].x - cx, -(points[0].z - cz));
            for (let i = 1; i < points.length; i++) {
                shapeOutline.lineTo(points[i].x - cx, -(points[i].z - cz));
            }
            shapeOutline.closePath();

            let buildingHeight = (tags && tags.height) ? parseFloat(tags.height) : (12 + Math.random() * 20);
            if (tags && tags["building:levels"]) buildingHeight = parseInt(tags["building:levels"]) * 3.5;
            buildingHeight = Math.min(buildingHeight, 60);

            const extrusionSettings = { depth: buildingHeight, bevelEnabled: false };
            const geom = new THREE.ExtrudeGeometry(shapeOutline, extrusionSettings);
            
            const blackWallMaterial = new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true });
            const solidBlackMesh = new THREE.Mesh(geom, blackWallMaterial);

            const edgesGeometry = new THREE.EdgesGeometry(geom);
            const hullColor = Math.random() > 0.7 ? 0x00ffcc : 0xff0055;
            const lineMaterial = new THREE.LineBasicMaterial({ color: hullColor });
            const buildingWireframeMesh = new THREE.LineSegments(edgesGeometry, lineMaterial);
            
            const buildingCompositeGroup = new THREE.Group();
            buildingCompositeGroup.add(solidBlackMesh);
            buildingCompositeGroup.add(buildingWireframeMesh);
            
            buildingCompositeGroup.rotation.x = -Math.PI / 2;
            buildingCompositeGroup.position.set(cx, 0, cz);
            
            mapStructuralMeshes.add(buildingCompositeGroup);
            renderedBuildingsList.push({ points: points, color: hullColor });
        }

        function buildNeonVectorPathways(points, tags) {
            const laneHalfWidth = 4.0; 
            const vertices = [];
            const indices = [];
            
            const leftCurbyPoints = [];
            const rightCurbyPoints = [];
            const centerLinePoints = [];
            const pointsCount = points.length;
            const computedNormals = new Array(pointsCount);

            const mainRoadTiers = ['motorway', 'trunk', 'primary', 'secondary', 'tertiary'];
            const isMainRoad = tags && tags.highway && mainRoadTiers.includes(tags.highway);

            for (let i = 0; i < pointsCount; i++) {
                let dx, dz;
                if (i === 0) {
                    dx = points[1].x - points[0].x; dz = points[1].z - points[0].z;
                } else if (i === pointsCount - 1) {
                    dx = points[pointsCount - 1].x - points[pointsCount - 2].x; dz = points[pointsCount - 1].z - points[pointsCount - 2].z;
                } else {
                    const dx1 = points[i].x - points[i - 1].x; const dz1 = points[i].z - points[i - 1].z;
                    const dx2 = points[i + 1].x - points[i].x; const dz2 = points[i + 1].z - points[i].z;
                    dx = (dx1 + dx2) / 2; dz = (dz1 + dz2) / 2;
                }
                const length = Math.hypot(dx, dz) || 1;
                computedNormals[i] = { x: -dz / length, z: dx / length };
            }

            for (let i = 0; i < pointsCount; i++) {
                const pt = points[i];
                const norm = computedNormals[i];

                const lx = pt.x + norm.x * laneHalfWidth;
                const lz = pt.z + norm.z * laneHalfWidth;
                const rx = pt.x - norm.x * laneHalfWidth;
                const rz = pt.z - norm.z * laneHalfWidth;

                vertices.push(lx, 0.01, lz); 
                vertices.push(rx, 0.01, rz); 

                leftCurbyPoints.push(new THREE.Vector3(lx, 0.02, lz));
                rightCurbyPoints.push(new THREE.Vector3(rx, 0.02, rz));
                centerLinePoints.push(new THREE.Vector3(pt.x, 0.03, pt.z));

                if (i < pointsCount - 1) {
                    const cL = i * 2, cR = i * 2 + 1;
                    const nL = (i + 1) * 2, nR = (i + 1) * 2 + 1;
                    indices.push(cL, cR, nL);
                    indices.push(cR, nR, nL);
                }
                globalTrafficNodes.push(new THREE.Vector3(pt.x, 1.7, pt.z));
            }

            const roadGeometry = new THREE.BufferGeometry();
            roadGeometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            roadGeometry.setIndex(indices);
            roadGeometry.computeVertexNormals();
            const roadDeckMesh = new THREE.Mesh(roadGeometry, new THREE.MeshBasicMaterial({ color: 0x010103, side: THREE.DoubleSide }));
            mapStructuralMeshes.add(roadDeckMesh);

            const yellowCurbMat = new THREE.LineBasicMaterial({ color: 0xffff00 });
            mapStructuralMeshes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(leftCurbyPoints), yellowCurbMat));
            mapStructuralMeshes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rightCurbyPoints), yellowCurbMat));

            if (isMainRoad) {
                const centerDashedGeo = new THREE.BufferGeometry().setFromPoints(centerLinePoints);
                const dashedCenterMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3 });
                const centralConduitLine = new THREE.Line(centerDashedGeo, dashedCenterMat);
                centralConduitLine.computeLineDistances();
                mapStructuralMeshes.add(centralConduitLine);
            }

            renderedStreetsList.push({ points: points, isMain: isMainRoad });
        }

        function buildPedestrianConduits(points, tags) {
            const pathPoints = [];
            points.forEach(pt => {
                pathPoints.push(new THREE.Vector3(pt.x, 0.04, pt.z)); 
                globalTrafficNodes.push(new THREE.Vector3(pt.x, 1.7, pt.z));
            });

            const isCrosswalk = tags && (tags.footway === 'crosswalk' || tags.highway === 'crossing');
            const pedestrianGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
            const paleYellowColor = 0xfffa9e; 
            let pedestrianMaterial;

            if (isCrosswalk) {
                pedestrianMaterial = new THREE.LineDashedMaterial({ color: paleYellowColor, dashSize: 1.5, gapSize: 1.5, linewidth: 2 });
            } else {
                pedestrianMaterial = new THREE.LineBasicMaterial({ color: paleYellowColor, linewidth: 2 });
            }

            const pedestrianLineMesh = new THREE.Line(pedestrianGeo, pedestrianMaterial);
            if (isCrosswalk) pedestrianLineMesh.computeLineDistances();
            
            mapStructuralMeshes.add(pedestrianLineMesh);
            renderedPedestrianList.push({ points: points, isCrosswalk: isCrosswalk });
        }

        /* ==========================================================================
           ENTITIES COMPILER: MECHANICAL SPHERICAL PATROL DRONES (ANIMATABLE LIMBS)
           ========================================================================= */
        function compileTacticalPatrolDrone() {
            const droneCompositeGroup = new THREE.Group();
            const chassisColor = 0xff0055;
            const mechanicalAccentColor = 0x00ffcc;

            // 1. Core Spherical Chassis
            const bodyGeo = new THREE.SphereGeometry(1.3, 10, 10);
            const solidInteriorMat = new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true });
            const bodyMesh = new THREE.Mesh(bodyGeo, solidInteriorMat);
            
            const frameEdges = new THREE.EdgesGeometry(bodyGeo);
            const wireframeMat = new THREE.LineBasicMaterial({ color: chassisColor });
            const bodyWireframeMesh = new THREE.LineSegments(frameEdges, wireframeMat);
            droneCompositeGroup.add(bodyMesh, bodyWireframeMesh);

            // Stored references for fully independent limb mapping
            let leftArmPivot = new THREE.Group();
            let rightArmPivot = new THREE.Group();

            // 2. Articulated Mechanical Limb Architecture
            function compileBentClawLimb(isLeftHandSide, targetGroup) {
                const mirrorMultiplier = isLeftHandSide ? -1 : 1;
                const componentMat = new THREE.MeshBasicMaterial({ color: chassisColor });
                const jointMat = new THREE.MeshBasicMaterial({ color: mechanicalAccentColor });

                // Upper Arm Segment
                const upperArmSegmentMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2), componentMat);
                upperArmSegmentMesh.position.set(0.5 * mirrorMultiplier, -0.3, 0);
                upperArmSegmentMesh.rotation.z = (Math.PI / 3.5) * mirrorMultiplier;
                targetGroup.add(upperArmSegmentMesh);

                // Articulated Elbow Joint Capsule
                const elbowJointMesh = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), jointMat);
                elbowJointMesh.position.set(1.0 * mirrorMultiplier, -0.7, 0);
                targetGroup.add(elbowJointMesh);

                // Forearm Segment (Bending inward at elbow)
                const forearmSegmentMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.1), componentMat);
                forearmSegmentMesh.position.set(0.85 * mirrorMultiplier, -1.2, 0);
                forearmSegmentMesh.rotation.z = (-Math.PI / 4) * mirrorMultiplier;
                targetGroup.add(forearmSegmentMesh);

                // Manipulator Claw Assembly Array
                const clawWristGroup = new THREE.Group();
                clawWristGroup.position.set(0.5 * mirrorMultiplier, -1.6, 0);
                
                const clawBaseBox = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.2), jointMat);
                clawWristGroup.add(clawBaseBox);

                const leftPincerClaw = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.08), componentMat);
                leftPincerClaw.position.set(-0.08, -0.15, 0);
                leftPincerClaw.rotation.z = 0.2;
                
                const rightPincerClaw = leftPincerClaw.clone();
                rightPincerClaw.position.x = 0.08;
                rightPincerClaw.rotation.z = -0.2;

                clawWristGroup.add(leftPincerClaw, rightPincerClaw);
                targetGroup.add(clawWristGroup);

                targetGroup.position.x = 1.2 * mirrorMultiplier;
                return targetGroup;
            }

            droneCompositeGroup.add(compileBentClawLimb(true, leftArmPivot));  
            droneCompositeGroup.add(compileBentClawLimb(false, rightArmPivot)); 

            // 3. Volumetric Search Scanner Spotlight Cone (Narrower profile, extended length)
            const beamConicGeo = new THREE.ConeGeometry(CONE_RADIUS, CONE_HEIGHT, 16, 1, true);
            beamConicGeo.translate(0, -CONE_HEIGHT / 2, 0); 

            const scanningBeamMat = new THREE.MeshBasicMaterial({
                color: mechanicalAccentColor,
                transparent: true,
                opacity: 0.15,
                side: THREE.DoubleSide,
                depthWrite: false
            });
            const beamMesh = new THREE.Mesh(beamConicGeo, scanningBeamMat);
            
            const scanningRigGroup = new THREE.Group();
            scanningRigGroup.add(beamMesh);
            droneCompositeGroup.add(scanningRigGroup);

            return { 
                coreAsset: droneCompositeGroup, 
                dynamicScannerBeam: scanningRigGroup,
                leftArm: leftArmPivot,
                rightArm: rightArmPivot
            };
        }

        function deployTacticalDronePlatoon() {
            tacticalDronesCollection.forEach(d => scene.remove(d.meshElement));
            tacticalDronesCollection.length = 0;

            if (renderedStreetsList.length === 0) return;

            const patrolUnitsTotalCount = Math.min(3, renderedStreetsList.length);
            for (let i = 0; i < patrolUnitsTotalCount; i++) {
                const assignedStreetAsset = renderedStreetsList[i];
                if (assignedStreetAsset.points.length < 2) continue;

                const droneAssetMatrix = compileTacticalPatrolDrone();
                const initialPointFix = assignedStreetAsset.points[0];
                
                droneAssetMatrix.coreAsset.position.set(initialPointFix.x, 25.0, initialPointFix.z);
                scene.add(droneAssetMatrix.coreAsset);

                tacticalDronesCollection.push({
                    id: i,
                    meshElement: droneAssetMatrix.coreAsset,
                    scannerBeamGroup: droneAssetMatrix.dynamicScannerBeam,
                    leftArmAsset: droneAssetMatrix.leftArm,
                    rightArmAsset: droneAssetMatrix.rightArm,
                    routeCoordinates: assignedStreetAsset.points,
                    currentNodeIndex: 0,
                    patrolDirectionFactor: 1,
                    movementVelocityFactor: 0.08 + Math.random() * 0.05,
                    isChasingPlayer: false
                });
            }
        }

        /* ==========================================================================
           CORE TRACKING ENGINE: DYNAMICS, DETECTION & CHASE STATE ARRAYS
           ========================================================================= */
        function advanceDronePatrolSimulation(timestamp) {
            isCurrentlyDetected = false; 

            tacticalDronesCollection.forEach(drone => {
                let currentPosVector = drone.meshElement.position;
                let targetX = 0, targetZ = 0;

                // 1. DYNAMIC ENHANCED RADAR CHASE LOOP
                if (drone.isChasingPlayer || alertStateActive) {
                    // Lock interception target onto player coordinates space
                    targetX = camera.position.x;
                    targetZ = camera.position.z;
                    
                    // Break normal routines to intercept player at higher tracking speeds
                    const dx = targetX - currentPosVector.x;
                    const dz = targetZ - currentPosVector.z;
                    const distToPlayer = Math.hypot(dx, dz);

                    if (distToPlayer > 1.0) {
                        drone.meshElement.rotation.y = Math.atan2(dx, dz);
                        // Increase chase speed when target is confirmed
                        const interceptSpeed = drone.movementVelocityFactor * 1.5;
                        currentPosVector.x += (dx / distToPlayer) * interceptSpeed;
                        currentPosVector.z += (dz / distToPlayer) * interceptSpeed;
                    }
                } else {
                    // Standard Waypoint Traversal Routine
                    const targetCoordinatesFix = drone.routeCoordinates[drone.currentNodeIndex];
                    targetX = targetCoordinatesFix.x;
                    targetZ = targetCoordinatesFix.z;

                    const dx = targetX - currentPosVector.x;
                    const dz = targetZ - currentPosVector.z;
                    const distanceRemaining = Math.hypot(dx, dz);

                    if (distanceRemaining > 0.1) {
                        drone.meshElement.rotation.y = Math.atan2(dx, dz);
                    }

                    if (distanceRemaining < 2.0) {
                        drone.currentNodeIndex += drone.patrolDirectionFactor;
                        if (drone.currentNodeIndex >= drone.routeCoordinates.length || drone.currentNodeIndex < 0) {
                            drone.patrolDirectionFactor *= -1;
                            drone.currentNodeIndex += drone.patrolDirectionFactor * 2;
                            drone.currentNodeIndex = Math.max(0, Math.min(drone.currentNodeIndex, drone.routeCoordinates.length - 1));
                        }
                    } else {
                        currentPosVector.x += (dx / distanceRemaining) * drone.movementVelocityFactor;
                        currentPosVector.z += (dz / distanceRemaining) * drone.movementVelocityFactor;
                    }
                }

                // 2. LAYERED PROCEDURAL KINEMATICS (Harmonic Vertical Bobbing)
                const slowVerticalBobbing = Math.sin(timestamp * 0.0012 + drone.id) * 0.4;
                currentPosVector.y = 25.0 + slowVerticalBobbing;

                // Independent Limb Movement Arrays
                drone.leftArmAsset.rotation.x = Math.sin(timestamp * 0.0018 + drone.id) * 0.18;
                drone.leftArmAsset.rotation.z = Math.cos(timestamp * 0.0014 + drone.id) * 0.08;
                
                drone.rightArmAsset.rotation.x = Math.cos(timestamp * 0.0022 + drone.id) * 0.15;
                drone.rightArmAsset.rotation.z = Math.sin(timestamp * 0.0016 + drone.id) * 0.08;

                // 3. VOLUMETRIC SCANNER SLOW INTERPOLATED SWEEP (Ease In / Ease Out Harmonic Cycle)
                const slowSmoothedSwayAngle = Math.sin(timestamp * 0.0008 + drone.id * 1.5) * 0.35;
                drone.scannerBeamGroup.rotation.z = slowSmoothedSwayAngle;

                // 4. VECTOR CONE DETECTION MATRIX (Dot-Product Frustum Collision Test)
                const vecToPlayer = new THREE.Vector3().copy(camera.position).sub(currentPosVector);
                const distanceToPlayer = vecToPlayer.length();

                // Compute global vector direction of the current scanning beam
                const localBeamDir = new THREE.Vector3(0, -1, 0);
                localBeamDir.applyQuaternion(drone.scannerBeamGroup.quaternion);
                localBeamDir.applyQuaternion(drone.meshElement.quaternion).normalize();

                vecToPlayer.normalize();
                const beamTargetAngleCosine = localBeamDir.dot(vecToPlayer);
                const actualAngleDeviation = Math.acos(beamTargetAngleCosine);

                // Check if player falls inside cone parameters
                if (actualAngleDeviation <= CONE_SEMI_ANGLE && distanceToPlayer <= CONE_HEIGHT) {
                    isCurrentlyDetected = true;
                    drone.isChasingPlayer = true;
                } else {
                    // Individual disengagement if the specific tracker loses alignment
                    if (!alertStateActive) {
                        drone.isChasingPlayer = false;
                    }
                }
            });

            // 5. GLOBAL ALERT STATE CONTROLLER MATRIX
            if (isCurrentlyDetected) {
                timeLastSeenByThreat = timestamp;
                alertStateActive = true;
                
                // Deal tick-based damage to armor integrity layers while detected
                playerHealth = Math.max(0, playerHealth - 0.12);
            } else {
                // Keep alert status running until the 5-second cooldown clears
                if (alertStateActive && (timestamp - timeLastSeenByThreat >= ALERT_COOLDOWN_MS)) {
                    alertStateActive = false;
                    // Reset all drone intercept configurations to base parameters
                    tacticalDronesCollection.forEach(d => d.isChasingPlayer = false);
                }
            }

            // Sync structural parameters out to HTML engine modules
            updateVitalsHUD(timestamp);
        }

        function updateVitalsHUD(timestamp) {
            const barFill = document.getElementById('health-bar-fill');
            const statusInd = document.getElementById('seen-status-indicator');

            // RenderArmor Bar updates
            barFill.style.width = `${playerHealth}%`;
            if (playerHealth < 30) barFill.classList.add('danger');
            else barFill.classList.remove('danger');

            // Render Alert Tracker states
            if (isCurrentlyDetected) {
                statusInd.innerHTML = "TARGET LOCK DETECTED";
                statusInd.className = "status-alert";
            } else if (alertStateActive) {
                const secondsRemaining = Math.max(0, (ALERT_COOLDOWN_MS - (timestamp - timeLastSeenByThreat)) / 1000);
                statusInd.innerHTML = `LOST LOCK - DISENGAGING: ${secondsRemaining.toFixed(1)}s`;
                statusInd.className = "status-alert";
            } else {
                statusInd.innerHTML = "SYSTEMS SECURE";
                statusInd.className = "status-clear";
            }
        }

        function generateProceduralBackupInfrastructure() {
            const spacing = 80;
            const gridLimit = 4;
            
            for (let i = -gridLimit; i <= gridLimit; i++) {
                renderedStreetsList.push({ points: [{ x: i * spacing, z: -350 }, { x: i * spacing, z: 350 }], isMain: (i % 2 === 0) });
                renderedStreetsList.push({ points: [{ x: -350, z: i * spacing }, { x: 350, z: i * spacing }], isMain: true });
                
                renderedPedestrianList.push({ points: [{ x: i * spacing + 5.5, z: -350 }, { x: i * spacing + 5.5, z: 350 }], isCrosswalk: false });
                renderedPedestrianList.push({ points: [{ x: i * spacing - 5.5, z: -350 }, { x: i * spacing - 5.5, z: 350 }], isCrosswalk: false });
                renderedPedestrianList.push({ points: [{ x: -350, z: i * spacing + 5.5 }, { x: 350, z: i * spacing + 5.5 }], isCrosswalk: false });
            }

            for (let x = -gridLimit; x <= gridLimit; x++) {
                for (let z = -gridLimit; z <= gridLimit; z++) {
                    renderedPedestrianList.push({
                        points: [{ x: x * spacing - 6, z: z * spacing }, { x: x * spacing + 6, z: z * spacing }], isCrosswalk: true
                    });
                }
            }

            renderedStreetsList.forEach(street => {
                buildNeonVectorPathways(street.points, street.isMain ? { highway: 'primary' } : { highway: 'residential' });
            });
            renderedPedestrianList.forEach(ped => {
                buildPedestrianConduits(ped.points, ped.isCrosswalk ? { footway: 'crosswalk' } : { highway: 'footway' });
            });
            for (let x = -gridLimit; x < gridLimit; x++) {
                for (let z = -gridLimit; z < gridLimit; z++) {
                    const cx = x * spacing + spacing / 2; const cz = z * spacing + spacing / 2;
                    const size = 35;
                    buildNeonStructuralHulls([
                        { x: cx - size/2, z: cz - size/2 }, { x: cx + size/2, z: cz - size/2 },
                        { x: cx + size/2, z: cz + size/2 }, { x: cx - size/2, z: cz + size/2 }
                    ], null, cx, cz);
                }
            }
            spawnQuantumAnomalies();
            deployTacticalDronePlatoon();
        }

        /* ==========================================================================
           TRUE TRACK-UP RADAR COMPASS RENDER MATRIX
           ========================================================================= */
        function update2DMinimapSystem() {
            const minimapCanvas = document.getElementById('minimapCanvas');
            const minimapCtx = minimapCanvas.getContext('2d');
            if (!minimapCtx) return;

            const directionVector = new THREE.Vector3();
            camera.getWorldDirection(directionVector);
            const yawAngleRadians = Math.atan2(directionVector.x, -directionVector.z);

            const compassRing = document.getElementById('compass-ring');
            if (compassRing) {
                compassRing.style.transform = `rotate(${THREE.MathUtils.radToDeg(-yawAngleRadians)}deg)`;
            }

            minimapCtx.clearRect(0, 0, 150, 150);
            minimapCtx.save();
            
            minimapCtx.beginPath();
            minimapCtx.arc(75, 75, 72, 0, Math.PI * 2);
            minimapCtx.clip();

            minimapCtx.fillStyle = 'rgba(4, 6, 15, 0.95)';
            minimapCtx.fillRect(0, 0, 150, 150);

            minimapCtx.translate(75, 75);
            minimapCtx.rotate(-yawAngleRadians);

            const RADAR_ZOOM_SCALE = 0.65;

            // Yellow Streets Layer
            renderedStreetsList.forEach(street => {
                minimapCtx.strokeStyle = '#020205';
                minimapCtx.lineWidth = 12;
                minimapCtx.beginPath();
                street.points.forEach((pt, idx) => {
                    const dx = (pt.x - camera.position.x) * RADAR_ZOOM_SCALE;
                    const dz = (pt.z - camera.position.z) * RADAR_ZOOM_SCALE;
                    if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.stroke();

                minimapCtx.strokeStyle = '#ffff00';
                minimapCtx.lineWidth = 2;
                minimapCtx.stroke();

                if (street.isMain) {
                    minimapCtx.save();
                    minimapCtx.strokeStyle = '#ffffff';
                    minimapCtx.lineWidth = 1.5;
                    minimapCtx.setLineDash([4, 4]);
                    minimapCtx.beginPath();
                    street.points.forEach((pt, idx) => {
                        const dx = (pt.x - camera.position.x) * RADAR_ZOOM_SCALE;
                        const dz = (pt.z - camera.position.z) * RADAR_ZOOM_SCALE;
                        if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                    });
                    minimapCtx.stroke();
                    minimapCtx.restore();
                }
            });

            // Pale Yellow Pedestrian Sidewalk Layer
            renderedPedestrianList.forEach(ped => {
                minimapCtx.save();
                minimapCtx.strokeStyle = '#fffa9e'; 
                minimapCtx.lineWidth = 1.2;
                if (ped.isCrosswalk) minimapCtx.setLineDash([2, 3]);
                minimapCtx.beginPath();
                ped.points.forEach((pt, idx) => {
                    const dx = (pt.x - camera.position.x) * RADAR_ZOOM_SCALE;
                    const dz = (pt.z - camera.position.z) * RADAR_ZOOM_SCALE;
                    if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.stroke();
                minimapCtx.restore();
            });

            // Volumetric Solid Black Hulls
            renderedBuildingsList.forEach(b => {
                minimapCtx.fillStyle = '#000000'; 
                minimapCtx.strokeStyle = b.color === 0x00ffcc ? 'rgba(0, 255, 204, 0.5)' : 'rgba(255, 0, 85, 0.5)';
                minimapCtx.lineWidth = 1.5;
                minimapCtx.beginPath();
                b.points.forEach((pt, idx) => {
                    const dx = (pt.x - camera.position.x) * RADAR_ZOOM_SCALE;
                    const dz = (pt.z - camera.position.z) * RADAR_ZOOM_SCALE;
                    if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.closePath();
                minimapCtx.fill(); minimapCtx.stroke();
            });

            // Plasma Purple Anomalies Units
            spatialAnomaliesCollection.forEach(anomaly => {
                if (anomaly.collected) return;
                const dx = (anomaly.mesh.position.x - camera.position.x) * RADAR_ZOOM_SCALE;
                const dz = (anomaly.mesh.position.z - camera.position.z) * RADAR_ZOOM_SCALE;
                minimapCtx.fillStyle = '#bd00ff';
                minimapCtx.beginPath();
                minimapCtx.arc(dx, dz, 4.5, 0, Math.PI * 2);
                minimapCtx.fill();
            });

            // Threats Tracking Signatures (Red Blips)
            tacticalDronesCollection.forEach(drone => {
                const dx = (drone.meshElement.position.x - camera.position.x) * RADAR_ZOOM_SCALE;
                const dz = (drone.meshElement.position.z - camera.position.z) * RADAR_ZOOM_SCALE;
                
                minimapCtx.save();
                minimapCtx.fillStyle = alertStateActive ? '#ff0055' : '#ffaa00';
                minimapCtx.strokeStyle = '#00ffcc';
                minimapCtx.lineWidth = 1;
                
                minimapCtx.translate(dx, dz);
                minimapCtx.rotate(drone.meshElement.rotation.y);
                minimapCtx.beginPath();
                minimapCtx.moveTo(0, -6);   
                minimapCtx.lineTo(-4, 4);   
                minimapCtx.lineTo(4, 4);    
                minimapCtx.closePath();
                minimapCtx.fill(); minimapCtx.stroke();
                minimapCtx.restore();
            });

            minimapCtx.restore();

            // FIXED USER RETICLE INDEX (Track-Up Visual Alignment)
            minimapCtx.strokeStyle = '#00ffcc';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.arc(75, 75, 73, 0, Math.PI * 2);
            minimapCtx.stroke();

            minimapCtx.fillStyle = '#ff0055';
            minimapCtx.beginPath();
            minimapCtx.arc(75, 75, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            minimapCtx.strokeStyle = '#ff0055';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(75, 75);
            minimapCtx.lineTo(75, 56); 
            minimapCtx.stroke();
        }

        /* ==========================================================================
           HARDWARE GEOLOCATION TRAVERSAL ENGINES
           ========================================================================= */
        function initializeHighPrecisionGpsTracking() {
            if (!navigator.geolocation) return;

            navigator.geolocation.watchPosition(
                (position) => {
                    updatePlayerPositionFromGps(position.coords.latitude, position.coords.longitude, "LIVE GEOCAST");
                },
                (error) => { console.warn(`GPS delay: ${error.message}`); },
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }

        function updatePlayerPositionFromGps(latitude, longitude, signalSource) {
            currentCoordinates.lat = latitude;
            currentCoordinates.lon = longitude;

            if (!hasLockedInitialAnchor) {
                anchorCoordinates.lat = latitude;
                anchorCoordinates.lon = longitude;
                hasLockedInitialAnchor = true;
                fetchLiveOpenStreetMapData(anchorCoordinates.lat, anchorCoordinates.lon);
            }

            const localMetersOffset = latLonToLocalMeters(
                currentCoordinates.lat, currentCoordinates.lon, 
                anchorCoordinates.lat, anchorCoordinates.lon
            );

            camera.position.x = localMetersOffset.x;
            camera.position.z = localMetersOffset.z;
            camera.position.y = 1.7; 

            updateTelemetryDisplay(mapLoadedForAnchor ? "MATRIX ACTIVE" : "EXTRUDING DATA...");
        }

        function simulateGpsMovementUpdate() {
            const headingVector = new THREE.Vector3();
            camera.getWorldDirection(headingVector);
            headingVector.y = 0; headingVector.normalize();

            const simulationStrideMeters = 8.0; 
            const degreesPerMeterFactor = 1.0 / R_EARTH * (180.0 / Math.PI);
            
            const simulatedLat = currentCoordinates.lat - (headingVector.z * simulationStrideMeters * degreesPerMeterFactor);
            const simulatedLon = currentCoordinates.lon + (headingVector.x * simulationStrideMeters * degreesPerMeterFactor / Math.cos(anchorCoordinates.lat * Math.PI / 180));

            updatePlayerPositionFromGps(simulatedLat, simulatedLon, "SIMULATION MATRIX");
        }

        function updateTelemetryDisplay(dataStatusString) {
            document.getElementById('geo-telemetry').innerHTML = `
                LAT: ${currentCoordinates.lat.toFixed(6)}<br>
                LON: ${currentCoordinates.lon.toFixed(6)}<br>
                ALT: 1.7m FIXED<br>
                SYS: ${dataStatusString}
            `;
        }

        /* ==========================================================================
           WEBRTC PASSTHROUGH AUDIO/VIDEO BACKDROP FEED
           ========================================================================= */
        async function toggleARCameraStream() {
            const arBtn = document.getElementById('arToggleBtn');
            const videoNode = document.getElementById('camera-feed');

            if (isARActive) {
                if (cameraStream) cameraStream.getTracks().forEach(track => track.stop());
                videoNode.srcObject = null;
                renderer.setClearColor(0x020205, 1.0); 
                isARActive = false;
                arBtn.classList.remove('active');
                arBtn.innerText = "Activate Camera AR";
            } else {
                try {
                    cameraStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { exact: "environment" } }, audio: false
                    });
                } catch (err) {
                    try {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } catch (fatalErr) {
                        alert("AR video channel initialization failed."); return;
                    }
                }
                videoNode.srcObject = cameraStream;
                renderer.setClearColor(0x000000, 0.0); 
                isARActive = true;
                arBtn.classList.add('active');
                arBtn.innerText = "Disable Camera AR";
            }
        }

        /* ==========================================================================
           AR GAMEPLAY SYSTEMS: OBJECTIVE EXTRACTION MATRIX
           ========================================================================= */
        function spawnQuantumAnomalies() {
            spatialAnomaliesCollection.forEach(a => scene.remove(a.mesh));
            spatialAnomaliesCollection.length = 0;

            const anomalyGeometry = new THREE.IcosahedronGeometry(1.5, 1);
            
            for (let i = 0; i < 5; i++) {
                let spawnPos = new THREE.Vector3((Math.random() - 0.5) * 60, 1.7, (Math.random() - 0.5) * 60);

                if (globalTrafficNodes.length > 0) {
                    const localTrafficNode = globalTrafficNodes[Math.floor(Math.random() * globalTrafficNodes.length)];
                    spawnPos.copy(localTrafficNode);
                    spawnPos.x += (Math.random() - 0.5) * 8;
                    spawnPos.z += (Math.random() - 0.5) * 8;
                }

                const material = new THREE.MeshBasicMaterial({ color: 0xbd00ff, wireframe: true });
                const anomalyMesh = new THREE.Mesh(anomalyGeometry, material);
                anomalyMesh.position.copy(spawnPos);
                
                scene.add(anomalyMesh);
                spatialAnomaliesCollection.push({ mesh: anomalyMesh, collected: false, radius: 6.0 });
            }
        }

        function evaluateGameplayState() {
            let closestDistanceMetric = Infinity;

            spatialAnomaliesCollection.forEach((anomaly) => {
                if (anomaly.collected) return;

                const dx = anomaly.mesh.position.x - camera.position.x;
                const dz = anomaly.mesh.position.z - camera.position.z;
                const distanceToTarget = Math.hypot(dx, dz);

                if (distanceToTarget < closestDistanceMetric) closestDistanceMetric = distanceToTarget;

                if (distanceToTarget <= anomaly.radius) {
                    anomaly.collected = true;
                    scene.remove(anomaly.mesh);
                    anomaliesCollectedCount++;
                }
            });

            const scoreText = `RIFTS HARVESTED: ${anomaliesCollectedCount}/5`;
            const distText = closestDistanceMetric === Infinity ? "SECTOR CLEAR" : `${closestDistanceMetric.toFixed(1)}m`;
            
            document.getElementById('score-telemetry').innerHTML = `
                ${scoreText}<br>
                PROXIMITY: ${distText}
            `;
        }

        /* ==========================================================================
           MAIN INITIALIZATION PIPELINE
           ========================================================================= */
        function init() {
            const canvasNode = document.getElementById('canvas3d');

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 1.7, 0); 

            renderer = new THREE.WebGLRenderer({ canvas: canvasNode, antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.add(mapStructuralMeshes);

            autoInitializeSensors();
            initializeHighPrecisionGpsTracking();
            
            window.addEventListener('resize', onWindowResize);

            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine);

                const timestamp = Date.now();

                spatialAnomaliesCollection.forEach(anomaly => {
                    if (!anomaly.collected) {
                        anomaly.mesh.rotation.x += 0.01;
                        anomaly.mesh.rotation.y += 0.02;
                    }
                });

                advanceDronePatrolSimulation(timestamp);
                evaluateGameplayState();
                renderer.render(scene, camera);
                update2DMinimapSystem();
            }
            frameLoopEngine();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
