<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GeoSpatial Real-Time Map & Humanoid Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #050508;
            color: #ffffff;
            user-select: none;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        /* HUD Interface Layout */
        #hud-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-card {
            background: rgba(10, 10, 16, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            min-width: 240px;
        }

        .hud-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00e5ff;
            margin-bottom: 6px;
        }

        .hud-data {
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.5;
        }

        /* 2D Top-Down Minimap & Compass UI Architecture */
        #minimap-container {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 150px;
            height: 150px;
            z-index: 100;
            pointer-events: none;
        }

        #minimapCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 150px;
            height: 150px;
            border-radius: 50%;
            display: block;
        }

        #compass-ring {
            position: absolute;
            top: -8px;
            left: -8px;
            width: 162px;
            height: 162px;
            border: 2px dashed rgba(0, 229, 255, 0.25);
            border-radius: 50%;
            transform-origin: center;
            will-change: transform;
        }

        .compass-marker {
            position: absolute;
            font-family: monospace;
            font-size: 11px;
            font-weight: 900;
            color: #00e5ff;
        }

        #marker-n { top: 2px; left: 50%; transform: translateX(-50%); color: #ff1744; text-shadow: 0 0 5px rgba(255, 23, 68, 0.8); }
        #marker-s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        #marker-e { right: 4px; top: 50%; transform: translateY(-50%); }
        #marker-w { left: 4px; top: 50%; transform: translateY(-50%); }

        #telemetry-log {
            position: absolute;
            top: 195px;
            right: 20px;
            z-index: 10;
            text-align: right;
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 5px;
            pointer-events: none;
        }

        .badge {
            background: rgba(0, 230, 118, 0.2);
            border: 1px solid #00e676;
            color: #00e676;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        /* Control Panel Dashboard */
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 10, 16, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .control-btn {
            background: #111116;
            color: #ffffff;
            border: 1px solid #333344;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.active {
            background: #ffea00;
            color: #050508;
            border-color: #ffea00;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.4);
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>

    <div id="minimap-container">
        <canvas id="minimapCanvas" width="150" height="150"></canvas>
        <div id="compass-ring">
            <span id="marker-n" class="compass-marker">N</span>
            <span id="marker-e" class="compass-marker">E</span>
            <span id="marker-s" class="compass-marker">S</span>
            <span id="marker-w" class="compass-marker">W</span>
        </div>
    </div>

    <div id="hud-container">
        <div class="hud-card">
            <div class="hud-title">Position Fix Data</div>
            <div id="gps-hud" class="hud-data">
                LAT: Fetching...<br>
                LON: Fetching...<br>
                ALT: -- m<br>
                ACCURACY: -- m
            </div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Inertial Telemetry Matrix</div>
            <div id="sensor-hud" class="hud-data">
                VELOCITY X: 0.0000<br>
                VELOCITY Z: 0.0000<br>
                SYSTEM MODE: DETACHED
            </div>
        </div>
    </div>

    <div id="telemetry-log">
        <span id="gps-status-badge" class="badge" style="background: rgba(255, 171, 0, 0.2); border-color: #ffab00; color: #ffab00;">Syncing Geo-Core...</span>
        <span id="data-status-badge" class="badge" style="background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; color: #00e5ff;">OSM Engine: Idle</span>
    </div>

    <div id="controls-panel">
        <button id="gyroBtn" class="control-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg>
            Sensor View Drive
        </button>
        <button id="autoWalkBtn" class="control-btn">
            <svg viewBox="0 0 24 24"><path d="M13.5 5.5c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zM9.8 8.9L7 21.5h2.1l1.9-8.2 2.1 2v6.2h2v-7.5l-2.1-2 .6-3c1 .8 2.4 1.5 4.1 1.5v-2c-1.5 0-2.7-.6-3.5-1.5l-1-1.5c-.4-.6-1-1-1.7-1-.3 0-.5 0-.8.1L5.7 6.3v5.2h2V8.9l2.1-.8z"/></svg>
            Simulate Walk Path
        </button>
        <button id="reloadMapBtn" class="control-btn">
            <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            Force Sync Bounding Box
        </button>
    </div>

    <script>
        let scene, camera, renderer, controls;
        let streetTexture, sidewalkTexture;
        let minimapCanvas, minimapCtx;
        
        // Extracted Core Sensor Traversal Variables
        let gyroActive = false;
        let isFirstGyroFrame = false;
        let lockedGyroRoll = 0; 
        const cleanTargetQuaternion = new THREE.Quaternion(); 
        let gyroYawOffset = 0;
        let targetLinearVelocityX = 0;
        let targetLinearVelocityZ = 0;
        const VELOCITY_DEADZONE_LIMIT = 0.0001;

        // Geolocation Data Tracking States
        let currentCoordinates = { lat: 40.7580, lon: -73.9855, alt: 15.0, accuracy: 5.0 }; // Core Times Square Default
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 }; // Static system geographic anchor
        let mapLoadedForAnchor = false;
        const R_EARTH = 6378137;

        // Simulation Update Configurations
        let isAutoWalking = false;
        let osmFetchController = null; 

        // Simulation Entity Collections
        const humanoidsArray = [];
        const dynamicWorldGroup = new THREE.Group();
        const globalTrafficNodes = [];
        const renderedStreetsList = [];
        const renderedBuildingsList = [];

        // Core Spatial Constants
        const ROAD_WIDTH_METERS = 12;

        /* ==========================================================================
           EXTRACTED INERTIAL CORE: SENSOR QUATERNION CONVERTER MATRIX
           ========================================================================= */
        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3( 0, 0, 1 );
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion( - Math.sqrt( 0.5 ), 0, 0, Math.sqrt( 0.5 ) ); 

            return function ( alpha, beta, gamma, orient ) {
                const q = new THREE.Quaternion();
                euler.set( beta, alpha, - gamma, 'YXZ' ); 
                q.setFromEuler( euler ); 
                q.multiply( q1 ); 
                q.multiply( q0.setFromAxisAngle( zee, - orient ) ); 
                return q;
            };
        })();

        /* ==========================================================================
           PROCEDURAL TEXTURING GENERATORS
           ========================================================================= */
        function createStreetCanvasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 256;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#16161a'; ctx.fillRect(0, 0, 256, 256);
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for (let i = 0; i < 1000; i++) ctx.fillRect(Math.random() * 256, Math.random() * 256, 2, 2);
            ctx.strokeStyle = '#ffea00'; ctx.lineWidth = 2; ctx.setLineDash([10, 8]);
            ctx.beginPath(); ctx.moveTo(128, 0); ctx.lineTo(128, 256); ctx.stroke();
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            texture.repeat.set(1, 4);
            return texture;
        }

        function createSidewalkCanvasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2d2d35'; ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#202025'; ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, 128, 128);
            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping; texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        /* ==========================================================================
           GEOSPATIAL COORDINATES PROJECTIONS MATRIX
           ========================================================================= */
        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        /* ==========================================================================
           STATIC LOCAL MAP INGESTION ENGINE (DOWNLOAD ONCE STRATEGY)
           ========================================================================= */
        async function fetchLiveOpenStreetMapData(lat, lon) {
            if (osmFetchController) osmFetchController.abort();
            osmFetchController = new AbortController();

            const dataStatus = document.getElementById('data-status-badge');
            
            const overpassEndpoints = [
                `https://overpass-api.de/api/interpreter`,
                `https://overpass.kumi.systems/api/interpreter`,
                `https://lz4.overpass-api.de/api/interpreter`
            ];

            const boundingBoxRange = 0.005; 
            const minLat = lat - boundingBoxRange;
            const minLon = lon - boundingBoxRange;
            const maxLat = lat + boundingBoxRange;
            const maxLon = lon + boundingBoxRange;

            const query = `[out:json][timeout:20];(way["building"](${minLat},${minLon},${maxLat},${maxLon});way["highway"](${minLat},${minLon},${maxLat},${maxLon}););out body;>;out skel qt;`;
            
            let data = null;
            let success = false;

            for (let i = 0; i < overpassEndpoints.length; i++) {
                const localMirrorController = new AbortController();
                const globalSignalListener = () => localMirrorController.abort();
                osmFetchController.signal.addEventListener('abort', globalSignalListener);

                const networkTimeoutId = setTimeout(() => localMirrorController.abort(), 6000);

                try {
                    dataStatus.innerText = `OSM Cache: Mirror ${i + 1}/${overpassEndpoints.length}...`;
                    dataStatus.style.background = "rgba(255, 171, 0, 0.2)";
                    dataStatus.style.borderColor = "#ffab00";
                    dataStatus.style.color = "#ffab00";

                    // Highly compatible GET request model prevents pre-flight preemption issues
                    const fetchUrl = `${overpassEndpoints[i]}?data=${encodeURIComponent(query)}`;
                    const response = await fetch(fetchUrl, {
                        method: 'GET',
                        signal: localMirrorController.signal
                    });
                    
                    clearTimeout(networkTimeoutId);
                    osmFetchController.signal.removeEventListener('abort', globalSignalListener);
                    
                    if (!response.ok) throw new Error(`HTTP ${response.status}`);
                    
                    data = await response.json();
                    if (data && data.elements && data.elements.length > 0) {
                        success = true;
                        break; 
                    }
                } catch (err) {
                    clearTimeout(networkTimeoutId);
                    osmFetchController.signal.removeEventListener('abort', globalSignalListener);
                    if (osmFetchController.signal.aborted) return;
                    console.warn(`Node ${i + 1} timeout/fail: ${err.message}`);
                }
            }

            if (success && data) {
                anchorCoordinates.lat = lat;
                anchorCoordinates.lon = lon;
                mapLoadedForAnchor = true;

                dataStatus.innerText = "OSM Engine: Extrusion Done";
                parseAndBuildOSMWorld(data, anchorCoordinates.lat, anchorCoordinates.lon);
                
                dataStatus.innerText = "Local Space Cache Active";
                dataStatus.style.background = "rgba(0, 230, 118, 0.2)";
                dataStatus.style.borderColor = "#00e676";
                dataStatus.style.color = "#00e676";
            } else {
                dataStatus.innerText = "OSM Engine: Using Fallback Grid";
                dataStatus.style.background = "rgba(255, 23, 68, 0.2)";
                dataStatus.style.borderColor = "#ff1744";
                dataStatus.style.color = "#ff1744";
                
                generateProceduralBackupInfrastructure();
            }
        }

        function parseAndBuildOSMWorld(osmData, anchorLat, anchorLon) {
            while(dynamicWorldGroup.children.length > 0) {
                const item = dynamicWorldGroup.children[0];
                if (item.geometry) item.geometry.dispose();
                if (item.material) item.material.dispose();
                dynamicWorldGroup.remove(item);
            }
            globalTrafficNodes.length = 0;
            renderedStreetsList.length = 0;
            renderedBuildingsList.length = 0;

            if (!osmData || !osmData.elements) return;

            const nodesLookup = {};
            osmData.elements.forEach(element => {
                if (element.type === 'node') {
                    const localMeters = latLonToLocalMeters(element.lat, element.lon, anchorLat, anchorLon);
                    nodesLookup[element.id] = { x: localMeters.x, z: localMeters.z };
                }
            });

            osmData.elements.forEach(element => {
                if (element.type === 'way' && element.nodes) {
                    const localCoordinatesPoints = [];
                    element.nodes.forEach(nodeId => {
                        if (nodesLookup[nodeId]) localCoordinatesPoints.push(nodesLookup[nodeId]);
                    });

                    if (localCoordinatesPoints.length < 2) return;

                    if (element.tags && element.tags.building) {
                        buildRealStructuralPolygon(localCoordinatesPoints, element.tags);
                    } else if (element.tags && element.tags.highway) {
                        buildRealStreetSegment(localCoordinatesPoints, element.tags);
                    }
                }
            });

            syncVirtualCameraToGpsCoordinates();
            repopulateHumanoidEntities();
        }

        function buildRealStructuralPolygon(points, tags) {
            if (points.length < 3) return;

            const shapeOutline = new THREE.Shape();
            shapeOutline.moveTo(points[0].x, points[0].z);
            for (let i = 1; i < points.length; i++) shapeOutline.lineTo(points[i].x, points[i].z);
            shapeOutline.closePath();

            let buildingHeight = tags && tags.height ? parseFloat(tags.height) : (15 + Math.random() * 30);
            if (!tags && tags.height) {
                if (tags["building:levels"]) buildingHeight = parseInt(tags["building:levels"]) * 3.5;
            }

            const extrusionSettings = {
                depth: buildingHeight,
                bevelEnabled: true,
                bevelThickness: 0.2,
                bevelSize: 0.1,
                bevelSegments: 1
            };

            const geom = new THREE.ExtrudeGeometry(shapeOutline, extrusionSettings);
            geom.rotateX(Math.PI / 2);

            const structureColors = [0x141923, 0x1c1e24, 0x252a36, 0x111218];
            const primaryColor = structureColors[Math.floor(Math.random() * structureColors.length)];
            const windowNeonGlows = [0x00e5ff, 0x00e676, 0xffea00, 0xff1744];
            const randomNeon = windowNeonGlows[Math.floor(Math.random() * windowNeonGlows.length)];

            const mat = new THREE.MeshStandardMaterial({
                color: primaryColor,
                roughness: 0.25,
                metalness: 0.75,
                emissive: randomNeon,
                emissiveIntensity: Math.random() > 0.8 ? 0.09 : 0.01
            });

            const buildingMesh = new THREE.Mesh(geom, mat);
            buildingMesh.castShadow = true;
            buildingMesh.receiveShadow = true;
            dynamicWorldGroup.add(buildingMesh);

            renderedBuildingsList.push({ points: points, height: buildingHeight });
        }

        function buildRealStreetSegment(points, tags) {
            renderedStreetsList.push(points);
            const streetMaterial = new THREE.MeshStandardMaterial({ map: streetTexture, roughness: 0.65 });

            for (let i = 0; i < points.length - 1; i++) {
                const ptA = points[i];
                const ptB = points[i + 1];

                globalTrafficNodes.push(new THREE.Vector3(ptA.x, 0.05, ptA.z));
                globalTrafficNodes.push(new THREE.Vector3(ptB.x, 0.05, ptB.z));

                const distance = Math.hypot(ptB.x - ptA.x, ptB.z - ptA.z);
                const roadLineGeo = new THREE.PlaneGeometry(ROAD_WIDTH_METERS, distance);
                
                const roadSegmentMesh = new THREE.Mesh(roadLineGeo, streetMaterial);
                roadSegmentMesh.rotation.x = -Math.PI / 2;
                
                const centerX = (ptA.x + ptB.x) / 2;
                const centerZ = (ptA.z + ptB.z) / 2;
                roadSegmentMesh.position.set(centerX, 0.01, centerZ);
                
                const headingAngle = Math.atan2(ptB.x - ptA.x, ptB.z - ptA.z);
                roadSegmentMesh.rotation.z = -headingAngle;
                roadSegmentMesh.receiveShadow = true;
                
                dynamicWorldGroup.add(roadSegmentMesh);
            }
        }

        function generateProceduralBackupInfrastructure() {
            while(dynamicWorldGroup.children.length > 0) {
                dynamicWorldGroup.remove(dynamicWorldGroup.children[0]);
            }
            globalTrafficNodes.length = 0;
            renderedStreetsList.length = 0;
            renderedBuildingsList.length = 0;

            const spacing = 80;
            
            // Generate full synthetic datasets for the 2D tracking engine
            for (let x = -4; x <= 4; x++) {
                const streetPointsV = [{ x: x * spacing, z: -350 }, { x: x * spacing, z: 350 }];
                renderedStreetsList.push(streetPointsV);
                globalTrafficNodes.push(new THREE.Vector3(x * spacing, 0.05, -350), new THREE.Vector3(x * spacing, 0.05, 350));

                const streetPointsH = [{ x: -350, z: x * spacing }, { x: 350, z: x * spacing }];
                renderedStreetsList.push(streetPointsH);
                globalTrafficNodes.push(new THREE.Vector3(-350, 0.05, x * spacing), new THREE.Vector3(350, 0.05, x * spacing));
            }

            const streetMaterial = new THREE.MeshStandardMaterial({ map: streetTexture, roughness: 0.65 });
            renderedStreetsList.forEach(points => {
                const ptA = points[0]; const ptB = points[1];
                const distance = Math.hypot(ptB.x - ptA.x, ptB.z - ptA.z);
                const roadLineGeo = new THREE.PlaneGeometry(ROAD_WIDTH_METERS, distance);
                const roadSegmentMesh = new THREE.Mesh(roadLineGeo, streetMaterial);
                roadSegmentMesh.rotation.x = -Math.PI / 2;
                roadSegmentMesh.position.set((ptA.x + ptB.x) / 2, 0.01, (ptA.z + ptB.z) / 2);
                roadSegmentMesh.rotation.z = -Math.atan2(ptB.x - ptA.x, ptB.z - ptA.z);
                roadSegmentMesh.receiveShadow = true;
                dynamicWorldGroup.add(roadSegmentMesh);
            });

            // Populate the fallback data structures with building geometry matrices
            for (let x = -3; x <= 3; x++) {
                for (let z = -3; z <= 3; z++) {
                    const centerX = x * spacing + spacing / 2;
                    const centerZ = z * spacing + spacing / 2;
                    const boxSize = 35;

                    const buildingPoints = [
                        { x: centerX - boxSize/2, z: centerZ - boxSize/2 },
                        { x: centerX + boxSize/2, z: centerZ - boxSize/2 },
                        { x: centerX + boxSize/2, z: centerZ + boxSize/2 },
                        { x: centerX - boxSize/2, z: centerZ + boxSize/2 }
                    ];
                    buildRealStructuralPolygon(buildingPoints, null);
                }
            }
            repopulateHumanoidEntities();
        }

        /* ==========================================================================
           AUTOMATED HUMANOID SIMULATION SYSTEM
           ========================================================================= */
        class AutomatedHumanoidAgent {
            constructor() {
                this.rootGroup = new THREE.Group();
                this.heightScaleFactor = 0.85 + Math.random() * 0.55;
                this.widthScaleFactor = 0.85 + Math.random() * 0.4;
                this.meshColorHex = new THREE.Color().setHSL(Math.random(), 0.85, 0.5);
                
                this.buildHumanoidTopology();

                this.currentNodeIndex = Math.floor(Math.random() * globalTrafficNodes.length);
                const spawnAnchorPosition = globalTrafficNodes[this.currentNodeIndex] || new THREE.Vector3(0,0,0);
                
                this.lateralOffsetVector = new THREE.Vector3((Math.random() - 0.5) * 5, 0, (Math.random() - 0.5) * 5);
                this.rootGroup.position.copy(spawnAnchorPosition).add(this.lateralOffsetVector);
                this.rootGroup.position.y = 0;

                this.targetNodeIndex = this.findRandomConnectedTrafficNode();
                this.movementVelocitySpeed = 3.0 + Math.random() * 4.0; 
                this.animationPhaseOscillationTime = Math.random() * Math.PI * 2;

                dynamicWorldGroup.add(this.rootGroup);
            }

            buildHumanoidTopology() {
                const material = new THREE.MeshStandardMaterial({ color: this.meshColorHex, roughness: 0.5 });
                const torsoGeo = new THREE.BoxGeometry(0.5 * this.widthScaleFactor, 0.7 * this.heightScaleFactor, 0.3 * this.widthScaleFactor);
                this.torsoMesh = new THREE.Mesh(torsoGeo, material);
                this.torsoMesh.position.y = 0.85 * this.heightScaleFactor;
                this.torsoMesh.castShadow = true;
                this.rootGroup.add(this.torsoMesh);

                const headGeo = new THREE.SphereGeometry(0.18 * this.widthScaleFactor, 16, 16);
                this.headMesh = new THREE.Mesh(headGeo, material);
                this.headMesh.position.y = 1.35 * this.heightScaleFactor;
                this.headMesh.castShadow = true;
                this.rootGroup.add(this.headMesh);

                const legGeo = new THREE.CylinderGeometry(0.09 * this.widthScaleFactor, 0.07 * this.widthScaleFactor, 0.6 * this.heightScaleFactor, 8);
                this.leftLegPivot = new THREE.Group();
                this.leftLegPivot.position.set(-0.16 * this.widthScaleFactor, 0.55 * this.heightScaleFactor, 0);
                const leftLegMesh = new THREE.Mesh(legGeo, material);
                leftLegMesh.position.y = -0.25 * this.heightScaleFactor;
                leftLegMesh.castShadow = true;
                this.leftLegPivot.add(leftLegMesh);
                this.rootGroup.add(this.leftLegPivot);

                this.rightLegPivot = new THREE.Group();
                this.rightLegPivot.position.set(0.16 * this.widthScaleFactor, 0.55 * this.heightScaleFactor, 0);
                const rightLegMesh = new THREE.Mesh(legGeo, material);
                rightLegMesh.position.y = -0.25 * this.heightScaleFactor;
                rightLegMesh.castShadow = true;
                this.rightLegPivot.add(rightLegMesh);
                this.rootGroup.add(this.rightLegPivot);
            }

            findRandomConnectedTrafficNode() {
                if(globalTrafficNodes.length === 0) return 0;
                const currentPoint = globalTrafficNodes[this.currentNodeIndex] || new THREE.Vector3(0,0,0);
                const validCandidateIndices = [];

                for (let i = 0; i < globalTrafficNodes.length; i++) {
                    if (i === this.currentNodeIndex) continue;
                    const evaluationDistance = currentPoint.distanceTo(globalTrafficNodes[i]);
                    if (evaluationDistance < 90.0) validCandidateIndices.push(i);
                }

                if (validCandidateIndices.length === 0) return Math.floor(Math.random() * globalTrafficNodes.length);
                return validCandidateIndices[Math.floor(Math.random() * validCandidateIndices.length)];
            }

            updateAgentPhysics(deltaTimeSeconds) {
                if (globalTrafficNodes.length === 0) return;

                const baseDestinationPoint = globalTrafficNodes[this.targetNodeIndex] || new THREE.Vector3(0,0,0);
                const absoluteTargetDestination = new THREE.Vector3().copy(baseDestinationPoint).add(this.lateralOffsetVector);
                absoluteTargetDestination.y = 0;

                const currentPositionVector = new THREE.Vector3().copy(this.rootGroup.position);
                currentPositionVector.y = 0;

                const distanceToDestination = currentPositionVector.distanceTo(absoluteTargetDestination);

                if (distanceToDestination < 1.5) {
                    this.currentNodeIndex = this.targetNodeIndex;
                    this.targetNodeIndex = this.findRandomConnectedTrafficNode();
                    return;
                }

                const movementHeadingDirection = new THREE.Vector3().subVectors(absoluteTargetDestination, currentPositionVector).normalize();
                this.rootGroup.position.addScaledVector(movementHeadingDirection, this.movementVelocitySpeed * deltaTimeSeconds);
                
                const lookAngleRadians = Math.atan2(movementHeadingDirection.x, movementHeadingDirection.z);
                this.rootGroup.rotation.y = lookAngleRadians;

                this.animationPhaseOscillationTime += this.movementVelocitySpeed * deltaTimeSeconds * 3.5;
                const swingAmplitude = Math.sin(this.animationPhaseOscillationTime) * 0.45;
                
                this.leftLegPivot.rotation.x = swingAmplitude;
                this.rightLegPivot.rotation.x = -swingAmplitude;
                this.torsoMesh.position.y = (0.85 * this.heightScaleFactor) + (Math.abs(Math.sin(this.animationPhaseOscillationTime)) * 0.04);
            }
        }

        /* ==========================================================================
           2D TRACK-UP MINIMAP & CARDINAL COMPASS ENGINE
           ========================================================================= */
        function update2DMinimapSystem() {
            if (!minimapCtx) return;

            const localUserPos = latLonToLocalMeters(currentCoordinates.lat, currentCoordinates.lon, anchorCoordinates.lat, anchorCoordinates.lon);

            const targetDirectionVector = new THREE.Vector3();
            camera.getWorldDirection(targetDirectionVector);
            const yawAngleRadians = Math.atan2(targetDirectionVector.x, -targetDirectionVector.z);

            const compassRing = document.getElementById('compass-ring');
            if (compassRing) {
                const compassOrientationDegrees = THREE.MathUtils.radToDeg(-yawAngleRadians);
                compassRing.style.transform = `rotate(${compassOrientationDegrees}deg)`;
            }

            minimapCtx.clearRect(0, 0, 150, 150);
            minimapCtx.save();
            
            minimapCtx.beginPath();
            minimapCtx.arc(75, 75, 72, 0, Math.PI * 2);
            minimapCtx.clip();

            minimapCtx.fillStyle = 'rgba(10, 10, 16, 0.94)';
            minimapCtx.fillRect(0, 0, 150, 150);

            minimapCtx.translate(75, 75);
            minimapCtx.rotate(-yawAngleRadians);

            const MINIMAP_GRAPHICS_SCALE = 0.5;

            // Minimap Layer A: Streets
            minimapCtx.strokeStyle = 'rgba(0, 229, 255, 0.3)';
            minimapCtx.lineWidth = ROAD_WIDTH_METERS * MINIMAP_GRAPHICS_SCALE;
            minimapCtx.lineCap = "round"; minimapCtx.lineJoin = "round";

            renderedStreetsList.forEach(streetPoints => {
                minimapCtx.beginPath();
                streetPoints.forEach((pt, index) => {
                    const dx = (pt.x - localUserPos.x) * MINIMAP_GRAPHICS_SCALE;
                    const dz = (pt.z - localUserPos.z) * MINIMAP_GRAPHICS_SCALE;
                    if (index === 0) minimapCtx.moveTo(dx, dz);
                    else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.stroke();
            });

            // Minimap Layer B: Building Footprints
            minimapCtx.fillStyle = 'rgba(255, 234, 0, 0.12)';
            minimapCtx.strokeStyle = 'rgba(255, 234, 0, 0.3)';
            minimapCtx.lineWidth = 1;

            renderedBuildingsList.forEach(building => {
                minimapCtx.beginPath();
                building.points.forEach((pt, index) => {
                    const dx = (pt.x - localUserPos.x) * MINIMAP_GRAPHICS_SCALE;
                    const dz = (pt.z - localUserPos.z) * MINIMAP_GRAPHICS_SCALE;
                    if (index === 0) minimapCtx.moveTo(dx, dz);
                    else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.closePath();
                minimapCtx.fill(); minimapCtx.stroke();
            });

            // Minimap Layer C: Humanoids
            for (let i = 0; i < humanoidsArray.length; i++) {
                const agentEntity = humanoidsArray[i];
                const deltaPositionX = agentEntity.rootGroup.position.x - localUserPos.x;
                const deltaPositionZ = agentEntity.rootGroup.position.z - localUserPos.z;

                if (Math.hypot(deltaPositionX, deltaPositionZ) * MINIMAP_GRAPHICS_SCALE < 72) {
                    const dx = deltaPositionX * MINIMAP_GRAPHICS_SCALE;
                    const dz = deltaPositionZ * MINIMAP_GRAPHICS_SCALE;
                    minimapCtx.fillStyle = `#${agentEntity.meshColorHex.getHexString()}`;
                    minimapCtx.beginPath();
                    minimapCtx.arc(dx, dz, 3, 0, Math.PI * 2);
                    minimapCtx.fill();
                }
            }

            minimapCtx.restore();

            minimapCtx.strokeStyle = 'rgba(0, 229, 255, 0.4)';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.arc(75, 75, 73, 0, Math.PI * 2);
            minimapCtx.stroke();

            minimapCtx.fillStyle = '#00ffcc';
            minimapCtx.beginPath();
            minimapCtx.arc(75, 75, 4, 0, Math.PI * 2);
            minimapCtx.fill();

            minimapCtx.strokeStyle = '#00ffcc';
            minimapCtx.lineWidth = 2;
            minimapCtx.beginPath();
            minimapCtx.moveTo(75, 75);
            minimapCtx.lineTo(75, 75 - 14); 
            minimapCtx.stroke();
        }

        /* ==========================================================================
           HARDWARE INTERACTIVE SENSOR ENGINES
           ========================================================================= */
        function toggleSensorsFunctionality() {
            const btn = document.getElementById('gyroBtn');
            if (gyroActive) {
                deactivateTrackingSensors();
            } else {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    Promise.all([
                        DeviceOrientationEvent.requestPermission(),
                        typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' ? 
                            DeviceMotionEvent.requestPermission() : Promise.resolve('granted')
                    ]).then(states => {
                        if (states.every(s => s === 'granted')) activateTrackingSensors(btn);
                    });
                } else {
                    activateTrackingSensors(btn);
                }
            }
        }

        function activateTrackingSensors(btn) {
            if (controls) controls.enabled = false; 
            isFirstGyroFrame = true;
            window.addEventListener('deviceorientation', handleGyroscopeMotionInput, true);
            window.addEventListener('devicemotion', handleInertialStepInput, true);
            gyroActive = true;
            btn.classList.add('active');
            document.getElementById('sensor-hud').innerHTML = `VELOCITY X: 0.0000<br>VELOCITY Z: 0.0000<br>SYSTEM MODE: GYRO_DRIVE`;
        }

        function deactivateTrackingSensors() {
            if (!gyroActive) return;
            window.removeEventListener('deviceorientation', handleGyroscopeMotionInput);
            window.removeEventListener('devicemotion', handleInertialStepInput);
            gyroActive = false;
            targetLinearVelocityX = 0;
            targetLinearVelocityZ = 0;
            document.getElementById('gyroBtn').classList.remove('active');
            
            const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
            lockedGyroRoll = euler.z; 
            euler.z = 0;
            camera.quaternion.setFromEuler(euler);
            
            const currentForwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const explicitTargetPoint = new THREE.Vector3().copy(camera.position).addScaledVector(currentForwardDir, 40);
            
            if (controls) controls.dispose();
            initOrbitControls();
            controls.target.copy(explicitTargetPoint);
            controls.update();
            document.getElementById('sensor-hud').innerHTML = `VELOCITY X: 0.0000<br>VELOCITY Z: 0.0000<br>SYSTEM MODE: DETACHED`;
        }

        function handleGyroscopeMotionInput(e) {
            if (!gyroActive) return;
            let alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
            let beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
            let gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;
            let orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            let qSensor = getSensorQuaternion(alpha, beta, gamma, orient);
            let sensorEuler = new THREE.Euler().setFromQuaternion(qSensor, 'YXZ');

            if (isFirstGyroFrame) {
                let currentEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                gyroYawOffset = currentEuler.y - sensorEuler.y;
                isFirstGyroFrame = false;
            }

            sensorEuler.y += gyroYawOffset;
            camera.quaternion.setFromEuler(sensorEuler);
        }

        function handleInertialStepInput(e) {
            if (!gyroActive) return;
            let acc = e.acceleration; 
            if (!acc || acc.x === null) return;

            const localAccelerationVector = new THREE.Vector3(acc.x, acc.y, acc.z);
            const worldSpaceAcceleration = localAccelerationVector.clone().applyQuaternion(camera.quaternion);
            worldSpaceAcceleration.y = 0;

            const hardwareJitterFloor = 0.08; 
            if (worldSpaceAcceleration.length() < hardwareJitterFloor) return;

            const ACCELERATION_INTEGRATION_GAIN_Z = 0.035;
            const ACCELERATION_INTEGRATION_GAIN_X = 0.012; 
            targetLinearVelocityX -= worldSpaceAcceleration.x * ACCELERATION_INTEGRATION_GAIN_X;
            targetLinearVelocityZ -= worldSpaceAcceleration.z * ACCELERATION_INTEGRATION_GAIN_Z;
        }

        /* ==========================================================================
           OFFLINE LOCAL POSITION TRAVERSAL MATRIX
           ========================================================================= */
        function onDynamicLocationUpdate(lat, lon, accuracy, alt) {
            currentCoordinates.lat = lat;
            currentCoordinates.lon = lon;
            currentCoordinates.accuracy = accuracy || 5.0;
            currentCoordinates.alt = alt || 15.0;

            updateGpsHudDisplay();
            syncVirtualCameraToGpsCoordinates();
        }

        function syncVirtualCameraToGpsCoordinates() {
            const mappedTargetPos = latLonToLocalMeters(currentCoordinates.lat, currentCoordinates.lon, anchorCoordinates.lat, anchorCoordinates.lon);
            
            if (!gyroActive && controls) {
                const cameraPositionDeltaX = camera.position.x - controls.target.x;
                const cameraPositionDeltaZ = camera.position.z - controls.target.z;
                controls.target.set(mappedTargetPos.x, 2, mappedTargetPos.z);
                camera.position.x = mappedTargetPos.x + cameraPositionDeltaX;
                camera.position.z = mappedTargetPos.z + cameraPositionDeltaZ;
            } else if (gyroActive) {
                camera.position.x = mappedTargetPos.x;
                camera.position.z = mappedTargetPos.z;
            }
        }

        function updateGpsHudDisplay() {
            document.getElementById('gps-hud').innerHTML = `
                LAT: ${currentCoordinates.lat.toFixed(6)}<br>
                LON: ${currentCoordinates.lon.toFixed(6)}<br>
                ALT: ${currentCoordinates.alt.toFixed(1)} m<br>
                ACCURACY: ${currentCoordinates.accuracy.toFixed(1)} m
            `;
        }

        function repopulateHumanoidEntities() {
            for (let i = 0; i < humanoidsArray.length; i++) {
                dynamicWorldGroup.remove(humanoidsArray[i].rootGroup);
            }
            humanoidsArray.length = 0;
            if(globalTrafficNodes.length === 0) return;

            const targetHumanoidsTotal = 60;
            for(let i = 0; i < targetHumanoidsTotal; i++) {
                humanoidsArray.push(new AutomatedHumanoidAgent());
            }
        }

        /* ==========================================================================
           INITIALIZATION & LOOP PIPELINES
           ========================================================================= */
        function initOrbitControls() {
            if (!controls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }
            controls.minDistance = 2;
            controls.maxDistance = 1000;
            controls.target.set(0, 2, 0);
            controls.enabled = !gyroActive;
        }

        function init() {
            const canvas3d = document.getElementById('canvas3d');
            minimapCanvas = document.getElementById('minimapCanvas');
            minimapCtx = minimapCanvas.getContext('2d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x06060c);
            scene.fog = new THREE.FogExp2(0x06060c, 0.0025);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 6000);
            camera.position.set(0, 50, 120);

            renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            initOrbitControls();

            scene.add(new THREE.AmbientLight(0xffffff, 0.22));
            const sunLight = new THREE.DirectionalLight(0xdbe7ff, 1.25);
            sunLight.position.set(150, 450, 150);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            scene.add(sunLight);

            const skyLight = new THREE.HemisphereLight(0x00e5ff, 0xff1744, 0.45);
            scene.add(skyLight);

            scene.add(dynamicWorldGroup);

            streetTexture = createStreetCanvasTexture();
            sidewalkTexture = createSidewalkCanvasTexture();

            updateGpsHudDisplay();
            fetchLiveOpenStreetMapData(currentCoordinates.lat, currentCoordinates.lon);

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition((position) => {
                    const badge = document.getElementById('gps-status-badge');
                    badge.innerText = "Live GPS Loop";
                    badge.style.cssText = "background: rgba(0, 230, 118, 0.2); border-color: #00e676; color: #00e676;";
                    
                    if (!isAutoWalking) {
                        onDynamicLocationUpdate(
                            position.coords.latitude,
                            position.coords.longitude,
                            position.coords.accuracy,
                            position.coords.altitude
                        );
                    }
                }, () => {}, { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 });
            }

            document.getElementById('gyroBtn').addEventListener('click', toggleSensorsFunctionality);
            
            const autoWalkBtn = document.getElementById('autoWalkBtn');
            autoWalkBtn.addEventListener('click', () => {
                isAutoWalking = !isAutoWalking;
                autoWalkBtn.classList.toggle('active', isAutoWalking);
                if (isAutoWalking) {
                    document.getElementById('gps-status-badge').innerText = "Simulated Path Run";
                    document.getElementById('gps-status-badge').style.cssText = "background: rgba(0, 229, 255, 0.2); border-color: #00e5ff; color: #00e5ff;";
                }
            });

            document.getElementById('reloadMapBtn').addEventListener('click', () => {
                fetchLiveOpenStreetMapData(currentCoordinates.lat, currentCoordinates.lon);
            });

            window.addEventListener('resize', onWindowResize);

            const clock = new THREE.Clock();
            
            function animateLoop() {
                requestAnimationFrame(animateLoop);
                const deltaTime = Math.min(clock.getDelta(), 0.1); 

                if (isAutoWalking) {
                    const latitudeStepHeading = 0.000020 * deltaTime; 
                    const longitudeStepHeading = 0.000010 * deltaTime;
                    onDynamicLocationUpdate(
                        currentCoordinates.lat + latitudeStepHeading,
                        currentCoordinates.lon + longitudeStepHeading,
                        3.0, 15.0
                    );
                }

                for(let i = 0; i < humanoidsArray.length; i++) {
                    humanoidsArray[i].updateAgentPhysics(deltaTime);
                }

                if (gyroActive) {
                    const INTEGRATION_LEAK_DECAY = 0.78;
                    targetLinearVelocityX *= INTEGRATION_LEAK_DECAY;
                    targetLinearVelocityZ *= INTEGRATION_LEAK_DECAY;

                    if (Math.abs(targetLinearVelocityX) < VELOCITY_DEADZONE_LIMIT) targetLinearVelocityX = 0;
                    if (Math.abs(targetLinearVelocityZ) < VELOCITY_DEADZONE_LIMIT) targetLinearVelocityZ = 0;

                    if (targetLinearVelocityX !== 0 || targetLinearVelocityZ !== 0) {
                        camera.position.x += targetLinearVelocityX;
                        camera.position.z += targetLinearVelocityZ;
                        
                        const localMetersToLatLonShift = 1.0 / R_EARTH * (180.0 / Math.PI);
                        const radAnchorLat = anchorCoordinates.lat * Math.PI / 180;
                        const adjustedLat = currentCoordinates.lat - (targetLinearVelocityZ * localMetersToLatLonShift);
                        const adjustedLon = currentCoordinates.lon + (targetLinearVelocityX * localMetersToLatLonShift / Math.cos(radAnchorLat));
                        
                        onDynamicLocationUpdate(adjustedLat, adjustedLon, currentCoordinates.accuracy, currentCoordinates.alt);
                    }

                    document.getElementById('sensor-hud').innerHTML = `
                        VELOCITY X: ${targetLinearVelocityX.toFixed(4)}<br>
                        VELOCITY Z: ${targetLinearVelocityZ.toFixed(4)}<br>
                        SYSTEM MODE: GYRO_DRIVE
                    `;
                }

                if (controls && controls.enabled) {
                    controls.update();
                    if (!gyroActive && lockedGyroRoll !== 0) {
                        cleanTargetQuaternion.copy(camera.quaternion);
                        camera.rotateZ(lockedGyroRoll);
                    }
                }

                renderer.render(scene, camera);
                update2DMinimapSystem();

                if (controls && controls.enabled && !gyroActive && lockedGyroRoll !== 0) {
                    camera.quaternion.copy(cleanTargetQuaternion);
                }
            }
            animateLoop();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
