<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project A.R.I.S. - Spatial Tactical Visor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #020205;
            color: #00ffcc;
            user-select: none;
        }

        /* Video Pass-Through Layer (True Physical AR Backdrop) */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: block;
            transform: scaleX(1); 
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: block;
            pointer-events: auto;
        }

        /* Tactical Cyber Visor HUD Overlay Architecture */
        #hud-visor-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            box-sizing: border-box;
            border: 20px solid rgba(0, 255, 204, 0.03);
        }

        .hud-panel {
            position: absolute;
            background: rgba(4, 6, 15, 0.75);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            padding: 12px;
            border-radius: 4px;
            pointer-events: auto;
        }

        #hud-top-left {
            top: 25px;
            left: 25px;
            min-width: 220px;
        }

        #hud-top-right {
            top: 25px;
            right: 25px;
            text-align: right;
            min-width: 180px;
        }

        .hud-header {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff0055;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .hud-readout {
            font-size: 12px;
            line-height: 1.4;
            color: #00ffcc;
            text-shadow: 0 0 4px rgba(0, 255, 204, 0.5);
        }

        /* Crosshair Reticle Matrix */
        #targeting-matrix {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        #targeting-matrix::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff0055;
        }

        #action-dashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .visor-btn {
            background: rgba(6, 10, 25, 0.85);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
            transition: all 0.2s ease;
        }

        .visor-btn:active {
            transform: scale(0.95);
        }

        .visor-btn.active {
            background: #00ffcc;
            color: #020205;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>

    <!-- Core WebGL Engine Import -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <!-- Camera Feed Node -->
    <video id="camera-feed" autoplay playsinline muted></video>
    
    <!-- Render Port Node -->
    <canvas id="canvas3d"></canvas>

    <!-- Visor Layer Matrix -->
    <div id="hud-visor-container">
        <div id="targeting-matrix"></div>

        <div id="hud-top-left" class="hud-panel">
            <div class="hud-header">// Telemetry Fix</div>
            <div id="geo-telemetry" class="hud-readout">
                LAT: 40.758012<br>
                LON: -73.985532<br>
                ALT: 1.7m FIXED
            </div>
        </div>

        <div id="hud-top-right" class="hud-panel">
            <div class="hud-header">// Mission Objectives</div>
            <div id="score-telemetry" class="hud-readout">
                ANOMALIES FILTRATED: 0/5<br>
                NEAREST DIST: SEARCHING
            </div>
        </div>
    </div>

    <!-- Interface Dashboard -->
    <div id="action-dashboard">
        <button id="arToggleBtn" class="visor-btn">Activate Camera AR</button>
        <button id="sensorBtn" class="visor-btn">Sync Motion Gyro</button>
        <button id="stepSimBtn" class="visor-btn">Pulse Step Forward</button>
    </div>

    <script>
        let scene, camera, renderer;
        let cameraStream = null;
        let isARActive = false;
        
        // Custom First-Person Camera Rotation Matrix state trackers
        let gyroActive = false;
        let lookYaw = 0;
        let lookPitch = 0;
        let isDragging = false;
        let previousPointerX = 0;
        let previousPointerY = 0;

        // Position & Geo-Tracking Engines
        let currentCoordinates = { lat: 40.7580, lon: -73.9855 };
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 };
        const R_EARTH = 6378137;

        // Gameplay Loop Data Arrays
        const spatialAnomaliesCollection = [];
        const mapStructuralMeshes = new THREE.Group();
        let anomaliesCollectedCount = 0;

        /* ==========================================================================
           GEOSPATIAL SPATIAL PROJECTIONS
           ========================================================================= */
        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        /* ==========================================================================
           FIRST-PERSON VIEW INTERACTION HANDLERS (DESKTOP & MOBILE COMPATIBLE)
           ========================================================================= */
        function initViewportInputControllers() {
            const viewportCanvas = document.getElementById('canvas3d');

            // Drag/Swipe to Look around in first person natively
            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;
                
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;

                // Adjust look tracking properties vectors
                lookYaw -= deltaX * 0.003;
                lookPitch -= deltaY * 0.003;
                
                // Limit pitch rotation to avoid tumbling upside down
                lookPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lookPitch));
                
                if (!gyroActive) updateCameraRotation();
            });

            window.addEventListener('pointerup', () => isDragging = false);

            document.getElementById('sensorBtn').addEventListener('click', toggleMotionSensors);
            document.getElementById('arToggleBtn').addEventListener('click', toggleARCameraStream);
            document.getElementById('stepSimBtn').addEventListener('click', simulateStepForward);
        }

        function updateCameraRotation() {
            const eulerRotation = new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ');
            camera.quaternion.setFromEuler(eulerRotation);
        }

        function toggleMotionSensors() {
            const sensorBtn = document.getElementById('sensorBtn');
            if (gyroActive) {
                window.removeEventListener('deviceorientation', handleVisorHardwareOrientation);
                gyroActive = false;
                sensorBtn.classList.remove('active');
            } else {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(permissionState => {
                        if (permissionState === 'granted') activateGyroEvents(sensorBtn);
                    }).catch(err => console.error("Sensor calibration rejected:", err));
                } else {
                    activateGyroEvents(sensorBtn);
                }
            }
        }

        function activateGyroEvents(btn) {
            window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
            gyroActive = true;
            btn.classList.add('active');
        }

        function handleVisorHardwareOrientation(e) {
            if (!gyroActive || e.alpha === null) return;

            // Convert raw degrees to camera coordinates
            const alphaRad = THREE.MathUtils.degToRad(e.alpha); 
            const betaRad = THREE.MathUtils.degToRad(e.beta);   
            const gammaRad = THREE.MathUtils.degToRad(e.gamma); 

            // Direct First Person device mapping transformation
            const euler = new THREE.Euler();
            euler.set(betaRad + Math.PI/2, alphaRad, -gammaRad, 'YXZ');
            camera.quaternion.setFromEuler(euler);
        }

        /* ==========================================================================
           HARDWARE CAMERA WEBRTC AUDIO/VIDEO PASS-THROUGH STREAMS
           ========================================================================= */
        async function toggleARCameraStream() {
            const arBtn = document.getElementById('arToggleBtn');
            const videoNode = document.getElementById('camera-feed');

            if (isARActive) {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                videoNode.srcObject = null;
                renderer.setClearColor(0x06060c, 1.0); // Reset solid background
                isARActive = false;
                arBtn.classList.remove('active');
                arBtn.innerText = "Activate Camera AR";
            } else {
                try {
                    const videoConstraints = {
                        video: { facingMode: { exact: "environment" } }, // Force rear primary camera
                        audio: false
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(videoConstraints);
                } catch (fallbackErr) {
                    console.warn("Environment camera missing, using generalized fallback device stream options...");
                    try {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } catch (fatalErr) {
                        alert("Could not initialize device video streaming pipeline hardware profiles.");
                        return;
                    }
                }

                videoNode.srcObject = cameraStream;
                renderer.setClearAlpha(0.0);
                renderer.setClearColor(0x000000, 0.0); // Make WebGL engine fully transparent
                isARActive = true;
                arBtn.classList.add('active');
                arBtn.innerText = "Disable Camera AR";
            }
        }

        /* ==========================================================================
           PROCEDURAL NEON CITY MAP GENERATION
           ========================================================================= */
        function generateProceduralARWorld() {
            scene.add(mapStructuralMeshes);

            const spacing = 75;
            const gridLimit = 4;
            
            // 1. Generate Glowing Neon Vector Roads Layout
            const laneMaterial = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });
            
            for (let i = -gridLimit; i <= gridLimit; i++) {
                // Horizontal roadway strip geometry
                const horizGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-300, 0.01, i * spacing),
                    new THREE.Vector3(300, 0.01, i * spacing)
                ]);
                mapStructuralMeshes.add(new THREE.Line(horizGeo, laneMaterial));

                // Vertical roadway strip geometry
                const vertGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(i * spacing, 0.01, -300),
                    new THREE.Vector3(i * spacing, 0.01, 300)
                ]);
                mapStructuralMeshes.add(new THREE.Line(vertGeo, laneMaterial));
            }

            // 2. Build Glowing Cyber-Grid Building Footprints
            for (let x = -gridLimit; x < gridLimit; x++) {
                for (let z = -gridLimit; z < gridLimit; z++) {
                    const cx = x * spacing + spacing / 2;
                    const cz = z * spacing + spacing / 2;
                    const size = 30 + Math.random() * 15;
                    const height = 25 + Math.random() * 60;

                    const wireBoxGeo = new THREE.BoxGeometry(size, height, size);
                    const edgesGeometry = new THREE.EdgesGeometry(wireBoxGeo);
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff0055, linewidth: 1 });
                    const buildingWireMesh = new THREE.LineSegments(edgesGeometry, lineMaterial);
                    
                    // Set position so the bottom of the wireframe rests exactly on the floor ($Y=0$)
                    buildingWireMesh.position.set(cx, height / 2, cz);
                    mapStructuralMeshes.add(buildingWireMesh);
                }
            }

            // Spawn localized game entities
            spawnQuantumAnomalies();
        }

        /* ==========================================================================
           GAMEPLAY ENGINE: ANOMALY HUNTING LOOP
           ========================================================================= */
        function spawnQuantumAnomalies() {
            const anomalyGeometry = new THREE.IcosahedronGeometry(2, 1);
            
            // Cluster target anomalies near the initial user entry point footprint
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 25 + Math.random() * 85; // Distributed locally within easy exploration walking distance
                const localX = Math.cos(angle) * distance;
                const localZ = Math.sin(angle) * distance;

                const material = new THREE.MeshBasicMaterial({
                    color: 0xffff00,
                    wireframe: true
                });

                const anomalyMesh = new THREE.Mesh(anomalyGeometry, material);
                
                // Position anomaly precisely at eye-level floating off the deck array parameters
                anomalyMesh.position.set(localX, 1.7, localZ);
                scene.add(anomalyMesh);

                spatialAnomaliesCollection.push({
                    mesh: anomalyMesh,
                    collected: false,
                    radius: 6.0 
                });
            }
        }

        function simulateStepForward() {
            // Push player ahead along their current first person look direction vector
            const forwardDirectionVector = new THREE.Vector3();
            camera.getWorldDirection(forwardDirectionVector);
            forwardDirectionVector.y = 0; // Lock player footprint strictly to horizontal translation plane
            forwardDirectionVector.normalize();

            const strideMetersLength = 4.5;
            camera.position.addScaledVector(forwardDirectionVector, strideMetersLength);

            // Re-integrate coordinates relative shift back into mock geographic degrees
            const localMetersToDegreesFactor = 1.0 / R_EARTH * (180.0 / Math.PI);
            currentCoordinates.lat -= forwardDirectionVector.z * localMetersToDegreesFactor;
            currentCoordinates.lon += forwardDirectionVector.x * localMetersToDegreesFactor / Math.cos(anchorCoordinates.lat * Math.PI / 180);

            document.getElementById('geo-telemetry').innerHTML = `
                LAT: ${currentCoordinates.lat.toFixed(6)}<br>
                LON: ${currentCoordinates.lon.toFixed(6)}<br>
                ALT: 1.7m FIXED
            `;
        }

        function evaluateGameplayState() {
            let closestDistanceMetric = Infinity;

            spatialAnomaliesCollection.forEach((anomaly) => {
                if (anomaly.collected) return;

                const dx = anomaly.mesh.position.x - camera.position.x;
                const dz = anomaly.mesh.position.z - camera.position.z;
                const rawDistance = Math.hypot(dx, dz);

                if (rawDistance < closestDistanceMetric) {
                    closestDistanceMetric = rawDistance;
                }

                // Interaction verification cascade logic check
                if (rawDistance <= anomaly.radius) {
                    anomaly.collected = true;
                    scene.remove(anomaly.mesh);
                    anomaliesCollectedCount++;
                    
                    // Trigger haptic flash alert indicator signature metrics updates
                    document.body.style.borderColor = "#ffff00";
                    setTimeout(() => document.body.style.borderColor = "transparent", 300);
                }
            });

            // Update user HUD panels elements data structures
            const scoreText = `ANOMALIES FILTRATED: ${anomaliesCollectedCount}/5`;
            const distText = closestDistanceMetric === Infinity ? "CLEAR" : `${closestDistanceMetric.toFixed(1)}m`;
            
            document.getElementById('score-telemetry').innerHTML = `
                ${scoreText}<br>
                NEAREST DIST: ${distText}
            `;
        }

        /* ==========================================================================
           MAIN INITIALIZATION PIPELINE ENGINE
           ========================================================================= */
        function init() {
            const canvasNode = document.getElementById('canvas3d');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            
            // LOCK THE POSITION: True first person human height configuration setting
            camera.position.set(0, 1.7, 0); 

            renderer = new THREE.WebGLRenderer({
                canvas: canvasNode,
                antialias: true,
                alpha: true // Critical configuration parameter: allows underlying video pipeline stream element visibility
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            // Generate structural environment asset arrays
            generateProceduralARWorld();
            
            // Initialize event drive bindings vectors
            initViewportInputControllers();
            window.addEventListener('resize', onWindowResize);

            // Trigger structural rendering frame loop matrix
            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine);

                // Spin target anomalies animations parameters
                spatialAnomaliesCollection.forEach(anomaly => {
                    if (!anomaly.collected) {
                        anomaly.mesh.rotation.x += 0.01;
                        anomaly.mesh.rotation.y += 0.02;
                    }
                });

                evaluateGameplayState();
                renderer.render(scene, camera);
            }
            
            frameLoopEngine();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
