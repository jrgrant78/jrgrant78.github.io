<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project A.R.I.S. - Continuous Spatial Visor</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #020205;
            color: #00ffcc;
            user-select: none;
        }

        /* Video Pass-Through Layer */
        #camera-feed {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 1;
            display: block;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 2;
            display: block;
            pointer-events: auto;
        }

        /* Tactical Cyber Visor HUD Overlay Architecture */
        #hud-visor-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 3;
            pointer-events: none;
            box-sizing: border-box;
            border: 20px solid rgba(0, 255, 204, 0.03);
        }

        .hud-panel {
            position: absolute;
            background: rgba(4, 6, 15, 0.75);
            border: 1px solid #00ffcc;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2);
            padding: 12px;
            border-radius: 4px;
            pointer-events: auto;
        }

        #hud-top-left {
            top: 25px;
            left: 25px;
            min-width: 240px;
        }

        #hud-top-right {
            top: 25px;
            right: 25px;
            text-align: right;
            min-width: 200px;
        }

        .hud-header {
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff0055;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        .hud-readout {
            font-size: 12px;
            line-height: 1.4;
            color: #00ffcc;
            text-shadow: 0 0 4px rgba(0, 255, 204, 0.5);
        }

        /* Crosshair Reticle Matrix */
        #targeting-matrix {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80px;
            height: 80px;
            border: 2px solid rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            pointer-events: none;
        }
        #targeting-matrix::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 8px; height: 8px;
            background: #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff0055;
        }

        #action-dashboard {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .visor-btn {
            background: rgba(6, 10, 25, 0.85);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            padding: 12px 24px;
            border-radius: 20px;
            font-family: inherit;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 204, 0.15);
            transition: all 0.2s ease;
        }

        .visor-btn:active {
            transform: scale(0.95);
        }

        .visor-btn.active {
            background: #00ffcc;
            color: #020205;
            box-shadow: 0 0 20px #00ffcc;
        }
    </style>

    <!-- Core WebGL Engine Import -->
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <video id="camera-feed" autoplay playsinline muted></video>
    <canvas id="canvas3d"></canvas>

    <div id="hud-visor-container">
        <div id="targeting-matrix"></div>

        <div id="hud-top-left" class="hud-panel">
            <div class="hud-header">// Telemetry Fix</div>
            <div id="geo-telemetry" class="hud-readout">
                LAT: 40.758000<br>
                LON: -73.985500<br>
                SIGNAL: SEARCHING...
            </div>
        </div>

        <div id="hud-top-right" class="hud-panel">
            <div class="hud-header">// Mission Objectives</div>
            <div id="score-telemetry" class="hud-readout">
                ANOMALIES FILTRATED: 0/5<br>
                NEAREST DIST: SEARCHING
            </div>
        </div>
    </div>

    <div id="action-dashboard">
        <button id="arToggleBtn" class="visor-btn">Activate Camera AR</button>
        <button id="stepSimBtn" class="visor-btn">Simulate GPS Move</button>
    </div>

    <script>
        let scene, camera, renderer;
        let cameraStream = null;
        let isARActive = false;
        
        // Sensor Tracking Configuration Matrix
        let isFirstGyroFrame = true;
        let gyroYawOffset = 0;
        let lookYaw = 0;
        let lookPitch = 0;
        let isDragging = false;
        let previousPointerX = 0;
        let previousPointerY = 0;

        // Position & Pure Geo-Tracking Coordinates
        let currentCoordinates = { lat: 40.7580, lon: -73.9855 };
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 };
        let hasLockedInitialAnchor = false;
        const R_EARTH = 6378137;

        const spatialAnomaliesCollection = [];
        const mapStructuralMeshes = new THREE.Group();
        let anomaliesCollectedCount = 0;

        /* ==========================================================================
           MATHEMATICAL CORE: SENSOR QUATERNION ALIGNMENT MATRIX
           ========================================================================= */
        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3(0, 0, 1);
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 

            return function (alpha, beta, gamma, orient) {
                const q = new THREE.Quaternion();
                euler.set(beta, alpha, -gamma, 'YXZ'); 
                q.setFromEuler(euler); 
                q.multiply(q1); 
                q.multiply(q0.setFromAxisAngle(zee, -orient)); 
                return q;
            };
        })();

        /* ==========================================================================
           GEOSPATIAL SPATIAL PROJECTIONS
           ========================================================================= */
        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        /* ==========================================================================
           AUTOMATIC SENSOR INJECTION ENGINE
           ========================================================================= */
        function autoInitializeSensors() {
            // Setup seamless fallback touch drag look controls for desktop users
            const viewportCanvas = document.getElementById('canvas3d');

            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true;
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;
            });

            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                
                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;
                
                previousPointerX = e.clientX;
                previousPointerY = e.clientY;

                lookYaw -= deltaX * 0.003;
                lookPitch -= deltaY * 0.003;
                lookPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lookPitch));
                
                // Only let touch mechanics override orientation if hardware sensors haven't fired yet
                if (isFirstGyroFrame) {
                    const eulerRotation = new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ');
                    camera.quaternion.setFromEuler(eulerRotation);
                }
            });

            window.addEventListener('pointerup', () => isDragging = false);

            // AUTOMATIC GYRO ENGINE TRIGGER: Fires instantly upon the user's first page interaction
            const requestHardwareSensors = () => {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
                        }
                    }).catch(err => console.error("Hardware sensor tracking authorization denied:", err));
                } else {
                    window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
                }
            };

            window.addEventListener('pointerdown', requestHardwareSensors, { once: true });
            
            // Link static controls panel interactions
            document.getElementById('arToggleBtn').addEventListener('click', toggleARCameraStream);
            document.getElementById('stepSimBtn').addEventListener('click', simulateGpsMovementUpdate);
        }

        function handleVisorHardwareOrientation(e) {
            if (e.alpha === null) return;
            
            let alpha = THREE.MathUtils.degToRad(e.alpha);
            let beta = THREE.MathUtils.degToRad(e.beta);
            let gamma = THREE.MathUtils.degToRad(e.gamma);
            let orient = (window.orientation || window.screen.orientation?.angle || 0) * Math.PI / 180;

            let qSensor = getSensorQuaternion(alpha, beta, gamma, orient);
            
            if (isFirstGyroFrame) {
                let currentEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                let sensorEuler = new THREE.Euler().setFromQuaternion(qSensor, 'YXZ');
                gyroYawOffset = currentEuler.y - sensorEuler.y;
                isFirstGyroFrame = false;
            }

            let finalEuler = new THREE.Euler().setFromQuaternion(qSensor, 'YXZ');
            finalEuler.y += gyroYawOffset;
            camera.quaternion.setFromEuler(finalEuler);
        }

        /* ==========================================================================
           HARDWARE GEOLOCATION DRIVE ENGINE (REAL-WORLD TRACKING SYSTEM)
           ========================================================================= */
        function initializeHighPrecisionGpsTracking() {
            if (!navigator.geolocation) {
                console.warn("Geolocation services unavailable on this system.");
                return;
            }

            navigator.geolocation.watchPosition(
                (position) => {
                    const freshLat = position.coords.latitude;
                    const freshLon = position.coords.longitude;
                    
                    updatePlayerPositionFromGps(freshLat, freshLon, "LIVE GPS");
                },
                (error) => {
                    console.warn(`GPS pipeline delay: ${error.message}. Using active simulation cache.`);
                },
                {
                    enableHighAccuracy: true,
                    timeout: 8000,
                    maximumAge: 0
                }
            );
        }

        function updatePlayerPositionFromGps(latitude, longitude, signalSource) {
            currentCoordinates.lat = latitude;
            currentCoordinates.lon = longitude;

            // Lock structural map origin on the very first coordinate sync point received
            if (!hasLockedInitialAnchor) {
                anchorCoordinates.lat = latitude;
                anchorCoordinates.lon = longitude;
                hasLockedInitialAnchor = true;
            }

            // PURE GEOSPATIAL TRANSLATION: Derive coordinate spaces locally using the core anchor matrix
            const localMetersOffset = latLonToLocalMeters(
                currentCoordinates.lat, 
                currentCoordinates.lon, 
                anchorCoordinates.lat, 
                anchorCoordinates.lon
            );

            // Shift camera through 3D space exclusively via GPS position coordinate offsets
            camera.position.x = localMetersOffset.x;
            camera.position.z = localMetersOffset.z;
            camera.position.y = 1.7; // Keep camera rigidly at real human eye level

            // Update tactical visor telemetry feed display
            document.getElementById('geo-telemetry').innerHTML = `
                LAT: ${currentCoordinates.lat.toFixed(6)}<br>
                LON: ${currentCoordinates.lon.toFixed(6)}<br>
                SIG: ${signalSource}
            `;
        }

        function simulateGpsMovementUpdate() {
            // Extrapolate forward vector from look angle to push mock GPS registers ahead
            const localHeadingVector = new THREE.Vector3();
            camera.getWorldDirection(localHeadingVector);
            localHeadingVector.y = 0; 
            localHeadingVector.normalize();

            const simulationStrideMeters = 5.0; 
            const degreesPerMeterFactor = 1.0 / R_EARTH * (180.0 / Math.PI);
            
            const simulatedLat = currentCoordinates.lat - (localHeadingVector.z * simulationStrideMeters * degreesPerMeterFactor);
            const simulatedLon = currentCoordinates.lon + (localHeadingVector.x * simulationStrideMeters * degreesPerMeterFactor / Math.cos(anchorCoordinates.lat * Math.PI / 180));

            updatePlayerPositionFromGps(simulatedLat, simulatedLon, "SIMULATED SPOOF");
        }

        /* ==========================================================================
           WEBRTC BACKDROP VIDEO PASS-THROUGH
           ========================================================================= */
        async function toggleARCameraStream() {
            const arBtn = document.getElementById('arToggleBtn');
            const videoNode = document.getElementById('camera-feed');

            if (isARActive) {
                if (cameraStream) {
                    cameraStream.getTracks().forEach(track => track.stop());
                }
                videoNode.srcObject = null;
                renderer.setClearColor(0x020205, 1.0); 
                isARActive = false;
                arBtn.classList.remove('active');
                arBtn.innerText = "Activate Camera AR";
            } else {
                try {
                    const videoConstraints = {
                        video: { facingMode: { exact: "environment" } }, 
                        audio: false
                    };
                    cameraStream = await navigator.mediaDevices.getUserMedia(videoConstraints);
                } catch (fallbackErr) {
                    try {
                        cameraStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: false });
                    } catch (fatalErr) {
                        alert("Camera backdrop stream channel handshake failed.");
                        return;
                    }
                }

                videoNode.srcObject = cameraStream;
                renderer.setClearColor(0x000000, 0.0); 
                isARActive = true;
                arBtn.classList.add('active');
                arBtn.innerText = "Disable Camera AR";
            }
        }

        /* ==========================================================================
           PROCEDURAL NEON AR CITY ENVIRONMENT
           ========================================================================= */
        function generateProceduralARWorld() {
            scene.add(mapStructuralMeshes);

            const spacing = 75;
            const gridLimit = 4;
            const laneMaterial = new THREE.LineBasicMaterial({ color: 0x00ffcc, linewidth: 2 });
            
            for (let i = -gridLimit; i <= gridLimit; i++) {
                const horizGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(-300, 0.01, i * spacing),
                    new THREE.Vector3(300, 0.01, i * spacing)
                ]);
                mapStructuralMeshes.add(new THREE.Line(horizGeo, laneMaterial));

                const vertGeo = new THREE.BufferGeometry().setFromPoints([
                    new THREE.Vector3(i * spacing, 0.01, -300),
                    new THREE.Vector3(i * spacing, 0.01, 300)
                ]);
                mapStructuralMeshes.add(new THREE.Line(vertGeo, laneMaterial));
            }

            for (let x = -gridLimit; x < gridLimit; x++) {
                for (let z = -gridLimit; z < gridLimit; z++) {
                    const cx = x * spacing + spacing / 2;
                    const cz = z * spacing + spacing / 2;
                    const size = 30 + Math.random() * 15;
                    const height = 25 + Math.random() * 60;

                    const wireBoxGeo = new THREE.BoxGeometry(size, height, size);
                    const edgesGeometry = new THREE.EdgesGeometry(wireBoxGeo);
                    const lineMaterial = new THREE.LineBasicMaterial({ color: 0xff0055, linewidth: 1 });
                    const buildingWireMesh = new THREE.LineSegments(edgesGeometry, lineMaterial);
                    
                    buildingWireMesh.position.set(cx, height / 2, cz);
                    mapStructuralMeshes.add(buildingWireMesh);
                }
            }

            spawnQuantumAnomalies();
        }

        /* ==========================================================================
           GAMEPLAY ENGINE: EVALUATE TARGET EXTRACTION MATRIX
           ========================================================================= */
        function spawnQuantumAnomalies() {
            const anomalyGeometry = new THREE.IcosahedronGeometry(2, 1);
            
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const distance = 20 + Math.random() * 60; 
                const localX = Math.cos(angle) * distance;
                const localZ = Math.sin(angle) * distance;

                const material = new THREE.MeshBasicMaterial({
                    color: 0xffff00,
                    wireframe: true
                });

                const anomalyMesh = new THREE.Mesh(anomalyGeometry, material);
                anomalyMesh.position.set(localX, 1.7, localZ);
                scene.add(anomalyMesh);

                spatialAnomaliesCollection.push({
                    mesh: anomalyMesh,
                    collected: false,
                    radius: 6.0 
                });
            }
        }

        function evaluateGameplayState() {
            let closestDistanceMetric = Infinity;

            spatialAnomaliesCollection.forEach((anomaly) => {
                if (anomaly.collected) return;

                const dx = anomaly.mesh.position.x - camera.position.x;
                const dz = anomaly.mesh.position.z - camera.position.z;
                const rawDistance = Math.hypot(dx, dz);

                if (rawDistance < closestDistanceMetric) {
                    closestDistanceMetric = rawDistance;
                }

                if (rawDistance <= anomaly.radius) {
                    anomaly.collected = true;
                    scene.remove(anomaly.mesh);
                    anomaliesCollectedCount++;
                }
            });

            const scoreText = `ANOMALIES FILTRATED: ${anomaliesCollectedCount}/5`;
            const distText = closestDistanceMetric === Infinity ? "CLEAR" : `${closestDistanceMetric.toFixed(1)}m`;
            
            document.getElementById('score-telemetry').innerHTML = `
                ${scoreText}<br>
                NEAREST DIST: ${distText}
            `;
        }

        /* ==========================================================================
           MAIN INITIALIZATION PIPELINE
           ========================================================================= */
        function init() {
            const canvasNode = document.getElementById('canvas3d');

            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 1.7, 0); 

            renderer = new THREE.WebGLRenderer({
                canvas: canvasNode,
                antialias: true,
                alpha: true 
            });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            generateProceduralARWorld();
            
            // Fire automatic background tracking loops
            autoInitializeSensors();
            initializeHighPrecisionGpsTracking();
            
            window.addEventListener('resize', onWindowResize);

            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine);

                spatialAnomaliesCollection.forEach(anomaly => {
                    if (!anomaly.collected) {
                        anomaly.mesh.rotation.x += 0.01;
                        anomaly.mesh.rotation.y += 0.02;
                    }
                });

                evaluateGameplayState();
                renderer.render(scene, camera);
            }
            
            frameLoopEngine();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
