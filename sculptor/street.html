<!DOCTYPE html>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;

        #canvas3d {
            position: absolute;
            top: 0; left: 0;

        #central-hud-alerts {
            position: absolute;

        .hud-banner-text {

        #minimap-container {
            position: absolute;
            bottom: 5vh;

            height: 26vh;
            min-width: 90px; min-height: 90px;

        @media (max-height: 480px) {
            #minimap-container {
                bottom: 4vh;

                width: 28vh;
                height: 28vh;
                max-width: 105px; max-height: 105px;

        #minimapCanvas {
            width: 100%;

        #compass-ring {
            position: absolute;
            top: -5%; left: -5%;
            width: 110%; height: 110%;

        .compass-marker {
            position: absolute;

        #marker-n { top: 2px; left: 50%; transform: translateX(-50%); color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        #marker-s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        #marker-e { right: 4px; top: 50%; transform: translateY(-50%); }
        #marker-w { left: 4px; top: 50%; transform: translateY(-50%); }

        #targeting-matrix {

        #targeting-matrix::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;

            border-radius: 50%;

        #action-dashboard {

        @media (min-width: 768px) {

        }

        #portrait-warning {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #04060f; color: #00ffcc;
            z-index: 99999; box-sizing: border-box; padding: 40px;
            justify-content: center; align-items: center; text-align: center;
            border: 4px solid #ff0055; letter-spacing: 1px;
        }
        @media (orientation: portrait) { #portrait-warning { display: flex; } }

<body>

    <div id="visor-screen-overlay"></div>

    <script>
        let scene, camera, renderer;
        let lookYaw = 0; let lookPitch = 0;
        let isDragging = false;
        let previousPointerX = 0; let previousPointerY = 0;

        let currentCoordinates = { lat: 40.7580, lon: -73.9855 };
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 };
        let hasLockedInitialAnchor = false;
        let mapLoadedForAnchor = false;
        let sensorsEngaged = false; 
        let osmFetchController = null;
        const R_EARTH = 6378137;

        let gpsTargetPosition = new THREE.Vector3(0, 1.7, 0);

        let playerHealth = 100.0;
        let timeLastSeenByThreat = 0; 
        let isCurrentlyDetected = false; 
        let alertStateActive = false;
        const ALERT_COOLDOWN_MS = 10000; 

        const spatialAnomaliesCollection = [];
        const mapStructuralMeshes = new THREE.Group();
        const globalTrafficNodes = [];
        const renderedStreetsList = [];
        const renderedBuildingsList = [];
        const renderedPedestrianList = []; 
        const tacticalDronesCollection = []; 
        const humanoidBotsCollection = []; 
        const activeLasersCollection = []; 
        let anomaliesCollectedCount = 0;

        const CONE_RADIUS = 2.4; 
        const CONE_HEIGHT = 38.0; 
        const CONE_SEMI_ANGLE = Math.atan(CONE_RADIUS / CONE_HEIGHT); 

        const crackSegmentsData = [
            [{x:0,y:0},{x:15,y:20},{x:22,y:18},{x:35,y:40},{x:40,y:38}],
            [{x:100,y:0},{x:80,y:25},{x:85,y:32},{x:70,y:55}],
            [{x:0,y:100},{x:20,y:75},{x:18,y:65},{x:40,y:60}],
            [{x:100,y:100},{x:85,y:80},{x:75,y:82},{x:60,y:65}],
            [{x:50,y:0},{x:48,y:15},{x:55,y:30},{x:45,y:45}]
        ];

        // Core Mathematical Transform Matrix: Links Absolute W3C Device Sensors directly to WebGL Engine Space
        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3(0, 0, 1);
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); // Base Pitch transformation (-90deg)
            return function (alpha, beta, gamma, orient) {
                const q = new THREE.Quaternion();
                euler.set(beta, alpha, -gamma, 'YXZ'); 
                q.setFromEuler(euler); 
                q.multiply(q1); 
                q.multiply(q0.setFromAxisAngle(zee, -orient)); 
                return q;
            };
        })();

        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        function autoInitializeSensors() {
            const viewportCanvas = document.getElementById('canvas3d');
            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true; previousPointerX = e.clientX; previousPointerY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!isDragging || sensorsEngaged) return; // Ignore dragging once hardware streams active
                const deltaX = e.clientX - previousPointerX; const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                lookYaw -= deltaX * 0.003; lookPitch -= deltaY * 0.003;
                lookPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lookPitch));
                camera.quaternion.setFromEuler(new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ'));
            });
            window.addEventListener('pointerup', () => isDragging = false);

            const requestHardwareSensors = () => {
                sensorsEngaged = true; 
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen().then(() => {
                        if (screen.orientation && screen.orientation.lock) {
                            screen.orientation.lock('landscape').catch(() => {});
                        }
                    }).catch(() => {});
                }
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    DeviceOrientationEvent.requestPermission().then(state => {
                        if (state === 'granted') {
                            bindAbsoluteCompassListeners();
                        }
                    });
                } else {
                    bindAbsoluteCompassListeners();
                }
            };
            window.addEventListener('pointerdown', requestHardwareSensors, { once: true });
            document.getElementById('stepSimBtn').addEventListener('click', simulateGpsMovementUpdate);
        }

        // Routing engine selecting absolute magnetometers channels
        function bindAbsoluteCompassListeners() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleVisorHardwareOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
            }
        }

        function handleVisorHardwareOrientation(e) {
            let alpha = e.alpha;
            
            // Core Fallback Check: Parse iOS native compass headings directly into the absolute calculation track
            if (e.webkitCompassHeading) {
                alpha = 360 - e.webkitCompassHeading;
            }
            
            if (alpha === null) return;

            let alphaRad = THREE.MathUtils.degToRad(alpha);
            let betaRad = THREE.MathUtils.degToRad(e.beta);
            let gammaRad = THREE.MathUtils.degToRad(e.gamma);
            let orient = (window.orientation || window.screen.orientation?.angle || 0) * Math.PI / 180;

            // RESOLVED: Direct copying preserves absolute raw sensor values relative to true North (Identity maps to negative Z axis)
            let qSensor = getSensorQuaternion(alphaRad, betaRad, gammaRad, orient);
            camera.quaternion.copy(qSensor);
        }

        async function fetchLiveOpenStreetMapData(lat, lon) {
            if (osmFetchController) osmFetchController.abort();
            osmFetchController = new AbortController();

            const overpassEndpoints = [
                `https://overpass-api.de/api/interpreter`,
                `https://overpass.kumi.systems/api/interpreter`,
                `https://lz4.overpass-api.de/api/interpreter`
            ];
            const range = 0.0435;
            const query = `[out:json][timeout:35];(way["building"](${lat-range},${lon-range},${lat+range},${lon+range});way["highway"](${lat-range},${lon-range},${lat+range},${lon+range}););out body;>;out skel qt;`;
            let data = null; let success = false;

            for (let i = 0; i < overpassEndpoints.length; i++) {
                const mirrorController = new AbortController();
                const timeoutId = setTimeout(() => mirrorController.abort(), 12000);
                try {
                    const r = await fetch(`${overpassEndpoints[i]}?data=${encodeURIComponent(query)}`, { signal: mirrorController.signal });
                    clearTimeout(timeoutId);
                    if (!r.ok) throw new Error();
                    data = await r.json();
                    if (data && data.elements && data.elements.length > 0) { success = true; break; }
                } catch (e) { clearTimeout(timeoutId); }
            }

            if (success && data) {
                mapLoadedForAnchor = true;
                parseAndBuildOSMWorld(data, anchorCoordinates.lat, anchorCoordinates.lon);
            } else {
                generateProceduralBackupInfrastructure();
            }
        }

        function parseAndBuildOSMWorld(osmData, anchorLat, anchorLon) {
            while(mapStructuralMeshes.children.length > 0) {
                const m = mapStructuralMeshes.children[0];
                if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose();
                mapStructuralMeshes.remove(m);
            }
            globalTrafficNodes.length = 0; renderedStreetsList.length = 0;
            renderedBuildingsList.length = 0; renderedPedestrianList.length = 0;

            const grassGroundMesh = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshBasicMaterial({ color: 0x071e0e, depthWrite: true }));
            grassGroundMesh.rotation.x = -Math.PI / 2;
            mapStructuralMeshes.add(grassGroundMesh);

            if (!osmData || !osmData.elements) return;
            const nodesLookup = {};
            osmData.elements.forEach(el => {
                if (el.type === 'node') nodesLookup[el.id] = latLonToLocalMeters(el.lat, el.lon, anchorLat, anchorLon);
            });

            osmData.elements.forEach(el => {
                if (el.type === 'way' && el.nodes) {
                    const pts = [];
                    el.nodes.forEach(nid => {
                        if (nodesLookup[nid]) pts.push(nodesLookup[nid]);
                    });
                    if (pts.length < 2) return;
                    const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
                    const cz = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
                    if (Math.hypot(cx, cz) > 600) return;

                    if (el.tags && el.tags.building) {
                        buildNeonStructuralHulls(pts, el.tags, cx, cz);
                    } else if (el.tags && el.tags.highway) {
                        if (['footway', 'pedestrian', 'path', 'sidewalk'].includes(el.tags.highway) || el.tags.footway) {
                            buildPedestrianConduits(pts, el.tags);
                        } else {
                            buildNeonVectorPathways(pts, el.tags);
                        }
                    }
                }
            });

            mapLoadedForAnchor = true;
            spawnQuantumAnomalies();
            deployTacticalDronePlatoon();
            deployHumanoidGarrison();
            onWindowResize(); 
        }

        function buildNeonStructuralHulls(points, tags, cx, cz) {
            if (points.length < 3) return;
            const shape = new THREE.Shape();
            shape.moveTo(points[0].x - cx, -(points[0].z - cz));
            for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x - cx, -(points[i].z - cz));
            shape.closePath();

            let h = (tags && tags.height) ? parseFloat(tags.height) : (12 + Math.random() * 20);
            if (tags && tags["building:levels"]) h = parseInt(tags["building:levels"]) * 3.5;
            h = Math.min(h, 60);

            const geom = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
            const solidMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true }));
            const hullColor = Math.random() > 0.7 ? 0x00ffcc : 0xff0055;
            const wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: hullColor }));
            
            const group = new THREE.Group();
            group.add(solidMesh, wireframe);
            group.rotation.x = -Math.PI / 2; group.position.set(cx, 0, cz);
            mapStructuralMeshes.add(group);
            renderedBuildingsList.push({ points: points, color: hullColor });
        }

        function buildNeonVectorPathways(points, tags) {
            const laneHalfWidth = 4.0; const vertices = []; const indices = [];
            const leftCurbyPoints = []; const rightCurbyPoints = []; const centerLinePoints = [];
            const count = points.length; const normals = new Array(count);

            const isMain = tags && tags.highway && ['motorway', 'trunk', 'primary', 'secondary', 'tertiary'].includes(tags.highway);

            for (let i = 0; i < count; i++) {
                let dx, dz;
                if (i === 0) { dx = points[1].x - points[0].x; dz = points[1].z - points[0].z; }
                else if (i === count - 1) { dx = points[count-1].x - points[count-2].x; dz = points[count-1].z - points[count-2].z; }
                else { dx = (points[i+1].x - points[i-1].x)/2; dz = (points[i+1].z - points[i-1].z)/2; }
                const len = Math.hypot(dx, dz) || 1;
                normals[i] = { x: -dz / len, z: dx / len };
            }

            for (let i = 0; i < count; i++) {
                const pt = points[i]; const norm = normals[i];
                const lx = pt.x + norm.x * laneHalfWidth; const lz = pt.z + norm.z * laneHalfWidth;
                const rx = pt.x - norm.x * laneHalfWidth; const rz = pt.z - norm.z * laneHalfWidth;
                vertices.push(lx, 0.01, lz, rx, 0.01, rz);
                leftCurbyPoints.push(new THREE.Vector3(lx, 0.012, lz));
                rightCurbyPoints.push(new THREE.Vector3(rx, 0.012, rz));
                centerLinePoints.push(new THREE.Vector3(pt.x, 0.015, pt.z));

                if (i < count - 1) {
                    indices.push(i*2, i*2+1, (i+1)*2, i*2+1, (i+1)*2+1, (i+1)*2);
                }
                globalTrafficNodes.push(new THREE.Vector3(pt.x, 0.01, pt.z));
            }

            const roadGeom = new THREE.BufferGeometry();
            roadGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            roadGeom.setIndex(indices); roadGeom.computeVertexNormals();
            mapStructuralMeshes.add(new THREE.Mesh(roadGeom, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })));

            const yellowCurbMat = new THREE.LineBasicMaterial({ color: 0xffff00 });
            mapStructuralMeshes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(leftCurbyPoints), yellowCurbMat));
            mapStructuralMeshes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rightCurbyPoints), yellowCurbMat));

            if (isMain) {
                const dashedCenterMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3 });
                const mainLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(centerLinePoints), dashedCenterMat);
                mainLine.computeLineDistances(); mapStructuralMeshes.add(mainLine);
            }
            renderedStreetsList.push({ points: points, isMain: isMain });
        }

        function buildPedestrianConduits(points, tags) {
            const count = points.length;
            const isCrosswalk = tags && (tags.footway === 'crosswalk' || tags.highway === 'crossing');
            
            if (isCrosswalk) {
                const pathPoints = []; points.forEach(pt => pathPoints.push(new THREE.Vector3(pt.x, 0.018, pt.z)));
                const crosswalkGeo = new THREE.BufferGeometry().setFromPoints(pathPoints);
                const crosswalkLine = new THREE.Line(crosswalkGeo, new THREE.LineDashedMaterial({ color: 0xfffa9e, dashSize: 1.5, gapSize: 1.5, linewidth: 3 }));
                crosswalkLine.computeLineDistances(); mapStructuralMeshes.add(crosswalkLine);
                renderedPedestrianList.push({ points: points, isCrosswalk: true });
                return;
            }

            const sidewalkHalfWidth = 1.2; const vertices = []; const indices = [];
            const normals = new Array(count);

            for (let i = 0; i < count; i++) {
                let dx, dz;
                if (i === 0) { dx = points[1].x - points[0].x; dz = points[1].z - points[0].z; }
                else if (i === count - 1) { dx = points[count-1].x - points[count-2].x; dz = points[count-1].z - points[count-2].z; }
                else { dx = (points[i+1].x - points[i-1].x)/2; dz = (points[i+1].z - points[i-1].z)/2; }
                const len = Math.hypot(dx, dz) || 1; normals[i] = { x: -dz / len, z: dx / len };
            }

            for (let i = 0; i < count; i++) {
                const pt = points[i]; const norm = normals[i];
                const lx = pt.x + norm.x * sidewalkHalfWidth; const lz = pt.z + norm.z * sidewalkHalfWidth;
                const rx = pt.x - norm.x * sidewalkHalfWidth; const rz = pt.z - norm.z * sidewalkHalfWidth;
                vertices.push(lx, 0.02, lz, rx, 0.02, rz);
                if (i < count - 1) indices.push(i*2, i*2+1, (i+1)*2, i*2+1, (i+1)*2+1, (i+1)*2);
            }

            const swGeom = new THREE.BufferGeometry();
            swGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
            swGeom.setIndex(indices); swGeom.computeVertexNormals();
            mapStructuralMeshes.add(new THREE.Mesh(swGeom, new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide })));
            renderedPedestrianList.push({ points: points, isCrosswalk: false });
        }

        function compileTacticalPatrolDrone() {
            const droneGroup = new THREE.Group();
            const chassisColor = 0xff0055; const mechanicalAccentColor = 0x00ffcc;

            const bodyMesh = new THREE.Mesh(new THREE.SphereGeometry(1.3, 10, 10), new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true }));
            const bodyWireframeMesh = new THREE.LineSegments(new THREE.EdgesGeometry(bodyMesh.geometry), new THREE.LineBasicMaterial({ color: chassisColor }));
            droneGroup.add(bodyMesh, bodyWireframeMesh);

            let leftArmPivot = new THREE.Group(); let rightArmPivot = new THREE.Group();

            function compileBentClawLimb(isLeft, targetGroup) {
                const mult = isLeft ? -1 : 1;
                const mat = new THREE.MeshBasicMaterial({ color: chassisColor });
                const jMat = new THREE.MeshBasicMaterial({ color: mechanicalAccentColor });

                const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2), mat);
                upper.position.set(0.5 * mult, -0.3, 0); upper.rotation.z = (Math.PI / 3.5) * mult;
                const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.18, 6, 6), jMat);
                elbow.position.set(1.0 * mult, -0.7, 0);
                const forearm = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.1), mat);
                forearm.position.set(0.85 * mult, -1.2, 0); forearm.rotation.z = (-Math.PI / 4) * mult;

                const wrist = new THREE.Group(); wrist.position.set(0.5 * mult, -1.6, 0);
                wrist.add(new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.15, 0.2), jMat));
                const clawL = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.3, 0.08), mat);
                clawL.position.set(-0.08, -0.15, 0); clawL.rotation.z = 0.2;
                const clawR = clawL.clone(); clawR.position.x = 0.08; clawR.rotation.z = -0.2;
                wrist.add(clawL, clawR);

                targetGroup.add(upper, elbow, forearm, wrist);
                targetGroup.position.x = 1.2 * mult; return targetGroup;
            }

            droneGroup.add(compileBentClawLimb(true, leftArmPivot), compileBentClawLimb(false, rightArmPivot));

            const beamConicGeo = new THREE.ConeGeometry(CONE_RADIUS, CONE_HEIGHT, 16, 1, true);

            const beamMesh = new THREE.Mesh(beamConicGeo, new THREE.MeshBasicMaterial({ color: mechanicalAccentColor, transparent: true, opacity: 0.12, side: THREE.DoubleSide, depthWrite: false }));
            
            const scanningRigGroup = new THREE.Group(); scanningRigGroup.add(beamMesh);
            droneGroup.add(scanningRigGroup);

            return { coreAsset: droneGroup, dynamicScannerBeam: scanningRigGroup, leftArm: leftArmPivot, rightArm: rightArmPivot };
        }

        function advanceDronePatrolSimulation(timestamp) {
            let spaceOverlay = document.getElementById('visor-screen-overlay');
            let droneDetectedFlag = false; 

            tacticalDronesCollection.forEach(drone => {
                let pos = drone.meshElement.position;
                let tx = 0, tz = 0;
                let targetAngle = drone.meshElement.rotation.y;

                if (drone.isChasingPlayer || alertStateActive) {
                    tx = camera.position.x; tz = camera.position.z;
                    const dx = tx - pos.x; const dz = tz - pos.z; const dist = Math.hypot(dx, dz);
                    if (dist > 1.0) {
                        targetAngle = Math.atan2(dx, dz);
                        pos.x += (dx / dist) * drone.movementVelocityFactor * 1.4;
                        pos.z += (dz / dist) * drone.movementVelocityFactor * 1.4;
                    }
                } else {
                    const node = drone.routeCoordinates[drone.currentNodeIndex];
                    const dx = node.x - pos.x; const dz = node.z - pos.z; const dist = Math.hypot(dx, dz);
                    if (dist > 0.1) targetAngle = Math.atan2(dx, dz);
                    if (dist < 2.0) {
                        drone.currentNodeIndex += drone.patrolDirectionFactor;
                        if (drone.currentNodeIndex >= drone.routeCoordinates.length || drone.currentNodeIndex < 0) {
                            drone.patrolDirectionFactor *= -1; drone.currentNodeIndex += drone.patrolDirectionFactor * 2;
                            drone.currentNodeIndex = Math.max(0, Math.min(drone.currentNodeIndex, drone.routeCoordinates.length - 1));
                        }
                    } else {
                        pos.x += (dx / dist) * drone.movementVelocityFactor;
                        pos.z += (dz / dist) * drone.movementVelocityFactor;
                    }
                }

                // Wrap-Around Rotational Smoothing Matrix
                let angleDiff = targetAngle - drone.meshElement.rotation.y;
                while (angleDiff < -Math.PI) angleDiff += Math.PI * 2;
                while (angleDiff > Math.PI) angleDiff -= Math.PI * 2;
                drone.meshElement.rotation.y += angleDiff * 0.08;

                pos.y = 25.0 + Math.sin(timestamp * 0.0012 + drone.id) * 0.4;
                drone.leftArmAsset.rotation.x = Math.sin(timestamp * 0.0018 + drone.id) * 0.18;
                drone.rightArmAsset.rotation.x = Math.cos(timestamp * 0.0022 + drone.id) * 0.15;
                drone.scannerBeamGroup.rotation.z = Math.sin(timestamp * 0.0008 + drone.id * 1.5) * 0.35;

                const vToP = new THREE.Vector3().copy(camera.position).sub(pos);
                const dToP = vToP.length();
                const beamDir = new THREE.Vector3(0, -1, 0).applyQuaternion(drone.scannerBeamGroup.quaternion).applyQuaternion(drone.meshElement.quaternion).normalize();
                vToP.normalize();
                
                if (Math.acos(beamDir.dot(vToP)) <= CONE_SEMI_ANGLE && dToP <= CONE_HEIGHT) {
                    droneDetectedFlag = true; drone.isChasingPlayer = true;
                } else if (!alertStateActive) {
                    drone.isChasingPlayer = false;
                }
            });

            let botDetectedFlag = false;
            humanoidBotsCollection.forEach(bot => {
                let pos = bot.meshElement.position;
                let headingVectorToPlayer = new THREE.Vector3(camera.position.x - pos.x, 0, camera.position.z - pos.z);
                const distanceToPlayer = headingVectorToPlayer.length();
                let canBotSeePlayerRightNow = false;
                let botTargetAngle = bot.meshElement.rotation.y;

                if (distanceToPlayer <= 30.0) {
                    headingVectorToPlayer.normalize();
                    let botDirectionFacingVector = new THREE.Vector3(Math.sin(bot.meshElement.rotation.y), 0, Math.cos(bot.meshElement.rotation.y)).normalize();
                    let forwardVisionCosineDot = botDirectionFacingVector.dot(headingVectorToPlayer);
                    if (forwardVisionCosineDot >= 0.5) { 
                        canBotSeePlayerRightNow = true;
                    }
                }

                if (canBotSeePlayerRightNow) {
                    botDetectedFlag = true; bot.isAlerted = true;
                } else {
                    bot.isAlerted = false;
                }

                if (bot.isAlerted) {
                    bot.aimProgress = Math.min(1.0, bot.aimProgress + 0.07);
                    const dx = camera.position.x - pos.x; const dz = camera.position.z - pos.z;
                    botTargetAngle = Math.atan2(dx, dz);
                    
                    if (distanceToPlayer <= 25.0 && timestamp - bot.lastFireTimestamp > 1200) {
                        bot.lastFireTimestamp = timestamp;
                        playerHealth = Math.max(0, playerHealth - 8.0);
                        spaceOverlay.classList.add('flash-red-harm');
                        setTimeout(() => spaceOverlay.classList.remove('flash-red-harm'), 150);

                        const muzzleOffsetVector = new THREE.Vector3(0.9, 0.4, 1.6); 
                        muzzleOffsetVector.applyMatrix4(bot.meshElement.matrixWorld);

                        const targetHitPosition = new THREE.Vector3().copy(camera.position);
                        const laserGeom = new THREE.CylinderGeometry(0.05, 0.05, 2.5);
                        const laserMesh = new THREE.Mesh(laserGeom, new THREE.MeshBasicMaterial({ color: 0xff0055 }));
                        
                        laserMesh.position.copy(muzzleOffsetVector);
                        laserMesh.lookAt(targetHitPosition);
                        laserMesh.rotation.x += Math.PI / 2; 
                        scene.add(laserMesh);

                        activeLasersCollection.push({
                            meshElement: laserMesh,
                            directionVector: new THREE.Vector3().subVectors(targetHitPosition, muzzleOffsetVector).normalize(),
                            velocitySpeed: 5.5,
                            distanceTraveled: 0,
                            maxDistanceLimit: muzzleOffsetVector.distanceTo(targetHitPosition)
                        });
                    }
                } else {
                    bot.aimProgress = Math.max(0.0, bot.aimProgress - 0.07);
                    const targetNode = bot.routeCoordinates[bot.currentNodeIndex];
                    const ndx = targetNode.x - pos.x; const ndz = targetNode.z - pos.z;
                    const ndist = Math.hypot(ndx, ndz);

                    if (ndist < 1.0) {
                        bot.currentNodeIndex += bot.patrolDirectionFactor;
                        if (bot.currentNodeIndex >= bot.routeCoordinates.length || bot.currentNodeIndex < 0) {
                            bot.patrolDirectionFactor *= -1; bot.currentNodeIndex += bot.patrolDirectionFactor * 2;
                            bot.currentNodeIndex = Math.max(0, Math.min(bot.currentNodeIndex, bot.routeCoordinates.length - 1));
                        }
                    }

                    if (ndist > 0.1) {
                        botTargetAngle = Math.atan2(ndx, ndz);
                        const frameVelocityStride = Math.min(ndist, bot.velocity * 0.12);
                        pos.x += (ndx / ndist) * frameVelocityStride;
                        pos.z += (ndz / ndist) * frameVelocityStride;
                    }
                }

                // Fluid Rotational Turn Interpolation Matrix
                let botAngleDiff = botTargetAngle - bot.meshElement.rotation.y;
                while (botAngleDiff < -Math.PI) botAngleDiff += Math.PI * 2;
                while (botAngleDiff > Math.PI) botAngleDiff -= Math.PI * 2;
                bot.meshElement.rotation.y += botAngleDiff * 0.08;

                const alternateCycle = Math.sin(timestamp * 0.008 * bot.velocity);
                bot.armL.rotation.x = -alternateCycle * 0.3;
                bot.armR.rotation.x = THREE.MathUtils.lerp(alternateCycle * 0.3, -Math.PI / 2, bot.aimProgress);
                bot.legL.rotation.x = alternateCycle * 0.4; bot.legR.rotation.x = -alternateCycle * 0.4;
            });

            for (let i = activeLasersCollection.length - 1; i >= 0; i--) {
                const bolt = activeLasersCollection[i];
                bolt.meshElement.position.addScaledVector(bolt.directionVector, bolt.velocitySpeed);
                bolt.distanceTraveled += bolt.velocitySpeed;

                if (bolt.distanceTraveled >= bolt.maxDistanceLimit || bolt.distanceTraveled > 250) {
                    scene.remove(bolt.meshElement);
                    bolt.meshElement.geometry.dispose();
                    bolt.meshElement.material.dispose();
                    activeLasersCollection.splice(i, 1);
                }
            }

            isCurrentlyDetected = (droneDetectedFlag || botDetectedFlag);

            if (isCurrentlyDetected) {
                timeLastSeenByThreat = timestamp; alertStateActive = true;
            } else if (alertStateActive && (timestamp - timeLastSeenByThreat >= ALERT_COOLDOWN_MS)) {
                alertStateActive = false;
                tacticalDronesCollection.forEach(d => d.isChasingPlayer = false);
            }

            if (isCurrentlyDetected) spaceOverlay.classList.add('pulse-yellow-alert');
            else spaceOverlay.classList.remove('pulse-yellow-alert');

            // Low-Pass Positioning Filter Matrix
            if (mapLoadedForAnchor) {
                camera.position.x += (gpsTargetPosition.x - camera.position.x) * 0.04;
                camera.position.z += (gpsTargetPosition.z - camera.position.z) * 0.04;
                camera.position.y = 1.7; 
            }

            updateVisorFeedbackHUD(timestamp);
        }

        function updateVisorFeedbackHUD(timestamp) {
            const statusLabel = document.getElementById('main-hud-status');
            const trackerContainer = document.getElementById('threat-tracker-display');
            const cracksCanvas = document.getElementById('cracks-canvas');
            const reticle = document.getElementById('targeting-matrix');
            const ctx = cracksCanvas.getContext('2d');

            if (!mapLoadedForAnchor) {
                statusLabel.innerHTML = "Loading Simulation...";
                statusLabel.classList.add('pulse-animation');
            } else if (mapLoadedForAnchor && !sensorsEngaged) {
                statusLabel.innerHTML = "Touch screen to engage simulation";
                statusLabel.classList.add('pulse-animation');
            } else {
                statusLabel.innerHTML = "";
                statusLabel.classList.remove('pulse-animation');
            }

            if (sensorsEngaged) {
                reticle.style.display = 'block';
            } else {
                reticle.style.display = 'none';
            }

            if (isCurrentlyDetected) {
                trackerContainer.style.display = 'block';
                trackerContainer.innerHTML = "WARNING: POSITION EXPOSED";
            } else if (alertStateActive) {
                trackerContainer.style.display = 'block';
                const secondsRemaining = Math.max(0, (ALERT_COOLDOWN_MS - (timestamp - timeLastSeenByThreat)) / 1000);
                trackerContainer.innerHTML = `EVADING THREAT: ${secondsRemaining.toFixed(1)}s`;
            } else {
                trackerContainer.style.display = 'none';
            }

            if (ctx) {
                ctx.clearRect(0, 0, cracksCanvas.width, cracksCanvas.height);
                
                let activeCrackPathsCount = 0;
                if (playerHealth < 90) activeCrackPathsCount = 1;
                if (playerHealth < 70) activeCrackPathsCount = 2;
                if (playerHealth < 50) activeCrackPathsCount = 3;
                if (playerHealth < 30) activeCrackPathsCount = 4;
                if (playerHealth < 15) activeCrackPathsCount = 5;

                ctx.strokeStyle = '#00ffcc';
                ctx.lineWidth = 2.5;
                ctx.shadowColor = '#00ffcc';
                ctx.shadowBlur = 8;

                for (let i = 0; i < activeCrackPathsCount; i++) {
                    const segmentPoints = crackSegmentsData[i];
                    ctx.beginPath();
                    segmentPoints.forEach((pt, index) => {
                        const px = (pt.x / 100) * cracksCanvas.width;
                        const py = (pt.y / 100) * cracksCanvas.height;
                        if (index === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
                    });
                    ctx.stroke();
                }
                ctx.shadowBlur = 0; 
            }
        }

        function generateProceduralBackupInfrastructure() {
            const spacing = 80; const gridLimit = 4;
            mapStructuralMeshes.add(new THREE.Mesh(new THREE.PlaneGeometry(2000, 2000), new THREE.MeshBasicMaterial({ color: 0x071e0e })));

            for (let i = -gridLimit; i <= gridLimit; i++) {
                renderedStreetsList.push({ points: [{ x: i * spacing, z: -350 }, { x: i * spacing, z: 350 }], isMain: (i % 2 === 0) });
                renderedStreetsList.push({ points: [{ x: -350, z: i * spacing }, { x: 350, z: i * spacing }], isMain: true });
                renderedPedestrianList.push({ points: [{ x: i * spacing + 5.5, z: -350 }, { x: i * spacing + 5.5, z: 350 }], isCrosswalk: false });
                renderedPedestrianList.push({ points: [{ x: i * spacing - 5.5, z: -350 }, { x: i * spacing - 5.5, z: 350 }], isCrosswalk: false });
            }
            renderedStreetsList.forEach(s => buildNeonVectorPathways(s.points, s.isMain ? { highway: 'primary' } : { highway: 'residential' }));
            renderedPedestrianList.forEach(p => buildPedestrianConduits(p.points, p.isCrosswalk ? { footway: 'crosswalk' } : { highway: 'footway' }));
            for (let x = -gridLimit; x < gridLimit; x++) {
                for (let z = -gridLimit; z < gridLimit; z++) {
                    const cx = x * spacing + spacing / 2; const cz = z * spacing + spacing / 2; const size = 35;
                    buildNeonStructuralHulls([{ x: cx - size/2, z: cz - size/2 }, { x: cx + size/2, z: cz - size/2 }, { x: cx + size/2, z: cz + size/2 }, { x: cx - size/2, z: cz + size/2 }], null, cx, cz);
                }
            }
            mapLoadedForAnchor = true;
            spawnQuantumAnomalies(); deployTacticalDronePlatoon(); deployHumanoidGarrison();
        }

        function update2DMinimapSystem() {
            const minimapCanvas = document.getElementById('minimapCanvas');
            const minimapCtx = minimapCanvas.getContext('2d'); if (!minimapCtx) return;

            const directionVector = new THREE.Vector3(); camera.getWorldDirection(directionVector);
            const yaw = Math.atan2(directionVector.x, -directionVector.z);

            const ring = document.getElementById('compass-ring');
            if (ring) ring.style.transform = `rotate(${THREE.MathUtils.radToDeg(-yaw)}deg)`;

            const centerMeters = minimapCanvas.width / 2;
            minimapCtx.clearRect(0, 0, minimapCanvas.width, minimapCanvas.height);
            minimapCtx.save();
            
            minimapCtx.beginPath(); 
            minimapCtx.arc(centerMeters, centerMeters, centerMeters - 2, 0, Math.PI * 2); 
            minimapCtx.clip();
            
            minimapCtx.fillStyle = '#071e0e'; 
            minimapCtx.fillRect(0, 0, minimapCanvas.width, minimapCanvas.height);

            minimapCtx.translate(centerMeters, centerMeters); 
            minimapCtx.rotate(-yaw);
            
            const scale = (minimapCanvas.width / 150) * 0.65;

            // Streets
            renderedStreetsList.forEach(s => {
                minimapCtx.strokeStyle = '#000000'; minimapCtx.lineWidth = 10 * scale;
                minimapCtx.beginPath();
                s.points.forEach((pt, idx) => {
                    const dx = (pt.x - camera.position.x) * scale; const dz = (pt.z - camera.position.z) * scale;
                    if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.stroke();
                minimapCtx.strokeStyle = '#ffff00'; minimapCtx.lineWidth = 1.5 * scale; minimapCtx.stroke();
            });

            // Sidewalks
            renderedPedestrianList.forEach(p => {
                minimapCtx.save();
                if (p.isCrosswalk) { minimapCtx.strokeStyle = '#fffa9e'; minimapCtx.lineWidth = 1.5 * scale; minimapCtx.setLineDash([2, 3]); }
                else { minimapCtx.strokeStyle = '#555555'; minimapCtx.lineWidth = 3 * scale; }
                minimapCtx.beginPath();
                p.points.forEach((pt, idx) => {
                    const dx = (pt.x - camera.position.x) * scale; const dz = (pt.z - camera.position.z) * scale;
                    if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.stroke(); minimapCtx.restore();
            });

            // Buildings
            renderedBuildingsList.forEach(b => {
                minimapCtx.fillStyle = '#000000'; minimapCtx.strokeStyle = b.color === 0x00ffcc ? 'rgba(0,255,204,0.5)' : 'rgba(255,0,85,0.5)';
                minimapCtx.lineWidth = 1.5 * scale; minimapCtx.beginPath();
                b.points.forEach((pt, idx) => {
                    const dx = (pt.x - camera.position.x) * scale; const dz = (pt.z - camera.position.z) * scale;
                    if (idx === 0) minimapCtx.moveTo(dx, dz); else minimapCtx.lineTo(dx, dz);
                });
                minimapCtx.closePath(); minimapCtx.fill(); minimapCtx.stroke();
            });

            // Anomalies
            spatialAnomaliesCollection.forEach(a => {
                if (a.collected) return;
                const dx = (a.mesh.position.x - camera.position.x) * scale; const dz = (a.mesh.position.z - camera.position.z) * scale;
                minimapCtx.fillStyle = '#bd00ff'; minimapCtx.beginPath(); minimapCtx.arc(dx, dz, 4.5 * scale, 0, Math.PI * 2); minimapCtx.fill();
            });

            // Threat Drones
            tacticalDronesCollection.forEach(d => {
                const dx = (d.meshElement.position.x - camera.position.x) * scale; const dz = (d.meshElement.position.z - camera.position.z) * scale;
                minimapCtx.save(); minimapCtx.fillStyle = alertStateActive ? '#ff0055' : '#ffaa00';
                minimapCtx.strokeStyle = '#00ffcc'; minimapCtx.lineWidth = 1;
                minimapCtx.translate(dx, dz); minimapCtx.rotate(d.meshElement.rotation.y);
                minimapCtx.beginPath(); minimapCtx.moveTo(0, -6 * scale); minimapCtx.lineTo(-4 * scale, 4 * scale); minimapCtx.lineTo(4 * scale, 4 * scale); minimapCtx.closePath();
                minimapCtx.fill(); minimapCtx.stroke(); minimapCtx.restore();
            });

            // Threat Ground Bots
            humanoidBotsCollection.forEach(b => {
                const dx = (b.meshElement.position.x - camera.position.x) * scale; const dz = (b.meshElement.position.z - camera.position.z) * scale;
                minimapCtx.save(); minimapCtx.fillStyle = b.isAlerted ? '#ff0055' : '#ff7700';
                minimapCtx.strokeStyle = '#ffffff'; minimapCtx.lineWidth = 1;
                minimapCtx.translate(dx, dz);
                const boxMetric = 8 * scale;
                minimapCtx.fillRect(-boxMetric/2, -boxMetric/2, boxMetric, boxMetric);
                minimapCtx.strokeRect(-boxMetric/2, -boxMetric/2, boxMetric, boxMetric);
                minimapCtx.restore();
            });

            minimapCtx.restore();

            minimapCtx.strokeStyle = '#00ffcc'; minimapCtx.lineWidth = 2; minimapCtx.beginPath(); minimapCtx.arc(centerMeters, centerMeters, centerMeters - 2, 0, Math.PI * 2); minimapCtx.stroke();
            minimapCtx.fillStyle = '#ff0055'; minimapCtx.beginPath(); minimapCtx.arc(centerMeters, centerMeters, 4, 0, Math.PI * 2); minimapCtx.fill();
            minimapCtx.strokeStyle = '#ff0055'; minimapCtx.lineWidth = 2; minimapCtx.beginPath(); minimapCtx.moveTo(centerMeters, centerMeters); minimapCtx.lineTo(centerMeters, centerMeters - (14 * scale)); minimapCtx.stroke();
        }

        function initializeHighPrecisionGpsTracking() {
            if (!navigator.geolocation) return;
            navigator.geolocation.watchPosition(
                (pos) => updatePlayerPositionFromGps(pos.coords.latitude, pos.coords.longitude, "LIVE GEOCAST"),
                (err) => console.warn(err.message),
                { enableHighAccuracy: true, timeout: 8000, maximumAge: 0 }
            );
        }

        function updatePlayerPositionFromGps(latitude, longitude, signalSource) {
            currentCoordinates.lat = latitude; currentCoordinates.lon = longitude;
            
            if (!hasLockedInitialAnchor) {
                anchorCoordinates.lat = latitude; anchorCoordinates.lon = longitude;
                hasLockedInitialAnchor = true;
                
                const local = latLonToLocalMeters(currentCoordinates.lat, currentCoordinates.lon, anchorCoordinates.lat, anchorCoordinates.lon);
                camera.position.set(local.x, 1.7, local.z);
                gpsTargetPosition.set(local.x, 1.7, local.z);
                
                fetchLiveOpenStreetMapData(anchorCoordinates.lat, anchorCoordinates.lon);
            } else {
                const local = latLonToLocalMeters(currentCoordinates.lat, currentCoordinates.lon, anchorCoordinates.lat, anchorCoordinates.lon);
                gpsTargetPosition.x = local.x;
                gpsTargetPosition.z = local.z;
            }
        }

        function simulateGpsMovementUpdate() {
            const vec = new THREE.Vector3(); camera.getWorldDirection(vec); vec.y = 0; vec.normalize();
            const factor = 1.0 / R_EARTH * (180.0 / Math.PI);
            const simLat = currentCoordinates.lat - (vec.z * 8.0 * factor);
            const simLon = currentCoordinates.lon + (vec.x * 8.0 * factor / Math.cos(anchorCoordinates.lat * Math.PI / 180));
            updatePlayerPositionFromGps(simLat, simLon, "SIMULATION MATRIX");
        }

        function spawnQuantumAnomalies() {
            spatialAnomaliesCollection.forEach(a => scene.remove(a.mesh)); spatialAnomaliesCollection.length = 0;
            const geo = new THREE.IcosahedronGeometry(1.5, 1);
            for (let i = 0; i < 5; i++) {
                let p = new THREE.Vector3((Math.random()-0.5)*60, 1.7, (Math.random()-0.5)*60);
                if (globalTrafficNodes.length > 0) p.copy(globalTrafficNodes[Math.floor(Math.random()*globalTrafficNodes.length)]).y = 1.7;
                const mesh = new THREE.Mesh(geo, new THREE.MeshBasicMaterial({ color: 0xbd00ff, wireframe: true }));
                mesh.position.copy(p); scene.add(mesh);
                spatialAnomaliesCollection.push({ mesh: mesh, collected: false, radius: 6.0 });
            }
        }

        function evaluateGameplayState() {
            spatialAnomaliesCollection.forEach(a => {
                if (a.collected) return;
                const d = Math.hypot(a.mesh.position.x - camera.position.x, a.mesh.position.z - camera.position.z);
                if (d <= a.radius) { a.collected = true; scene.remove(a.mesh); anomaliesCollectedCount++; }
            });
        }

        function onWindowResize() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            camera.aspect = width / height;
            camera.updateProjectionMatrix();
            renderer.setSize(width, height);

            const cracksCanvas = document.getElementById('cracks-canvas');
            cracksCanvas.width = width;
            cracksCanvas.height = height;

            const minimapCanvas = document.getElementById('minimapCanvas');
            const containerWidth = document.getElementById('minimap-container').offsetWidth;
            minimapCanvas.width = containerWidth;
            minimapCanvas.height = containerWidth;
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000);
            camera.position.set(0, 1.7, 0); 

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x020205, 1.0);
            scene.add(mapStructuralMeshes);

            autoInitializeSensors(); 
            initializeHighPrecisionGpsTracking();
            
            onWindowResize();
            window.addEventListener('resize', onWindowResize);

            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine);
                const t = Date.now();
                spatialAnomaliesCollection.forEach(a => {
                    if (!a.collected) { a.mesh.rotation.x += 0.01; a.mesh.rotation.y += 0.02; }
                });
                advanceDronePatrolSimulation(t); evaluateGameplayState();
                renderer.render(scene, camera); update2DMinimapSystem();
            }
            frameLoopEngine();
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
