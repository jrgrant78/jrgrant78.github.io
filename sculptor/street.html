<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GeoSpatial AR Map & Humanoid Simulator</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #050508;
            color: #ffffff;
            user-select: none;
        }

        #canvas3d {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 1;
            display: block;
        }

        /* HUD Interface Layout */
        #hud-container {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 10;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .hud-card {
            background: rgba(10, 10, 16, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 229, 255, 0.2);
            padding: 12px 18px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            min-width: 240px;
        }

        .hud-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #00e5ff;
            margin-bottom: 6px;
        }

        .hud-data {
            font-family: monospace;
            font-size: 13px;
            color: #00ffcc;
            line-height: 1.5;
        }

        /* Control Panel Dashboard */
        #controls-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(10, 10, 16, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 20px;
            border-radius: 30px;
            display: flex;
            gap: 15px;
            align-items: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
        }

        .control-btn {
            background: #111116;
            color: #ffffff;
            border: 1px solid #333344;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            -webkit-tap-highlight-color: transparent;
        }

        .control-btn:active {
            transform: scale(0.95);
        }

        .control-btn.active {
            background: #ffea00;
            color: #050508;
            border-color: #ffea00;
            box-shadow: 0 0 15px rgba(255, 234, 0, 0.4);
        }

        .control-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
        }

        #telemetry-log {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 10;
            text-align: right;
        }

        .badge {
            background: rgba(0, 230, 118, 0.2);
            border: 1px solid #00e676;
            color: #00e676;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>

    <div id="hud-container">
        <div class="hud-card">
            <div class="hud-title">Position Fix Data</div>
            <div id="gps-hud" class="hud-data">
                LAT: Fetching...<br>
                LON: Fetching...<br>
                ALT: -- m<br>
                ACCURACY: -- m
            </div>
        </div>
        <div class="hud-card">
            <div class="hud-title">Inertial Telemetry Matrix</div>
            <div id="sensor-hud" class="hud-data">
                VELOCITY X: 0.0000<br>
                VELOCITY Z: 0.0000<br>
                SYSTEM MODE: DETACHED
            </div>
        </div>
    </div>

    <div id="telemetry-log">
        <span id="gps-status-badge" class="badge" style="background: rgba(255, 171, 0, 0.2); border-color: #ffab00; color: #ffab00;">Simulated GPS Loop</span>
    </div>

    <div id="controls-panel">
        <button id="gyroBtn" class="control-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/><circle cx="12" cy="12" r="3"/></svg>
            Sensor View Drive
        </button>
        <button id="triggerGpsBtn" class="control-btn">
            <svg viewBox="0 0 24 24"><path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5c-1.38 0-2.5-1.12-2.5-2.5s1.12-2.5 2.5-2.5 2.5 1.12 2.5 2.5-1.12 2.5-2.5 2.5z"/></svg>
            Trigger Location Shift
        </button>
    </div>

    <script>
        // Global Systems Reference Context Setup
        let scene, camera, renderer, controls;
        let streetTexture, sidewalkTexture;
        
        // Extracted Core Sensor Traversal Variables
        let gyroActive = false;
        let isFirstGyroFrame = false;
        let lockedGyroRoll = 0; 
        const cleanTargetQuaternion = new THREE.Quaternion(); 
        let gyroYawOffset = 0;
        let targetLinearVelocityX = 0;
        let targetLinearVelocityZ = 0;
        const VELOCITY_DEADZONE_LIMIT = 0.0001;

        // Geolocation Data Tracking States
        let currentCoordinates = { lat: 40.7128, lon: -74.0060, alt: 10.0, accuracy: 3.0 };
        const MAP_SCALE_FACTOR = 111000; 

        // Simulation Entity Collections
        const humanoidsArray = [];
        const dynamicWorldGroup = new THREE.Group();
        const globalTrafficNodes = [];

        // Core Spatial Constants
        const GRID_BLOCK_SIZE = 60;
        const ROAD_WIDTH_METERS = 14;
        const SIDEWALK_WIDTH_METERS = 3;

        /* ==========================================================================
           EXTRACTED INERTIAL CORE: CLEAN SENSOR QUATERNION CONVERTER MATRIX
           ========================================================================= */
        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3( 0, 0, 1 );
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion( - Math.sqrt( 0.5 ), 0, 0, Math.sqrt( 0.5 ) ); 

            return function ( alpha, beta, gamma, orient ) {
                const q = new THREE.Quaternion();
                euler.set( beta, alpha, - gamma, 'YXZ' ); 
                q.setFromEuler( euler ); 
                q.multiply( q1 ); 
                q.multiply( q0.setFromAxisAngle( zee, - orient ) ); 
                return q;
            };
        })();

        /* ==========================================================================
           PROCEDURAL TEXTURING GENERATORS
           ========================================================================= */
        function createStreetCanvasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Asphalt Background
            ctx.fillStyle = '#18181f';
            ctx.fillRect(0, 0, 512, 512);

            // Fine Asphalt Grain Noise Profile
            ctx.fillStyle = 'rgba(255,255,255,0.02)';
            for (let i = 0; i < 4000; i++) {
                ctx.fillRect(Math.random() * 512, Math.random() * 512, 2, 2);
            }

            // Central Dual Lane Safety Divider Markings
            ctx.strokeStyle = '#ffea00';
            ctx.lineWidth = 4;
            ctx.setLineDash([20, 15]);
            ctx.beginPath();
            ctx.moveTo(256, 0);
            ctx.lineTo(256, 512);
            ctx.stroke();

            // Outer Boundary Solid White Road Fog Lines
            ctx.strokeStyle = 'rgba(255,255,255,0.4)';
            ctx.lineWidth = 3;
            ctx.setLineDash([]);
            ctx.beginPath();
            ctx.moveTo(40, 0); ctx.lineTo(40, 512);
            ctx.moveTo(472, 0); ctx.lineTo(472, 512);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        function createSidewalkCanvasTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            // Concrete Core Base Block Color
            ctx.fillStyle = '#3a3a45';
            ctx.fillRect(0, 0, 256, 256);

            // Concrete Texture Aggregate Grain
            ctx.fillStyle = 'rgba(0,0,0,0.1)';
            for (let i = 0; i < 800; i++) {
                ctx.fillRect(Math.random() * 256, Math.random() * 256, 1, 1);
            }

            // Concrete Pavement Joint Lines
            ctx.strokeStyle = '#25252d';
            ctx.lineWidth = 3;
            ctx.strokeRect(0, 0, 256, 256);
            ctx.beginPath();
            ctx.moveTo(128, 0); ctx.lineTo(128, 256);
            ctx.moveTo(0, 128); ctx.lineTo(256, 128);
            ctx.stroke();

            const texture = new THREE.CanvasTexture(canvas);
            texture.wrapS = THREE.RepeatWrapping;
            texture.wrapT = THREE.RepeatWrapping;
            return texture;
        }

        /* ==========================================================================
           GEOSPATIAL WORLD COMPONENT ENGINE
           ========================================================================= */
        function generateProceduralMapInfrastructure() {
            // Clean up existing world elements
            while(dynamicWorldGroup.children.length > 0){
                let targetChild = dynamicWorldGroup.children[0];
                dynamicWorldGroup.remove(targetChild);
            }
            globalTrafficNodes.length = 0;

            const halfBlockSize = GRID_BLOCK_SIZE / 2;
            const iterationsRange = 4; // Expanded workspace grid footprint area

            // Generate Street Grid Network Layers
            for (let xOffset = -iterationsRange; xOffset <= iterationsRange; xOffset++) {
                for (let zOffset = -iterationsRange; zOffset <= iterationsRange; zOffset++) {
                    const posX = xOffset * GRID_BLOCK_SIZE;
                    const posZ = zOffset * GRID_BLOCK_SIZE;

                    // Compute Traffic Tracking Vector Node Matrix Connections
                    globalTrafficNodes.push(new THREE.Vector3(posX, 0.1, posZ));

                    // Primary Road Segment (North-South Matrix)
                    const nsRoadGeo = new THREE.PlaneGeometry(ROAD_WIDTH_METERS, GRID_BLOCK_SIZE);
                    const nsRoadMat = new THREE.MeshStandardMaterial({ 
                        map: streetTexture, 
                        roughness: 0.6 
                    });
                    const nsRoadMesh = new THREE.Mesh(nsRoadGeo, nsRoadMat);
                    nsRoadMesh.rotation.x = -Math.PI / 2;
                    nsRoadMesh.position.set(posX, 0, posZ);
                    nsRoadMesh.receiveShadow = true;
                    dynamicWorldGroup.add(nsRoadMesh);

                    // Primary Road Segment (East-West Matrix)
                    const ewRoadGeo = new THREE.PlaneGeometry(ROAD_WIDTH_METERS, GRID_BLOCK_SIZE);
                    const ewRoadMat = new THREE.MeshStandardMaterial({ 
                        map: streetTexture, 
                        roughness: 0.6 
                    });
                    const ewRoadMesh = new THREE.Mesh(ewRoadGeo, ewRoadMat);
                    ewRoadMesh.rotation.x = -Math.PI / 2;
                    ewRoadMesh.rotation.z = Math.PI / 2;
                    ewRoadMesh.position.set(posX, 0, posZ);
                    ewRoadMesh.receiveShadow = true;
                    dynamicWorldGroup.add(ewRoadMesh);

                    // Create Sidewalk Boundaries Around Structural Urban City Blocks
                    const sidewalkGeo = new THREE.PlaneGeometry(
                        GRID_BLOCK_SIZE - ROAD_WIDTH_METERS, 
                        GRID_BLOCK_SIZE - ROAD_WIDTH_METERS
                    );
                    const sidewalkMat = new THREE.MeshStandardMaterial({ 
                        map: sidewalkTexture, 
                        roughness: 0.8 
                    });
                    const sidewalkMesh = new THREE.Mesh(sidewalkGeo, sidewalkMat);
                    sidewalkMesh.rotation.x = -Math.PI / 2;
                    sidewalkMesh.position.set(posX + halfBlockSize, 0.02, posZ + halfBlockSize);
                    sidewalkMesh.receiveShadow = true;
                    dynamicWorldGroup.add(sidewalkMesh);

                    // Build Multifaceted 3D Architectural Structural Polygons inside Block Footprints
                    if (Math.random() > 0.15) {
                        createMultifacetedStructureGroup(
                            posX + halfBlockSize, 
                            posZ + halfBlockSize, 
                            GRID_BLOCK_SIZE - ROAD_WIDTH_METERS - (SIDEWALK_WIDTH_METERS * 2)
                        );
                    }
                }
            }
        }

        function createMultifacetedStructureGroup(centerX, centerZ, maximumFootprintBoundingSpace) {
            const architecturalBaseHeight = 15 + Math.random() * 45;
            const segmentsCount = 3 + Math.floor(Math.random() * 5); 
            const shapeOutline = new THREE.Shape();
            
            const outerBoundingRadius = maximumFootprintBoundingSpace * 0.48;

            // Generate procedural algorithmic multifaceted polygon coordinate paths
            for(let i = 0; i < segmentsCount; i++) {
                const angleRad = (i / segmentsCount) * Math.PI * 2;
                const dynamicVariationalRadius = outerBoundingRadius * (0.78 + Math.random() * 0.22);
                const localVectorPointX = Math.cos(angleRad) * dynamicVariationalRadius;
                const localVectorPointY = Math.sin(angleRad) * dynamicVariationalRadius;

                if(i === 0) {
                    shapeOutline.moveTo(localVectorPointX, localVectorPointY);
                } else {
                    shapeOutline.lineTo(localVectorPointX, localVectorPointY);
                }
            }
            shapeOutline.closePath();

            // Extrude polygon paths into 3D structural volumes
            const extrusionSettings = {
                depth: architecturalBaseHeight,
                bevelEnabled: true,
                bevelThickness: 0.4,
                bevelSize: 0.2,
                bevelSegments: 2,
                curveSegments: 12
            };

            const structureGeometry = new THREE.ExtrudeGeometry(shapeOutline, extrusionSettings);
            structureGeometry.rotateX(Math.PI / 2); // Correct orientation vectors to match vertical Y-axis ground bounds

            // Dynamic material styling arrays using glass/neon emissive features
            const structuralColorPalette = [0x1d2230, 0x111625, 0x2e3b4e, 0x0f1c2e];
            const rawThemeColor = structuralColorPalette[Math.floor(Math.random() * structuralColorPalette.length)];
            
            const networkNeonEmissivePalette = [0x00e5ff, 0x00e676, 0xffea00, 0xff1744];
            const selectedEmissiveNeon = networkNeonEmissivePalette[Math.floor(Math.random() * networkNeonEmissivePalette.length)];

            const structureMaterial = new THREE.MeshStandardMaterial({
                color: rawThemeColor,
                roughness: 0.2,
                metalness: 0.8,
                emissive: selectedEmissiveNeon,
                emissiveIntensity: Math.random() * 0.12
            });

            const buildingInstanceMesh = new THREE.Mesh(structureGeometry, structureMaterial);
            buildingInstanceMesh.position.set(centerX, architecturalBaseHeight, centerZ);
            buildingInstanceMesh.castShadow = true;
            buildingInstanceMesh.receiveShadow = true;

            dynamicWorldGroup.add(buildingInstanceMesh);
        }

        /* ==========================================================================
           AUTOMATED HUMANOID SIMULATION SYSTEM
           ========================================================================= */
        class AutomatedHumanoidAgent {
            constructor() {
                this.rootGroup = new THREE.Group();
                
                // Random scale dimensions to produce various human structural profiles
                this.heightScaleFactor = 0.85 + Math.random() * 0.55;
                this.widthScaleFactor = 0.85 + Math.random() * 0.4;
                
                this.meshColorHex = new THREE.Color().setHSL(Math.random(), 0.85, 0.5);
                
                this.buildHumanoidTopology();

                // Initialize starting steering tracking coordinates onto structural road nodes
                this.currentNodeIndex = Math.floor(Math.random() * globalTrafficNodes.length);
                const spawnAnchorPosition = globalTrafficNodes[this.currentNodeIndex];
                
                // Lateral street placement offset adjustment factor
                this.lateralOffsetVector = new THREE.Vector3(
                    (Math.random() - 0.5) * (ROAD_WIDTH_METERS - 3.5),
                    0,
                    (Math.random() - 0.5) * (ROAD_WIDTH_METERS - 3.5)
                );

                this.rootGroup.position.copy(spawnAnchorPosition).add(this.lateralOffsetVector);
                this.rootGroup.position.y = 0;

                this.targetNodeIndex = this.findRandomConnectedTrafficNode();
                this.movementVelocitySpeed = 3.5 + Math.random() * 4.0; // Scaled operational velocity values
                this.animationPhaseOscillationTime = Math.random() * Math.PI * 2;

                dynamicWorldGroup.add(this.rootGroup);
            }

            buildHumanoidTopology() {
                const material = new THREE.MeshStandardMaterial({ 
                    color: this.meshColorHex, 
                    roughness: 0.5 
                });

                // Torso Primitive
                const torsoGeo = new THREE.BoxGeometry(
                    0.5 * this.widthScaleFactor, 
                    0.7 * this.heightScaleFactor, 
                    0.3 * this.widthScaleFactor
                );
                this.torsoMesh = new THREE.Mesh(torsoGeo, material);
                this.torsoMesh.position.y = 0.85 * this.heightScaleFactor;
                this.torsoMesh.castShadow = true;
                this.rootGroup.add(this.torsoMesh);

                // Head Sphere
                const headGeo = new THREE.SphereGeometry(0.18 * this.widthScaleFactor, 16, 16);
                this.headMesh = new THREE.Mesh(headGeo, material);
                this.headMesh.position.y = 1.35 * this.heightScaleFactor;
                this.headMesh.castShadow = true;
                this.rootGroup.add(this.headMesh);

                // Left Leg Component Matrix
                const legGeo = new THREE.CylinderGeometry(
                    0.09 * this.widthScaleFactor, 
                    0.07 * this.widthScaleFactor, 
                    0.6 * this.heightScaleFactor, 8
                );
                this.leftLegPivot = new THREE.Group();
                this.leftLegPivot.position.set(-0.16 * this.widthScaleFactor, 0.55 * this.heightScaleFactor, 0);
                const leftLegMesh = new THREE.Mesh(legGeo, material);
                leftLegMesh.position.y = -0.25 * this.heightScaleFactor;
                leftLegMesh.castShadow = true;
                this.leftLegPivot.add(leftLegMesh);
                this.rootGroup.add(this.leftLegPivot);

                // Right Leg Component Matrix
                this.rightLegPivot = new THREE.Group();
                this.rightLegPivot.position.set(0.16 * this.widthScaleFactor, 0.55 * this.heightScaleFactor, 0);
                const rightLegMesh = new THREE.Mesh(legGeo, material);
                rightLegMesh.position.y = -0.25 * this.heightScaleFactor;
                rightLegMesh.castShadow = true;
                this.rightLegPivot.add(rightLegMesh);
                this.rootGroup.add(this.rightLegPivot);
            }

            findRandomConnectedTrafficNode() {
                const currentPoint = globalTrafficNodes[this.currentNodeIndex];
                const validCandidateIndices = [];

                for (let i = 0; i < globalTrafficNodes.length; i++) {
                    if (i === this.currentNodeIndex) continue;
                    const evaluationDistance = currentPoint.distanceTo(globalTrafficNodes[i]);
                    
                    // Match directly linear block connections limits
                    if (evaluationDistance < GRID_BLOCK_SIZE * 1.1) {
                        validCandidateIndices.push(i);
                    }
                }

                if (validCandidateIndices.length === 0) {
                    return Math.floor(Math.random() * globalTrafficNodes.length);
                }
                return validCandidateIndices[Math.floor(Math.random() * validCandidateIndices.length)];
            }

            updateAgentPhysics(deltaTimeSeconds) {
                if (globalTrafficNodes.length === 0) return;

                const baseDestinationPoint = globalTrafficNodes[this.targetNodeIndex];
                const absoluteTargetDestination = new THREE.Vector3().copy(baseDestinationPoint).add(this.lateralOffsetVector);
                absoluteTargetDestination.y = 0;

                const currentPositionVector = new THREE.Vector3().copy(this.rootGroup.position);
                currentPositionVector.y = 0;

                const distanceToDestination = currentPositionVector.distanceTo(absoluteTargetDestination);

                // Arrived at intersection waypoint node limits
                if (distanceToDestination < 1.0) {
                    this.currentNodeIndex = this.targetNodeIndex;
                    this.targetNodeIndex = this.findRandomConnectedTrafficNode();
                    return;
                }

                // Compute directional vectors
                const movementHeadingDirection = new THREE.Vector3()
                    .subVectors(absoluteTargetDestination, currentPositionVector)
                    .normalize();

                // Compute kinematic position changes
                this.rootGroup.position.addScaledVector(
                    movementHeadingDirection, 
                    this.movementVelocitySpeed * deltaTimeSeconds
                );

                // Update heading orientation
                const lookAngleRadians = Math.atan2(movementHeadingDirection.x, movementHeadingDirection.z);
                this.rootGroup.rotation.y = lookAngleRadians;

                // Drive procedural articulation oscillators
                this.animationPhaseOscillationTime += this.movementVelocitySpeed * deltaTimeSeconds * 3.5;
                const swingAmplitude = Math.sin(this.animationPhaseOscillationTime) * 0.45;
                
                this.leftLegPivot.rotation.x = swingAmplitude;
                this.rightLegPivot.rotation.x = -swingAmplitude;

                // Subtle torso posture calculations
                this.torsoMesh.position.y = (0.85 * this.heightScaleFactor) + (Math.abs(Math.sin(this.animationPhaseOscillationTime)) * 0.04);
            }
        }

        /* ==========================================================================
           HARDWARE HARDLINK INTERACTIVE DRIVERS
           ========================================================================= */
        function toggleSensorsFunctionality() {
            const btn = document.getElementById('gyroBtn');
            if (gyroActive) {
                deactivateTrackingSensors();
            } else {
                if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                    Promise.all([
                        DeviceOrientationEvent.requestPermission(),
                        typeof DeviceMotionEvent !== 'undefined' && typeof DeviceMotionEvent.requestPermission === 'function' ? 
                            DeviceMotionEvent.requestPermission() : Promise.resolve('granted')
                    ]).then(states => {
                        if (states.every(s => s === 'granted')) activateTrackingSensors(btn);
                    });
                } else {
                    activateTrackingSensors(btn);
                }
            }
        }

        function activateTrackingSensors(btn) {
            if (controls) controls.enabled = false; 
            isFirstGyroFrame = true;
            window.addEventListener('deviceorientation', handleGyroscopeMotionInput, true);
            window.addEventListener('devicemotion', handleInertialStepInput, true);
            gyroActive = true;
            btn.classList.add('active');
            document.getElementById('sensor-hud').innerHTML = `VELOCITY X: 0.0000<br>VELOCITY Z: 0.0000<br>SYSTEM MODE: GYRO_DRIVE`;
        }

        function deactivateTrackingSensors() {
            if (!gyroActive) return;
            window.removeEventListener('deviceorientation', handleGyroscopeMotionInput);
            window.removeEventListener('devicemotion', handleInertialStepInput);
            gyroActive = false;
            targetLinearVelocityX = 0;
            targetLinearVelocityZ = 0;
            document.getElementById('gyroBtn').classList.remove('active');
            
            const euler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
            lockedGyroRoll = euler.z; 
            
            euler.z = 0;
            camera.quaternion.setFromEuler(euler);
            
            const currentForwardDir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const explicitTargetPoint = new THREE.Vector3().copy(camera.position).addScaledVector(currentForwardDir, 40);
            
            if (controls) {
                controls.dispose();
                controls = null; 
            }
            
            initOrbitControls();
            controls.target.copy(explicitTargetPoint);
            controls.update();
            document.getElementById('sensor-hud').innerHTML = `VELOCITY X: 0.0000<br>VELOCITY Z: 0.0000<br>SYSTEM MODE: DETACHED`;
        }

        function handleGyroscopeMotionInput(e) {
            if (!gyroActive) return;
            
            let alpha = e.alpha ? THREE.MathUtils.degToRad(e.alpha) : 0;
            let beta = e.beta ? THREE.MathUtils.degToRad(e.beta) : 0;
            let gamma = e.gamma ? THREE.MathUtils.degToRad(e.gamma) : 0;
            let orient = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

            let qSensor = getSensorQuaternion(alpha, beta, gamma, orient);
            let sensorEuler = new THREE.Euler().setFromQuaternion(qSensor, 'YXZ');

            if (isFirstGyroFrame) {
                let currentEuler = new THREE.Euler().setFromQuaternion(camera.quaternion, 'YXZ');
                gyroYawOffset = currentEuler.y - sensorEuler.y;
                isFirstGyroFrame = false;
            }

            sensorEuler.y += gyroYawOffset;
            camera.quaternion.setFromEuler(sensorEuler);
        }

        function handleInertialStepInput(e) {
            if (!gyroActive) return;

            let acc = e.acceleration; 
            if (!acc || acc.x === null) return;

            const localAccelerationVector = new THREE.Vector3(acc.x, acc.y, acc.z);
            const worldSpaceAcceleration = localAccelerationVector.clone().applyQuaternion(camera.quaternion);
            worldSpaceAcceleration.y = 0;

            const hardwareJitterFloor = 0.08; 
            if (worldSpaceAcceleration.length() < hardwareJitterFloor) return;

            const ACCELERATION_INTEGRATION_GAIN_Z = 0.035;
            const ACCELERATION_INTEGRATION_GAIN_X = 0.012; 
            targetLinearVelocityX -= worldSpaceAcceleration.x * ACCELERATION_INTEGRATION_GAIN_X;
            targetLinearVelocityZ -= worldSpaceAcceleration.z * ACCELERATION_INTEGRATION_GAIN_Z;
        }

        /* ==========================================================================
           GEOLOCATION INTERACTION HANDLERS
           ========================================================================= */
        function triggerManualLocationUpdate() {
            // Mock spatial translation changes across coordinate spaces
            currentCoordinates.lat += (Math.random() - 0.5) * 0.0015;
            currentCoordinates.lon += (Math.random() - 0.5) * 0.0015;
            currentCoordinates.alt = 10.0 + Math.random() * 5.0;
            currentCoordinates.accuracy = 2.0 + Math.random() * 2.0;

            updateGpsHudDisplay();
            
            // Re-render visual assets around new coordinate calculations
            generateProceduralMapInfrastructure();
            repopulateHumanoidEntities();
        }

        function updateGpsHudDisplay() {
            document.getElementById('gps-hud').innerHTML = `
                LAT: ${currentCoordinates.lat.toFixed(6)}<br>
                LON: ${currentCoordinates.lon.toFixed(6)}<br>
                ALT: ${currentCoordinates.alt.toFixed(1)} m<br>
                ACCURACY: ${currentCoordinates.accuracy.toFixed(1)} m
            `;
        }

        function repopulateHumanoidEntities() {
            // Purge collections
            humanoidsArray.length = 0;
            
            // Instantiation sequences
            const TargetHumanoidCount = 45;
            for(let i=0; i < TargetHumanoidCount; i++) {
                humanoidsArray.push(new AutomatedHumanoidAgent());
            }
        }

        /* ==========================================================================
           CORE ENVIRONMENT ARCHITECTURE INITIALIZATION
           ========================================================================= */
        function initOrbitControls() {
            if (!controls) {
                controls = new THREE.OrbitControls(camera, renderer.domElement);
                controls.enableDamping = true;
                controls.dampingFactor = 0.05;
            }
            controls.minDistance = 2;
            controls.maxDistance = 600;
            controls.target.set(0, 2, 0);
            controls.enabled = !gyroActive;
        }

        function init() {
            const canvas3d = document.getElementById('canvas3d');

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x06060c);
            scene.fog = new THREE.FogExp2(0x06060c, 0.0035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 4000);
            camera.position.set(0, 30, 75);

            renderer = new THREE.WebGLRenderer({ canvas: canvas3d, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;

            initOrbitControls();

            // Lighting Systems Setup
            scene.add(new THREE.AmbientLight(0xffffff, 0.15));
            
            const sunLight = new THREE.DirectionalLight(0xdbe7ff, 1.1);
            sunLight.position.set(100, 250, 100);
            sunLight.castShadow = true;
            sunLight.shadow.mapSize.width = 2048;
            sunLight.shadow.mapSize.height = 2048;
            sunLight.shadow.bias = -0.0005;
            sunLight.shadow.camera.near = 0.5;
            sunLight.shadow.camera.far = 1000;
            const size = 300;
            sunLight.shadow.camera.left = -size;
            sunLight.shadow.camera.right = size;
            sunLight.shadow.camera.top = size;
            sunLight.shadow.camera.bottom = -size;
            scene.add(sunLight);

            // Sky Hemisphere Accent Glow Sources
            const skyLight = new THREE.HemisphereLight(0x00e5ff, 0xff1744, 0.35);
            scene.add(skyLight);

            scene.add(dynamicWorldGroup);

            // Build Procedural Materials
            streetTexture = createStreetCanvasTexture();
            sidewalkTexture = createSidewalkCanvasTexture();

            // Primary System Triggers
            generateProceduralMapInfrastructure();
            repopulateHumanoidEntities();
            updateGpsHudDisplay();

            // Event Listeners Integration
            document.getElementById('gyroBtn').addEventListener('click', toggleSensorsFunctionality);
            document.getElementById('triggerGpsBtn').addEventListener('click', triggerManualLocationUpdate);
            window.addEventListener('resize', onWindowResize);

            // Hardware Hook Native Geolocation Setup
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    currentCoordinates.lat = position.coords.latitude;
                    currentCoordinates.lon = position.coords.longitude;
                    currentCoordinates.alt = position.coords.altitude || 12.0;
                    currentCoordinates.accuracy = position.coords.accuracy;
                    
                    document.getElementById('gps-status-badge').innerText = "Live GPS Link";
                    document.getElementById('gps-status-badge').style.cssText = "background: rgba(0, 230, 118, 0.2); border-color: #00e676; color: #00e676;";
                    
                    updateGpsHudDisplay();
                    generateProceduralMapInfrastructure();
                    repopulateHumanoidEntities();
                }, () => {
                    // Fallback configuration parameters remain running seamlessly
                }, { enableHighAccuracy: true });
            }

            // Execute Application Runtime Loops
            const clock = new THREE.Clock();
            
            function animateLoop() {
                requestAnimationFrame(animateLoop);
                
                const deltaTime = Math.min(clock.getDelta(), 0.1); 

                // Dynamic Humanoid Routine Processes Update
                for(let i = 0; i < humanoidsArray.length; i++) {
                    humanoidsArray[i].updateAgentPhysics(deltaTime);
                }

                // Extracted Accelerometer Inertial Core Processing Update Logic Loop
                if (gyroActive) {
                    const INTEGRATION_LEAK_DECAY = 0.78;
                    targetLinearVelocityX *= INTEGRATION_LEAK_DECAY;
                    targetLinearVelocityZ *= INTEGRATION_LEAK_DECAY;

                    if (Math.abs(targetLinearVelocityX) < VELOCITY_DEADZONE_LIMIT) targetLinearVelocityX = 0;
                    if (Math.abs(targetLinearVelocityZ) < VELOCITY_DEADZONE_LIMIT) targetLinearVelocityZ = 0;

                    if (targetLinearVelocityX !== 0 || targetLinearVelocityZ !== 0) {
                        camera.position.x += targetLinearVelocityX;
                        camera.position.z += targetLinearVelocityZ;
                    }

                    document.getElementById('sensor-hud').innerHTML = `
                        VELOCITY X: ${targetLinearVelocityX.toFixed(4)}<br>
                        VELOCITY Z: ${targetLinearVelocityZ.toFixed(4)}<br>
                        SYSTEM MODE: GYRO_DRIVE
                    `;
                }

                // Camera Constraints Resolution Layer
                if (controls && controls.enabled) {
                    controls.update();
                    
                    if (!gyroActive && lockedGyroRoll !== 0) {
                        cleanTargetQuaternion.copy(camera.quaternion);
                        camera.rotateZ(lockedGyroRoll);
                    }
                }

                renderer.render(scene, camera);

                if (controls && controls.enabled && !gyroActive && lockedGyroRoll !== 0) {
                    camera.quaternion.copy(cleanTargetQuaternion);
                }
            }

            animateLoop();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
