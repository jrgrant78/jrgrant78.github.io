        // ADAPTIVE DUTY FRAME CALIBRATION
        let handStabilityCounter = 0;

        // VOLUMETRIC SOLID BIOMETRIC HAND REGISTERS
        let handVisualizerGroup;

        const kinematicTargetCoordinates = Array.from({ length: 21 }, () => new THREE.Vector3(0, 0, -0.35));

        let sharedLaserGeometry, sharedLaserMaterial;

        const sharedMaterials = {

            buildingSolid: new THREE.MeshLambertMaterial({ color: 0x01020a, depthWrite: true }),
            buildingWire: new THREE.LineBasicMaterial({ color: 0x00ffff }),

            roadCenter: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3 }),
            sidewalkSolid: new THREE.MeshLambertMaterial({ color: 0x222222, side: THREE.DoubleSide }),

        let buildingSolidGeoms = [];

        const crackSegmentsData = [

            [{x:100,y:0},{x:80,y:25},{x:85,y:32},{x:70,y:55}],

        ];

        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3(0, 0, 1);
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
            return function (alpha, beta, gamma, orient) {
                const q = new THREE.Quaternion();
                euler.set(beta, alpha, -gamma, 'YXZ'); q.setFromEuler(euler); q.multiply(q1); q.multiply(q0.setFromAxisAngle(zee, -orient)); return q;
            };
        })();

        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        function applyGeospatialNudge(deltaLat, deltaLon) {
            geoTelemetryOffset.lat += deltaLat; geoTelemetryOffset.lon += deltaLon;
            if (hasLockedInitialAnchor) {
                let calibratedLat = lastRawCoords.lat + geoTelemetryOffset.lat;
                let calibratedLon = lastRawCoords.lon + geoTelemetryOffset.lon;
                currentCoordinates.lat = calibratedLat; currentCoordinates.lon = calibratedLon;
                const local = latLonToLocalMeters(calibratedLat, calibratedLon, anchorCoordinates.lat, anchorCoordinates.lon);
                gpsTargetPosition.set(local.x, 1.7, local.z);
            }
        }

        function compileHumanoidAgentModel() {
            const masterRigContainer = new THREE.Group();
            const wireframeMat = new THREE.LineBasicMaterial({ color: 0xff7700, linewidth: 2 });
            const extractEdges = (geo) => new THREE.EdgesGeometry(geo);
            const torsoBox = new THREE.LineSegments(extractEdges(new THREE.BoxGeometry(0.7, 1.1, 0.35)), wireframeMat); torsoBox.position.y = 1.25; masterRigContainer.add(torsoBox);
            const headBox = new THREE.LineSegments(extractEdges(new THREE.BoxGeometry(0.4, 0.4, 0.4)), wireframeMat); headBox.position.y = 0.8; torsoBox.add(headBox);
            const leftShoulderPivot = new THREE.Group(); leftShoulderPivot.position.set(-0.45, 0.45, 0);
            const leftUpperArmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.07, 0.55)), wireframeMat); leftUpperArmSeg.position.y = -0.25; leftShoulderPivot.add(leftUpperArmSeg);
            const leftElbowPivot = new THREE.Group(); leftElbowPivot.position.set(0, -0.275, 0);
            const leftForearmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.05, 0.05, 0.5)), wireframeMat); leftForearmSeg.position.y = -0.25; leftUpperArmSeg.add(leftShoulderPivot); torsoBox.add(leftShoulderPivot);
            const rightShoulderPivot = new THREE.Group(); rightShoulderPivot.position.set(0.45, 0.45, 0);
            const rightUpperArmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.07, 0.55)), wireframeMat); rightUpperArmSeg.position.y = -0.25; rightShoulderPivot.add(rightUpperArmSeg);
            const rightElbowPivot = new THREE.Group(); rightElbowPivot.position.set(0, -0.275, 0);
            const rightForearmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.05, 0.05, 0.5)), wireframeMat); rightForearmSeg.position.y = -0.25; rightUpperArmSeg.add(rightElbowPivot); torsoBox.add(rightShoulderPivot);
            const leftHipPivot = new THREE.Group(); leftHipPivot.position.set(-0.22, -0.6, 0);
            const leftThighSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.09, 0.07, 0.65)), wireframeMat); leftThighSeg.position.y = -0.325; leftHipPivot.add(leftThighSeg);
            const leftKneePivot = new THREE.Group(); leftKneePivot.position.set(0, -0.325, 0);
            const leftShinSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.05, 0.6)), wireframeMat); leftShinSeg.position.y = -0.3; leftKneePivot.add(leftShinSeg); leftThighSeg.add(leftHipPivot); torsoBox.add(leftHipPivot);
            const rightHipPivot = new THREE.Group(); rightHipPivot.position.set(0.22, -0.6, 0);
            const rightThighSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.09, 0.07, 0.65)), wireframeMat); rightThighSeg.position.y = -0.325; rightHipPivot.add(rightThighSeg);
            const rightKneePivot = new THREE.Group(); rightKneePivot.position.set(0, -0.325, 0);
            const rightShinSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.05, 0.6)), wireframeMat); rightShinSeg.position.y = -0.3; rightKneePivot.add(rightShinSeg); rightThighSeg.add(rightKneePivot); torsoBox.add(rightHipPivot);
            return {
                rootMesh: masterRigContainer, leftShoulder: leftShoulderPivot, leftElbow: leftElbowPivot, rightShoulder: rightShoulderPivot, rightElbow: rightElbowPivot, leftHip: leftHipPivot, leftKnee: leftKneePivot, rightHip: rightHipPivot, rightKnee: rightKneePivot
            };
        }

        function executeAgentLimbAnimations(agentRef, currentTimestamp) {
            const movementVelocity = agentRef.smoothedSpeed || 0;
            if (movementVelocity > 0.02) {
                const dynamicFrequency = Math.min(12, movementVelocity * 4.5); const rotationSwingPhase = Math.sin(currentTimestamp * 0.008 * dynamicFrequency);
                agentRef.joints.leftShoulder.rotation.x = rotationSwingPhase * 0.6; agentRef.joints.leftElbow.rotation.x = (Math.sin(currentTimestamp * 0.008 * dynamicFrequency + Math.PI/2) * 0.2) - 0.2;
                agentRef.joints.rightShoulder.rotation.x = -rotationSwingPhase * 0.6; agentRef.joints.rightElbow.rotation.x = (Math.sin(currentTimestamp * 0.008 * dynamicFrequency - Math.PI/2) * 0.2) - 0.2;
                agentRef.joints.leftHip.rotation.x = -rotationSwingPhase * 0.5; agentRef.joints.leftKnee.rotation.x = rotationSwingPhase > 0 ? rotationSwingPhase * 0.4 : 0;
                agentRef.joints.rightHip.rotation.x = rotationSwingPhase * 0.5; agentRef.joints.rightKnee.rotation.x = rotationSwingPhase < 0 ? -rotationSwingPhase * 0.4 : 0;
            } else {
                const returnEaseFactor = 0.15;
                agentRef.joints.leftShoulder.rotation.x += (0 - agentRef.joints.leftShoulder.rotation.x) * returnEaseFactor; agentRef.joints.leftElbow.rotation.x += (0 - agentRef.joints.leftElbow.rotation.x) * returnEaseFactor;

        function advanceDayNightCycleSimulation() {
            const hardwareDateInstance = new Date();
            calculatedVisorTimeline = hardwareDateInstance.getHours() + (hardwareDateInstance.getMinutes() / 60) + (hardwareDateInstance.getSeconds() / 3600);

            let ambientIlluminationIntensity = 0.3;
            let solarBeamIntensity = 0.0;
            let stellarOpacityValue = 0.0;

            const sunOrbitalRadian = ((calculatedVisorTimeline - 6) / 24) * Math.PI * 2;
            atmosphericSunLight.position.set(
                Math.cos(sunOrbitalRadian) * 600,
                Math.sin(sunOrbitalRadian) * 600,
                0
            );

            if (calculatedVisorTimeline >= 0 && calculatedVisorTimeline < 4.5) { 
                _colorSkyBuffer.copy(_colorMidnightSky); _colorLightBuffer.copy(_colorMidnightLight);
                ambientIlluminationIntensity = 0.25; solarBeamIntensity = 0.2; stellarOpacityValue = 1.0;
            } 
            else if (calculatedVisorTimeline >= 4.5 && calculatedVisorTimeline < 7.0) { 
                const alpha = (calculatedVisorTimeline - 4.5) / 2.5;
                _colorSkyBuffer.lerpColors(_colorMidnightSky, _colorDawnSky, alpha);
                _colorLightBuffer.lerpColors(_colorMidnightLight, _colorDawnLight, alpha);
                ambientIlluminationIntensity = THREE.MathUtils.lerp(0.25, 0.45, alpha);
                solarBeamIntensity = THREE.MathUtils.lerp(0.2, 0.7, alpha);
                stellarOpacityValue = THREE.MathUtils.lerp(1.0, 0.0, alpha);
            } 
            else if (calculatedVisorTimeline >= 7.0 && calculatedVisorTimeline < 16.0) { 
                const alpha = (calculatedVisorTimeline - 7.0) / 9.0;
                _colorSkyBuffer.lerpColors(_colorDawnSky, _colorDaySky, alpha);
                _colorLightBuffer.copy(_colorDayLight);
                ambientIlluminationIntensity = 0.6; solarBeamIntensity = 1.1; stellarOpacityValue = 0.0;
            } 
            else if (calculatedVisorTimeline >= 16.0 && calculatedVisorTimeline < 19.0) { 
                const alpha = (calculatedVisorTimeline - 16.0) / 3.0;
                _colorSkyBuffer.lerpColors(_colorDaySky, _colorDuskSky, alpha);
                _colorLightBuffer.lerpColors(_colorDayLight, _colorDuskLight, alpha);
                ambientIlluminationIntensity = THREE.MathUtils.lerp(0.6, 0.5, alpha);
                solarBeamIntensity = THREE.MathUtils.lerp(1.1, 0.9, alpha);
                stellarOpacityValue = 0.0;
            } 
            else if (calculatedVisorTimeline >= 19.0 && calculatedVisorTimeline < 21.5) { 
                const alpha = (calculatedVisorTimeline - 19.0) / 2.5;
                _colorSkyBuffer.lerpColors(_colorDuskSky, _colorMidnightSky, alpha);
                _colorLightBuffer.lerpColors(_colorDuskLight, _colorMidnightLight, alpha);
                ambientIlluminationIntensity = THREE.MathUtils.lerp(0.5, 0.3, alpha);
                solarBeamIntensity = THREE.MathUtils.lerp(0.9, 0.3, alpha);
                stellarOpacityValue = THREE.MathUtils.lerp(0.0, 1.0, alpha);
            } 
            else { 
                _colorSkyBuffer.copy(_colorMidnightSky); _colorLightBuffer.copy(_colorMidnightLight);
                ambientIlluminationIntensity = 0.25; solarBeamIntensity = 0.2; stellarOpacityValue = 1.0;
            }

            renderer.setClearColor(_colorSkyBuffer, 1.0);
            globalAmbientLight.color.copy(_colorSkyBuffer);
            globalAmbientLight.intensity = ambientIlluminationIntensity;
            atmosphericSunLight.color.copy(_colorLightBuffer);
            atmosphericSunLight.intensity = solarBeamIntensity;
            stellarDomeSystem.material.opacity = stellarOpacityValue;
        }

        function autoInitializeSensors() {
            const viewportCanvas = document.getElementById('canvas3d');
            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true; previousPointerX = e.clientX; previousPointerY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return; 
                const deltaX = e.clientX - previousPointerX; const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                lookYaw -= deltaX * 0.003; lookPitch -= deltaY * 0.003;

            });
            window.addEventListener('pointerup', () => { isDragging = false; });
            window.addEventListener('pointercancel', () => { isDragging = false; });

            const mapContainer = document.getElementById('minimap-container');
            
            mapContainer.addEventListener('pointerdown', (e) => {
                if (!isMinimapEnlarged) return;
                e.stopPropagation(); 
                activeMapPointers.push(e);
                if (activeMapPointers.length === 2) {
                    previousPinchDist = Math.hypot(
                        activeMapPointers[0].clientX - activeMapPointers[1].clientX,
                        activeMapPointers[0].clientY - activeMapPointers[1].clientY
                    );
                }
            });

            mapContainer.addEventListener('pointermove', (e) => {
                if (!isMinimapEnlarged) return;
                e.stopPropagation();
                
                const ptrIndex = activeMapPointers.findIndex(p => p.pointerId === e.pointerId);
                if (ptrIndex === -1) return;
                
                let legacyPointer = activeMapPointers[ptrIndex];
                let deltaX = e.clientX - legacyPointer.clientX;
                let deltaY = e.clientY - legacyPointer.clientY;
                
                activeMapPointers[ptrIndex] = e;

                const baseRadius = MAP_RADIUS_METERS;
                const VISIBLE_MAP_RADIUS = baseRadius / minimapZoomScale;
                const minimapCanvas = document.getElementById('minimapCanvas');
                const centerMeters = minimapCanvas.width / 2;
                const contextScale = centerMeters / VISIBLE_MAP_RADIUS;

                if (activeMapPointers.length === 1) {
                    const headingVector = new THREE.Vector3(); 
                    camera.getWorldDirection(headingVector); 
                    const currentYawAngle = Math.atan2(headingVector.x, -headingVector.z);

                    let spaceDeltaMetersX = deltaX / contextScale;
                    let spaceDeltaMetersZ = delta;

                    let translatedWorldX = spaceDeltaMetersX * Math.cos(currentYawAngle) - spaceDeltaMetersZ * Math.sin(currentYawAngle);
                    let translatedWorldZ = spaceDeltaMetersX * Math.sin(currentYawAngle) + spaceDeltaMetersZ * Math.cos(currentYawAngle);

                    minimapPanOffset.x -= translatedWorldX;
                    minimapPanOffset.z -= translatedWorldZ;

                    let candidateCenterX = camera.position.x + minimapPanOffset.x;
                    let candidateCenterZ = camera.position.z + minimapPanOffset.z;
                    let centerDistFromOrigin = Math.hypot(candidateCenterX, candidateCenterZ);
                    let maxAllowedDist = Math.max(0, MAP_RADIUS_METERS - VISIBLE_MAP_RADIUS);

                    if (centerDistFromOrigin > maxAllowedDist) {
                        if (maxAllowedDist === 0) {
                            minimapPanOffset.set(0, 0, 0);
                        } else {
                            let clampRatio = maxAllowedDist / centerDistFromOrigin;
                            candidateCenterX *= clampRatio;
                            candidateCenterZ *= clampRatio;
                            minimapPanOffset.x = candidateCenterX - camera.position.x;
                            minimapPanOffset.z = candidateCenterZ - camera.position.z;
                        }
                    }
                } 
                else if (activeMapPointers.length === 2) {
                    let activeDistance = Math.hypot(
                        activeMapPointers[0].clientX - activeMapPointers[1].clientX,
                        activeMapPointers[0].clientY - activeMapPointers[1].clientY
                    );
                    if (previousPinchDist > 0) {
                        let rawZoomRatio = activeDistance / previousPinchDist;
                        let dampenedZoomRatio = 1 + (rawZoomRatio - 1) * 0.5;
                        minimapZoomScale *= dampenedZoomRatio;
                        
                        if (minimapZoomScale < 1.0) {
                            minimapZoomScale = 1.0;
                            minimapPanOffset.set(0, 0, 0); 
                        }
                        minimapZoomScale = Math.min(12.0, minimapZoomScale); 

                        let candidateCenterX = camera.position.x + minimapPanOffset.x;
                        let candidateCenterZ = camera.position.z + minimapPanOffset.z;
                        let centerDistFromOrigin = Math.hypot(candidateCenterX, candidateCenterZ);
                        let dynamicMaxPanDist = Math.max(0, MAP_RADIUS_METERS - (baseRadius / minimapZoomScale));

                        if (dynamicMaxPanDist === 0 || centerDistFromOrigin > dynamicMaxPanDist) {
                            if (dynamicMaxPanDist === 0) {
                                minimapPanOffset.set(0, 0, 0);
                            } else {
                                let clampRatio = dynamicMaxPanDist / centerDistFromOrigin;
                                candidateCenterX *= clampRatio;
                                candidateCenterZ *= clampRatio;
                                minimapPanOffset.x = candidateCenterX - camera.position.x;
                                minimapPanOffset.z = dynamicMaxPanDist;
                            }
                        }
                    }
                    previousPinchDist = activeDistance;
                }
            });

            const flushActiveMapPointers = (e) => {
                const ptrIndex = activeMapPointers.findIndex(p => p.pointerId === e.pointerId);
                if (ptrIndex !== -1) activeMapPointers.splice(ptrIndex, 1);
                if (activeMapPointers.length < 2) previousPinchDist = 0;
            };

            mapContainer.addEventListener('pointerup', flushActiveMapPointers);
            mapContainer.addEventListener('pointercancel', flushActiveMapPointers);
            mapContainer.addEventListener('pointerleave', flushActiveMapPointers);

            mapContainer.addEventListener('click', (e) => {

                    } else {

                    }
                    minimapPanOffset.set(0, 0, 0);
                }
                lastMapClickTime = rightNowTime;
            });

            window.addEventListener('click', (e) => {
                if (!sensorsEngaged || e.target.closest('#fine-tune-dock')) return; 
                
                if (isMinimapEnlarged) {
                    if (!e.target.closest('#minimap-container')) {

                        mapContainer.classList.remove('enlarged');
                        minimapZoomScale = 1.0;
                        minimapPanOffset.set(0, 0, 0);
                    }

                    if (e.target.closest('#minimap-container')) {
                        isMinimapEnlarged = true;
                        mapContainer.classList.add('enlarged');
                    }
                }
            });
        }

        function parseAndBuildOSMWorld(osmData, anchorLat, anchorLon) {
            while(mapStructuralMeshes.children.length > 0) { const m = mapStructuralMeshes.children[0]; if (m.geometry) m.geometry.dispose(); mapStructuralMeshes.remove(m); }
            globalTrafficNodes.length = 0; renderedStreetsList.length = 0; renderedBuildingsList.length = 0; renderedPedestrianList.length = 0;
            actionableItemsArray.length = 0; hackingTerminalsCollection.length = 0; combinedBuildingMesh = null;

            buildingSolidGeoms = []; buildingWireGeoms = []; roadSolidGeoms = []; roadCurbGeoms = []; roadCenterGeoms = []; sidewalkSolidGeoms = []; crosswalkGeoms = [];
            const grassGroundMesh = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), sharedMaterials.grass); grassGroundMesh.rotation.x = -Math.PI / 2; mapStructuralMeshes.add(grassGroundMesh);

            if (!osmData || !osmData.elements) return;
            const nodesLookup = {};
            osmData.elements.forEach(el => { if (el.type === 'node') nodesLookup[el.id] = latLonToLocalMeters(el.lat, el.lon, anchorLat, anchorLon); });
            osmData.elements.forEach(el => {
                if (el.type === 'way' && el.nodes) {
                    const pts = []; el.nodes.forEach(nid => { if (nodesLookup[nid]) pts.push(nodesLookup[nid]); }); if (pts.length < 2) return;
                    const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length; const cz = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
                    if (Math.hypot(cx, cz) > MAP_RADIUS_METERS) return;
                    if (el.tags && el.tags.building) { buildNeonStructuralHulls(pts, el.tags); }
                    else if (el.tags && el.tags.highway) {
                        if (['footway', 'pedestrian', 'path', 'sidewalk'].includes(el.tags.highway) || el.tags.footway) { buildPedestrianConduits(pts, el.tags); }
                        else { buildNeonVectorPathways(pts, el.tags); }
                    }
                }
            });

            if (buildingSolidGeoms.length > 0) { 
                combinedBuildingMesh = new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(buildingSolidGeoms), sharedMaterials.buildingSolid);
                mapStructuralMeshes.add(combinedBuildingMesh); 
            }
            if (buildingWireGeoms.length > 0) { mapStructuralMeshes.add(new THREE.LineSegments(THREE.BufferGeometryUtils.mergeBufferGeometries(buildingWireGeoms), sharedMaterials.buildingWire)); }
            if (roadSolidGeoms.length > 0) { mapStructuralMeshes.add(new THREE.Mesh(THREE.BufferGeometryUtils.mergeBufferGeometries(roadSolidGeoms), sharedMaterials.roadSolid)); }
            if (roadCurbGeoms.length > 0) { mapStructuralMeshes.add(new THREE.LineSegments(THREE.BufferGeometryUtils.mergeBufferGeometries(roadCurbGeoms), sharedMaterials.roadCurb)); }
            if (roadCenterGeoms.length > 0) {
                const mainLine = new THREE.LineSegments(THREE.BufferGeometryUtils.mergeBufferGeometries(roadCenterGeoms), sharedMaterials.roadCenter);

        function handleAIBuildingCollision(pos, radius) {

                const b = renderedBuildingsList[i];

                const box = b.box;
                if (pos.x + radius > box.minX && pos.x - radius < box.maxX &&
                    pos.z + radius > box.minZ && pos.z - radius < box.maxZ) {
                    
                    let pushLeft = pos.x - box.minX + radius;
                    let pushRight = box.maxX - pos.x + radius;
                    let pushUp = pos.z - box.minZ + radius;
                    let pushDown = box.maxZ - pos.z + radius;
                    
                    let minPush = pushLeft;
                    if (pushRight < minPush) minPush = pushRight;
                    if (pushUp < minPush) minPush = pushUp;
                    if (pushDown < minPush) minPush = pushDown;
                    
                    if (minPush === pushLeft) pos.x -= pushLeft;
                    else if (minPush === pushRight) pos.x += pushRight;
                    else if (minPush === pushUp) pos.z -= pushUp;
                    else pos.z += pushDown;
                }
            }
        }

            scene.add(mapStructuralMeshes); autoInitializeSensors(); setupVisorEnvironmentLighting(); onWindowResize(); window.addEventListener('resize', onWindowResize);
            
            sharedLaserGeometry = new THREE.CylinderGeometry(0.05, 0.05, 2.5);
            sharedLaserMaterial = new THREE.MeshBasicMaterial({ color: 0xff0055 });

            handVisualizerGroup = new THREE.Group();
            handVisualizerGroup.renderOrder = 9999; 
            handVisualizerGroup.visible = false;
            
            const jointGeometry = new THREE.SphereGeometry(0.0048, 8, 8);
            
            const biometricOrangeMaterial = new THREE.MeshBasicMaterial({ 
                color: 0xff5500, 
                wireframe: false, 
                depthTest: false,
                depthWrite: false,
                transparent: true
            });
            
            for (let i = 0; i < 21; i++) {
                const jMesh = new THREE.Mesh(jointGeometry, biometricOrangeMaterial);
                jMesh.matrixAutoUpdate = false;
                handVisualizerGroup.add(jMesh);
                structuralJointMeshes.push(jMesh);
            }

            const baseBoneUnitGeometry = new THREE.CylinderGeometry(0.0045, 0.0035, 1.0, 6);
            
            for (let i = 0; i < BIOMETRIC_BONES_MAP.length; i++) {
                const boneMeshInstance = new THREE.Mesh(baseBoneUnitGeometry, biometricOrangeMaterial);
                boneMeshInstance.matrixAutoUpdate = false;
                handVisualizerGroup.add(boneMeshInstance);
                volumetricBoneMeshes.push(boneMeshInstance);
            }

            palmGeometry = new THREE.BufferGeometry();
            const palmPositionsArray = new Float32Array(7 * 3); 
            palmGeometry.setAttribute('position', new THREE.BufferAttribute(palmPositionsArray, 3));
            
            const palmIndices = [
                0, 1, 2,  
                0, 2, 3,  
                0, 3, 4,  
                0, 4, 5,  
                0, 5, 6   
            ];
            palmGeometry.setIndex(palmIndices);

            const palmMaterial = new THREE.MeshBasicMaterial({
                color: 0xff5500,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.85, 
                depthTest: false,
                depthWrite: false
            });

            palmMesh = new THREE.Mesh(palmGeometry, palmMaterial);
            palmMesh.matrixAutoUpdate = false;
            handVisualizerGroup.add(palmMesh);
            
            camera.add(handVisualizerGroup);
            scene.add(camera);

            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine); const t = Date.now();
                spatialAnomaliesCollection.forEach(a => { if (!a.collected) { a.mesh.rotation.x += 0.01; a.mesh.rotation.y += 0.02; } });
                
                hackingTerminalsCollection.forEach(tNode => {
                    if (tNode.lowering) {
                        tNode.group.position.y -= 0.05; 
                        if (tNode.group.position.y <= -3.0) {
                            tNode.group.position.y = -3.0;
                            tNode.lowering = false;
                            scene.remove(tNode.group); 
                        }
                    }
                });

                if (sensorsEngaged) { 
                    advanceDayNightCycleSimulation();
                    advanceDronePatrolSimulation(t); 
                    evaluateGameplayState(); 

                    if (handVisualizerGroup.visible) {
                        for (let i = 0; i < 21; i++) {
                            structuralJointMeshes[i].position.lerp(kinematicTargetCoordinates[i], 0.35);
                            structuralJointMeshes[i].updateMatrix();
                        }
                        for (let i = 0; i < BIOMETRIC_BONES_MAP.length; i++) {
                            const connection = BIOMETRIC_BONES_MAP[i];
                            orientVolumetricBoneCylinder(volumetricBoneMeshes[i], structuralJointMeshes[connection[0]].position, structuralJointMeshes[connection[1]].position);
                            volumetricBoneMeshes[i].updateMatrix();
                        }

                        const palmVertices = palmGeometry.attributes.position.array;
                        const boundNodes = [0, 1, 2, 5, 9, 13, 17]; 
                        for (let idx = 0; idx < 7; idx++) {
                            const currentJointPos = structuralJointMeshes[boundNodes[idx]].position;
                            const stride = idx * 3;
                            palmVertices[stride] = currentJointPos.x;
                            palmVertices[stride + 1] = currentJointPos.y;
                            palmVertices[stride + 2] = currentJointPos.z;
                        }
                        palmGeometry.attributes.position.needsUpdate = true;
                        palmMesh.updateMatrix();

                        _scratchHandCheckVec.copy(structuralJointMeshes[8].position); 
                        _scratchHandCheckVec.applyMatrix4(camera.matrixWorld); 

                        hackingTerminalsCollection.forEach(tNode => {
                            if (tNode.hacked) return;

                            const flatDistanceToUnit = camera.position.distanceTo(tNode.group.position);
                            if (flatDistanceToUnit < 3.5) { 
                                
                                tNode.buttons.forEach(btn => {
                                    if (!btn.userData.clicked) {
                                        if (_scratchHandCheckVec.distanceTo(btn.userData.worldPos) < 0.14) {
                                            btn.userData.clicked = true;
                                            btn.material.color.setHex(0x00ff55); 
                                            generateLocalElectricSpark(btn.userData.worldPos);
                                        }
                                    }
                                });

                                if (tNode.slideHandle.userData.progress < 1.0) {
                                    tNode.handleWorldPos.lerpVectors(tNode.trackStartWorldPos, tNode.trackEndWorldPos, tNode.slideHandle.userData.progress);
                                    
                                    if (_scratchHandCheckVec.distanceTo(tNode.handleWorldPos) < 0.18) {
                                        tNode.slideHandle.userData.progress = Math.min(1.0, tNode.slideHandle.userData.progress + 0.025);
                                        tNode.slideHandle.position.x = -0.26 + (tNode.slideHandle.userData.progress * 0.52);
                                        
                                        if (tNode.slideHandle.userData.progress >= 1.0) {
                                            tNode.slideHandle.material.color.setHex(0x00ffff); 
                                        }
                                    }
                                }

                                const formsCompleted = tNode.buttons.every(b => b.userData.clicked);
                                const trackCompleted = tNode.slideHandle.userData.progress >= 1.0;
                                
                                if (formsCompleted && trackCompleted) {
                                    tNode.hacked = true;
                                    tNode.lowering = true;

                                    activeTerminalAlarms.push({
                                        pos: tNode.group.position.clone(),
                                        expiresAt: Date.now() + 20000
                                    });

                                    totalTerminalsHacked++;
                                    document.getElementById('hacked-terminal-counter').innerText = `${totalTerminalsHacked} / ${hackingTerminalsCollection.length}`;
                                    if (totalTerminalsHacked >= hackingTerminalsCollection.length) { triggerGlobalHardwareOverride(); }
                                }
                            }
                        });
                    }
                }
                
                renderer.render(scene, camera); 

                if (t - lastMinimapUpdateTime > 66) {
                    update2DMinimapSystem();
                    lastMinimapUpdateTime = t;
                }
            }
            frameLoopEngine();
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
