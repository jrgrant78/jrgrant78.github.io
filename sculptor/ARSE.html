<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project A.R.S.E - Biometric Diagnostic Mode</title>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #010103; color: #00ffcc; user-select: none;
        }

        #canvas3d {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 2;
            display: block;
        }

        #visor-boot-gate {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; background: #020205;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; cursor: pointer;
        }

        #central-hud-alerts {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 6; pointer-events: none; text-align: center; width: 80%;
        }

        .hud-banner-text {
            font-size: 24px; font-weight: 900; letter-spacing: 4px; color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc; margin: 0;
        }

        .pulse-animation { animation: loading-text-pulse 1.4s infinite ease-in-out; }
        @keyframes loading-text-pulse {
            0% { opacity: 0.4; }
            50% { opacity: 1; }
            100% { opacity: 0.4; }
        }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <!-- MEDIAPIPE CORE SPATIAL TRACKING ENGINE -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <video id="webcam-hardware-feed" autoplay playsinline width="640" height="480" style="display:none;"></video>

    <div id="visor-boot-gate" onclick="engageVisorDiagnosticMode()">
        <div style="font-size: 28px; font-weight: 900; letter-spacing: 6px; color: #00ffcc; margin-bottom: 20px; text-shadow: 0 0 15px #00ffcc;">
            // BIOMETRIC DIAGNOSTIC ISOLATION
        </div>
        <div class="pulse-animation" style="font-size: 12px; font-weight: bold; letter-spacing: 2px;">
            TAP SCREEN TO INITIALIZE CAMERA SUB-SYSTEMS
        </div>
    </div>

    <canvas id="canvas3d"></canvas>

    <div id="central-hud-alerts">
        <div id="diagnostic-status" class="hud-banner-text pulse-animation">SENSORS OFFLINE</div>
    </div>

    <script>
        let scene, camera, renderer;
        let sensorsEngaged = false; 

        // ARTICULATED BIOMETRIC MATRIX DEFINITIONS
        let handVisualizerGroup;
        const structuralJointMeshes = [];
        let skeletalBonesMesh;
        const BIOMETRIC_BONES_MAP = [
            [0,1], [1,2], [2,3], [3,4],
            [0,5], [5,6], [6,7], [7,8],
            [5,9], [9,10], [10,11], [11,12],
            [9,13], [13,14], [14,15], [15,16],
            [13,17], [17,18], [18,19], [19,20], [0,17]
        ];

        function engageVisorDiagnosticMode() {
            if (sensorsEngaged) return; 
            sensorsEngaged = true;

            const bootGate = document.getElementById('visor-boot-gate');
            bootGate.style.display = 'none';
            
            document.getElementById('diagnostic-status').innerText = "SEARCHING FOR BIOMETRIC SIGNALS...";

            initializeHardwareBiometricTracking();
        }

        function initializeHardwareBiometricTracking() {
            const videoElement = document.getElementById('webcam-hardware-feed');
            const handsTrackingInstance = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            handsTrackingInstance.setOptions({
                maxNumHands: 1,
                modelComplexity: 0, // Lite computational footprint
                minDetectionConfidence: 0.45,
                minTrackingConfidence: 0.45
            });

            handsTrackingInstance.onResults(handleBiometricLandmarkResults);

            // Fallback chain handling exact vs ideal environment modes to bypass mobile constraints
            navigator.mediaDevices.getUserMedia({
                video: { facingMode: { ideal: "environment" }, width: { ideal: 640 }, height: { ideal: 480 } }
            }).then(stream => {
                videoElement.srcObject = stream;
                videoElement.addEventListener('loadedmetadata', () => {
                    videoElement.play();
                    executeThrottledFramePump();
                });
            }).catch((err) => {
                document.getElementById('diagnostic-status').innerText = "CAMERA ACCESS DENIED";
                console.error("Camera system acquisition failure:", err);
            });

            let lastHandProcessTime = 0;
            function executeThrottledFramePump() {
                if (sensorsEngaged && videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    const now = Date.now();
                    if (now - lastHandProcessTime > 40) { // Throttled processing window
                        handsTrackingInstance.send({ image: videoElement });
                        lastHandProcessTime = now;
                    }
                }
                requestAnimationFrame(executeThrottledFramePump);
            }
        }

        function handleBiometricLandmarkResults(results) {
            const statusLabel = document.getElementById('diagnostic-status');
            
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                handVisualizerGroup.visible = false;
                statusLabel.innerText = "SEARCHING FOR BIOMETRIC SIGNALS...";
                statusLabel.style.color = "#00ffcc";
                return;
            }

            // Target lock acquired
            handVisualizerGroup.visible = true;
            statusLabel.innerText = "HAND TRACKING ACTIVE";
            statusLabel.style.color = "#ff0055";
            
            const landmarks = results.multiHandLandmarks[0];
            const fovRad = (camera.fov * Math.PI) / 180;
            const projectDistance = 0.25; // Render closer to the lens to prevent far-plane clipping limits
            const viewHeightMax = Math.tan(fovRad / 2) * projectDistance;
            const viewWidthMax = viewHeightMax * camera.aspect;

            for (let i = 0; i < 21; i++) {
                const lm = landmarks[i];
                // Project normalized camera space cleanly into Three.js screen space child vectors
                const localX = (lm.x - 0.5) * 2 * viewWidthMax; 
                const localY = (0.5 - lm.y) * 2 * viewHeightMax;
                const localZ = -projectDistance - (lm.z * 0.2); 

                structuralJointMeshes[i].position.set(localX, localY, localZ);
            }

            const posAttr = skeletalBonesMesh.geometry.attributes.position;
            let idx = 0;
            BIOMETRIC_BONES_MAP.forEach(connection => {
                const vStart = structuralJointMeshes[connection[0]].position;
                const vEnd = structuralJointMeshes[connection[1]].position;
                posAttr.setXYZ(idx++, vStart.x, vStart.y, vStart.z);
                posAttr.setXYZ(idx++, vEnd.x, vEnd.y, vEnd.z);
            });
            posAttr.needsUpdate = true;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.setClearColor(0x010103, 1.0);

            window.addEventListener('resize', onWindowResize);
            
            // CONSTRUCT EXCLUSIVE VISUAL DIAGNOSTIC CORE GROUP
            handVisualizerGroup = new THREE.Group();
            handVisualizerGroup.renderOrder = 9999;
            
            // Increased geometry footprint size for debugging visibility issues instantly
            const jointGeometry = new THREE.SphereGeometry(0.006, 8, 8);
            const jointMaterial = new THREE.MeshBasicMaterial({ 
                color: 0x00ffcc, 
                wireframe: true,
                depthTest: false,
                depthWrite: false,
                transparent: true
            });
            
            for (let i = 0; i < 21; i++) {
                const jMesh = new THREE.Mesh(jointGeometry, jointMaterial);
                handVisualizerGroup.add(jMesh);
                structuralJointMeshes.push(jMesh);
            }

            const skeletonGeo = new THREE.BufferGeometry();
            const jointPositionsArray = new Float32Array(BIOMETRIC_BONES_MAP.length * 6);
            skeletonGeo.setAttribute('position', new THREE.BufferAttribute(jointPositionsArray, 3));
            
            skeletalBonesMesh = new THREE.LineSegments(skeletonGeo, new THREE.LineBasicMaterial({ 
                color: 0xff0055, 
                linewidth: 3,
                depthTest: false,
                depthWrite: false,
                transparent: true
            }));
            handVisualizerGroup.add(skeletalBonesMesh);
            
            // Lock tracking assets directly to perspective system
            camera.add(handVisualizerGroup);
            scene.add(camera);

            function diagnosticRenderLoop() {
                requestAnimationFrame(diagnosticRenderLoop);
                renderer.render(scene, camera);
            }
            diagnosticRenderLoop();
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
