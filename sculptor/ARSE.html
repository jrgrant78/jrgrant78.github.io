<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project A.R.S.E - Augmented Reality Spatial Espionage</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            overflow: hidden;
            width: 100%;
            height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #020205;
            color: #00ffcc;
            user-select: none;
        }

        #canvas3d {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 2;
            display: block;
            pointer-events: auto;
        }

        #visor-boot-gate {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 9999;
            background: #020205;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            cursor: pointer;
            pointer-events: auto;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #visor-screen-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 4;
            pointer-events: none;
            background: rgba(255, 255, 255, 0);
            transition: background 0.15s ease;
        }

        /* LIVE NETWORK SATELLITE HUD DISPLAY */
        #agent-count-hud {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 1000;
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 2px;
            color: #00ffcc;
            text-shadow: 0 0 10px #00ffcc;
            pointer-events: none;
            display: none;
            background: rgba(2, 2, 5, 0.6);
            padding: 6px 12px;
            border: 1px solid rgba(0, 255, 204, 0.3);
            border-radius: 4px;
        }

        .pulse-yellow-alert {
            animation: slow-yellow-glow 1.5s infinite ease-in-out;
        }

        .flash-red-harm {
            background: rgba(255, 0, 85, 0.4) !important;
            box-shadow: inset 0 0 100px rgba(255, 0, 85, 0.7);
        }

        @keyframes slow-yellow-glow {
            0% { background: rgba(255, 255, 0, 0); box-shadow: inset 0 0 20px rgba(255, 255, 0, 0); }
            50% { background: rgba(255, 255, 0, 0.09); box-shadow: inset 0 0 60px rgba(255, 255, 0, 0.35); }
            100% { background: rgba(255, 255, 0, 0); box-shadow: inset 0 0 20px rgba(255, 255, 0, 0); }
        }

        #cracks-canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 5;
            pointer-events: none;
        }

        #central-hud-alerts {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            z-index: 6;
            pointer-events: none;
            text-align: center;
            width: 80%;
        }

        .hud-banner-text {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 4px;
            color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc, 0 0 30px rgba(0, 255, 204, 0.4);
            margin: 0;
        }

        @media (min-width: 768px) {
            .hud-banner-text { font-size: 38px; letter-spacing: 6px; }
        }

        .pulse-animation {
            animation: loading-text-pulse 1.4s infinite ease-in-out;
        }

        @keyframes loading-text-pulse {
            0% { transform: scale(0.96); opacity: 0.4; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.96); opacity: 0.4; }
        }

        .matrix-overload-title {
            color: #ff0055;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: 5px;
            text-shadow: 0 0 20px #ff0055;
            animation: critical-visor-flash 0.4s infinite;
            text-transform: uppercase;
        }

        .matrix-overload-sub {
            color: #00ffcc;
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 18px;
            text-shadow: 0 0 10px #00ffcc;
            animation: loading-text-pulse 1.2s infinite ease-in-out;
        }

        @keyframes critical-visor-flash {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }

        #threat-tracker-display {
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 2px;
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
            margin-top: 40px;
            display: none;
        }

        @media (min-width: 768px) {
            #threat-tracker-display { font-size: 18px; letter-spacing: 3px; margin-top: 60px; }
        }

        #minimap-container {
            position: absolute;
            bottom: 25px;
            left: 25px;
            width: 26vh; 
            height: 26vh;
            min-width: 90px; min-height: 90px; 
            max-width: 180px; max-height: 180px; 
            z-index: 100;
            pointer-events: auto;
            cursor: pointer;
            transition: width 0.3s ease, height 0.3s ease, max-width 0.3s ease, max-height 0.3s ease, top 0.3s ease, left 0.3s ease, transform 0.3s ease;
        }

        #minimap-container.enlarged {
            bottom: auto;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 94vh;
            height: 94vh;
            max-width: 94vw;
            max-height: 94vh;
            min-width: 0;
            min-height: 0;
        }

        #minimapCanvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            display: block;
        }

        #compass-ring {
            position: absolute;
            top: -5%; left: -5%;
            width: 110%; height: 110%;
            border: 2px dashed rgba(0, 255, 204, 0.3);
            border-radius: 50%;
            transform-origin: center;
            will-change: transform;
        }

        .compass-marker {
            position: absolute;
            font-family: monospace;
            font-size: 9px; font-weight: 900;
            color: #00ffcc;
        }

        #marker-n { top: 2px; left: 50%; transform: translateX(-50%); color: #ff0055; text-shadow: 0 0 5px #ff0055; }
        #marker-s { bottom: 2px; left: 50%; transform: translateX(-50%); }
        #marker-e { right: 4px; top: 50%; transform: translateY(-50%); }
        #marker-w { left: 4px; top: 50%; transform: translateY(-50%); }

        #targeting-matrix {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 60px; height: 60px;
            border: 2px solid rgba(0, 255, 204, 0.2);
            border-radius: 50%;
            pointer-events: none;
            z-index: 1000; 
            display: none; 
        }
        
        #targeting-matrix::before {
            content: '';
            position: absolute;
            top: 50%; left: 50%;
            width: 6px; height: 6px;
            background: #ff0055;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 0 8px #ff0055;
        }

        #fine-tune-dock {
            position: absolute;
            bottom: 25px;
            right: 25px;
            z-index: 110;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .bias-control-panel {
            display: flex;
            gap: 6px;
            background: rgba(6, 10, 25, 0.85);
            padding: 6px;
            border-radius: 6px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            opacity: 0;
            transform: translateX(40px);
            transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.25s ease;
        }

        .bias-control-panel.open {
            opacity: 1;
            pointer-events: auto;
            transform: translateX(0);
        }

        .nudge-btn {
            background: rgba(2, 2, 5, 0.9);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            width: 36px; height: 32px;
            font-size: 13px;
            font-weight: bold;
            font-family: monospace;
            cursor: pointer;
            border-radius: 4px;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.1s ease;
        }

        .nudge-btn:active {
            background: #00ffcc;
            color: #020205;
        }

        .offset-menu-trigger {
            background: rgba(6, 10, 25, 0.85);
            color: #00ffcc;
            border: 1px solid #00ffcc;
            width: 44px;
            height: 44px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 12px rgba(0, 255, 204, 0.25);
            transition: all 0.2s ease;
            pointer-events: auto;
        }

        .offset-menu-trigger:active {
            background: #00ffcc;
            color: #020205;
            box-shadow: 0 0 20px #00ffcc;
        }

        #portrait-warning {
            display: none;
            position: absolute;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: #04060f; color: #00ffcc;
            z-index: 99999; box-sizing: border-box; padding: 40px;
            justify-content: center; align-items: center; text-align: center;
            border: 4px solid #ff0055; letter-spacing: 1px;
        }
        @media (orientation: portrait) { #portrait-warning { display: flex; } }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
</head>
<body>

    <!-- RESTRUCTURED INTERCEPT OVERLAY WITH PROJECT TITLES -->
    <div id="visor-boot-gate" onclick="engageVisorSystemFromBootGate()">
        <div style="font-size: 36px; font-weight: 900; letter-spacing: 8px; color: #00ffcc; margin-bottom: 2px; text-shadow: 0 0 15px #00ffcc;">
            PROJECT A.R.S.E.
        </div>
        <div style="font-size: 11px; font-weight: 800; letter-spacing: 3px; color: #00ffcc; margin-bottom: 50px; opacity: 0.75;">
            AUGMENTED REALITY SPATIAL ESPIONAGE
        </div>
        
        <div style="font-size: 15px; font-weight: 900; letter-spacing: 4px; color: #ff0055; margin-bottom: 12px; text-shadow: 0 0 10px #ff0055;">
            // TERMINAL INITIALIZATION REQUEST
        </div>
        <div class="pulse-animation" style="font-size: 12px; font-weight: bold; letter-spacing: 2px;">
            TAP SCREEN TO INITIALIZE VISOR PROTOCOLS
        </div>
    </div>

    <div id="portrait-warning">
        <div>
            <div style="font-size: 20px; font-weight: bold; color: #ff0055; margin-bottom: 12px;">// CRITICAL ALIGNMENT ALERT</div>
            VISOR ENGAGEMENT BLOCKED. PLEASE ROTATE YOUR DEVICE TO LANDSCAPE VIEW MODE.
        </div>
    </div>

    <!-- UPPER-LEFT VIEWPORT TARGET REGISTRY -->
    <div id="agent-count-hud">Agents: 1</div>

    <div id="visor-screen-overlay"></div>
    <canvas id="cracks-canvas"></canvas>
    <canvas id="canvas3d"></canvas>

    <div id="hud-visor-container">
        <div id="targeting-matrix"></div>

        <div id="central-hud-alerts">
            <div id="main-hud-status" class="hud-banner-text pulse-animation">Calibrating Satellites...</div>
            <div id="threat-tracker-display">TARGET ACQUIRED</div>
        </div>

        <div id="minimap-container">
            <canvas id="minimapCanvas"></canvas>
            <div id="compass-ring">
                <span id="marker-n" class="compass-marker">N</span>
                <span id="marker-e" class="compass-marker">E</span>
                <span id="marker-s" class="compass-marker">S</span>
                <span id="marker-w" class="compass-marker">W</span>
            </div>
        </div>
    </div>

    <div id="fine-tune-dock">
        <div id="biasPanel" class="bias-control-panel">
            <button class="nudge-btn" onclick="applyGeospatialNudge(0.00004, 0)" title="Nudge North">+N</button>
            <button class="nudge-btn" onclick="applyGeospatialNudge(-0.00004, 0)" title="Nudge South">-S</button>
            <button class="nudge-btn" onclick="applyGeospatialNudge(0, -0.00005)" title="Nudge West">-W</button>
            <button class="nudge-btn" onclick="applyGeospatialNudge(0, 0.00005)" title="Nudge East">+E</button>
        </div>
        <button id="offsetMenuTriggerBtn" class="offset-menu-trigger" title="Positional Offset Calibration">⌖</button>
    </div>

    <script>
        let scene, camera, renderer;
        let lookYaw = 0; let lookPitch = 0;
        let isDragging = false;
        let previousPointerX = 0; let previousPointerY = 0;

        let currentCoordinates = { lat: 40.7580, lon: -73.9855 };
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 };
        let lastRawCoords = { lat: 40.7580, lon: -73.9855 }; 
        let hasLockedInitialAnchor = false;
        let initialBestAccuracy = 999999; 
        let mapLoadedForAnchor = false;
        let sensorsEngaged = false; 
        let matrixOverloadActive = false; 
        let isFetchingMap = false; 
        let osmFetchController = null;
        const R_EARTH = 6378137;

        let isMinimapEnlarged = false;

        let geoTelemetryOffset = { lat: 0.0, lon: 0.0 };
        let gpsTargetPosition = new THREE.Vector3(0, 1.7, 0);
        let initialSnapCompleted = false; 

        let playerHealth = 100.0;
        let timeLastSeenByThreat = 0; 
        let isCurrentlyDetected = false; 
        let alertStateActive = false;
        const ALERT_COOLDOWN_MS = 10000; 

        const spatialAnomaliesCollection = [];
        const mapStructuralMeshes = new THREE.Group();
        const globalTrafficNodes = [];
        const renderedStreetsList = [];
        const renderedBuildingsList = [];
        const renderedPedestrianList = []; 
        const tacticalDronesCollection = []; 
        const humanoidBotsCollection = []; 
        const activeLasersCollection = []; 
        let anomaliesCollectedCount = 0;

        let mqttClientInstance = null;
        const connectedAgentsMap = {};
        const localSessionAgentSignature = "AGENT_" + Math.random().toString(36).substring(2, 9);
        const FIELD_TELEMETRY_TOPIC = "project_arse/sat_telemetry/v1";

        const CONE_RADIUS = 2.4; 
        const CONE_HEIGHT = 38.0; 
        const CONE_SEMI_ANGLE = Math.atan(CONE_RADIUS / CONE_HEIGHT); 

        const crackSegmentsData = [
            [{x:0,y:0},{x:15,y:20},{x:22,y:18},{x:35,y:40},{x:40,y:38}],
            [{x:100,y:0},{x:80,y:25},{x:85,y:32},{x:70,y:55}],
            [{x:0,y:100},{x:20,y:75},{x:18,y:65},{x:40,y:60}],
            [{x:100,y:100},{x:85,y:80},{x:75,y:82},{x:60,y:65}],
            [{x:50,y:0},{x:48,y:15},{x:55,y:30},{x:45,y:45}]
        ];

        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3(0, 0, 1);
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
            return function (alpha, beta, gamma, orient) {
                const q = new THREE.Quaternion();
                euler.set(beta, alpha, -gamma, 'YXZ'); 
                q.setFromEuler(euler); 
                q.multiply(q1); 
                q.multiply(q0.setFromAxisAngle(zee, -orient)); 
                return q;
            };
        })();

        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        function applyGeospatialNudge(deltaLat, deltaLon) {
            geoTelemetryOffset.lat += deltaLat;
            geoTelemetryOffset.lon += deltaLon;
            
            if (hasLockedInitialAnchor) {
                let calibratedLat = lastRawCoords.lat + geoTelemetryOffset.lat;
                let calibratedLon = lastRawCoords.lon + geoTelemetryOffset.lon;
                
                currentCoordinates.lat = calibratedLat;
                currentCoordinates.lon = calibratedLon;
                
                const local = latLonToLocalMeters(calibratedLat, calibratedLon, anchorCoordinates.lat, anchorCoordinates.lon);
                gpsTargetPosition.set(local.x, 1.7, local.z);
            }
        }

        function compileHumanoidAgentModel() {
            const masterRigContainer = new THREE.Group();
            const wireframeMat = new THREE.LineBasicMaterial({ color: 0xbd00ff, linewidth: 2 });
            const extractEdges = (geo) => new THREE.EdgesGeometry(geo);

            const torsoBox = new THREE.LineSegments(extractEdges(new THREE.BoxGeometry(0.7, 1.1, 0.35)), wireframeMat);
            torsoBox.position.y = 1.25; 
            masterRigContainer.add(torsoBox);

            const headBox = new THREE.LineSegments(extractEdges(new THREE.BoxGeometry(0.4, 0.4, 0.4)), wireframeMat);
            headBox.position.y = 0.8;
            torsoBox.add(headBox);

            const leftShoulderPivot = new THREE.Group(); leftShoulderPivot.position.set(-0.45, 0.45, 0);
            const leftUpperArmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.07, 0.55)), wireframeMat);
            leftUpperArmSeg.position.y = -0.25; leftShoulderPivot.add(leftUpperArmSeg);
            const leftElbowPivot = new THREE.Group(); leftElbowPivot.position.set(0, -0.275, 0);
            const leftForearmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.05, 0.05, 0.5)), wireframeMat);
            leftForearmSeg.position.y = -0.25; leftElbowPivot.add(leftForearmSeg);
            leftUpperArmSeg.add(leftElbowPivot); torsoBox.add(leftShoulderPivot);

            const rightShoulderPivot = new THREE.Group(); rightShoulderPivot.position.set(0.45, 0.45, 0);
            const rightUpperArmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.07, 0.55)), wireframeMat);
            rightUpperArmSeg.position.y = -0.25; rightShoulderPivot.add(rightUpperArmSeg);
            const rightElbowPivot = new THREE.Group(); rightElbowPivot.position.set(0, -0.275, 0);
            const rightForearmSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.05, 0.05, 0.5)), wireframeMat);
            rightForearmSeg.position.y = -0.25; rightElbowPivot.add(rightForearmSeg);
            rightUpperArmSeg.add(rightElbowPivot); torsoBox.add(rightShoulderPivot);

            const leftHipPivot = new THREE.Group(); leftHipPivot.position.set(-0.22, -0.6, 0);
            const leftThighSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.09, 0.07, 0.65)), wireframeMat);
            leftThighSeg.position.y = -0.325; leftHipPivot.add(leftThighSeg);
            const leftKneePivot = new THREE.Group(); leftKneePivot.position.set(0, -0.325, 0);
            const leftShinSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.05, 0.6)), wireframeMat);
            leftShinSeg.position.y = -0.3; leftKneePivot.add(leftShinSeg);
            leftThighSeg.add(leftKneePivot); torsoBox.add(leftHipPivot);

            const rightHipPivot = new THREE.Group(); rightHipPivot.position.set(0.22, -0.6, 0);
            const rightThighSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.09, 0.07, 0.65)), wireframeMat);
            rightThighSeg.position.y = -0.325; rightHipPivot.add(rightThighSeg);
            const rightKneePivot = new THREE.Group(); rightKneePivot.position.set(0, -0.325, 0);
            const rightShinSeg = new THREE.LineSegments(extractEdges(new THREE.CylinderGeometry(0.07, 0.05, 0.6)), wireframeMat);
            rightShinSeg.position.y = -0.3; rightKneePivot.add(rightShinSeg);
            rightThighSeg.add(rightHipPivot); torsoBox.add(rightHipPivot);

            return {
                rootMesh: masterRigContainer,
                leftShoulder: leftShoulderPivot, leftElbow: leftElbowPivot,
                rightShoulder: rightShoulderPivot, rightElbow: rightElbowPivot,
                leftHip: leftHipPivot, leftKnee: leftKneePivot,
                rightHip: rightHipPivot, rightKnee: rightKneePivot
            };
        }

        function executeAgentLimbAnimations(agentRef, currentTimestamp) {
            const movementVelocity = agentRef.smoothedSpeed || 0;
            
            if (movementVelocity > 0.02) {
                const dynamicFrequency = Math.min(12, movementVelocity * 4.5);
                const rotationSwingPhase = Math.sin(currentTimestamp * 0.008 * dynamicFrequency);
                
                agentRef.joints.leftShoulder.rotation.x = rotationSwingPhase * 0.6;
                agentRef.joints.leftElbow.rotation.x = (Math.sin(currentTimestamp * 0.008 * dynamicFrequency + Math.PI/2) * 0.2) - 0.2;
                
                agentRef.joints.rightShoulder.rotation.x = -rotationSwingPhase * 0.6;
                agentRef.joints.rightElbow.rotation.x = (Math.sin(currentTimestamp * 0.008 * dynamicFrequency - Math.PI/2) * 0.2) - 0.2;

                agentRef.joints.leftHip.rotation.x = -rotationSwingPhase * 0.5;
                agentRef.joints.leftKnee.rotation.x = rotationSwingPhase > 0 ? rotationSwingPhase * 0.4 : 0;

                agentRef.joints.rightHip.rotation.x = rotationSwingPhase * 0.5;
                agentRef.joints.rightKnee.rotation.x = rotationSwingPhase < 0 ? -rotationSwingPhase * 0.4 : 0;
            } else {
                const returnEaseFactor = 0.15;
                agentRef.joints.leftShoulder.rotation.x += (0 - agentRef.joints.leftShoulder.rotation.x) * returnEaseFactor;
                agentRef.joints.leftElbow.rotation.x += (0 - agentRef.joints.leftElbow.rotation.x) * returnEaseFactor;
                agentRef.joints.rightShoulder.rotation.x += (0 - agentRef.joints.rightShoulder.rotation.x) * returnEaseFactor;
                agentRef.joints.rightElbow.rotation.x += (0 - agentRef.joints.rightElbow.rotation.x) * returnEaseFactor;
                agentRef.joints.leftHip.rotation.x += (0 - agentRef.joints.leftHip.rotation.x) * returnEaseFactor;
                agentRef.joints.leftKnee.rotation.x += (0 - agentRef.joints.leftKnee.rotation.x) * returnEaseFactor;
                agentRef.joints.rightHip.rotation.x += (0 - agentRef.joints.rightHip.rotation.x) * returnEaseFactor;
                agentRef.joints.rightKnee.rotation.x += (0 - agentRef.joints.rightKnee.rotation.x) * returnEaseFactor;
            }
        }

        function initializeSatelliteMultiplayerTelemetry() {
            try {
                mqttClientInstance = mqtt.connect("wss://broker.hivemq.com:8884/mqtt");

                mqttClientInstance.on("connect", () => {
                    mqttClientInstance.subscribe(FIELD_TELEMETRY_TOPIC);
                });

                mqttClientInstance.on("message", (topic, dataPacket) => {
                    try {
                        const parsedData = JSON.parse(dataPacket.toString());
                        if (!parsedData.id || parsedData.id === localSessionAgentSignature) return;

                        if (!connectedAgentsMap[parsedData.id]) {
                            const newAgentStructure = compileHumanoidAgentModel();
                            scene.add(newAgentStructure.rootMesh);
                            
                            connectedAgentsMap[parsedData.id] = {
                                id: parsedData.id,
                                joints: newAgentStructure,
                                currentPos: new THREE.Vector3(0, 0, 0),
                                targetPos: new THREE.Vector3(0, 0, 0),
                                currentYaw: 0,
                                targetYaw: 0,
                                smoothedSpeed: 0,
                                lastTransmissionPacketTime: Date.now()
                            };
                        }

                        const agentRecord = connectedAgentsMap[parsedData.id];
                        agentRecord.lastTransmissionPacketTime = Date.now();
                        agentRecord.targetYaw = parsedData.yaw || 0;

                        if (hasLockedInitialAnchor) {
                            const projectionLocalCoordinates = latLonToLocalMeters(
                                parsedData.lat, parsedData.lon, anchorCoordinates.lat, anchorCoordinates.lon
                            );
                            agentRecord.targetPos.set(projectionLocalCoordinates.x, 0, projectionLocalCoordinates.z);
                        }
                    } catch (err) {}
                });

                setInterval(() => {
                    if (sensorsEngaged && hasLockedInitialAnchor && mqttClientInstance && mqttClientInstance.connected) {
                        const rawUploadPayload = {
                            id: localSessionAgentSignature,
                            lat: currentCoordinates.lat,
                            lon: currentCoordinates.lon,
                            yaw: lookYaw,
                            timestamp: Date.now()
                        };
                        mqttClientInstance.publish(FIELD_TELEMETRY_TOPIC, JSON.stringify(rawUploadPayload));
                    }
                }, 300);

            } catch (networkBlockError) {}
        }

        function engageVisorSystemFromBootGate() {
            if (sensorsEngaged) return;
            sensorsEngaged = true;

            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) {
                        screen.orientation.lock('landscape').catch(() => {});
                    }
                }).catch(() => {});
            }

            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => {
                    if (state === 'granted') bindAbsoluteCompassListeners();
                });
            } else {
                bindAbsoluteCompassListeners();
            }

            const bootGate = document.getElementById('visor-boot-gate');
            bootGate.style.opacity = '0';
            setTimeout(() => {
                bootGate.style.display = 'none';
            }, 400);

            // Transition the tracking count into view cleanly once boot resolves
            document.getElementById('agent-count-hud').style.display = 'block';

            initializeHighPrecisionGpsTracking();
            initializeSatelliteMultiplayerTelemetry();
        }

        function autoInitializeSensors() {
            const viewportCanvas = document.getElementById('canvas3d');
            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true; previousPointerX = e.clientX; previousPointerY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return; 
                const deltaX = e.clientX - previousPointerX; const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                lookYaw -= deltaX * 0.003; lookPitch -= deltaY * 0.003;
                lookPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lookPitch));
                camera.quaternion.setFromEuler(new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ'));
            });

            document.getElementById('offsetMenuTriggerBtn').addEventListener('click', (e) => {
                e.stopPropagation();
                const biasPanel = document.getElementById('biasPanel');
                biasPanel.classList.toggle('open');
            });

            window.addEventListener('click', (e) => {
                if (!sensorsEngaged || e.target.closest('#fine-tune-dock')) return; 
                const mapContainer = document.getElementById('minimap-container');
                if (isMinimapEnlarged) {
                    isMinimapEnlarged = false;
                    mapContainer.classList.remove('enlarged');
                } else {
                    if (e.target.closest('#minimap-container')) {
                        isMinimapEnlarged = true;
                        mapContainer.classList.add('enlarged');
                    }
                }
            });
        }

        function bindAbsoluteCompassListeners() {
            if ('ondeviceorientationabsolute' in window) {
                window.addEventListener('deviceorientationabsolute', handleVisorHardwareOrientation, true);
            } else {
                window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true);
            }
        }

        function handleVisorHardwareOrientation(e) {
            let alpha = e.alpha;
            if (e.webkitCompassHeading) alpha = 360 - e.webkitCompassHeading;
            if (alpha === null) return;

            let alphaRad = THREE.MathUtils.degToRad(alpha);
            let betaRad = THREE.MathUtils.degToRad(e.beta);
            let gammaRad = THREE.MathUtils.degToRad(e.gamma);
            let orient = (window.orientation || window.screen.orientation?.angle || 0) * Math.PI / 180;

            let qSensor = getSensorQuaternion(alphaRad, betaRad, gammaRad, orient);
            camera.quaternion.slerp(qSensor, 0.12);
        }

        async function fetchLiveOpenStreetMapData(lat, lon) {
            if (osmFetchController) osmFetchController.abort();
            osmFetchController = new AbortController();

            matrixOverloadActive = false;
            mapLoadedForAnchor = false;
            initialSnapCompleted = false; 
            isFetchingMap = true; 
            updateVisorFeedbackHUD(Date.now());

            const overpassEndpoints = [
                `https://overpass-api.de/api/interpreter`,
                `https://overpass.kumi.systems/api/interpreter`,
                `https://lz4.overpass-api.de/api/interpreter`
            ];
            const range = 0.0435;
            const query = `[out:json][timeout:35];(way["building"](${lat-range},${lon-range},${lat+range},${lon+range});way["highway"](${lat-range},${lon-range},${lat+range},${lon+range}););out body;>;out skel qt;`;
            let data = null; let success = false;

            for (let i = 0; i < overpassEndpoints.length; i++) {
                const mirrorController = new AbortController();
                const timeoutId = setTimeout(() => mirrorController.abort(), 12000);
                try {
                    const r = await fetch(`${overpassEndpoints[i]}?data=${encodeURIComponent(query)}`, { signal: mirrorController.signal });
                    clearTimeout(timeoutId);
                    if (!r.ok) throw new Error();
                    data = await r.json();
                    if (data && data.elements && data.elements.length > 0) { success = true; break; }
                } catch (e) { clearTimeout(timeoutId); }
            }

            isFetchingMap = false; 

            if (success && data) {
                parseAndBuildOSMWorld(data, anchorCoordinates.lat, anchorCoordinates.lon);
            } else {
                triggerMatrixOverloadErrorState();
            }
        }

        function triggerMatrixOverloadErrorState() {
            matrixOverloadActive = true;
            mapLoadedForAnchor = false;
            isFetchingMap = false;
            while(mapStructuralMeshes.children.length > 0) {
                const m = mapStructuralMeshes.children[0];
                if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose();
                mapStructuralMeshes.remove(m);
            }
            tacticalDronesCollection.forEach(d => scene.remove(d.meshElement)); tacticalDronesCollection.length = 0;
            humanoidBotsCollection.forEach(b => scene.remove(b.meshElement)); humanoidBotsCollection.length = 0;
            spatialAnomaliesCollection.forEach(a => scene.remove(a.mesh)); spatialAnomaliesCollection.length = 0;
            updateVisorFeedbackHUD(Date.now());
        }

        function parseAndBuildOSMWorld(osmData, anchorLat, anchorLon) {
            while(mapStructuralMeshes.children.length > 0) {
                const m = mapStructuralMeshes.children[0];
                if (m.geometry) m.geometry.dispose(); if (m.material) m.material.dispose();
                mapStructuralMeshes.remove(m);
            }
            globalTrafficNodes.length = 0; renderedStreetsList.length = 0;
            renderedBuildingsList.length = 0; renderedPedestrianList.length = 0;

            const grassGroundMesh = new THREE.Mesh(new THREE.PlaneGeometry(3000, 3000), new THREE.MeshBasicMaterial({ color: 0x071e0e, depthWrite: true }));
            grassGroundMesh.rotation.x = -Math.PI / 2;
            mapStructuralMeshes.add(grassGroundMesh);

            if (!osmData || !osmData.elements) return;
            const nodesLookup = {};
            osmData.elements.forEach(el => {
                if (el.type === 'node') nodesLookup[el.id] = latLonToLocalMeters(el.lat, el.lon, anchorLat, anchorLon);
            });

            osmData.elements.forEach(el => {
                if (el.type === 'way' && el.nodes) {
                    const pts = [];
                    el.nodes.forEach(nid => { if (nodesLookup[nid]) pts.push(nodesLookup[nid]); });
                    if (pts.length < 2) return;
                    const cx = pts.reduce((sum, p) => sum + p.x, 0) / pts.length;
                    const cz = pts.reduce((sum, p) => sum + p.z, 0) / pts.length;
                    if (Math.hypot(cx, cz) > 600) return;

                    if (el.tags && el.tags.building) {
                        buildNeonStructuralHulls(pts, el.tags);
                    } else if (el.tags && el.tags.highway) {
                        if (['footway', 'pedestrian', 'path', 'sidewalk'].includes(el.tags.highway) || el.tags.footway) {
                            buildPedestrianConduits(pts, el.tags);
                        } else {
                            buildNeonVectorPathways(pts, el.tags);
                        }
                    }
                }
            });

            mapLoadedForAnchor = true;
            spawnQuantumAnomalies();
            deployTacticalDronePlatoon();
            deployHumanoidGarrison();
            onWindowResize(); 
        }

        function buildNeonStructuralHulls(points, tags) {
            if (points.length < 3) return;
            const shape = new THREE.Shape();
            shape.moveTo(points[0].x, -points[0].z);
            for (let i = 1; i < points.length; i++) shape.lineTo(points[i].x, -points[i].z);
            shape.closePath();

            let h = (tags && tags.height) ? parseFloat(tags.height) : (12 + Math.random() * 20);
            if (tags && tags["building:levels"]) h = parseInt(tags["building:levels"]) * 3.5;
            h = Math.min(h, 60);

            const geom = new THREE.ExtrudeGeometry(shape, { depth: h, bevelEnabled: false });
            const solidMesh = new THREE.Mesh(geom, new THREE.MeshBasicMaterial({ color: 0x000000, depthWrite: true }));
            const hullColor = Math.random() > 0.7 ? 0x00ffcc : 0xff0055;
            const wireframe = new THREE.LineSegments(new THREE.EdgesGeometry(geom), new THREE.LineBasicMaterial({ color: hullColor }));
            
            const group = new THREE.Group();
            group.add(solidMesh, wireframe);
            group.rotation.x = -Math.PI / 2;
            group.position.set(0, 0, 0); 
            mapStructuralMeshes.add(group);
            renderedBuildingsList.push({ points: points, color: hullColor });
        }

        function buildNeonVectorPathways(points, tags) {
            const laneHalfWidth = 4.0; const vertices = []; const indices = []; const leftCurbyPoints = []; const rightCurbyPoints = []; const centerLinePoints = []; const count = points.length; const normals = new Array(count);
            const isMain = tags && tags.highway && ['motorway', 'trunk', 'primary', 'secondary', 'tertiary'].includes(tags.highway);

            for (let i = 0; i < count; i++) {
                let dx, dz;
                if (i === 0) { dx = points[1].x - points[0].x; dz = points[1].z - points[0].z; }
                else if (i === count - 1) { dx = points[count-1].x - points[count-2].x; dz = points[count-1].z - points[count-2].z; }
                else { dx = (points[i+1].x - points[i-1].x)/2; dz = (points[i+1].z - points[i-1].z)/2; }
                const len = Math.hypot(dx, dz) || 1; normals[i] = { x: -dz / len, z: dx / len };
            }
            for (let i = 0; i < count; i++) {
                const pt = points[i]; const norm = normals[i]; const lx = pt.x + norm.x * laneHalfWidth; const lz = pt.z + norm.z * laneHalfWidth; const rx = pt.x - norm.x * laneHalfWidth; const rz = pt.z - norm.z * laneHalfWidth;
                vertices.push(lx, 0.01, lz, rx, 0.01, rz); leftCurbyPoints.push(new THREE.Vector3(lx, 0.012, lz)); rightCurbyPoints.push(new THREE.Vector3(rx, 0.012, rz)); centerLinePoints.push(new THREE.Vector3(pt.x, 0.015, pt.z));
                if (i < count - 1) indices.push(i*2, i*2+1, (i+1)*2, i*2+1, (i+1)*2+1, (i+1)*2);
                globalTrafficNodes.push(new THREE.Vector3(pt.x, 0.01, pt.z));
            }
            const roadGeom = new THREE.BufferGeometry(); roadGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3)); roadGeom.setIndex(indices); roadGeom.computeVertexNormals();
            mapStructuralMeshes.add(new THREE.Mesh(roadGeom, new THREE.MeshBasicMaterial({ color: 0x000000, side: THREE.DoubleSide })));
            const yellowCurbMat = new THREE.LineBasicMaterial({ color: 0xffff00 });
            mapStructuralMeshes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(leftCurbyPoints), yellowCurbMat)); mapStructuralMeshes.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints(rightCurbyPoints), yellowCurbMat));
            if (isMain) {
                const dashedCenterMat = new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3 }); const mainLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(centerLinePoints), dashedCenterMat);
                mainLine.computeLineDistances(); mapStructuralMeshes.add(mainLine);
            }
            renderedStreetsList.push({ points: points, isMain: isMain });
        }

        function buildPedestrianConduits(points, tags) {
            const count = points.length; const isCrosswalk = tags && (tags.footway === 'crosswalk' || tags.highway === 'crossing');
            if (isCrosswalk) {
                const pathPoints = []; points.forEach(pt => pathPoints.push(new THREE.Vector3(pt.x, 0.018, pt.z))); const crosswalkGeo = new THREE.BufferGeometry().setFromPoints(pathPoints); const crosswalkLine = new THREE.Line(crosswalkGeo, new THREE.LineDashedMaterial({ color: 0xfffa9e, dashSize: 1.5, gapSize: 1.5, linewidth: 3 }));
                crosswalkLine.computeLineDistances(); mapStructuralMeshes.add(crosswalkLine); renderedPedestrianList.push({ points: points, isCrosswalk: true }); return;
            }
            const sidewalkHalfWidth = 1.2; const vertices = []; const indices = []; const normals = new Array(count);
            for (let i = 0; i < count; i++) {
                let dx, dz; if (i === 0) { dx = points[1].x - points[0].x; dz = points[1].z - points[0].z; } else if (i === count - 1) { dx = points[count-1].x - points[count-2].x; dz = points[count-1].z - points[count-2].z; } else { dx = (points[i+1].x - points[i-1].x)/2; dz = (points[i+1].z - points[i-1].z)/2; }
                const len = Math.hypot(dx, dz) || 1; normals[i] = { x: -dz / len, z: dx / len };
            }
            for (let i = 0; i < count; i++) {
                const pt = points[i]; const norm = normals[i]; const lx = pt.x + norm.x * sidewalkHalfWidth; const lz = pt.z + norm.z * sidewalkHalfWidth; const rx = pt.x - norm.x * sidewalkHalfWidth; const rz = pt.z - norm.z * sidewalkHalfWidth;
                vertices.push(lx, 0.02, lz, rx, 0.02, rz); if (i < count - 1) indices.push(i*2, i*2+1, (i+1)*2, i*2+1, (i+1)*2+1, (i+1)*2);
            }
            const swGeom = new THREE.BufferGeometry(); swGeom.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3)); swGeom.setIndex(indices); swGeom.computeVertexNormals();
            mapStructuralMeshes.add(new THREE.Mesh(swGeom, new THREE.MeshBasicMaterial({ color: 0x555555, side: THREE.DoubleSide }))); renderedPedestrianList.push({ points: points, isCrosswalk: false });
        }

        function onWindowResize() {
            const width = window.innerWidth; const height = window.innerHeight; camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setSize(width, height);
            const cracksCanvas = document.getElementById('cracks-canvas'); cracksCanvas.width = width; cracksCanvas.height = height;
            
            const currentContainerElement = document.getElementById('minimap-container');
            const targetWidth = currentContainerElement.offsetWidth;
            if (targetWidth > 0) {
                const minimapCanvas = document.getElementById('minimapCanvas');
                minimapCanvas.width = targetWidth; minimapCanvas.height = targetWidth;
            }
        }

        function init() {
            scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2000); camera.position.set(0, 1.7, 0);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.setClearColor(0x020205, 1.0);
            scene.add(mapStructuralMeshes); autoInitializeSensors(); onWindowResize(); window.addEventListener('resize', onWindowResize);
            
            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine); const t = Date.now();
                spatialAnomaliesCollection.forEach(a => { if (!a.collected) { a.mesh.rotation.x += 0.01; a.mesh.rotation.y += 0.02; } });
                
                if (sensorsEngaged) { 
                    advanceDronePatrolSimulation(t); 
                    evaluateGameplayState(); 

                    // REGISTRY RECONCILIATION LOOP
                    const currentSystemTime = Date.now();
                    let livePeersCounter = 0;
                    
                    for (const key in connectedAgentsMap) {
                        const activeAgent = connectedAgentsMap[key];
                        
                        if (currentSystemTime - activeAgent.lastTransmissionPacketTime > 7000) {
                            scene.remove(activeAgent.joints.rootMesh);
                            delete connectedAgentsMap[key];
                            continue;
                        }

                        livePeersCounter++;
                        const previousX = activeAgent.joints.rootMesh.position.x;
                        const previousZ = activeAgent.joints.rootMesh.position.z;

                        activeAgent.joints.rootMesh.position.lerp(activeAgent.targetPos, 0.1);
                        
                        let rawRotationDiff = activeAgent.targetYaw - activeAgent.joints.rootMesh.rotation.y;
                        while (rawRotationDiff < -Math.PI) rawRotationDiff += Math.PI * 2;
                        while (rawRotationDiff > Math.PI) rawRotationDiff -= Math.PI * 2;
                        activeAgent.joints.rootMesh.rotation.y += rawRotationDiff * 0.12;

                        const currentDeltaSpeed = Math.hypot(
                            activeAgent.joints.rootMesh.position.x - previousX,
                            activeAgent.joints.rootMesh.position.z - previousZ
                        );
                        activeAgent.smoothedSpeed = THREE.MathUtils.lerp(activeAgent.smoothedSpeed, currentDeltaSpeed, 0.2);

                        executeAgentLimbAnimations(activeAgent, t);
                    }

                    // Dynamically push state modifications out to HUD layers (including oneself)
                    document.getElementById('agent-count-hud').innerText = `Agents: ${livePeersCounter + 1}`;
                }
                
                renderer.render(scene, camera); 
                update2DMinimapSystem();
            }
            frameLoopEngine();
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
