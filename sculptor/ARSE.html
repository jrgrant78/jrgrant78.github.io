<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Project A.R.S.E - Diagnostic Hand Tracking Matrix</title>
    <style>
        body, html {
            margin: 0; padding: 0; overflow: hidden;
            width: 100%; height: 100%;
            font-family: 'Courier New', Courier, monospace;
            background: #000000; color: #00ffcc; user-select: none;
        }

        #canvas3d {
            position: absolute; top: 0; left: 0;
            width: 100vw; height: 100vh; z-index: 2;
            display: block; pointer-events: auto;
        }

        #visor-boot-gate {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 9999; background: #020205;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            text-align: center; cursor: pointer; pointer-events: auto;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }

        #visor-screen-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            z-index: 4; pointer-events: none; background: rgba(255, 255, 255, 0);
        }

        #central-hud-alerts {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            z-index: 6; pointer-events: none; text-align: center; width: 80%;
        }

        .hud-banner-text {
            font-size: 24px; font-weight: 900; letter-spacing: 4px; color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc; margin: 0;
        }

        .pulse-animation { animation: loading-text-pulse 1.4s infinite ease-in-out; }

        @keyframes loading-text-pulse {
            0% { transform: scale(0.96); opacity: 0.4; }
            50% { transform: scale(1.03); opacity: 1; }
            100% { transform: scale(0.96); opacity: 0.4; }
        }

        #minimap-container {
            position: absolute; bottom: 25px; left: 25px; width: 26vh; height: 26vh;
            min-width: 90px; min-height: 90px; max-width: 180px; max-height: 180px;
            z-index: 100; pointer-events: auto; cursor: pointer; display: block;
        }

        #minimapCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; background: #040805; border: 2px solid #00ffcc; }

        #portrait-warning {
            display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #04060f; color: #00ffcc; z-index: 99999; box-sizing: border-box; padding: 40px;
            justify-content: center; align-items: center; text-align: center; border: 4px solid #ff0055;
        }
        @media (orientation: portrait) { #portrait-warning { display: flex; } }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
    <script src="https://unpkg.com/three@0.128.0/examples/js/utils/BufferGeometryUtils.js"></script>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    
    <!-- MEDIAPIPE CORE SPATIAL TRACKING LIBRARIES -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
</head>
<body>

    <!-- SILENT FEED EXTRACTION NODE -->
    <video id="webcam-hardware-feed" autoplay playsinline style="display:none;"></video>

    <div id="visor-boot-gate" onclick="engageVisorSystemFromBootGate()">
        <div style="font-size: 36px; font-weight: 900; letter-spacing: 8px; color: #00ffcc; margin-bottom: 2px; text-shadow: 0 0 15px #00ffcc;">
            PROJECT A.R.S.E.
        </div>
        <div style="font-size: 11px; font-weight: bold; letter-spacing: 3px; color: #00ffcc; margin-bottom: 45px; opacity: 0.75;">
            DIAGNOSTIC MATRIX PROTOCOLS
        </div>
        <div class="pulse-animation" style="font-size: 12px; font-weight: bold; letter-spacing: 2px; color: #ff0055;">
            TAP TO INITIALIZE HAND GEOMETRY ISOLATION TEST
        </div>
    </div>

    <div id="portrait-warning">
        <div>
            <div style="font-size: 20px; font-weight: bold; color: #ff0055; margin-bottom: 12px;">// CRITICAL ALIGNMENT ALERT</div>
            DIAGNOSTIC ENGAGEMENT BLOCKED. ROTATE TO LANDSCAPE VIEW MODE.
        </div>
    </div>

    <div id="visor-screen-overlay"></div>
    <canvas id="canvas3d"></canvas>

    <div id="hud-visor-container">
        <div id="central-hud-alerts">
            <div id="main-hud-status" class="hud-banner-text pulse-animation">BIOMETRIC HAND ISOLATION TEST: ACTIVE</div>
        </div>
        <div id="minimap-container">
            <canvas id="minimapCanvas"></canvas>
        </div>
    </div>

    <script>
        // CRITICAL CONFIGURATION PROTOCOL: Set to false to restore map rendering and bot AI loops
        const DIAGNOSTIC_HAND_TEST_MODE = true;

        let scene, camera, renderer;
        let lookYaw = 0; let lookPitch = 0;
        let isDragging = false;
        let previousPointerX = 0; let previousPointerY = 0;
        let gyroSignalDetected = false;

        let currentCoordinates = { lat: 40.7580, lon: -73.9855 };
        let anchorCoordinates = { lat: 40.7580, lon: -73.9855 };
        let lastRawCoords = { lat: 40.7580, lon: -73.9855 }; 
        let hasLockedInitialAnchor = false;
        let initialBestAccuracy = 999999; 
        let mapLoadedForAnchor = false;
        let sensorsEngaged = false; 
        let matrixOverloadActive = false; 
        let isFetchingMap = false; 
        let osmFetchController = null;
        const R_EARTH = 6378137;

        const MAP_RADIUS_METERS = 1609;
        let isMinimapEnlarged = false;
        let screenWakeLockInstance = null;

        let atmosphericSunLight, globalAmbientLight, stellarDomeSystem;
        let calculatedVisorTimeline = 12.0; 

        let activeMapPointers = [];
        let previousPinchDist = 0;
        let minimapZoomScale = 1.0;
        let minimapPanOffset = new THREE.Vector3(0, 0, 0);

        let geoTelemetryOffset = { lat: 0.0, lon: 0.0 };
        let gpsTargetPosition = new THREE.Vector3(0, 1.7, 0);
        let initialSnapCompleted = false; 

        const spatialAnomaliesCollection = [];
        const mapStructuralMeshes = new THREE.Group();
        const globalTrafficNodes = [];
        const renderedStreetsList = [];
        const renderedBuildingsList = [];
        const renderedPedestrianList = []; 
        const tacticalDronesCollection = []; 
        const humanoidBotsCollection = []; 
        const activeLasersCollection = []; 

        const hackingTerminalsCollection = [];
        const actionableItemsArray = []; 

        // ARTICULATED BIOMETRIC MATRIX DEFINITIONS
        let handVisualizerGroup;
        const structuralJointMeshes = [];
        let skeletalBonesMesh;
        const BIOMETRIC_BONES_MAP = [
            [0,1], [1,2], [2,3], [3,4],
            [0,5], [5,6], [6,7], [7,8],
            [5,9], [9,10], [10,11], [11,12],
            [9,13], [13,14], [14,15], [15,16],
            [13,17], [17,18], [18,19], [19,20], [0,17]
        ];

        const sharedMaterials = {
            grass: new THREE.MeshLambertMaterial({ color: 0x071e0e, depthWrite: true }),
            buildingSolid: new THREE.MeshLambertMaterial({ color: 0x01020a, depthWrite: true }),
            buildingWire: new THREE.LineBasicMaterial({ color: 0x00ffff }),
            roadSolid: new THREE.MeshLambertMaterial({ color: 0x020202, side: THREE.DoubleSide }),
            roadCurb: new THREE.LineBasicMaterial({ color: 0xffff00 }),
            roadCenter: new THREE.LineDashedMaterial({ color: 0xffffff, dashSize: 3, gapSize: 3 }),
            sidewalkSolid: new THREE.MeshLambertMaterial({ color: 0x222222, side: THREE.DoubleSide }),
            crosswalk: new THREE.LineDashedMaterial({ color: 0xfffa9e, dashSize: 1.5, gapSize: 1.5 }),
            terminalActive: new THREE.MeshBasicMaterial({ color: 0x00ff55, wireframe: true }),
            terminalHacked: new THREE.MeshBasicMaterial({ color: 0x555555, wireframe: true })
        };

        let buildingSolidGeoms = [];
        let buildingWireGeoms = [];
        let roadSolidGeoms = [];
        let roadCurbGeoms = [];
        let roadCenterGeoms = [];
        let sidewalkSolidGeoms = [];
        let crosswalkGeoms = [];

        const getSensorQuaternion = (function () {
            const zee = new THREE.Vector3(0, 0, 1);
            const euler = new THREE.Euler();
            const q0 = new THREE.Quaternion();
            const q1 = new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5)); 
            return function (alpha, beta, gamma, orient) {
                const q = new THREE.Quaternion();
                euler.set(beta, alpha, -gamma, 'YXZ'); q.setFromEuler(euler); q.multiply(q1); q.multiply(q0.setFromAxisAngle(zee, -orient)); return q;
            };
        })();

        function latLonToLocalMeters(lat, lon, anchorLat, anchorLon) {
            const radLat = anchorLat * Math.PI / 180;
            const x = (lon - anchorLon) * (Math.PI / 180) * R_EARTH * Math.cos(radLat);
            const z = -(lat - anchorLat) * (Math.PI / 180) * R_EARTH;
            return { x: x, z: z };
        }

        async function executeScreenWakeLockEngagement() {
            if ('wakeLock' in navigator) {
                try { screenWakeLockInstance = await navigator.wakeLock.request('screen'); } catch (err) {}
            }
        }

        function engageVisorSystemFromBootGate() {
            if (sensorsEngaged) return; sensorsEngaged = true;
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().then(() => {
                    if (screen.orientation && screen.orientation.lock) { screen.orientation.lock('landscape').catch(() => {}); }
                }).catch(() => {});
            }
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission().then(state => { if (state === 'granted') bindAbsoluteCompassListeners(); });
            } else { bindAbsoluteCompassListeners(); }
            executeScreenWakeLockEngagement();
            const bootGate = document.getElementById('visor-boot-gate'); bootGate.style.opacity = '0'; setTimeout(() => { bootGate.style.display = 'none'; }, 400);
            
            initializeHardwareBiometricTracking();
            if (!DIAGNOSTIC_HAND_TEST_MODE) {
                initializeHighPrecisionGpsTracking();
            }
        }

        function initializeHardwareBiometricTracking() {
            const videoElement = document.getElementById('webcam-hardware-feed');
            const handsTrackingInstance = new window.Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            handsTrackingInstance.setOptions({
                maxNumHands: 1,
                modelComplexity: 1,
                minDetectionConfidence: 0.5,
                minTrackingConfidence: 0.5
            });

            handsTrackingInstance.onResults(handleBiometricLandmarkResults);

            navigator.mediaDevices.getUserMedia({
                video: { facingMode: "environment", width: { ideal: 640 }, height: { ideal: 480 } }
            }).then(stream => {
                videoElement.srcObject = stream;
                const mediapipeCameraInstance = new window.Camera(videoElement, {
                    onFrame: async () => {
                        if (sensorsEngaged) await handsTrackingInstance.send({ image: videoElement });
                    },
                    width: 640, height: 480
                });
                mediapipeCameraInstance.start();
            }).catch((err) => {
                console.error("Camera access blocked: ", err);
            });
        }

        function handleBiometricLandmarkResults(results) {
            if (!results.multiHandLandmarks || results.multiHandLandmarks.length === 0) {
                handVisualizerGroup.visible = false;
                return;
            }

            handVisualizerGroup.visible = true;
            const landmarks = results.multiHandLandmarks[0];
            const fovRad = (camera.fov * Math.PI) / 180;
            const projectDistance = 0.35; 
            const viewHeightMax = Math.tan(fovRad / 2) * projectDistance;
            const viewWidthMax = viewHeightMax * camera.aspect;

            for (let i = 0; i < 21; i++) {
                const lm = landmarks[i];
                // Mirror mapping adjustment for computing localized rear camera projection coordinates
                const localX = -(lm.x - 0.5) * 2 * viewWidthMax;
                const localY = (0.5 - lm.y) * 2 * viewHeightMax;
                const localZ = -projectDistance - (lm.z * 0.3); 

                structuralJointMeshes[i].position.set(localX, localY, localZ);
                structuralJointMeshes[i].visible = true; // CRITICAL FIX: Forces nodes to switch execution visibility to true
            }

            const dynamicBonesBuffer = [];
            BIOMETRIC_BONES_MAP.forEach(connection => {
                const vStart = structuralJointMeshes[connection[0]].position;
                const vEnd = structuralJointMeshes[connection[1]].position;
                dynamicBonesBuffer.push(vStart.x, vStart.y, vStart.z, vEnd.x, vEnd.y, vEnd.z);
            });

            skeletalBonesMesh.geometry.setAttribute('position', new THREE.Float32BufferAttribute(dynamicBonesBuffer, 3));
            skeletalBonesMesh.geometry.attributes.position.needsUpdate = true;
            skeletalBonesMesh.visible = true;
        }

        function autoInitializeSensors() {
            const viewportCanvas = document.getElementById('canvas3d');
            viewportCanvas.addEventListener('pointerdown', (e) => {
                isDragging = true; previousPointerX = e.clientX; previousPointerY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!isDragging) return; 
                const deltaX = e.clientX - previousPointerX; const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                lookYaw -= deltaX * 0.003; lookPitch -= deltaY * 0.003;
                lookPitch = Math.max(-Math.PI / 2.2, Math.min(Math.PI / 2.2, lookPitch));
                if (!gyroSignalDetected) { camera.quaternion.setFromEuler(new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ')); }
            });
            window.addEventListener('pointerup', () => { isDragging = false; });
            window.addEventListener('pointercancel', () => { isDragging = false; });
        }

        function bindAbsoluteCompassListeners() {
            if ('ondeviceorientationabsolute' in window) { window.addEventListener('deviceorientationabsolute', handleVisorHardwareOrientation, true); }
            else { window.addEventListener('deviceorientation', handleVisorHardwareOrientation, true); }
        }

        function handleVisorHardwareOrientation(e) {
            let alpha = e.alpha; if (e.webkitCompassHeading) alpha = 360 - e.webkitCompassHeading; if (alpha === null) return;
            gyroSignalDetected = true;
            let alphaRad = THREE.MathUtils.degToRad(alpha); let betaRad = THREE.MathUtils.degToRad(e.beta); let gammaRad = THREE.MathUtils.degToRad(e.gamma);
            let orient = (window.orientation || window.screen.orientation?.angle || 0) * Math.PI / 180;
            let qSensor = getSensorQuaternion(alphaRad, betaRad, gammaRad, orient);
            let qManualAdjustment = new THREE.Quaternion().setFromEuler(new THREE.Euler(lookPitch, lookYaw, 0, 'YXZ'));
            let qCombinedTarget = qSensor.clone().multiply(qManualAdjustment);
            camera.quaternion.slerp(qCombinedTarget, 0.12);
        }

        async function fetchLiveOpenStreetMapData(lat, lon) {
            if (DIAGNOSTIC_HAND_TEST_MODE) return;
            // Native spatial layout build skipped during test execution mode
        }

        function onWindowResize() {
            const width = window.innerWidth; const height = window.innerHeight; camera.aspect = width / height; camera.updateProjectionMatrix(); renderer.setSize(width, height);
        }

        function init() {
            scene = new THREE.Scene(); camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 1000); camera.position.set(0, 1.7, 0);
            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true }); renderer.setSize(window.innerWidth, window.innerHeight); renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2)); renderer.setClearColor(0x000000, 1.0);
            
            autoInitializeSensors(); 
            onWindowResize(); 
            window.addEventListener('resize', onWindowResize);
            
            // BUILD BIOMETRIC MESH NODES
            handVisualizerGroup = new THREE.Group();
            // Upgraded sphere scale metrics to maximize node visualization index signatures
            const jointGeometry = new THREE.SphereGeometry(0.012, 16, 16);
            const jointMaterial = new THREE.MeshBasicMaterial({ color: 0x00ffcc, depthTest: false, depthWrite: false });
            
            for (let i = 0; i < 21; i++) {
                const jMesh = new THREE.Mesh(jointGeometry, jointMaterial);
                jMesh.visible = true; // FIXED: Changed parameter baseline configuration state to clear culling bugs
                jMesh.renderOrder = 999;
                handVisualizerGroup.add(jMesh);
                structuralJointMeshes.push(jMesh);
            }

            const skeletonGeo = new THREE.BufferGeometry();
            skeletalBonesMesh = new THREE.LineSegments(skeletonGeo, new THREE.LineBasicMaterial({ color: 0xff0055, linewidth: 3, depthTest: false, depthWrite: false }));
            skeletalBonesMesh.renderOrder = 998;
            handVisualizerGroup.add(skeletalBonesMesh);
            
            // Mount directly to camera frame to bind transformations over real-time positional updates
            camera.add(handVisualizerGroup);
            scene.add(camera);

            // Lightweight ambient light configuration for matrix isolation testing
            const diagnosticLight = new THREE.AmbientLight(0xffffff, 1.0);
            scene.add(diagnosticLight);

            function frameLoopEngine() {
                requestAnimationFrame(frameLoopEngine);
                renderer.render(scene, camera);
            }
            frameLoopEngine();
        }
        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
