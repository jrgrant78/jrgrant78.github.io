<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Directory Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 2rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .title-area h1 {
      font-size: 2rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .search-bar {
      width: 100%;
      max-width: 320px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus {
      border-color: var(--accent);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card:hover {
      transform: translateY(-3px);
      background-color: var(--card-hover);
      border-color: var(--accent);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .card-details {
      flex-grow: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .card-path {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: transform 0.2s, color 0.2s;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    .status-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>Project Index</h1>
        <p id="file-count">Loading pages...</p>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search pages..." />
      </div>
    </header>

    <main id="grid" class="grid"></main>
    <div id="status" class="status-panel">Fetching directory data...</div>
  </div>

  <script>
    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const fileCount = document.getElementById('file-count');
    const searchInput = document.getElementById('search-input');

    async function loadDirectory() {
      try {
        const response = await fetch('/api/files');
        if (!response.ok) throw new Error('API request failed');

        const pages = await response.json();

        if (pages.length === 0) {
          status.textContent = 'No other HTML files found in this directory.';
          fileCount.textContent = '0 pages found';
          return;
        }

        status.style.display = 'none';
        grid.innerHTML = '';
        fileCount.textContent = `Found ${pages.length} page${pages.length === 1 ? '' : 's'}`;

        pages.forEach(item => {
          const card = document.createElement('a');
          card.className = 'card';
          card.href = item.file;
          card.dataset.title = item.title.toLowerCase();
          card.dataset.file = item.file.toLowerCase();

          card.innerHTML = `
            <div class="card-icon">📄</div>
            <div class="card-details">
              <div class="card-title">${escapeHtml(item.title)}</div>
              <div class="card-path">${escapeHtml(item.file)}</div>
            </div>
            <div class="card-arrow">→</div>
          `;

          grid.appendChild(card);
        });

      } catch (err) {
        status.textContent = 'Error loading files from server API.';
        fileCount.textContent = 'Error loading pages';
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      const cards = document.querySelectorAll('.card');

      cards.forEach(card => {
        const matches = card.dataset.title.includes(term) || card.dataset.file.includes(term);
        card.style.display = matches ? 'flex' : 'none';
      });
    });

    loadDirectory();
  </script>
</body>
</html>
