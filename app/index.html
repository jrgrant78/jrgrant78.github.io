<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GitHub Pages Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --card-hover: #334155;
      --accent: #38bdf8;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem;
    }

    .container { max-width: 1200px; margin: 0 auto; }

    header {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    @media (min-width: 640px) {
      header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
    }

    .title-area h1 {
      font-size: 2rem;
      font-weight: 700;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .title-area p {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    .search-bar {
      width: 100%;
      max-width: 320px;
    }

    .search-bar input {
      width: 100%;
      padding: 0.75rem 1rem;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .search-bar input:focus { border-color: var(--accent); }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 1.25rem;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s, background-color 0.2s, border-color 0.2s;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .card:hover {
      transform: translateY(-3px);
      background-color: var(--card-hover);
      border-color: var(--accent);
    }

    .card-icon {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
      flex-shrink: 0;
    }

    .card-details {
      flex-grow: 1;
      overflow: hidden;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 0.25rem;
    }

    .card-path {
      font-size: 0.8rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-arrow {
      color: var(--text-muted);
      font-size: 1.1rem;
      transition: transform 0.2s, color 0.2s;
    }

    .card:hover .card-arrow {
      transform: translateX(3px);
      color: var(--accent);
    }

    .status-panel {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 2.5rem;
      text-align: center;
      color: var(--text-muted);
    }

    .status-panel code {
      background-color: rgba(255, 255, 255, 0.1);
      padding: 0.2rem 0.4rem;
      border-radius: 4px;
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="title-area">
        <h1>Project Index</h1>
        <p id="file-count">Scanning GitHub repository...</p>
      </div>
      <div class="search-bar">
        <input type="text" id="search-input" placeholder="Search pages..." />
      </div>
    </header>

    <main id="grid" class="grid"></main>
    <div id="status" class="status-panel">Connecting to GitHub API...</div>
  </div>

  <script>
    // Configuration: Leave blank for automatic URL parsing on standard GitHub Pages sites
    // (e.g. https://username.github.io/repository-name/)
    const OVERRIDE_CONFIG = {
      username: 'jrgrant78', // Manual override e.g. 'octocat'
      repo: ''      // Manual override e.g. 'my-repo'
    };

    const grid = document.getElementById('grid');
    const status = document.getElementById('status');
    const fileCount = document.getElementById('file-count');
    const searchInput = document.getElementById('search-input');

    function getGitHubDetails() {
      let username = OVERRIDE_CONFIG.username;
      let repo = OVERRIDE_CONFIG.repo;

      if (!username || !repo) {
        const host = window.location.hostname;
        const pathParts = window.location.pathname.split('/').filter(Boolean);

        if (host.endsWith('.github.io')) {
          if (!username) username = host.split('.')[0];
          if (!repo && pathParts.length > 0) repo = pathParts[0];
        }
      }

      return { username, repo };
    }

    async function loadGitHubFiles() {
      const { username, repo } = getGitHubDetails();

      if (!username || !repo) {
        status.innerHTML = `
          <p><strong>Auto-detection failed.</strong></p>
          <p style="margin-top: 0.5rem; font-size: 0.85rem;">
            If using a custom domain or testing locally, open <code>index.html</code> and manually populate <code>OVERRIDE_CONFIG</code> in the script.
          </p>
        `;
        fileCount.textContent = 'Configuration required';
        return;
      }

      try {
        const apiUrl = `https://api.github.com/repos/${username}/${repo}/contents`;
        const response = await fetch(apiUrl);

        if (!response.ok) {
          if (response.status === 403) throw new Error('GitHub API rate limit exceeded. Try again in a few minutes.');
          if (response.status === 404) throw new Error('Repository not found. Ensure the GitHub repository is public.');
          throw new Error('Failed to fetch directory list from GitHub API.');
        }

        const contents = await response.json();

        // Extract .html files excluding index.html
        const htmlFiles = contents
          .filter(item => item.type === 'file' && item.name.match(/\.html?$/i))
          .map(item => item.name)
          .filter(file => file.toLowerCase() !== 'index.html');

        if (htmlFiles.length === 0) {
          status.textContent = 'No other HTML files found in this repository.';
          fileCount.textContent = '0 pages found';
          return;
        }

        renderFiles(htmlFiles);
      } catch (err) {
        status.textContent = err.message || 'Error communicating with GitHub API.';
        fileCount.textContent = 'Scan failed';
      }
    }

    async function renderFiles(fileList) {
      status.style.display = 'none';
      grid.innerHTML = '';
      fileCount.textContent = `Found ${fileList.length} page${fileList.length === 1 ? '' : 's'}`;

      for (const file of fileList) {
        let title = file;

        // Fetch page file directly through GitHub Pages to extract page <title>
        try {
          const res = await fetch(file);
          if (res.ok) {
            const pageText = await res.text();
            const pageDoc = new DOMParser().parseFromString(pageText, 'text/html');
            const extracted = pageDoc.querySelector('title')?.textContent || 
                               pageDoc.querySelector('h1')?.textContent;
            if (extracted) title = extracted.trim();
          }
        } catch (e) {}

        const card = document.createElement('a');
        card.className = 'card';
        card.href = file;
        card.dataset.title = title.toLowerCase();
        card.dataset.file = file.toLowerCase();

        card.innerHTML = `
          <div class="card-icon">📄</div>
          <div class="card-details">
            <div class="card-title">${escapeHtml(title)}</div>
            <div class="card-path">${escapeHtml(file)}</div>
          </div>
          <div class="card-arrow">→</div>
        `;

        grid.appendChild(card);
      }
    }

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    searchInput.addEventListener('input', (e) => {
      const term = e.target.value.toLowerCase().trim();
      document.querySelectorAll('.card').forEach(card => {
        const matches = card.dataset.title.includes(term) || card.dataset.file.includes(term);
        card.style.display = matches ? 'flex' : 'none';
      });
    });

    loadGitHubFiles();
  </script>
</body>
</html>
