<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Local Directory Dashboard</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --accent-gradient: linear-gradient(135deg, #38bdf8, #818cf8);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: #334155;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 2rem; }
    .container { max-width: 1200px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
    h1 { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .btn-select {
      background: var(--accent-gradient);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: var(--radius);
      cursor: pointer;
      font-weight: 600;
      display: inline-block;
    }
    .btn-select input { display: none; }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.25rem; }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.25rem;
      text-decoration: none;
      color: inherit;
      display: flex;
      align-items: center;
      gap: 1rem;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover { transform: translateY(-3px); border-color: #38bdf8; }
    .card-icon { width: 40px; height: 40px; background: var(--accent-gradient); border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .card-title { font-weight: 600; font-size: 1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .card-path { font-size: 0.8rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div>
        <h1>Offline Project Index</h1>
        <p id="count" style="color: var(--text-muted);">Select folder to load contents...</p>
      </div>
      <label class="btn-select">
        Open Directory
        <input type="file" id="dir-picker" webkitdirectory directory multiple />
      </label>
    </header>

    <main id="grid" class="grid"></main>
  </div>

  <script>
    const picker = document.getElementById('dir-picker');
    const grid = document.getElementById('grid');
    const count = document.getElementById('count');

    picker.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files).filter(f => 
        (f.name.endsWith('.html') || f.name.endsWith('.htm')) && f.name.toLowerCase() !== 'index.html'
      );

      if (!files.length) {
        count.textContent = 'No other HTML files found in selected directory.';
        return;
      }

      grid.innerHTML = '';
      count.textContent = `Loaded ${files.length} page${files.length === 1 ? '' : 's'}`;

      for (const file of files) {
        const text = await file.text();
        const doc = new DOMParser().parseFromString(text, 'text/html');
        const title = doc.querySelector('title')?.textContent?.trim() || 
                      doc.querySelector('h1')?.textContent?.trim() || 
                      file.name;

        const blobUrl = URL.createObjectURL(file);

        const card = document.createElement('a');
        card.className = 'card';
        card.href = blobUrl;
        card.target = '_blank';
        card.innerHTML = `
          <div class="card-icon">📄</div>
          <div style="overflow: hidden;">
            <div class="card-title">${escapeHtml(title)}</div>
            <div class="card-path">${escapeHtml(file.webkitRelativePath || file.name)}</div>
          </div>
        `;
        grid.appendChild(card);
      }
    });

    function escapeHtml(str) {
      return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }
  </script>
</body>
</html>
