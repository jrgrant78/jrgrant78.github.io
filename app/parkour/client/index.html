<!-- client/index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Parkour Multiplayer</title>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.55.2/dist/phaser.js"></script>
  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: Arial, sans-serif;
      background: #1a1a1a;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    #game {
      max-width: 1280px;
      width: 100%;
    }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Utility Scripts -->
  <script src="js/utils/constants.js"></script>
  <script src="js/systems/NetworkManager.js"></script>
  <script src="js/systems/InputManager.js"></script>
  <script src="js/systems/LevelGenerator.js"></script>
  <script src="js/systems/WeaponSystem.js"></script>

  <!-- Entity Scripts -->
  <script src="js/entities/Player.js"></script>
  <script src="js/entities/Weapon.js"></script>

  <!-- Scene Scripts -->
  <script src="js/scenes/PreloadScene.js"></script>
  <script src="js/scenes/MenuScene.js"></script>
  <script src="js/scenes/GameScene.js"></script>

  <!-- Main Game Script -->
  <script src="js/main.js"></script>
</body>
</html>
