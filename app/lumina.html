<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMINA: Laser Logic</title>
  <style>
    :root {
      --bg: #090d16;
      --panel: #111827;
      --laser-red: #ff3300;
      --laser-glow: rgba(255, 51, 0, 0.6);
      --mirror-cyan: #38bdf8;
      --text: #f8fafc;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 12px;
    }

    header {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .title {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--laser-red);
      text-shadow: 0 0 10px var(--laser-glow);
    }

    .stage-indicator {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .controls-bar {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button:active {
      transform: scale(0.95);
      background: var(--mirror-cyan);
      color: #000;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 500px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.8);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: var(--laser-red);
      text-shadow: 0 0 15px var(--laser-glow);
      margin-bottom: 8px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
    }

    .level-btn {
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      border-radius: 6px;
      padding: 0;
    }

    .level-btn.completed {
      border-color: var(--mirror-cyan);
      color: var(--mirror-cyan);
    }

    footer {
      width: 100%;
      max-width: 500px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
    }

    footer button {
      flex: 1;
      justify-content: center;
      padding: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="title">LUMINA</div>
      <div class="stage-indicator" id="stage-text">STAGE 001 / 100</div>
    </div>
    <div class="controls-bar">
      <button id="btn-sound">🔊</button>
      <button id="btn-select">LEVELS</button>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="win-overlay">
      <h2>TARGET POWERED</h2>
      <p style="color: var(--text-dim); margin-bottom: 20px;">Laser signal locked onto target.</p>
      <button id="btn-next" style="padding: 12px 32px; background: var(--laser-red); color: #fff;">NEXT STAGE</button>
    </div>

    <div class="overlay" id="select-overlay">
      <h3 style="margin-bottom: 12px;">SELECT STAGE</h3>
      <div class="modal-grid" id="level-grid"></div>
      <button id="btn-close-select" style="width: 100%;">CLOSE</button>
    </div>
  </div>

  <footer>
    <button id="btn-prev">PREV</button>
    <button id="btn-reset">RESET</button>
    <button id="btn-skip">NEXT</button>
  </footer>

  <script>
    // --- Sound Synth ---
    const Audio = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playRotate() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(800, this.ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.05);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.05);
      },
      playWin() {
        if (this.muted) return;
        this.init();
        [440, 554.37, 659.25, 880].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.06);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.06 + 0.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.06);
          osc.stop(this.ctx.currentTime + i * 0.06 + 0.2);
        });
      }
    };

    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 8, t | 1);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    // Directions: 0: RIGHT, 1: DOWN, 2: LEFT, 3: UP
    const DX = [1, 0, -1, 0];
    const DY = [0, 1, 0, -1];

    let currentStage = 1;
    let completedStages = JSON.parse(localStorage.getItem('lumina_completed') || '[]');
    let grid = [];
    let cols = 6, rows = 6;
    let laserPaths = [];
    let stageCleared = false;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    // --- High-Difficulty Puzzle Generation Engine ---
    function generateStage(stageNum) {
      let rng = mulberry32(8000 + stageNum * 997);
      
      // Grid dimensions expand from 5x5 up to 10x10
      cols = Math.min(10, 5 + Math.floor((stageNum - 1) / 18));
      rows = cols;

      let validBuild = false;
      let maxAttempts = 50;

      while (!validBuild && maxAttempts > 0) {
        maxAttempts--;
        grid = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({ type: 'EMPTY' })));

        // Place Emitter on random edge
        let edge = Math.floor(rng() * 4);
        let ec = 0, er = 0, edir = 0;
        if (edge === 0) { ec = Math.floor(rng() * cols); er = 0; edir = 1; }
        else if (edge === 1) { ec = cols - 1; er = Math.floor(rng() * rows); edir = 2; }
        else if (edge === 2) { ec = Math.floor(rng() * cols); er = rows - 1; edir = 3; }
        else { ec = 0; er = Math.floor(rng() * rows); edir = 0; }

        grid[er][ec] = { type: 'EMITTER', dir: edir };

        // Determine target path length (Scales up to 22 turns on stage 100)
        let targetTurns = Math.min(22, 3 + Math.floor(stageNum / 4.8));
        let path = [{ c: ec, r: er }];
        let curC = ec, curR = er, curDir = edir;
        let turnsPlaced = 0;

        let solutionAngles = {};

        // Trace path through grid
        for (let step = 0; step < 120 && turnsPlaced < targetTurns; step++) {
          let nc = curC + DX[curDir];
          let nr = curR + DY[curDir];

          if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) break;

          // Check if we can turn here
          let canTurn = (nc > 0 && nc < cols - 1 && nr > 0 && nr < rows - 1) && 
                        (grid[nr][nc].type === 'EMPTY');

          if (canTurn && rng() < 0.65) {
            let turnLeft = rng() > 0.5;
            let nextDir = turnLeft ? (curDir + 3) % 4 : (curDir + 1) % 4;

            // Mirror orientation math for 45° (slash) vs 135° (backslash)
            // Slash (0): 0<->3, 1<->2.  Backslash (1): 0<->1, 2<->3
            let reqAngle = -1;
            if ((curDir === 0 && nextDir === 3) || (curDir === 3 && nextDir === 0) ||
                (curDir === 1 && nextDir === 2) || (curDir === 2 && nextDir === 1)) {
              reqAngle = 0; // Slash / (45 deg)
            } else {
              reqAngle = 1; // Backslash \ (135 deg)
            }

            let isFixed = (stageNum > 20 && rng() < 0.15);
            let isSplitter = (stageNum > 40 && rng() < 0.2);

            grid[nr][nc] = {
              type: isSplitter ? 'SPLITTER' : 'MIRROR',
              solAngle: reqAngle,
              angle: reqAngle, // Temporarily set solution angle
              isFixed: isFixed,
              rotAnim: 0
            };

            solutionAngles[`${nc},${nr}`] = reqAngle;
            curC = nc; curR = nr; curDir = nextDir;
            turnsPlaced++;
          } else {
            curC = nc; curR = nr;
          }
          path.push({ c: curC, r: curR });
        }

        // Must have reached a valid number of turns and ending cell
        if (turnsPlaced >= Math.min(targetTurns, 3) && (curC !== ec || curR !== er)) {
          grid[curR][curC] = { type: 'TARGET', hit: false };
          validBuild = true;
        }
      }

      // Fill empty cells with decoy mirrors and blocking walls
      let mirrorDensity = Math.min(0.65, 0.25 + stageNum * 0.004);
      let wallDensity = Math.min(0.20, 0.05 + stageNum * 0.0015);

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === 'EMPTY') {
            let rand = rng();
            if (rand < mirrorDensity) {
              grid[r][c] = {
                type: 'MIRROR',
                solAngle: -1,
                angle: Math.floor(rng() * 2),
                isFixed: (stageNum > 30 && rng() < 0.1),
                rotAnim: 0
              };
            } else if (rand < mirrorDensity + wallDensity) {
              grid[r][c] = { type: 'WALL' };
            }
          }
        }
      }

      // Randomize initial orientations of ALL non-fixed mirrors
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let cell = grid[r][c];
          if ((cell.type === 'MIRROR' || cell.type === 'SPLITTER') && !cell.isFixed) {
            cell.angle = Math.floor(rng() * 2);
          }
        }
      }

      stageCleared = false;
      document.getElementById('stage-text').innerText = `STAGE ${String(stageNum).padStart(3, '0')} / 100`;
      document.getElementById('win-overlay').classList.remove('active');
      calculateLasers();
    }

    // --- Accurate Physics Reflection Engine ---
    function calculateLasers() {
      laserPaths = [];
      let totalTargets = 0;
      let hitTargets = 0;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === 'TARGET') {
            grid[r][c].hit = false;
            totalTargets++;
          }
        }
      }

      let queue = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === 'EMITTER') {
            queue.push({ c: c, r: r, dir: grid[r][c].dir });
          }
        }
      }

      let maxSteps = 128;
      while (queue.length > 0 && maxSteps > 0) {
        maxSteps--;
        let ray = queue.shift();
        let pathSeg = [{ c: ray.c, r: ray.r }];

        let curC = ray.c;
        let curR = ray.r;
        let curDir = ray.dir;

        while (true) {
          let nextC = curC + DX[curDir];
          let nextR = curR + DY[curDir];

          if (nextC < 0 || nextC >= cols || nextR < 0 || nextR >= rows) {
            pathSeg.push({ c: nextC, r: nextR });
            break;
          }

          let cell = grid[nextR][nextC];
          pathSeg.push({ c: nextC, r: nextR });

          if (cell.type === 'WALL') {
            break;
          } else if (cell.type === 'TARGET') {
            if (!cell.hit) {
              cell.hit = true;
              hitTargets++;
            }
            break;
          } else if (cell.type === 'MIRROR') {
            // Correct Reflection Logic for 45 deg (0: Slash /) and 135 deg (1: Backslash \)
            let nextDir = curDir;
            if (cell.angle === 0) { // Slash /
              nextDir = 3 - curDir;
            } else { // Backslash \
              nextDir = curDir ^ 1;
            }
            curC = nextC; curR = nextR; curDir = nextDir;
          } else if (cell.type === 'SPLITTER') {
            let splitDir = (cell.angle === 0) ? (3 - curDir) : (curDir ^ 1);
            queue.push({ c: nextC, r: nextR, dir: splitDir });
            curC = nextC; curR = nextR; // Main beam goes straight through
          } else {
            curC = nextC; curR = nextR;
          }
        }
        laserPaths.push(pathSeg);
      }

      if (totalTargets > 0 && hitTargets >= totalTargets && !stageCleared) {
        stageCleared = true;
        Audio.playWin();
        if (!completedStages.includes(currentStage)) {
          completedStages.push(currentStage);
          localStorage.setItem('lumina_completed', JSON.stringify(completedStages));
        }
        setTimeout(() => {
          document.getElementById('win-overlay').classList.add('active');
        }, 250);
      }
    }

    // --- Renderer ---
    function render() {
      const rect = canvas.getBoundingClientRect();
      const tileSize = rect.width / cols;

      ctx.clearRect(0, 0, rect.width, rect.height);

      // Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        ctx.beginPath(); ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, rect.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(rect.width, i * tileSize); ctx.stroke();
      }

      // Grid Elements
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let cell = grid[r][c];
          let cx = (c + 0.5) * tileSize;
          let cy = (r + 0.5) * tileSize;

          if (cell.type === 'WALL') {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(c * tileSize + 2, r * tileSize + 2, tileSize - 4, tileSize - 4);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(c * tileSize + 4, r * tileSize + 4, tileSize - 8, tileSize - 8);
          } else if (cell.type === 'EMITTER') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(cell.dir * Math.PI / 2);
            ctx.fillStyle = '#334155';
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.3, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff3300'; // Laser Emitter accent
            ctx.fillRect(0, -tileSize * 0.08, tileSize * 0.35, tileSize * 0.16);
            ctx.restore();
          } else if (cell.type === 'TARGET') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = cell.hit ? '#ff3300' : '#475569';
            ctx.lineWidth = 3;
            if (cell.hit) {
              ctx.shadowColor = '#ff3300';
              ctx.shadowBlur = 12;
            }
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.28, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = cell.hit ? '#ff3300' : '#1e293b';
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.12, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          } else if (cell.type === 'MIRROR' || cell.type === 'SPLITTER') {
            ctx.save();
            ctx.translate(cx, cy);

            // Smooth interpolation on 90-degree rotations
            if (cell.rotAnim > 0) {
              cell.rotAnim -= 0.18;
              if (cell.rotAnim < 0) cell.rotAnim = 0;
            }

            // 45 deg offset + 90 deg steps
            let baseAngle = cell.angle === 0 ? (Math.PI / 4) : (3 * Math.PI / 4);
            let currentAngle = baseAngle - (cell.rotAnim * Math.PI / 2);
            ctx.rotate(currentAngle);

            if (cell.type === 'MIRROR') {
              ctx.strokeStyle = cell.isFixed ? '#f59e0b' : '#38bdf8'; // Metallic Cyan Mirrors
              ctx.lineWidth = 5;
              ctx.shadowColor = cell.isFixed ? '#f59e0b' : '#38bdf8';
              ctx.shadowBlur = 6;
              ctx.beginPath();
              ctx.moveTo(-tileSize * 0.32, 0);
              ctx.lineTo(tileSize * 0.32, 0);
              ctx.stroke();

              // Glass Backing
              ctx.strokeStyle = 'rgba(255,255,255,0.4)';
              ctx.lineWidth = 1.5;
              ctx.beginPath();
              ctx.moveTo(-tileSize * 0.32, -3);
              ctx.lineTo(tileSize * 0.32, -3);
              ctx.stroke();
            } else if (cell.type === 'SPLITTER') {
              ctx.fillStyle = 'rgba(56, 189, 248, 0.25)';
              ctx.strokeStyle = '#38bdf8';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(-tileSize * 0.2, -tileSize * 0.2);
              ctx.lineTo(tileSize * 0.2, 0);
              ctx.lineTo(-tileSize * 0.2, tileSize * 0.2);
              ctx.closePath();
              ctx.fill(); ctx.stroke();
            }
            ctx.restore();
          }
        }
      }

      // Draw Fiery Red/Orange Laser Beams
      laserPaths.forEach(path => {
        if (path.length < 2) return;
        ctx.save();
        
        // Outer Glow
        ctx.shadowColor = '#ff3300';
        ctx.shadowBlur = 14;
        ctx.strokeStyle = '#ff3300';
        ctx.lineWidth = 5;
        ctx.beginPath();
        ctx.moveTo((path[0].c + 0.5) * tileSize, (path[0].r + 0.5) * tileSize);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo((path[i].c + 0.5) * tileSize, (path[i].r + 0.5) * tileSize);
        }
        ctx.stroke();

        // Inner Yellow Core
        ctx.strokeStyle = '#ffffaa';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo((path[0].c + 0.5) * tileSize, (path[0].r + 0.5) * tileSize);
        for (let i = 1; i < path.length; i++) {
          ctx.lineTo((path[i].c + 0.5) * tileSize, (path[i].r + 0.5) * tileSize);
        }
        ctx.stroke();

        ctx.restore();
      });

      requestAnimationFrame(render);
    }

    // --- User Controls ---
    function handleTouch(e) {
      if (stageCleared) return;
      e.preventDefault();
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const c = Math.floor((clientX - rect.left) / (rect.width / cols));
      const r = Math.floor((clientY - rect.top) / (rect.height / rows));

      if (c >= 0 && c < cols && r >= 0 && r < rows) {
        let cell = grid[r][c];
        if ((cell.type === 'MIRROR' || cell.type === 'SPLITTER') && !cell.isFixed) {
          // Rotates 90 degrees (toggles state between 45 deg and 135 deg)
          cell.angle = (cell.angle + 1) % 2;
          cell.rotAnim = 1.0;
          Audio.playRotate();
          if (navigator.vibrate) navigator.vibrate(12);
          calculateLasers();
        }
      }
    }

    canvas.addEventListener('touchstart', handleTouch, { passive: false });
    canvas.addEventListener('mousedown', handleTouch);

    function populateLevelGrid() {
      const gridContainer = document.getElementById('level-grid');
      gridContainer.innerHTML = '';
      for (let i = 1; i <= 100; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${completedStages.includes(i) ? 'completed' : ''}`;
        btn.innerText = i;
        btn.onclick = () => {
          currentStage = i;
          generateStage(currentStage);
          document.getElementById('select-overlay').classList.remove('active');
        };
        gridContainer.appendChild(btn);
      }
    }

    document.getElementById('btn-reset').onclick = () => generateStage(currentStage);
    document.getElementById('btn-prev').onclick = () => { if (currentStage > 1) generateStage(--currentStage); };
    document.getElementById('btn-skip').onclick = () => { if (currentStage < 100) generateStage(++currentStage); };
    document.getElementById('btn-next').onclick = () => { if (currentStage < 100) generateStage(++currentStage); };
    document.getElementById('btn-select').onclick = () => { populateLevelGrid(); document.getElementById('select-overlay').classList.add('active'); };
    document.getElementById('btn-close-select').onclick = () => { document.getElementById('select-overlay').classList.add('active'); };
    document.getElementById('btn-sound').onclick = (e) => { Audio.muted = !Audio.muted; e.target.innerText = Audio.muted ? '🔇' : '🔊'; };

    window.addEventListener('resize', resizeCanvas);

    resizeCanvas();
    generateStage(currentStage);
    requestAnimationFrame(render);
  </script>
</body>
</html>
