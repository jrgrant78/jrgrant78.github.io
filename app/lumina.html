<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMINA: Laser Logic</title>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151d2a;
      --laser-core: #ffea00;
      --laser-glow: #ff2200;
      --mirror-frame: #38bdf8;
      --text: #f8fafc;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 12px;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 4px;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--laser-glow);
      text-shadow: 0 0 12px rgba(255, 34, 0, 0.6);
    }

    .stage-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .controls-bar {
      display: flex;
      gap: 8px;
    }

    button {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:active {
      transform: scale(0.95);
      background: var(--mirror-frame);
      color: #000;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.9);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(11, 15, 25, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: var(--laser-glow);
      text-shadow: 0 0 15px var(--laser-glow);
      margin-bottom: 8px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
    }

    .level-btn {
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      border-radius: 6px;
      padding: 0;
    }

    .level-btn.completed {
      border-color: var(--mirror-frame);
      color: var(--mirror-frame);
    }

    footer {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
    }

    footer button {
      flex: 1;
      justify-content: center;
      padding: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="title">LUMINA</div>
      <div class="stage-indicator" id="stage-text">STAGE 001 / 100</div>
    </div>
    <div class="controls-bar">
      <button id="btn-sound">🔊</button>
      <button id="btn-select">LEVELS</button>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="win-overlay">
      <h2>TARGET POWERED</h2>
      <p style="color: var(--text-dim); margin-bottom: 20px;">Light vector locked onto receiver.</p>
      <button id="btn-next" style="padding: 12px 32px; background: var(--laser-glow); color: #fff;">NEXT STAGE</button>
    </div>

    <div class="overlay" id="select-overlay">
      <h3 style="margin-bottom: 12px;">SELECT STAGE</h3>
      <div class="modal-grid" id="level-grid"></div>
      <button id="btn-close-select" style="width: 100%;">CLOSE</button>
    </div>
  </div>

  <footer>
    <button id="btn-prev">PREV</button>
    <button id="btn-reset">RESET</button>
    <button id="btn-skip">NEXT</button>
  </footer>

  <script>
    // --- Audio System ---
    const Audio = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playRotate() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(450, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.04);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.04);
      },
      playWin() {
        if (this.muted) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.06);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.06 + 0.22);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.06);
          osc.stop(this.ctx.currentTime + i * 0.06 + 0.22);
        });
      }
    };

    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 8, t | 1);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    // Grid Vectors: 0: RIGHT, 1: DOWN, 2: LEFT, 3: UP
    const DX = [1, 0, -1, 0];
    const DY = [0, 1, 0, -1];

    let currentStage = 1;
    let completedStages = JSON.parse(localStorage.getItem('lumina_completed') || '[]');
    let grid = [];
    let cols = 6, rows = 6;
    let laserPath = [];
    let stageCleared = false;
    let lastInputTime = 0;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    // --- Deterministic Strategic Level Generation ---
    function generateStage(stageNum) {
      let rng = mulberry32(9000 + stageNum * 777);
      
      cols = Math.min(9, 5 + Math.floor((stageNum - 1) / 20));
      rows = cols;

      grid = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({ type: 'EMPTY' })));

      // 1. Place Emitter on outer border
      let edge = Math.floor(rng() * 4);
      let ec = 0, er = 0, edir = 0;
      if (edge === 0) { ec = Math.floor(rng() * cols); er = 0; edir = 1; }
      else if (edge === 1) { ec = cols - 1; er = Math.floor(rng() * rows); edir = 2; }
      else if (edge === 2) { ec = Math.floor(rng() * cols); er = rows - 1; edir = 3; }
      else { ec = 0; er = Math.floor(rng() * rows); edir = 0; }

      grid[er][ec] = { type: 'EMITTER', dir: edir };

      // 2. Build a strategic path with designated turns
      let pathTurns = Math.min(12, 2 + Math.floor(stageNum / 8));
      let curC = ec, curR = er, curDir = edir;
      let pathCells = new Set([`${ec},${er}`]);

      for (let t = 0; t < pathTurns; t++) {
        let dist = Math.floor(rng() * (cols - 3)) + 1;
        for (let d = 0; d < dist; d++) {
          let nc = curC + DX[curDir];
          let nr = curR + DY[curDir];
          if (nc < 0 || nc >= cols || nr < 0 || nr >= rows) break;
          curC = nc; curR = nr;
          pathCells.add(`${curC},${curR}`);
        }

        // Determine next turn direction (Left or Right relative to current direction)
        let turnRight = rng() > 0.5;
        let nextDir = turnRight ? (curDir + 1) % 4 : (curDir + 3) % 4;

        // Verify corner cell isn't already occupied
        if (curC > 0 && curC < cols - 1 && curR > 0 && curR < rows - 1) {
          // Angle 0: Slash (/), Angle 1: Backslash (\)
          let requiredAngle = -1;
          if ((curDir === 0 && nextDir === 3) || (curDir === 3 && nextDir === 0) ||
              (curDir === 1 && nextDir === 2) || (curDir === 2 && nextDir === 1)) {
            requiredAngle = 0; // Slash /
          } else {
            requiredAngle = 1; // Backslash \
          }

          grid[curR][curC] = {
            type: 'MIRROR',
            solAngle: requiredAngle,
            angle: (requiredAngle + 1) % 2 // Start in WRONG orientation
          };

          curDir = nextDir;
        }
      }

      // 3. Place Target at end of path
      let tc = curC + DX[curDir];
      let tr = curR + DY[curDir];
      if (tc >= 0 && tc < cols && tr >= 0 && tr < rows && grid[tr][tc].type === 'EMPTY') {
        grid[tr][tc] = { type: 'TARGET', hit: false };
      } else {
        grid[curR][curC] = { type: 'TARGET', hit: false };
      }

      // 4. Place sparse strategic Wall obstacles (NO extra decoy mirrors)
      let numWalls = Math.min(8, Math.floor(stageNum / 12));
      for (let w = 0; w < numWalls; w++) {
        let wr = Math.floor(rng() * rows);
        let wc = Math.floor(rng() * cols);
        if (grid[wr][wc].type === 'EMPTY' && !pathCells.has(`${wc},${wr}`)) {
          grid[wr][wc] = { type: 'WALL' };
        }
      }

      stageCleared = false;
      document.getElementById('stage-text').innerText = `STAGE ${String(stageNum).padStart(3, '0')} / 100`;
      document.getElementById('win-overlay').classList.remove('active');
      calculateLasers();
    }

    // --- Accurate Physics Optics ---
    function calculateLasers() {
      laserPath = [];
      let targetHit = false;

      // Find Emitter
      let er = -1, ec = -1, edir = -1;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === 'EMITTER') {
            er = r; ec = c; edir = grid[r][c].dir;
          }
          if (grid[r][c].type === 'TARGET') {
            grid[r][c].hit = false;
          }
        }
      }

      let curC = ec, curR = er, curDir = edir;
      laserPath.push({ c: curC, r: curR });

      let maxSteps = 64;
      while (maxSteps > 0) {
        maxSteps--;
        let nextC = curC + DX[curDir];
        let nextR = curR + DY[curDir];

        if (nextC < 0 || nextC >= cols || nextR < 0 || nextR >= rows) {
          laserPath.push({ c: nextC, r: nextR });
          break;
        }

        let cell = grid[nextR][nextC];
        laserPath.push({ c: nextC, r: nextR });

        if (cell.type === 'WALL') {
          break;
        } else if (cell.type === 'TARGET') {
          cell.hit = true;
          targetHit = true;
          break;
        } else if (cell.type === 'MIRROR') {
          // Angle 0: Slash (/), Angle 1: Backslash (\)
          let nextDir = curDir;
          if (cell.angle === 0) {
            // Slash / reflection
            // 0 (RIGHT) -> 3 (UP), 1 (DOWN) -> 2 (LEFT)
            // 2 (LEFT) -> 1 (DOWN), 3 (UP) -> 0 (RIGHT)
            nextDir = 3 - curDir;
          } else {
            // Backslash \ reflection
            // 0 (RIGHT) -> 1 (DOWN), 1 (DOWN) -> 0 (RIGHT)
            // 2 (LEFT) -> 3 (UP), 3 (UP) -> 2 (LEFT)
            nextDir = curDir ^ 1;
          }
          curC = nextC; curR = nextR; curDir = nextDir;
        } else {
          curC = nextC; curR = nextR;
        }
      }

      if (targetHit && !stageCleared) {
        stageCleared = true;
        Audio.playWin();
        if (!completedStages.includes(currentStage)) {
          completedStages.push(currentStage);
          localStorage.setItem('lumina_completed', JSON.stringify(completedStages));
        }
        setTimeout(() => {
          document.getElementById('win-overlay').classList.add('active');
        }, 200);
      }
    }

    // --- High Contrast Canvas Rendering ---
    function render() {
      const rect = canvas.getBoundingClientRect();
      const tileSize = rect.width / cols;

      ctx.clearRect(0, 0, rect.width, rect.height);

      // Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        ctx.beginPath(); ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, rect.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(rect.width, i * tileSize); ctx.stroke();
      }

      // Draw Grid Elements
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let cell = grid[r][c];
          let cx = (c + 0.5) * tileSize;
          let cy = (r + 0.5) * tileSize;

          if (cell.type === 'WALL') {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(c * tileSize + 3, r * tileSize + 3, tileSize - 6, tileSize - 6);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(c * tileSize + 5, r * tileSize + 5, tileSize - 10, tileSize - 10);
          } else if (cell.type === 'EMITTER') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(cell.dir * Math.PI / 2);
            ctx.fillStyle = '#334155';
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.32, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff2200';
            ctx.fillRect(0, -tileSize * 0.08, tileSize * 0.38, tileSize * 0.16);
            ctx.restore();
          } else if (cell.type === 'TARGET') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = cell.hit ? '#ffea00' : '#475569';
            ctx.lineWidth = 3;
            if (cell.hit) {
              ctx.shadowColor = '#ffea00';
              ctx.shadowBlur = 14;
            }
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.3, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = cell.hit ? '#ffea00' : '#1e293b';
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.14, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          } else if (cell.type === 'MIRROR') {
            ctx.save();
            ctx.translate(cx, cy);

            // Angle 0: Slash / (-45 deg in canvas Y-down coords)
            // Angle 1: Backslash \ (+45 deg in canvas Y-down coords)
            let drawAngle = cell.angle === 0 ? -Math.PI / 4 : Math.PI / 4;
            ctx.rotate(drawAngle);

            // Outer Mirror Frame
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 5;
            ctx.shadowColor = '#38bdf8';
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(-tileSize * 0.35, 0);
            ctx.lineTo(tileSize * 0.35, 0);
            ctx.stroke();

            // Glass Reflective Surface
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-tileSize * 0.35, -2);
            ctx.lineTo(tileSize * 0.35, -2);
            ctx.stroke();

            ctx.restore();
          }
        }
      }

      // Draw Laser Beam (Fiery Red Glow with White-Hot Core)
      if (laserPath.length >= 2) {
        ctx.save();

        // Glow Pass
        ctx.shadowColor = '#ff2200';
        ctx.shadowBlur = 16;
        ctx.strokeStyle = '#ff2200';
        ctx.lineWidth = 6;
        ctx.beginPath();
        ctx.moveTo((laserPath[0].c + 0.5) * tileSize, (laserPath[0].r + 0.5) * tileSize);
        for (let i = 1; i < laserPath.length; i++) {
          ctx.lineTo((laserPath[i].c + 0.5) * tileSize, (laserPath[i].r + 0.5) * tileSize);
        }
        ctx.stroke();

        // Core Pass
        ctx.strokeStyle = '#ffea00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo((laserPath[0].c + 0.5) * tileSize, (laserPath[0].r + 0.5) * tileSize);
        for (let i = 1; i < laserPath.length; i++) {
          ctx.lineTo((laserPath[i].c + 0.5) * tileSize, (laserPath[i].r + 0.5) * tileSize);
        }
        ctx.stroke();

        ctx.restore();
      }

      requestAnimationFrame(render);
    }

    // --- Immediate Touch-Down Control Engine ---
    function handleImmediateInput(e) {
      if (stageCleared) return;

      const now = Date.now();
      if (now - lastInputTime < 80) return; // Debounce rapid input
      lastInputTime = now;

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const c = Math.floor((clientX - rect.left) / (rect.width / cols));
      const r = Math.floor((clientY - rect.top) / (rect.height / rows));

      if (c >= 0 && c < cols && r >= 0 && r < rows) {
        let cell = grid[r][c];
        if (cell.type === 'MIRROR') {
          // Toggle mirror angle immediately on touch
          cell.angle = (cell.angle + 1) % 2;
          Audio.playRotate();
          if (navigator.vibrate) navigator.vibrate(12);
          calculateLasers();
        }
      }
    }

    // Attach listeners for immediate TOUCHSTART / MOUSEDOWN
    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleImmediateInput(e);
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handleImmediateInput(e);
    });

    // Level Selector Modal
    function populateLevelGrid() {
      const gridContainer = document.getElementById('level-grid');
      gridContainer.innerHTML = '';
      for (let i = 1; i <= 100; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${completedStages.includes(i) ? 'completed' : ''}`;
        btn.innerText = i;
        btn.onclick = () => {
          currentStage = i;
          generateStage(currentStage);
          document.getElementById('select-overlay').classList.remove('active');
        };
        gridContainer.appendChild(btn);
      }
    }

    // Controls
    document.getElementById('btn-reset').onclick = () => generateStage(currentStage);
    document.getElementById('btn-prev').onclick = () => { if (currentStage > 1) generateStage(--currentStage); };
    document.getElementById('btn-skip').onclick = () => { if (currentStage < 100) generateStage(++currentStage); };
    document.getElementById('btn-next').onclick = () => { if (currentStage < 100) generateStage(++currentStage); };
    document.getElementById('btn-select').onclick = () => { populateLevelGrid(); document.getElementById('select-overlay').classList.add('active'); };
    document.getElementById('btn-close-select').onclick = () => { document.getElementById('select-overlay').classList.remove('active'); };
    document.getElementById('btn-sound').onclick = (e) => { Audio.muted = !Audio.muted; e.target.innerText = Audio.muted ? '🔇' : '🔊'; };

    window.addEventListener('resize', resizeCanvas);

    // Init
    resizeCanvas();
    generateStage(currentStage);
    requestAnimationFrame(render);
  </script>
</body>
</html>
