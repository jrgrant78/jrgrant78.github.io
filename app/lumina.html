<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LUMINA: 100 Laser Logic Stages</title>
  <style>
    :root {
      --bg: #070a12;
      --panel: #111827;
      --laser-red: #ff2200;
      --laser-yellow: #ffea00;
      --mirror-cyan: #38bdf8;
      --fixed-gold: #f59e0b;
      --portal-purple: #a855f7;
      --text: #f8fafc;
      --text-dim: #64748b;
    }

    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow: hidden;
      padding: 12px;
    }

    header {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 2px;
    }

    .title {
      font-size: 1.3rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--laser-red);
      text-shadow: 0 0 12px rgba(255, 34, 0, 0.7);
    }

    .stage-indicator {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-dim);
    }

    .mechanic-banner {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--laser-yellow);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 2px;
    }

    .controls-bar {
      display: flex;
      gap: 6px;
    }

    button {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.95);
      background: var(--mirror-cyan);
      color: #000;
    }

    #game-container {
      position: relative;
      width: 100%;
      max-width: 480px;
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      background: rgba(15, 23, 42, 0.95);
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.8), inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(7, 10, 18, 0.93);
      backdrop-filter: blur(8px);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
      z-index: 10;
      padding: 24px;
      text-align: center;
    }

    .overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .overlay h2 {
      font-size: 1.8rem;
      color: var(--laser-red);
      text-shadow: 0 0 15px var(--laser-red);
      margin-bottom: 8px;
    }

    .modal-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      max-height: 260px;
      overflow-y: auto;
      width: 100%;
      padding: 8px;
      margin-bottom: 20px;
    }

    .level-btn {
      aspect-ratio: 1 / 1;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.85rem;
      border-radius: 6px;
      padding: 0;
    }

    .level-btn.completed {
      border-color: var(--mirror-cyan);
      color: var(--mirror-cyan);
    }

    footer {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding-top: 8px;
    }

    footer button {
      flex: 1;
      justify-content: center;
      padding: 12px;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <div class="title">LUMINA</div>
      <div class="stage-indicator" id="stage-text">STAGE 001 / 100</div>
      <div class="mechanic-banner" id="mechanic-text">BASIC REFRACTION</div>
    </div>
    <div class="controls-bar">
      <button id="btn-sound">🔊</button>
      <button id="btn-select">LEVELS</button>
    </div>
  </header>

  <div id="game-container">
    <canvas id="gameCanvas"></canvas>

    <div class="overlay" id="win-overlay">
      <h2>STAGE CLEARED</h2>
      <p style="color: var(--text-dim); margin-bottom: 20px;">Laser path successfully aligned.</p>
      <button id="btn-next" style="padding: 12px 32px; background: var(--laser-red); color: #fff;">NEXT STAGE</button>
    </div>

    <div class="overlay" id="select-overlay">
      <h3 style="margin-bottom: 12px;">SELECT STAGE</h3>
      <div class="modal-grid" id="level-grid"></div>
      <button id="btn-close-select" style="width: 100%;">CLOSE</button>
    </div>
  </div>

  <footer>
    <button id="btn-prev">PREV</button>
    <button id="btn-reset">RESET</button>
    <button id="btn-skip">NEXT</button>
  </footer>

  <script>
    // --- Audio System ---
    const Audio = {
      ctx: null,
      muted: false,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      playRotate() {
        if (this.muted) return;
        this.init();
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(1000, this.ctx.currentTime + 0.03);
        gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.03);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.03);
      },
      playWin() {
        if (this.muted) return;
        this.init();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime + i * 0.05);
          gain.gain.setValueAtTime(0.15, this.ctx.currentTime + i * 0.05);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + i * 0.05 + 0.2);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(this.ctx.currentTime + i * 0.05);
          osc.stop(this.ctx.currentTime + i * 0.05 + 0.2);
        });
      }
    };

    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ t >>> 15, t | 1);
        t ^= t + Math.imul(t ^ t >>> 8, t | 1);
        return ((t ^ t >>> 14) >>> 0) / 4294967296;
      }
    }

    // Grid Directions: 0: RIGHT, 1: DOWN, 2: LEFT, 3: UP
    const DX = [1, 0, -1, 0];
    const DY = [0, 1, 0, -1];

    let currentStage = 1;
    let completedStages = JSON.parse(localStorage.getItem('lumina_completed') || '[]');
    let grid = [];
    let cols = 5, rows = 5;
    let laserSegments = [];
    let stageCleared = false;
    let lastInputTime = 0;

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      ctx.scale(dpr, dpr);
    }

    // --- Strategic Stage Generator ---
    function generateStage(stageNum) {
      let rng = mulberry32(10000 + stageNum * 888);

      // Grid dimensions expand smoothly up to 10x10
      cols = Math.min(10, 5 + Math.floor((stageNum - 1) / 18));
      rows = cols;

      grid = Array.from({ length: rows }, () => Array.from({ length: cols }, () => ({ type: 'EMPTY' })));

      // Set mechanic banner
      const mechanicBanner = document.getElementById('mechanic-text');
      if (stageNum >= 90) mechanicBanner.innerText = "MASTERY: DUAL TARGET CONVERGENCE";
      else if (stageNum >= 70) mechanicBanner.innerText = "BEAM SPLITTERS INTRODUCED";
      else if (stageNum >= 50) mechanicBanner.innerText = "PORTAL WORMHOLES INTRODUCED";
      else if (stageNum >= 30) mechanicBanner.innerText = "LOCKED GOLD MIRRORS INTRODUCED";
      else if (stageNum >= 15) mechanicBanner.innerText = "ABSORBING WALLS INTRODUCED";
      else mechanicBanner.innerText = "BASIC REFRACTION";

      // 1. Place Emitter on grid boundary
      let edge = Math.floor(rng() * 4);
      let ec = 0, er = 0, edir = 0;
      if (edge === 0) { ec = Math.floor(rng() * (cols - 2)) + 1; er = 0; edir = 1; }
      else if (edge === 1) { ec = cols - 1; er = Math.floor(rng() * (rows - 2)) + 1; edir = 2; }
      else if (edge === 2) { ec = Math.floor(rng() * (cols - 2)) + 1; er = rows - 1; edir = 3; }
      else { ec = 0; er = Math.floor(rng() * (rows - 2)) + 1; edir = 0; }

      grid[er][ec] = { type: 'EMITTER', dir: edir };

      // 2. Trace path with required turns scaling with stage number
      let reqTurns = Math.min(14, 2 + Math.floor((stageNum - 1) / 7));
      let curC = ec, curR = er, curDir = edir;
      let pathNodes = [];
      let mirrorCells = [];

      for (let t = 0; t < reqTurns; t++) {
        let maxDist = Math.max(1, Math.floor(rng() * (cols - 2)));
        for (let d = 0; d < maxDist; d++) {
          let nc = curC + DX[curDir];
          let nr = curR + DY[curDir];
          if (nc < 1 || nc >= cols - 1 || nr < 1 || nr >= rows - 1) break;
          curC = nc; curR = nr;
          pathNodes.push(`${curC},${curR}`);
        }

        let turnRight = rng() > 0.5;
        let nextDir = turnRight ? (curDir + 1) % 4 : (curDir + 3) % 4;

        if (curC >= 1 && curC < cols - 1 && curR >= 1 && curR < rows - 1 && grid[curR][curC].type === 'EMPTY') {
          // Angle 0: Slash (/), Angle 1: Backslash (\)
          let solAngle = -1;
          if ((curDir === 0 && nextDir === 3) || (curDir === 3 && nextDir === 0) ||
              (curDir === 1 && nextDir === 2) || (curDir === 2 && nextDir === 1)) {
            solAngle = 0; // Slash /
          } else {
            solAngle = 1; // Backslash \
          }

          let isLocked = (stageNum >= 30 && rng() < 0.25);
          let isSplitter = (stageNum >= 70 && rng() < 0.3);

          let cellType = isSplitter ? 'SPLITTER' : 'MIRROR';

          grid[curR][curC] = {
            type: cellType,
            solAngle: solAngle,
            angle: solAngle, // Set solution initially
            isFixed: isLocked
          };

          mirrorCells.push({ r: curR, c: curC, solAngle: solAngle, isFixed: isLocked });
          curDir = nextDir;
        }
      }

      // 3. Place Primary Target Receptacle
      let tc = curC + DX[curDir];
      let tr = curR + DY[curDir];
      if (tc >= 0 && tc < cols && tr >= 0 && tr < rows && grid[tr][tc].type === 'EMPTY') {
        grid[tr][tc] = { type: 'TARGET', hit: false };
      } else {
        grid[curR][curC] = { type: 'TARGET', hit: false };
      }

      // Stage 90+: Dual Targets
      if (stageNum >= 90) {
        for (let r = 1; r < rows - 1; r++) {
          for (let c = 1; c < cols - 1; c++) {
            if (grid[r][c].type === 'EMPTY' && rng() < 0.1) {
              grid[r][c] = { type: 'TARGET', hit: false };
              r = rows; break; // Place one extra target
            }
          }
        }
      }

      // 4. Introduce Portals (Stages 50+)
      if (stageNum >= 50 && rng() < 0.8) {
        let emptyCells = [];
        for (let r = 1; r < rows - 1; r++) {
          for (let c = 1; c < cols - 1; c++) {
            if (grid[r][c].type === 'EMPTY') emptyCells.push({ r, c });
          }
        }
        if (emptyCells.length >= 2) {
          let p1 = emptyCells.splice(Math.floor(rng() * emptyCells.length), 1)[0];
          let p2 = emptyCells.splice(Math.floor(rng() * emptyCells.length), 1)[0];
          grid[p1.r][p1.c] = { type: 'PORTAL', pairR: p2.r, pairC: p2.c };
          grid[p2.r][p2.c] = { type: 'PORTAL', pairR: p1.r, pairC: p1.c };
        }
      }

      // 5. Introduce Absorbing Walls (Stages 15+)
      if (stageNum >= 15) {
        let wallCount = Math.min(10, Math.floor((stageNum - 10) / 6));
        for (let w = 0; w < wallCount; w++) {
          let wr = Math.floor(rng() * rows);
          let wc = Math.floor(rng() * cols);
          if (grid[wr][wc].type === 'EMPTY' && !pathNodes.includes(`${wc},${wr}`)) {
            grid[wr][wc] = { type: 'WALL' };
          }
        }
      }

      // 6. GUARANTEE NON-INSTANT START: Scramble all non-fixed mirrors
      mirrorCells.forEach(m => {
        if (!m.isFixed) {
          grid[m.r][m.c].angle = (m.solAngle + 1) % 2; // Invert to wrong orientation
        }
      });

      // Verify level is not auto-cleared on load; if so, scramble further
      let sim = calculateLasers(false);
      if (sim.cleared) {
        mirrorCells.forEach(m => {
          if (!m.isFixed && rng() > 0.5) {
            grid[m.r][m.c].angle = (grid[m.r][m.c].angle + 1) % 2;
          }
        });
      }

      stageCleared = false;
      document.getElementById('stage-text').innerText = `STAGE ${String(stageNum).padStart(3, '0')} / 100`;
      document.getElementById('win-overlay').classList.remove('active');
      calculateLasers(true);
    }

    // --- Ray-Tracing Physics Engine ---
    function calculateLasers(applyWinCheck = true) {
      laserSegments = [];
      let totalTargets = 0;
      let hitTargets = 0;

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === 'TARGET') {
            grid[r][c].hit = false;
            totalTargets++;
          }
        }
      }

      // Find Emitter(s)
      let queue = [];
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].type === 'EMITTER') {
            queue.push({ c: c, r: r, dir: grid[r][c].dir });
          }
        }
      }

      let visitedRays = new Set();
      let maxSteps = 128;

      while (queue.length > 0 && maxSteps > 0) {
        maxSteps--;
        let ray = queue.shift();
        let stateKey = `${ray.c},${ray.r},${ray.dir}`;
        if (visitedRays.has(stateKey)) continue;
        visitedRays.add(stateKey);

        let segment = [{ c: ray.c, r: ray.r }];
        let curC = ray.c, curR = ray.r, curDir = ray.dir;

        while (true) {
          let nextC = curC + DX[curDir];
          let nextR = curR + DY[curDir];

          if (nextC < 0 || nextC >= cols || nextR < 0 || nextR >= rows) {
            segment.push({ c: nextC, r: nextR });
            break;
          }

          let cell = grid[nextR][nextC];
          segment.push({ c: nextC, r: nextR });

          if (cell.type === 'WALL') {
            break; // Laser absorbed by wall
          } else if (cell.type === 'TARGET') {
            if (!cell.hit) {
              cell.hit = true;
              hitTargets++;
            }
            break;
          } else if (cell.type === 'MIRROR') {
            // Angle 0: Slash (/), Angle 1: Backslash (\)
            let nextDir = (cell.angle === 0) ? (3 - curDir) : (curDir ^ 1);
            curC = nextC; curR = nextR; curDir = nextDir;
          } else if (cell.type === 'SPLITTER') {
            let reflectDir = (cell.angle === 0) ? (3 - curDir) : (curDir ^ 1);
            // Push straight beam
            queue.push({ c: nextC, r: nextR, dir: curDir });
            // Reflect secondary beam
            curC = nextC; curR = nextR; curDir = reflectDir;
          } else if (cell.type === 'PORTAL') {
            // Teleport to paired portal and continue in same direction
            curC = cell.pairC; curR = cell.pairR;
            segment.push({ c: curC, r: curR });
          } else {
            curC = nextC; curR = nextR;
          }
        }
        laserSegments.push(segment);
      }

      let cleared = (totalTargets > 0 && hitTargets >= totalTargets);

      if (applyWinCheck && cleared && !stageCleared) {
        stageCleared = true;
        Audio.playWin();
        if (!completedStages.includes(currentStage)) {
          completedStages.push(currentStage);
          localStorage.setItem('lumina_completed', JSON.stringify(completedStages));
        }
        setTimeout(() => {
          document.getElementById('win-overlay').classList.add('active');
        }, 200);
      }

      return { cleared, hitTargets, totalTargets };
    }

    // --- High-Contrast Canvas Renderer ---
    function render() {
      const rect = canvas.getBoundingClientRect();
      const tileSize = rect.width / cols;

      ctx.clearRect(0, 0, rect.width, rect.height);

      // Grid Lines
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.05)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= cols; i++) {
        ctx.beginPath(); ctx.moveTo(i * tileSize, 0); ctx.lineTo(i * tileSize, rect.height); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i * tileSize); ctx.lineTo(rect.width, i * tileSize); ctx.stroke();
      }

      // Grid Elements
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          let cell = grid[r][c];
          let cx = (c + 0.5) * tileSize;
          let cy = (r + 0.5) * tileSize;

          if (cell.type === 'WALL') {
            ctx.fillStyle = '#1e293b';
            ctx.fillRect(c * tileSize + 3, r * tileSize + 3, tileSize - 6, tileSize - 6);
            ctx.strokeStyle = '#334155';
            ctx.strokeRect(c * tileSize + 5, r * tileSize + 5, tileSize - 10, tileSize - 10);
          } else if (cell.type === 'EMITTER') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.rotate(cell.dir * Math.PI / 2);
            ctx.fillStyle = '#334155';
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.32, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff2200';
            ctx.fillRect(0, -tileSize * 0.08, tileSize * 0.38, tileSize * 0.16);
            ctx.restore();
          } else if (cell.type === 'TARGET') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = cell.hit ? '#ffea00' : '#475569';
            ctx.lineWidth = 3;
            if (cell.hit) {
              ctx.shadowColor = '#ffea00';
              ctx.shadowBlur = 14;
            }
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.3, 0, Math.PI * 2); ctx.stroke();
            ctx.fillStyle = cell.hit ? '#ffea00' : '#1e293b';
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.14, 0, Math.PI * 2); ctx.fill();
            ctx.restore();
          } else if (cell.type === 'MIRROR') {
            ctx.save();
            ctx.translate(cx, cy);

            // Angle 0: Slash (/), Angle 1: Backslash (\)
            let drawAngle = cell.angle === 0 ? -Math.PI / 4 : Math.PI / 4;
            ctx.rotate(drawAngle);

            let mirrorColor = cell.isFixed ? '#f59e0b' : '#38bdf8';
            ctx.strokeStyle = mirrorColor;
            ctx.lineWidth = 5;
            ctx.shadowColor = mirrorColor;
            ctx.shadowBlur = 8;
            ctx.beginPath();
            ctx.moveTo(-tileSize * 0.35, 0);
            ctx.lineTo(tileSize * 0.35, 0);
            ctx.stroke();

            // Metallic/Glass backing
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(-tileSize * 0.35, -2);
            ctx.lineTo(tileSize * 0.35, -2);
            ctx.stroke();

            ctx.restore();
          } else if (cell.type === 'SPLITTER') {
            ctx.save();
            ctx.translate(cx, cy);
            let drawAngle = cell.angle === 0 ? -Math.PI / 4 : Math.PI / 4;
            ctx.rotate(drawAngle);
            ctx.fillStyle = 'rgba(56, 189, 248, 0.3)';
            ctx.strokeStyle = '#38bdf8';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(-tileSize * 0.25, -tileSize * 0.2);
            ctx.lineTo(tileSize * 0.25, 0);
            ctx.lineTo(-tileSize * 0.25, tileSize * 0.2);
            ctx.closePath();
            ctx.fill(); ctx.stroke();
            ctx.restore();
          } else if (cell.type === 'PORTAL') {
            ctx.save();
            ctx.translate(cx, cy);
            ctx.strokeStyle = '#a855f7';
            ctx.shadowColor = '#a855f7';
            ctx.shadowBlur = 10;
            ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(0, 0, tileSize * 0.28, 0, Math.PI * 2); ctx.stroke();
            ctx.restore();
          }
        }
      }

      // Draw Laser Beams
      laserSegments.forEach(seg => {
        if (seg.length < 2) return;
        ctx.save();

        // Fiery Outer Glow
        ctx.shadowColor = '#ff2200';
        ctx.shadowBlur = 16;
        ctx.strokeStyle = '#ff2200';
        ctx.lineWidth = 5.5;
        ctx.beginPath();
        ctx.moveTo((seg[0].c + 0.5) * tileSize, (seg[0].r + 0.5) * tileSize);
        for (let i = 1; i < seg.length; i++) {
          ctx.lineTo((seg[i].c + 0.5) * tileSize, (seg[i].r + 0.5) * tileSize);
        }
        ctx.stroke();

        // White-Hot Inner Core
        ctx.strokeStyle = '#ffea00';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo((seg[0].c + 0.5) * tileSize, (seg[0].r + 0.5) * tileSize);
        for (let i = 1; i < seg.length; i++) {
          ctx.lineTo((seg[i].c + 0.5) * tileSize, (seg[i].r + 0.5) * tileSize);
        }
        ctx.stroke();

        ctx.restore();
      });

      requestAnimationFrame(render);
    }

    // --- Immediate Touch-Down Control Engine ---
    function handleImmediateInput(e) {
      if (stageCleared) return;

      const now = Date.now();
      if (now - lastInputTime < 60) return;
      lastInputTime = now;

      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const c = Math.floor((clientX - rect.left) / (rect.width / cols));
      const r = Math.floor((clientY - rect.top) / (rect.height / rows));

      if (c >= 0 && c < cols && r >= 0 && r < rows) {
        let cell = grid[r][c];
        if ((cell.type === 'MIRROR' || cell.type === 'SPLITTER') && !cell.isFixed) {
          cell.angle = (cell.angle + 1) % 2; // Instant 90-degree rotation
          Audio.playRotate();
          if (navigator.vibrate) navigator.vibrate(10);
          calculateLasers(true);
        }
      }
    }

    canvas.addEventListener('touchstart', (e) => {
      e.preventDefault();
      handleImmediateInput(e);
    }, { passive: false });

    canvas.addEventListener('mousedown', (e) => {
      e.preventDefault();
      handleImmediateInput(e);
    });

    // Level Selector Modal
    function populateLevelGrid() {
      const gridContainer = document.getElementById('level-grid');
      gridContainer.innerHTML = '';
      for (let i = 1; i <= 100; i++) {
        const btn = document.createElement('button');
        btn.className = `level-btn ${completedStages.includes(i) ? 'completed' : ''}`;
        btn.innerText = i;
        btn.onclick = () => {
          currentStage = i;
          generateStage(currentStage);
          document.getElementById('select-overlay').classList.remove('active');
        };
        gridContainer.appendChild(btn);
      }
    }

    // Navigation Handlers
    document.getElementById('btn-reset').onclick = () => generateStage(currentStage);
    document.getElementById('btn-prev').onclick = () => { if (currentStage > 1) generateStage(--currentStage); };
    document.getElementById('btn-skip').onclick = () => { if (currentStage < 100) generateStage(++currentStage); };
    document.getElementById('btn-next').onclick = () => { if (currentStage < 100) generateStage(++currentStage); };
    document.getElementById('btn-select').onclick = () => { populateLevelGrid(); document.getElementById('select-overlay').classList.add('active'); };
    document.getElementById('btn-close-select').onclick = () => { document.getElementById('select-overlay').classList.remove('active'); };
    document.getElementById('btn-sound').onclick = (e) => { Audio.muted = !Audio.muted; e.target.innerText = Audio.muted ? '🔇' : '🔊'; };

    window.addEventListener('resize', resizeCanvas);

    // Initialization
    resizeCanvas();
    generateStage(currentStage);
    requestAnimationFrame(render);
  </script>
</body>
</html>
