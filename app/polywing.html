<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>POLYWING: HYPER-RAIL IMMERSIVE CORRIDOR</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #00ffcc; }
        
        #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: block; touch-action: none; }
        
        /* UI OVERLAYS */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(2, 2, 8, 0.92); text-align: center; padding: 20px; transition: opacity 0.4s ease;
        }

        h1.game-title {
            font-size: min(10vw, 44px); font-weight: 900; letter-spacing: 6px; color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc, 0 0 35px #00ffcc; margin-bottom: 5px;
        }
        
        .subtitle { font-size: min(3.5vw, 13px); letter-spacing: 3px; color: #ff0055; margin-bottom: 30px; text-shadow: 0 0 10px #ff0055; }

        .btn {
            background: rgba(0, 255, 204, 0.12); border: 2px solid #00ffcc; color: #00ffcc;
            padding: 14px 28px; margin: 8px; font-size: min(4vw, 18px); font-weight: bold;
            letter-spacing: 2px; font-family: inherit; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); transition: all 0.2s ease; outline: none;
            width: min(80vw, 280px);
        }
        .btn:active { background: #00ffcc; color: #000; box-shadow: 0 0 25px #00ffcc; transform: scale(0.96); }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; display: none; }
        
        .hud-panel { position: absolute; padding: 12px; font-weight: bold; text-shadow: 0 0 8px currentColor; }
        #hud-top-left { top: 15px; left: 15px; color: #00ffcc; font-size: min(4vw, 16px); }
        #hud-top-right { top: 15px; right: 15px; color: #ff0055; text-align: right; font-size: min(4vw, 16px); }
        
        #hud-center-alert {
            position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%);
            font-size: min(6vw, 26px); font-weight: 900; letter-spacing: 3px; color: #ffff00;
            text-shadow: 0 0 15px #ffff00; text-align: center; opacity: 0; transition: opacity 0.3s;
        }

        #quota-bar-container {
            width: 150px; height: 8px; background: rgba(255, 255, 255, 0.15);
            border: 1px solid #00ffcc; margin-top: 6px; border-radius: 4px; overflow: hidden;
        }
        #quota-bar-fill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.2s ease-out; }

        #health-bar-container {
            width: 140px; height: 10px; background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055; margin-top: 6px; border-radius: 4px; overflow: hidden;
        }
        #health-bar-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.2s ease-out; }

        /* DAMAGE FLASH OVERLAY */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 4;
            pointer-events: none; background: rgba(255, 0, 85, 0); transition: background 0.12s ease;
        }

        /* RETICLE */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 40px; height: 40px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 6;
        }
        #reticle::before, #reticle::after {
            content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 8px #00ffcc;
        }
        #reticle::before { top: 19px; left: 0; width: 40px; height: 2px; }
        #reticle::after { top: 0; left: 19px; width: 2px; height: 40px; }

        /* HIGH SCORES MODAL */
        #high-scores-modal { display: none; z-index: 20; }
        .score-list { margin: 20px 0; text-align: left; width: min(80vw, 320px); font-size: min(4vw, 16px); line-height: 1.8; }
        .score-item { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0, 255, 204, 0.3); }

        .pulse { animation: pulse-anim 1.5s infinite ease-in-out; }
        @keyframes pulse-anim { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>
    <div id="damage-overlay"></div>

    <!-- TITLE SCREEN -->
    <div id="title-screen" class="overlay-screen">
        <h1 class="game-title">POLYWING</h1>
        <div class="subtitle">// IMMERSIVE AERIAL COMBAT</div>
        <button class="btn" onclick="startRun()">BEGIN RUN</button>
        <button class="btn" onclick="showHighScores()">HIGH SCORES</button>
        <div class="pulse" style="margin-top: 25px; font-size: min(3vw, 12px); color: #888;">TOUCH SCREEN FOR FULLSCREEN / GYRO</div>
    </div>

    <!-- HIGH SCORES SCREEN -->
    <div id="high-scores-modal" class="overlay-screen">
        <h1 class="game-title" style="font-size: min(7vw, 30px);">TOP PILOTS</h1>
        <div class="score-list" id="score-list-content"></div>
        <button class="btn" onclick="hideHighScores()">BACK</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 class="game-title" style="color: #ff0055; text-shadow: 0 0 15px #ff0055;">CRAFT DESTROYED</h1>
        <div class="subtitle" id="final-score-text">FINAL SCORE: 0</div>
        <button class="btn" onclick="startRun()">REDEPLOY</button>
        <button class="btn" onclick="returnToTitle()">TITLE</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="reticle"></div>
        <div id="hud-top-left" class="hud-panel">
            <div>SCORE: <span id="score-display">0</span></div>
            <div style="font-size: 11px; margin-top: 4px; color: #aaa;" id="location-display">STARFIELD</div>
            <div id="quota-bar-container"><div id="quota-bar-fill"></div></div>
        </div>
        <div id="hud-top-right" class="hud-panel">
            <div>SHIELD</div>
            <div id="health-bar-container"><div id="health-bar-fill"></div></div>
            <div style="font-size: 11px; margin-top: 4px; color: #ff0055;" id="threat-level-display">THREAT: EASY</div>
        </div>
        <div id="hud-center-alert">SECTOR CLEAR<br><span style="font-size: 14px; color: #fff;">WARPING TO NEXT SECTOR...</span></div>
    </div>

    <script>
        // --- SYNTHESIZED WEB AUDIO SOUND FX ---
        class SoundSynth {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            
            playLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(850, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.1);
            }

            playEnemyLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.14);
            }

            playExplosion() {
                if (!this.ctx) return;
                const bufSize = this.ctx.sampleRate * 0.35, buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buf;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.35);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            }

            playPlayerHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }

            playWarp() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.6);
            }
        }

        const sfx = new SoundSynth();

        // --- IMMERSIVE BIOMES CONFIGURATION ---
        const BIOMES = [
            { name: "ORBITAL STARFIELD", fog: 0x01010a, light: 0x00ffcc, bg: 0x01010a, quota: 8, speed: 1.1, type: "starfield", wallX: 25, wallY: 15 },
            { name: "ASTEROID BELT HABITAT", fog: 0x0f0a14, light: 0xffaa00, bg: 0x0f0a14, quota: 10, speed: 1.2, type: "asteroids", wallX: 22, wallY: 14 },
            { name: "STAR DESTROYER TRENCH", fog: 0x060c14, light: 0x00ffff, bg: 0x060c14, quota: 12, speed: 1.4, type: "trench_tech", wallX: 9, wallY: 5.5 },
            { name: "ATMOSPHERIC APPROACH", fog: 0x021424, light: 0x00ff88, bg: 0x021424, quota: 12, speed: 1.3, type: "planet", wallX: 24, wallY: 15 },
            { name: "CANYON TRENCH RUN", fog: 0x240a02, light: 0xff5500, bg: 0x240a02, quota: 14, speed: 1.5, type: "trench_canyon", wallX: 8.5, wallY: 5 },
            { name: "FOREST HABITAT CANOPY", fog: 0x01240c, light: 0x55ff55, bg: 0x01240c, quota: 14, speed: 1.4, type: "forest", wallX: 9.5, wallY: 6 },
            { name: "DESOLATE OBSIDIAN WASTES", fog: 0x140120, light: 0xaa00ff, bg: 0x140120, quota: 16, speed: 1.6, type: "desolate", wallX: 20, wallY: 12 },
            { name: "BELLY OF THE BEAST", fog: 0x240110, light: 0xff0055, bg: 0x240110, quota: 18, speed: 1.7, type: "belly", wallX: 8, wallY: 5 }
        ];

        // --- GLOBAL ENGINE & GAME STATE ---
        let scene, camera, renderer, playerShip, starParticlesSystem, planetMeshSystem;
        let gameState = "TITLE";
        let score = 0, health = 100, currentBiomeIndex = 0, quotaDefeated = 0;
        let isTransitioning = false, elapsedTime = 0, difficultyLevel = 0.5;
        
        const playerLasers = [], enemyLasers = [], enemies = [], envProps = [], particleExplosions = [];
        let lastShotTime = 0, spawnTimer = 0;

        // Steering / Gyro controls
        let gyroPitch = 0, gyroRoll = 0, initialPitch = null, initialRoll = null;
        let pointerTargetX = 0, pointerTargetY = 0, isTouchDragging = false;
        let previousPointerX = 0, previousPointerY = 0;

        // --- INITIALIZATION ---
        function initEngine() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.fog = new THREE.FogExp2(BIOMES[0].fog, 0.006);
            renderer.setClearColor(BIOMES[0].bg);

            // Ambient + Sun Lights
            const ambient = new THREE.AmbientLight(0xffffff, 0.65);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(10, 30, 20);
            scene.add(sun);

            // Persistent Background Starfield Particles
            buildStarfieldSystem();

            // Background Planet System (for Planet Approach)
            buildApproachingPlanet();

            // Detailed Player Spacecraft Model
            playerShip = buildDetailedPlayerShip();
            playerShip.position.set(0, -1.2, -5);
            scene.add(playerShip);

            setupControls();
            window.addEventListener('resize', onWindowResize);
            
            requestAnimationFrame(animate);
        }

        // --- BACKGROUND STARFIELD ---
        function buildStarfieldSystem() {
            const starGeo = new THREE.BufferGeometry();
            const count = 1000;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 450;
                positions[i+1] = (Math.random() - 0.5) * 450;
                positions[i+2] = -Math.random() * 500;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.2, transparent: true, opacity: 0.85 });
            starParticlesSystem = new THREE.Points(starGeo, starMat);
            scene.add(starParticlesSystem);
        }

        // --- APPROACHING PLANET MESH ---
        function buildApproachingPlanet() {
            planetMeshSystem = new THREE.Group();
            
            const planetGeo = new THREE.IcosahedronGeometry(32, 3);
            const planetMat = new THREE.MeshLambertMaterial({ color: 0x0088ff, flatShading: true });
            const body = new THREE.Mesh(planetGeo, planetMat);
            
            // Low-poly atmosphere ring
            const ringGeo = new THREE.TorusGeometry(46, 1.5, 4, 24);
            const ringMat = new THREE.MeshLambertMaterial({ color: 0x00ffff, flatShading: true });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 3;

            planetMeshSystem.add(body, ring);
            planetMeshSystem.position.set(0, 0, -360);
            planetMeshSystem.visible = false;
            scene.add(planetMeshSystem);
        }

        // --- HIGHLY DETAILED CRAFT BUILDER ---
        function buildDetailedPlayerShip() {
            const ship = new THREE.Group();
            const hullMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, roughness: 0.3, metalness: 0.8, flatShading: true });
            const wingMat = new THREE.MeshStandardMaterial({ color: 0x0a1e28, roughness: 0.4, metalness: 0.6, flatShading: true });
            const accentMat = new THREE.MeshLambertMaterial({ color: 0xff0055, flatShading: true });
            const engineGlow = new THREE.MeshBasicMaterial({ color: 0x00ffff });

            // Nose Fuselage
            const noseGeo = new THREE.ConeGeometry(0.5, 2.6, 6);
            noseGeo.rotateX(Math.PI / 2);
            const nose = new THREE.Mesh(noseGeo, hullMat);
            ship.add(nose);

            // Center Body Frame
            const bodyGeo = new THREE.BoxGeometry(0.8, 0.5, 1.8);
            const body = new THREE.Mesh(bodyGeo, hullMat);
            body.position.z = 0.8;
            ship.add(body);

            // Wireframe Canopy / Cockpit
            const glassGeo = new THREE.SphereGeometry(0.38, 6, 6);
            glassGeo.scale(0.9, 0.7, 1.8);
            const glass = new THREE.Mesh(glassGeo, new THREE.MeshBasicMaterial({ color: 0xffff00, wireframe: true }));
            glass.position.set(0, 0.35, 0.3);
            ship.add(glass);

            // Swept Multi-Layer Wings
            const wingShape = new THREE.Shape();
            wingShape.moveTo(0, 0); wingShape.lineTo(2.4, -1.2); wingShape.lineTo(2.2, -1.8); wingShape.lineTo(0, -0.9);
            const wingGeo = new THREE.ExtrudeGeometry(wingShape, { depth: 0.08, bevelEnabled: true, bevelThickness: 0.04, bevelSize: 0.04 });
            wingGeo.rotateX(Math.PI / 2);

            const wingR = new THREE.Mesh(wingGeo, wingMat);
            wingR.position.set(0.3, 0, 0.6);
            const wingL = new THREE.Mesh(wingGeo, wingMat);
            wingL.scale.set(-1, 1, 1);
            wingL.position.set(-0.3, 0, 0.6);
            ship.add(wingR, wingL);

            // Vertical Stabilizers
            const finGeo = new THREE.ConeGeometry(0.3, 1.2, 4);
            finGeo.rotateX(-0.4);
            const finL = new THREE.Mesh(finGeo, accentMat);
            finL.position.set(-0.6, 0.6, 1.2);
            finL.rotation.z = -0.3;
            const finR = finL.clone();
            finR.position.x = 0.6;
            finR.rotation.z = 0.3;
            ship.add(finL, finR);

            // Twin Wingtip Lasers
            const cannonGeo = new THREE.CylinderGeometry(0.06, 0.06, 1.4, 6);
            cannonGeo.rotateX(Math.PI / 2);
            const cannonR = new THREE.Mesh(cannonGeo, accentMat);
            cannonR.position.set(2.4, -0.05, -0.2);
            const cannonL = cannonR.clone();
            cannonL.position.x = -2.4;
            ship.add(cannonR, cannonL);

            // Engine Thrusters
            const engineGeo = new THREE.CylinderGeometry(0.22, 0.12, 0.9, 8);
            engineGeo.rotateX(Math.PI / 2);
            const engine1 = new THREE.Mesh(engineGeo, hullMat);
            engine1.position.set(-0.35, -0.1, 1.6);
            const engine2 = engine1.clone();
            engine2.position.x = 0.35;
            
            const plumeGeo = new THREE.ConeGeometry(0.18, 0.8, 8);
            plumeGeo.rotateX(-Math.PI / 2);
            const plume1 = new THREE.Mesh(plumeGeo, engineGlow);
            plume1.position.set(0, 0, 0.7);
            const plume2 = plume1.clone();
            engine1.add(plume1); engine2.add(plume2);
            ship.add(engine1, engine2);

            return ship;
        }

        // --- LOCATION-SPECIFIC ENEMY BUILDER ---
        function createLocationEnemy(biomeIdx) {
            const group = new THREE.Group();
            const matA = new THREE.MeshLambertMaterial({ color: 0xff0055, flatShading: true });
            const matB = new THREE.MeshLambertMaterial({ color: 0xffff00, flatShading: true });
            const matC = new THREE.MeshLambertMaterial({ color: 0x00ffcc, flatShading: true });

            switch(biomeIdx) {
                case 0: // Starfield: Orbital Sentry
                    const ring = new THREE.Mesh(new THREE.TorusGeometry(1.2, 0.15, 6, 12), matA);
                    const eye = new THREE.Mesh(new THREE.SphereGeometry(0.6, 8, 8), matB);
                    group.add(ring, eye);
                    break;
                case 1: // Asteroid: Scraptrap Harvester
                    const body = new THREE.Mesh(new THREE.DodecahedronGeometry(1.0), matB);
                    const drill = new THREE.Mesh(new THREE.ConeGeometry(0.6, 1.8, 6), matA);
                    drill.rotation.x = -Math.PI / 2; drill.position.z = -1.2;
                    group.add(body, drill);
                    break;
                case 2: // Star Destroyer Trench: Imperial Twin-Wing Skimmer
                    const pod = new THREE.Mesh(new THREE.SphereGeometry(0.6, 6, 6), matA);
                    const panelL = new THREE.Mesh(new THREE.BoxGeometry(0.1, 2.0, 1.2), matC);
                    panelL.position.x = -1.0;
                    const panelR = panelL.clone(); panelR.position.x = 1.0;
                    group.add(pod, panelL, panelR);
                    break;
                case 3: // Planet Approach: Aero Jet Interceptor
                    const jetBody = new THREE.Mesh(new THREE.ConeGeometry(0.5, 2.2, 5), matA);
                    jetBody.rotation.x = Math.PI / 2;
                    const deltaWing = new THREE.Mesh(new THREE.BoxGeometry(2.8, 0.08, 1.0), matB);
                    group.add(jetBody, deltaWing);
                    break;
                case 4: // Canyon: Hover Skim-Tank
                    const chassis = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.5, 1.6), matB);
                    const turret = new THREE.Mesh(new THREE.OctahedronGeometry(0.6), matA);
                    turret.position.y = 0.5;
                    group.add(chassis, turret);
                    break;
                case 5: // Forest: Hive Swarmer
                    const thorax = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7), matA);
                    const wing1 = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.6, 3), matC);
                    wing1.rotation.z = Math.PI / 3; wing1.position.x = -0.8;
                    const wing2 = wing1.clone(); wing2.scale.x = -1; wing2.position.x = 0.8;
                    group.add(thorax, wing1, wing2);
                    break;
                case 6: // Desolate Wastes: Crystal Sentinel
                    const crystal = new THREE.Mesh(new THREE.OctahedronGeometry(1.2), matC);
                    crystal.scale.set(0.6, 2.0, 0.6);
                    group.add(crystal);
                    break;
                case 7: // Belly of Beast: Bio Parasite Pod
                    const podCore = new THREE.Mesh(new THREE.SphereGeometry(0.9, 8, 8), matA);
                    for(let i = 0; i < 4; i++) {
                        const spike = new THREE.Mesh(new THREE.ConeGeometry(0.15, 1.4, 4), matB);
                        spike.rotation.z = (i * Math.PI) / 2;
                        group.add(spike);
                    }
                    group.add(podCore);
                    break;
            }
            return group;
        }

        // --- HIGHLY IMMERSIVE ENVIRONMENT SCENERY SPAWNER ---
        function buildEnvironmentProp(biomeIdx) {
            const prop = new THREE.Group();
            const zPos = -240;
            const currentBiome = BIOMES[biomeIdx];

            if (currentBiome.type === "trench_tech") {
                // STAR DESTROYER TRENCH: Metallic floor, left/right walls, greeble conduits
                const wallX = currentBiome.wallX;
                const wallY = currentBiome.wallY;

                // Trench Floor
                const floor = new THREE.Mesh(new THREE.BoxGeometry(wallX * 2 + 4, 1, 40), new THREE.MeshLambertMaterial({ color: 0x0d121c, flatShading: true }));
                floor.position.set(0, -wallY, zPos);
                
                // Left & Right Metallic Walls
                const wallL = new THREE.Mesh(new THREE.BoxGeometry(2, wallY * 2.5, 40), new THREE.MeshLambertMaterial({ color: 0x161e2e, flatShading: true }));
                wallL.position.set(-wallX - 1, 0, zPos);
                const wallR = wallL.clone(); wallR.position.x = wallX + 1;

                // Overhead Turret / Conduit Beams
                const beam = new THREE.Mesh(new THREE.BoxGeometry(wallX * 2, 0.8, 1.5), new THREE.MeshLambertMaterial({ color: 0x00ffff, flatShading: true }));
                beam.position.set(0, wallY, zPos);

                prop.add(floor, wallL, wallR, beam);
            } 
            else if (currentBiome.type === "trench_canyon") {
                // CANYON TRENCH: Jagged reddish walls + rocky floor
                const wallX = currentBiome.wallX;
                const wallY = currentBiome.wallY;

                const floor = new THREE.Mesh(new THREE.BoxGeometry(wallX * 2 + 8, 1, 40), new THREE.MeshLambertMaterial({ color: 0x3d1408, flatShading: true }));
                floor.position.set(0, -wallY, zPos);

                const wallL = new THREE.Mesh(new THREE.BoxGeometry(6, wallY * 3, 40), new THREE.MeshLambertMaterial({ color: 0x5e200d, flatShading: true }));
                wallL.position.set(-wallX - 3, 0, zPos);
                const wallR = wallL.clone(); wallR.position.x = wallX + 3;

                prop.add(floor, wallL, wallR);
            } 
            else if (currentBiome.type === "forest") {
                // FOREST: Grass/Dirt floor + walls of polygonal pine/canopy trees
                const wallX = currentBiome.wallX;
                const wallY = currentBiome.wallY;

                // Dirt/Grass Ground Floor
                const floor = new THREE.Mesh(new THREE.BoxGeometry(wallX * 2.5, 1, 40), new THREE.MeshLambertMaterial({ color: 0x1c3811, flatShading: true }));
                floor.position.set(0, -wallY, zPos);

                // Tree Walls (Left & Right Clusters)
                const treeMat = new THREE.MeshLambertMaterial({ color: 0x0d521f, flatShading: true });
                const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3d2511, flatShading: true });

                for(let side of [-1, 1]) {
                    for(let t = 0; t < 4; t++) {
                        const treeGroup = new THREE.Group();
                        const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 4, 5), trunkMat);
                        const canopy = new THREE.Mesh(new THREE.ConeGeometry(2.5, 9, 5), treeMat);
                        canopy.position.y = 5;
                        treeGroup.add(trunk, canopy);
                        treeGroup.position.set((wallX + 1 + Math.random() * 6) * side, -wallY + 2, (t - 2) * 10);
                        prop.add(treeGroup);
                    }
                }
                prop.add(floor);
            }
            else if (currentBiome.type === "asteroids") {
                // ASTEROID BELT: Multiple floating/spinning space rocks surrounding player path
                const rockMat = new THREE.MeshLambertMaterial({ color: 0x5a4d66, flatShading: true });
                for(let i = 0; i < 4; i++) {
                    const ast = new THREE.Mesh(new THREE.DodecahedronGeometry(2 + Math.random() * 4, 1), rockMat);
                    ast.position.set((Math.random() - 0.5) * 55, (Math.random() - 0.5) * 35, (Math.random() - 0.5) * 30);
                    prop.add(ast);
                }
            }
            else if (currentBiome.type === "belly") {
                // BELLY OF THE BEAST: Fleshy tunnel rib cage arches
                const ribMat = new THREE.MeshLambertMaterial({ color: 0xff0055, flatShading: true });
                const rib = new THREE.Mesh(new THREE.TorusGeometry(12, 1.2, 5, 12, Math.PI), ribMat);
                rib.position.set(0, -6, zPos);
                prop.add(rib);
            }
            else if (currentBiome.type === "desolate") {
                // DESOLATE WASTES: Sharp obsidian mountain peaks
                const obsMat = new THREE.MeshLambertMaterial({ color: 0x220033, flatShading: true });
                const peakL = new THREE.Mesh(new THREE.ConeGeometry(6, 25, 4), obsMat);
                peakL.position.set(-22, -8, zPos);
                const peakR = peakL.clone(); peakR.position.x = 22;
                prop.add(peakL, peakR);
            }
            else {
                // STARFIELD / DEFAULT: Orbital Satellites & Space Debris
                const satMat = new THREE.MeshLambertMaterial({ color: 0x00ffcc, flatShading: true });
                const sat = new THREE.Mesh(new THREE.OctahedronGeometry(2), satMat);
                sat.position.set((Math.random() - 0.5) * 60, (Math.random() - 0.5) * 40, zPos);
                prop.add(sat);
            }

            prop.position.z = zPos;
            scene.add(prop);
            envProps.push(prop);
        }

        // --- CONTROLS SETUP ---
        function setupControls() {
            function handleOrientation(e) {
                if (e.beta === null || e.gamma === null) return;
                if (initialPitch === null) { initialPitch = e.beta; initialRoll = e.gamma; }
                gyroPitch = (e.beta - initialPitch) * 0.045;
                gyroRoll = (e.gamma - initialRoll) * 0.045;
            }

            if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            else window.addEventListener('deviceorientation', handleOrientation, true);

            window.addEventListener('pointerdown', (e) => {
                isTouchDragging = true; previousPointerX = e.clientX; previousPointerY = e.clientY;
            });
            window.addEventListener('pointermove', (e) => {
                if (!isTouchDragging) return;
                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                
                const currentBiome = BIOMES[currentBiomeIndex];
                pointerTargetX += deltaX * 0.035;
                pointerTargetY -= deltaY * 0.035;
                pointerTargetX = Math.max(-currentBiome.wallX + 1.2, Math.min(currentBiome.wallX - 1.2, pointerTargetX));
                pointerTargetY = Math.max(-currentBiome.wallY + 1.0, Math.min(currentBiome.wallY - 1.0, pointerTargetY));
            });
            window.addEventListener('pointerup', () => { isTouchDragging = false; });
        }

        // --- GAME STATE & LOOP ---
        function startRun() {
            sfx.init();
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            }
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission();
            }

            score = 0; health = 100; quotaDefeated = 0; currentBiomeIndex = 0; elapsedTime = 0; difficultyLevel = 0.5;
            updateBiomeVisuals();

            // Clear Scene Objects
            enemies.forEach(e => scene.remove(e.mesh)); enemies.length = 0;
            playerLasers.forEach(l => scene.remove(l.mesh)); playerLasers.length = 0;
            enemyLasers.forEach(el => scene.remove(el.mesh)); enemyLasers.length = 0;
            envProps.forEach(p => scene.remove(p)); envProps.length = 0;

            document.getElementById('title-screen').style.display = 'none';
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('high-scores-modal').style.display = 'none';
            document.getElementById('hud').style.display = 'block';

            gameState = "PLAYING";
            updateHUD();
        }

        function updateBiomeVisuals() {
            const b = BIOMES[currentBiomeIndex];
            scene.fog.color.setHex(b.fog);
            renderer.setClearColor(b.bg);
            document.getElementById('location-display').innerText = b.name;

            // Handle Planet Approach Visual State
            if (b.type === "planet") {
                planetMeshSystem.visible = true;
                planetMeshSystem.position.z = -360;
                planetMeshSystem.scale.set(1, 1, 1);
            } else {
                planetMeshSystem.visible = false;
            }
        }

        function animate(time) {
            requestAnimationFrame(animate);

            if (gameState === "PLAYING") {
                elapsedTime += 0.016;
                // Gradual difficulty scaling: Starts easy, scales slowly over time and stage progression
                difficultyLevel = 0.5 + (elapsedTime / 40) + (currentBiomeIndex * 0.25);
                
                const threatLabel = difficultyLevel < 1.2 ? "EASY" : (difficultyLevel < 2.0 ? "MEDIUM" : (difficultyLevel < 3.0 ? "HARD" : "EXTREME"));
                document.getElementById('threat-level-display').innerText = "THREAT: " + threatLabel;

                const currentBiome = BIOMES[currentBiomeIndex];
                const speed = currentBiome.speed;

                // Move Stars for Space Motion Feeling
                if (starParticlesSystem) {
                    starParticlesSystem.rotation.z += 0.0005;
                }

                // Planet Approach Scale Up Effect
                if (currentBiome.type === "planet" && planetMeshSystem.visible) {
                    const quotaPct = quotaDefeated / currentBiome.quota;
                    const approachZ = -360 + quotaPct * 160;
                    planetMeshSystem.position.z += (approachZ - planetMeshSystem.position.z) * 0.05;
                    planetMeshSystem.rotation.y += 0.002;
                }

                // --- 1. CRAFT STEERING & TIGHT CORRIDOR BOUNDS ---
                let targetX = pointerTargetX + gyroRoll * 7.0;
                let targetY = pointerTargetY - gyroPitch * 5.0;

                // Enforce Corridor Walls
                const limitX = currentBiome.wallX - 1.5;
                const limitY = currentBiome.wallY - 1.2;
                targetX = Math.max(-limitX, Math.min(limitX, targetX));
                targetY = Math.max(-limitY, Math.min(limitY, targetY));

                playerShip.position.x += (targetX - playerShip.position.x) * 0.12;
                playerShip.position.y += (targetY - playerShip.position.y) * 0.12;
                
                // Roll/Pitch Visual Banking
                playerShip.rotation.z = -(targetX - playerShip.position.x) * 0.35;
                playerShip.rotation.x = (targetY - playerShip.position.y) * 0.2;

                // --- 2. AUTO FIRE PLAYER LASERS ---
                if (time - lastShotTime > 130) {
                    firePlayerLaser();
                    lastShotTime = time;
                }

                // --- 3. SPAWN ENEMIES & CORRIDOR PROPS ---
                spawnTimer++;
                if (spawnTimer % 20 === 0) buildEnvironmentProp(currentBiomeIndex);
                
                // Enemy max simultaneous count ramps gently with difficulty
                const maxEnemies = Math.min(10, Math.floor(3 + difficultyLevel * 2));
                const spawnInterval = Math.max(25, Math.floor(65 - difficultyLevel * 8));
                if (spawnTimer % spawnInterval === 0 && enemies.length < maxEnemies) {
                    spawnEnemy();
                }

                // --- 4. UPDATE PLAYER LASERS ---
                for (let i = playerLasers.length - 1; i >= 0; i--) {
                    const l = playerLasers[i];
                    l.mesh.position.z -= 4.0;
                    if (l.mesh.position.z < -240) {
                        scene.remove(l.mesh); playerLasers.splice(i, 1);
                    }
                }

                // --- 5. UPDATE ENEMY LASERS (ENEMIES FIRING BACK) ---
                for (let i = enemyLasers.length - 1; i >= 0; i--) {
                    const el = enemyLasers[i];
                    el.mesh.position.addScaledVector(el.dir, el.speed);

                    // Collision check with Player
                    if (el.mesh.position.distanceTo(playerShip.position) < 1.6) {
                        scene.remove(el.mesh); enemyLasers.splice(i, 1);
                        triggerPlayerDamage(6 + Math.floor(difficultyLevel * 2)); // Easy damage early
                        continue;
                    }

                    if (el.mesh.position.z > 10) {
                        scene.remove(el.mesh); enemyLasers.splice(i, 1);
                    }
                }

                // --- 6. UPDATE ENVIRONMENT SCENERY ---
                for (let i = envProps.length - 1; i >= 0; i--) {
                    const p = envProps[i];
                    p.position.z += speed * 1.3;
                    if (p.position.z > 15) {
                        scene.remove(p); envProps.splice(i, 1);
                    }
                }

                // --- 7. UPDATE ENEMIES & ENEMY AI SHOOTING ---
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.mesh.position.z += speed * 0.65;
                    e.mesh.rotation.x += 0.02; e.mesh.rotation.y += 0.03;

                    // Enemy firing frequency starts slow, ramps up with difficulty
                    if (time - e.lastFireTime > e.fireInterval) {
                        fireEnemyLaser(e);
                        e.lastFireTime = time;
                    }

                    // Check Player Laser Hits Enemy
                    for (let j = playerLasers.length - 1; j >= 0; j--) {
                        const l = playerLasers[j];
                        if (l.mesh.position.distanceTo(e.mesh.position) < 2.2) {
                            createExplosion(e.mesh.position);
                            scene.remove(e.mesh); enemies.splice(i, 1);
                            scene.remove(l.mesh); playerLasers.splice(j, 1);
                            
                            score += 150;
                            quotaDefeated++;
                            sfx.playExplosion();
                            checkQuotaProgress();
                            updateHUD();
                            break;
                        }
                    }

                    // Check Enemy Collision With Player Ship
                    if (e && e.mesh.position.distanceTo(playerShip.position) < 1.8) {
                        createExplosion(e.mesh.position);
                        scene.remove(e.mesh); enemies.splice(i, 1);
                        triggerPlayerDamage(15);
                    } else if (e && e.mesh.position.z > 5) {
                        scene.remove(e.mesh); enemies.splice(i, 1);
                    }
                }

                // --- 8. UPDATE EXPLOSIONS ---
                for (let i = particleExplosions.length - 1; i >= 0; i--) {
                    const p = particleExplosions[i];
                    p.mesh.position.add(p.vel);
                    p.mesh.scale.multiplyScalar(0.91);
                    if (p.mesh.scale.x < 0.04) {
                        scene.remove(p.mesh); particleExplosions.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function firePlayerLaser() {
            const geo = new THREE.CylinderGeometry(0.08, 0.08, 1.8);
            const mat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });
            const laserL = new THREE.Mesh(geo, mat); laserL.rotation.x = Math.PI / 2;
            const laserR = laserL.clone();

            laserL.position.set(playerShip.position.x - 2.2, playerShip.position.y, playerShip.position.z - 1);
            laserR.position.set(playerShip.position.x + 2.2, playerShip.position.y, playerShip.position.z - 1);

            scene.add(laserL, laserR);
            playerLasers.push({ mesh: laserL }, { mesh: laserR });
            sfx.playLaser();
        }

        function fireEnemyLaser(enemy) {
            const geo = new THREE.CylinderGeometry(0.12, 0.12, 2.2, 6);
            geo.rotateX(Math.PI / 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const laser = new THREE.Mesh(geo, mat);
            laser.position.copy(enemy.mesh.position);

            // Aim towards player ship position
            const dir = new THREE.Vector3().subVectors(playerShip.position, enemy.mesh.position).normalize();
            const shotSpeed = 1.1 + difficultyLevel * 0.25;

            scene.add(laser);
            enemyLasers.push({ mesh: laser, dir: dir, speed: shotSpeed });
            sfx.playEnemyLaser();
        }

        function spawnEnemy() {
            const enemyMesh = createLocationEnemy(currentBiomeIndex);
            const currentBiome = BIOMES[currentBiomeIndex];
            
            enemyMesh.position.set(
                (Math.random() - 0.5) * (currentBiome.wallX * 1.4),
                (Math.random() - 0.5) * (currentBiome.wallY * 1.3),
                -180
            );

            // Enemy shoot delay starts at ~4.5s (very easy) and scales down gradually to ~1.2s
            const fireInterval = Math.max(1200, 4500 - difficultyLevel * 450 + Math.random() * 600);

            scene.add(enemyMesh);
            enemies.push({ mesh: enemyMesh, lastFireTime: performance.now(), fireInterval: fireInterval });
        }

        function createExplosion(pos) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            for (let i = 0; i < 9; i++) {
                const p = new THREE.Mesh(new THREE.TetrahedronGeometry(0.45), mat);
                p.position.copy(pos);
                const vel = new THREE.Vector3((Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.7);
                scene.add(p);
                particleExplosions.push({ mesh: p, vel: vel });
            }
        }

        function triggerPlayerDamage(amount) {
            health -= amount;
            sfx.playPlayerHit();
            
            const overlay = document.getElementById('damage-overlay');
            overlay.style.background = 'rgba(255, 0, 85, 0.45)';
            setTimeout(() => overlay.style.background = 'rgba(255, 0, 85, 0)', 120);

            updateHUD();
            if (health <= 0) triggerGameOver();
        }

        function checkQuotaProgress() {
            const targetQuota = BIOMES[currentBiomeIndex].quota;
            if (quotaDefeated >= targetQuota && !isTransitioning) {
                isTransitioning = true;
                sfx.playWarp();
                
                const alertEl = document.getElementById('hud-center-alert');
                alertEl.style.opacity = '1';

                setTimeout(() => {
                    quotaDefeated = 0;
                    currentBiomeIndex = (currentBiomeIndex + 1) % BIOMES.length;
                    updateBiomeVisuals();
                    alertEl.style.opacity = '0';
                    isTransitioning = false;
                    updateHUD();
                }, 1600);
            }
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('health-bar-fill').style.width = Math.max(0, health) + '%';
            
            const targetQuota = BIOMES[currentBiomeIndex].quota;
            const pct = Math.min(100, (quotaDefeated / targetQuota) * 100);
            document.getElementById('quota-bar-fill').style.width = pct + '%';
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            saveHighScore(score);
            document.getElementById('hud').style.display = 'none';
            document.getElementById('final-score-text').innerText = "FINAL SCORE: " + score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function returnToTitle() {
            gameState = "TITLE";
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('title-screen').style.display = 'flex';
        }

        // --- HIGH SCORES LOCALSTORAGE ---
        function getHighScores() {
            return JSON.parse(localStorage.getItem('POLYWING_HIGH_SCORES') || '[8500, 6000, 4200, 2500, 1000]');
        }

        function saveHighScore(newScore) {
            let scores = getHighScores();
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            localStorage.setItem('POLYWING_HIGH_SCORES', JSON.stringify(scores));
        }

        function showHighScores() {
            const scores = getHighScores();
            const container = document.getElementById('score-list-content');
            container.innerHTML = scores.map((s, i) => `<div class="score-item"><span>RANK 0${i+1}</span><span>${s} PTS</span></div>`).join('');
            document.getElementById('high-scores-modal').style.display = 'flex';
        }

        function hideHighScores() {
            document.getElementById('high-scores-modal').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initEngine);
    </script>
</body>
