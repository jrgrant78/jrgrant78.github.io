<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>POLYWING: DELIBERATE FLIGHT PATHS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #00ffcc; }
        
        #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: block; touch-action: none; }
        
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(2, 2, 8, 0.92); text-align: center; padding: 20px; transition: opacity 0.5s ease;
        }

        h1.game-title {
            font-size: min(10vw, 44px); font-weight: 900; letter-spacing: 6px; color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc, 0 0 35px #00ffcc; margin-bottom: 5px;
        }
        
        .subtitle { font-size: min(3.5vw, 13px); letter-spacing: 3px; color: #ff0055; margin-bottom: 30px; text-shadow: 0 0 10px #ff0055; }

        .btn {
            background: rgba(0, 255, 204, 0.12); border: 2px solid #00ffcc; color: #00ffcc;
            padding: 14px 28px; margin: 8px; font-size: min(4vw, 18px); font-weight: bold;
            letter-spacing: 2px; font-family: inherit; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); transition: all 0.2s ease; outline: none;
            width: min(80vw, 280px);
        }
        .btn:active { background: #00ffcc; color: #000; box-shadow: 0 0 25px #00ffcc; transform: scale(0.96); }

        #hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; display: none; }
        
        .hud-panel { position: absolute; padding: 12px; font-weight: bold; text-shadow: 0 0 8px currentColor; }
        #hud-top-left { top: 15px; left: 15px; color: #00ffcc; font-size: min(3.8vw, 15px); }
        #hud-top-right { top: 15px; right: 15px; color: #ff0055; text-align: right; font-size: min(3.8vw, 15px); }
        
        #hud-center-alert {
            position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%);
            font-size: min(6vw, 26px); font-weight: 900; letter-spacing: 3px; color: #ffff00;
            text-shadow: 0 0 15px #ffff00; text-align: center; opacity: 0; transition: opacity 0.5s ease;
        }

        #powerup-popup {
            position: absolute; bottom: 22%; left: 50%; transform: translateX(-50%);
            font-size: min(5vw, 22px); font-weight: 900; letter-spacing: 2px; color: #00ffff;
            text-shadow: 0 0 16px #00ffff; text-align: center; opacity: 0; transition: opacity 0.3s ease;
            white-space: nowrap; pointer-events: none;
        }

        #boss-hud-container {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            width: min(70vw, 360px); text-align: center; opacity: 0; transition: opacity 0.4s ease;
        }
        #boss-name { font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 4px; }
        #boss-bar-bg { width: 100%; height: 12px; background: rgba(255, 0, 85, 0.2); border: 2px solid #ff0055; border-radius: 4px; overflow: hidden; }
        #boss-bar-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.15s linear; box-shadow: 0 0 12px #ff0055; }

        #quota-bar-container {
            width: 150px; height: 8px; background: rgba(255, 255, 255, 0.15);
            border: 1px solid #00ffcc; margin-top: 6px; border-radius: 4px; overflow: hidden;
        }
        #quota-bar-fill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.2s ease-out; }

        #health-bar-container {
            width: 140px; height: 10px; background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055; margin-top: 6px; border-radius: 4px; overflow: hidden;
        }
        #health-bar-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.2s ease-out; }

        #right-touch-zone {
            position: absolute; right: 0; top: 0; width: 50vw; height: 100vh;
            border-left: 1px dashed rgba(0, 255, 204, 0.15); pointer-events: none;
        }

        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 4;
            pointer-events: none; background: rgba(255, 0, 85, 0); transition: background 0.12s ease;
        }

        #reticle {
            position: absolute; top: 50%; left: 50%; width: 44px; height: 40px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 6;
            will-change: top, left;
        }
        #reticle::before, #reticle::after {
            content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 10px #00ffcc;
        }
        #reticle::before { top: 19px; left: 0; width: 44px; height: 2px; }
        #reticle::after { top: 0; left: 21px; width: 2px; height: 40px; }

        #high-scores-modal { display: none; z-index: 20; }
        .score-list { margin: 20px 0; text-align: left; width: min(80vw, 320px); font-size: min(4vw, 16px); line-height: 1.8; }
        .score-item { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0, 255, 204, 0.3); }

        .pulse { animation: pulse-anim 1.5s infinite ease-in-out; }
        @keyframes pulse-anim { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>
    <div id="damage-overlay"></div>

    <div id="title-screen" class="overlay-screen">
        <h1 class="game-title">POLYWING</h1>
        <div class="subtitle">// STAR DESTROYER TRENCH RUN</div>
        <button class="btn" onclick="startRun()">BEGIN RUN</button>
        <button class="btn" onclick="showHighScores()">HIGH SCORES</button>
        <div class="pulse" style="margin-top: 25px; font-size: min(3vw, 12px); color: #888;">HOLD RIGHT SCREEN TO FIRE CANNONS</div>
    </div>

    <div id="high-scores-modal" class="overlay-screen">
        <h1 class="game-title" style="font-size: min(7vw, 30px);">TOP PILOTS</h1>
        <div class="score-list" id="score-list-content"></div>
        <button class="btn" onclick="hideHighScores()">BACK</button>
    </div>

    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 class="game-title" style="color: #ff0055; text-shadow: 0 0 15px #ff0055;">CRAFT DESTROYED</h1>
        <div class="subtitle" id="final-score-text">FINAL SCORE: 0</div>
        <button class="btn" onclick="startRun()">REDEPLOY</button>
        <button class="btn" onclick="returnToTitle()">TITLE</button>
    </div>

    <div id="hud">
        <div id="reticle"></div>
        <div id="right-touch-zone"></div>
        <div id="powerup-popup">MAX SHIELDS +25</div>
        
        <div id="boss-hud-container">
            <div id="boss-name">IMPERIAL DREADNOUGHT</div>
            <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
        </div>

        <div id="hud-top-left" class="hud-panel">
            <div>SCORE: <span id="score-display">0</span></div>
            <div style="font-size: 11px; margin-top: 4px; color: #aaa;" id="location-display">TRENCH SECTOR 01</div>
            <div id="quota-bar-container"><div id="quota-bar-fill"></div></div>
            <div style="font-size: 11px; margin-top: 6px; color: #00ffcc;" id="weapon-display">WEAPON: PLASMA [LVL 1]</div>
            <div style="font-size: 11px; margin-top: 2px; color: #bd00ff;" id="missile-display">MISSILES: 0</div>
        </div>
        <div id="hud-top-right" class="hud-panel">
            <div>SHIELD</div>
            <div id="health-bar-container"><div id="health-bar-fill"></div></div>
            <div style="font-size: 11px; margin-top: 4px; color: #ff0055;" id="threat-level-display">THREAT: EASY</div>
        </div>
        <div id="hud-center-alert">WARNING: BOSS ENGAGED</div>
    </div>

    <script>
        class SoundSynth {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            
            playLaser(type = "PLASMA") {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                if (type === "BEAM") {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                } else if (type === "SPREAD") {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.14);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(850, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                }
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            }

            playMissileLaunch() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);
                osc.frequency.setValueAtTime(1320, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }

            playEnemyLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.14);
            }

            playExplosion(isBoss = false) {
                if (!this.ctx) return;
                const duration = isBoss ? 1.2 : 0.6;
                const bufSize = this.ctx.sampleRate * duration;
                const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) {
                    data[i] = (Math.random() * 2 - 1);
                }
                
                const noise = this.ctx.createBufferSource();
                noise.buffer = buf;

                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(isBoss ? 1200 : 950, this.ctx.currentTime);
                filter.frequency.exponentialRampToValueAtTime(25, this.ctx.currentTime + duration);

                const gain = this.ctx.createGain();
                const initialVolume = isBoss ? 0.9 : 0.65;
                gain.gain.setValueAtTime(initialVolume, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);

                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start();

                const subOsc = this.ctx.createOscillator();
                const subGain = this.ctx.createGain();
                subOsc.type = 'sawtooth';
                subOsc.frequency.setValueAtTime(isBoss ? 220 : 160, this.ctx.currentTime);
                subOsc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + (isBoss ? 0.8 : 0.45));

                subGain.gain.setValueAtTime(isBoss ? 0.85 : 0.6, this.ctx.currentTime);
                subGain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + (isBoss ? 0.8 : 0.45));

                const subFilter = this.ctx.createBiquadFilter();
                subFilter.type = 'lowpass';
                subFilter.frequency.setValueAtTime(250, this.ctx.currentTime);

                subOsc.connect(subFilter);
                subFilter.connect(subGain);
                subGain.connect(this.ctx.destination);
                subOsc.start();
                subOsc.stop(this.ctx.currentTime + duration);
            }

            playPlayerHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }

            playWarp() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.6);
            }
        }

        const sfx = new SoundSynth();

        const BOSS_TYPES = [
            { name: "IMPERIAL EXECUTIONER TIE", hp: 80, bossType: 0 },
            { name: "GROUND FORTRESS TURRET ARRAY", hp: 130, bossType: 1 },
            { name: "STAR DESTROYER COMMAND CORE", hp: 190, bossType: 2 }
        ];

        const POWERUP_TYPES = [
            { id: "HEALTH", label: "+30 SHIELD REPAIR", color: 0x00ff66 },
            { id: "MAX_HP", label: "MAX SHIELD EXPANDED (+25)", color: 0xffff00 },
            { id: "SPREAD", label: "CANNON SPREAD UPGRADED", color: 0x00ffff },
            { id: "TEMP_SHIELD", label: "INVULNERABLE SHIELD ACTIVATED", color: 0x0088ff },
            { id: "WEAPON_SWAP", label: "PRIMARY WEAPON MODIFIED", color: 0xff00ff },
            { id: "HOMING_MISSILE", label: "+1 HOMING MISSILE POD", color: 0xbd00ff }
        ];

        // --- GLOBAL ENGINE & GAME STATE ---
        let scene, camera, renderer, playerShip, starParticlesSystem, planetMeshSystem, warpTunnelSystem, shieldBubbleMesh;
        let extraCannonsGroup = null, missilePodsGroup = null;
        let popupTimer = null;
        let gameState = "TITLE";
        let score = 0, health = 100, maxHealth = 100, quotaDefeated = 0, targetQuota = 35;
        let sectorLevel = 1, isTransitioning = false, elapsedTime = 0, difficultyLevel = 0.5;

        // PLAYER ARSENAL & POWERUP STATES
        let activeWeaponType = "PLASMA";
        let cannonSpreadLevel = 1;
        let tempShieldTimer = 0;
        let missileCount = 0;
        let lastMissileFireTime = 0;
        let isRightSideFiring = false;

        let currentBoss = null;

        const corridorSegments = [];
        const NUM_CORRIDOR_SEGMENTS = 12;
        const SEGMENT_LENGTH = 22;
        const TRENCH_FLOOR_Y = -5.0;

        const playerLasers = [], enemyLasers = [], enemies = [], groundTurrets = [], tallBuildings = [], particleExplosions = [], powerUps = [], activeMissiles = [];
        let lastShotTime = 0, spawnTimer = 0;

        const currentAimWorldPoint = new THREE.Vector3(0, 0, -80);

        let gyroPitch = 0, gyroRoll = 0, initialPitch = null, initialRoll = null;
        let reticleAimX = 0, reticleAimY = 0;
        let pointerTargetX = 0, pointerTargetY = 0, isTouchDragging = false;
        let previousPointerX = 0, previousPointerY = 0;

        function keepAboveTerrain(object3D, minY = -2.5) {
            let safeY = minY;
            for (let i = 0; i < tallBuildings.length; i++) {
                const bbox = tallBuildings[i].bbox;
                if (object3D.position.x >= bbox.min.x - 1.8 && object3D.position.x <= bbox.max.x + 1.8 &&
                    object3D.position.z >= bbox.min.z - 2.5 && object3D.position.z <= bbox.max.z + 2.5) {
                    safeY = Math.max(safeY, bbox.max.y + 1.8);
                }
            }
            if (object3D.position.y < safeY) {
                object3D.position.y = safeY;
            }
        }

        function initEngine() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            const fogColor = 0x060c14;
            scene.fog = new THREE.FogExp2(fogColor, 0.0055);
            renderer.setClearColor(fogColor);

            const ambient = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.3);
            sun.position.set(10, 40, 20);
            scene.add(sun);

            buildStarfieldSystem();
            buildApproachingPlanet();
            buildWarpTunnel();

            playerShip = buildDetailedPlayerShip();
            playerShip.position.set(0, -1.0, -5);
            scene.add(playerShip);

            const shieldGeo = new THREE.IcosahedronGeometry(3.2, 2);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true, transparent: true, opacity: 0 });
            shieldBubbleMesh = new THREE.Mesh(shieldGeo, shieldMat);
            playerShip.add(shieldBubbleMesh);

            buildContinuousFloorSegments();

            setupControls();
            window.addEventListener('resize', onWindowResize);
            
            requestAnimationFrame(animate);
        }

        function createGreebleFloorSurfaceGroup(panelWidth, panelThickness, length) {
            const group = new THREE.Group();
            
            const baseMat = new THREE.MeshLambertMaterial({ color: 0x101726, flatShading: true });
            const blockMatA = new THREE.MeshLambertMaterial({ color: 0x1c283c, flatShading: true });
            const blockMatB = new THREE.MeshLambertMaterial({ color: 0x0b111a, flatShading: true });
            const pipeMat = new THREE.MeshLambertMaterial({ color: 0x00ffff, flatShading: true });

            const base = new THREE.Mesh(new THREE.BoxGeometry(panelWidth, panelThickness, length), baseMat);
            group.add(base);

            for (let i = 0; i < 28; i++) {
                const type = Math.floor(Math.random() * 4);
                const px = (Math.random() - 0.5) * (panelWidth * 0.88);
                const pz = (Math.random() - 0.5) * (length * 0.88);

                if (type === 0) {
                    const w = 1.2 + Math.random() * 3.5;
                    const h = 0.5 + Math.random() * 1.5;
                    const l = 1.8 + Math.random() * 4.5;
                    const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), blockMatA);
                    block.position.set(px, panelThickness / 2 + h / 2, pz);
                    group.add(block);
                } else if (type === 1) {
                    const r = 0.15 + Math.random() * 0.35;
                    const pipe = new THREE.Mesh(new THREE.CylinderGeometry(r, r, length, 6), pipeMat);
                    pipe.rotation.x = Math.PI / 2;
                    pipe.position.set(px, panelThickness / 2 + r, 0);
                    group.add(pipe);
                } else if (type === 2) {
                    const w = 1.5 + Math.random() * 2.8;
                    const h = 0.8 + Math.random() * 2.0;
                    const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), blockMatB);
                    block.position.set(px, panelThickness / 2 + h / 2, pz);
                    group.add(block);
                } else {
                    const rib = new THREE.Mesh(new THREE.BoxGeometry(panelWidth * 0.95, 0.4, 0.9), blockMatA);
                    rib.position.set(0, panelThickness / 2 + 0.2, pz);
                    group.add(rib);
                }
            }

            return group;
        }

        function buildContinuousFloorSegments() {
            for (let i = 0; i < NUM_CORRIDOR_SEGMENTS; i++) {
                const zPos = -i * SEGMENT_LENGTH;
                const greebleFloor = createGreebleFloorSurfaceGroup(80, 0.8, SEGMENT_LENGTH);
                greebleFloor.position.set(0, TRENCH_FLOOR_Y, zPos);
                scene.add(greebleFloor);

                corridorSegments.push({
                    group: greebleFloor
                });
            }
        }

        function buildStarfieldSystem() {
            const starGeo = new THREE.BufferGeometry();
            const count = 1200;
            const positions = new Float32Array(count * 3);
            for (let i = 0; i < count * 3; i += 3) {
                positions[i] = (Math.random() - 0.5) * 500;
                positions[i+1] = Math.random() * 250 + 5;
                positions[i+2] = -Math.random() * 550;
            }
            starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            const starMat = new THREE.PointsMaterial({ color: 0xffffff, size: 1.3, transparent: true, opacity: 0.9 });
            starParticlesSystem = new THREE.Points(starGeo, starMat);
            scene.add(starParticlesSystem);
        }

        function buildApproachingPlanet() {
            planetMeshSystem = new THREE.Group();
            
            const planetGeo = new THREE.IcosahedronGeometry(42, 3);
            const planetMat = new THREE.MeshLambertMaterial({ color: 0x0077ff, flatShading: true });
            const body = new THREE.Mesh(planetGeo, planetMat);
            
            const ringGeo = new THREE.TorusGeometry(62, 1.8, 4, 24);
            const ringMat = new THREE.MeshLambertMaterial({ color: 0x00ffff, flatShading: true });
            const ring = new THREE.Mesh(ringGeo, ringMat);
            ring.rotation.x = Math.PI / 3;

            planetMeshSystem.add(body, ring);
            planetMeshSystem.position.set(60, 35, -380);
            scene.add(planetMeshSystem);
        }

        function buildWarpTunnel() {
            const geo = new THREE.BufferGeometry();
            const count = 300;
            const pos = new Float32Array(count * 3);
            for(let i=0; i<count*3; i+=3) {
                pos[i] = (Math.random() - 0.5) * 50;
                pos[i+1] = (Math.random() - 0.5) * 40;
                pos[i+2] = -Math.random() * 160;

        function setupControls() {
            function handleOrientation(e) {
                if (e.beta === null || e.gamma === null) return;
                
                let rawBeta = e.beta;
                let rawGamma = e.gamma;
                let angle = (window.orientation !== undefined) ? window.orientation : (screen.orientation ? screen.orientation.angle : 0);
                
                let adjustedPitch = 0;
                let adjustedRoll = 0;

                if (angle === 90) {
                    adjustedPitch = -rawGamma;
                    adjustedRoll = rawBeta;
                } else if (angle === -90 || angle === 270) {
                    adjustedPitch = rawGamma;
                    adjustedRoll = -rawBeta;
                } else if (angle === 180) {
                    adjustedPitch = -rawBeta;
                    adjustedRoll = -rawGamma;
                } else {
                    adjustedPitch = rawBeta;
                    adjustedRoll = rawGamma;
                }

                if (initialPitch === null) {
                    initialPitch = adjustedPitch;
                    initialRoll = adjustedRoll;
                }

                let dPitch = adjustedPitch - initialPitch;
                let dRoll = adjustedRoll - initialRoll;

                if (dPitch > 180) dPitch -= 360;
                if (dPitch < -180) dPitch += 360;
                if (dRoll > 180) dRoll -= 360;
                if (dRoll < -180) dRoll += 360;

                dPitch = Math.max(-45, Math.min(45, dPitch));
                dRoll = Math.max(-45, Math.min(45, dRoll));

                gyroPitch = dPitch * 0.055;
                gyroRoll = dRoll * 0.055;
            }

            if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            else window.addEventListener('deviceorientation', handleOrientation, true);

            window.addEventListener('orientationchange', () => {
                initialPitch = null;
                initialRoll = null;
            });

            window.addEventListener('pointerdown', (e) => {
                if (e.clientX > window.innerWidth * 0.48) {
                    isRightSideFiring = true;
                } else {
                    isTouchDragging = true;
                    previousPointerX = e.clientX;
                    previousPointerY = e.clientY;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (!isTouchDragging) return;
                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                
                pointerTargetX += (deltaX / window.innerWidth) * 2.2;
                pointerTargetY -= (deltaY / window.innerHeight) * 2.2;

                pointerTargetX = Math.max(-1.0, Math.min(1.0, pointerTargetX));
                pointerTargetY = Math.max(-1.0, Math.min(1.0, pointerTargetY));
            });

            const stopTouch = (e) => {
                if (e.clientX > window.innerWidth * 0.45) {
                    isRightSideFiring = false;
                }
                isTouchDragging = false;
            };

            window.addEventListener('pointerup', stopTouch);
            window.addEventListener('pointercancel', stopTouch);
        }

            score = 0; health = 100; maxHealth = 100; quotaDefeated = 0; targetQuota = 35; sectorLevel = 1; elapsedTime = 0; difficultyLevel = 0.5;
            activeWeaponType = "PLASMA"; cannonSpreadLevel = 1; tempShieldTimer = 0; missileCount = 0;
            
            if (currentBoss) { scene.remove(currentBoss.mesh); currentBoss = null; }
            enemies.forEach(e => scene.remove(e.mesh)); enemies.length = 0;

            tallBuildings.forEach(b => scene.remove(b.mesh)); tallBuildings.length = 0;
            playerLasers.forEach(l => scene.remove(l.mesh)); playerLasers.length = 0;

        function triggerPowerupPopup(text) {

        function animate(time) {
            requestAnimationFrame(animate);

            if (gameState === "PLAYING") {
                elapsedTime += 0.016;
                difficultyLevel = 0.5 + (elapsedTime / 45) + (sectorLevel * 0.22);
                
                const threatLabel = difficultyLevel < 1.2 ? "EASY" : (difficultyLevel < 2.0 ? "MEDIUM" : (difficultyLevel < 3.0 ? "HARD" : "EXTREME"));
                document.getElementById('threat-level-display').innerText = "THREAT: " + threatLabel;

                const speed = 1.4 + sectorLevel * 0.1;

                if (tempShieldTimer > 0) {
                    tempShieldTimer -= 0.016;
                    shieldBubbleMesh.material.opacity = 0.45 + Math.sin(time * 0.01) * 0.15;
                    shieldBubbleMesh.rotation.y += 0.03;
                } else {
                    shieldBubbleMesh.material.opacity = 0;
                }

                if (isTransitioning) {
                    warpTunnelSystem.material.opacity = Math.min(0.8, warpTunnelSystem.material.opacity + 0.05);
                    const pos = warpTunnelSystem.geometry.attributes.position.array;
                    for(let i=2; i<pos.length; i+=3) {
                        pos[i] += 8.0;
                        if(pos[i] > 10) pos[i] = -150;
                    }
                    warpTunnelSystem.geometry.attributes.position.needsUpdate = true;
                } else {
                    warpTunnelSystem.material.opacity = Math.max(0, warpTunnelSystem.material.opacity - 0.04);
                }

                for (let i = 0; i < corridorSegments.length; i++) {
                    const seg = corridorSegments[i];
                    seg.group.position.z += speed * 1.4;
                    if (seg.group.position.z > 20) {
                        seg.group.position.z -= NUM_CORRIDOR_SEGMENTS * SEGMENT_LENGTH;
                    }
                }

                if (planetMeshSystem) planetMeshSystem.rotation.y += 0.001;

                // --- 1. FULL SCREEN RETICLE AIMING & BOUNDED SHIP MOVEMENT ---
                let rawNDC_X = pointerTargetX + gyroRoll * 1.25;
                let rawNDC_Y = pointerTargetY - gyroPitch * 1.25;

                const aimNDC_X = Math.max(-0.95, Math.min(0.95, rawNDC_X));
                const aimNDC_Y = Math.max(-0.95, Math.min(0.95, rawNDC_Y));

                const reticleScreenX = (aimNDC_X * 0.5 + 0.5) * window.innerWidth;
                const reticleScreenY = (-aimNDC_Y * 0.5 + 0.5) * window.innerHeight;

                const reticleEl = document.getElementById('reticle');
                if (reticleEl) {
                    reticleEl.style.left = `${reticleScreenX}px`;
                    reticleEl.style.top = `${reticleScreenY}px`;
                }

                const aimDistance = 80;
                const fovRad = THREE.MathUtils.degToRad(camera.fov);
                const halfFovTan = Math.tan(fovRad / 2);
                
                const aimWorldY = camera.position.y + (aimNDC_Y * aimDistance * halfFovTan);
                const aimWorldX = camera.position.x + (aimNDC_X * aimDistance * halfFovTan * camera.aspect);
                
                currentAimWorldPoint.set(aimWorldX, aimWorldY, camera.position.z - aimDistance);

                let desiredShipX = aimWorldX * 0.45;
                let desiredShipY = aimWorldY * 0.45;

                const MAX_SHIP_X = 22.0;
                const MAX_SHIP_Y = 14.0;
                const MIN_SHIP_Y = TRENCH_FLOOR_Y + 1.2;

                desiredShipX = Math.max(-MAX_SHIP_X, Math.min(MAX_SHIP_X, desiredShipX));
                desiredShipY = Math.max(MIN_SHIP_Y, Math.min(MAX_SHIP_Y, desiredShipY));

                playerShip.position.x += (desiredShipX - playerShip.position.x) * 0.05;
                playerShip.position.y += (desiredShipY - playerShip.position.y) * 0.05;
                
                playerShip.position.x = Math.max(-MAX_SHIP_X, Math.min(MAX_SHIP_X, playerShip.position.x));
                playerShip.position.y = Math.max(MIN_SHIP_Y, Math.min(MAX_SHIP_Y, playerShip.position.y));

                playerShip.rotation.z = -(desiredShipX - playerShip.position.x) * 0.22;
                playerShip.rotation.x = (desiredShipY - playerShip.position.y) * 0.15;

                // --- 2. CAMERA TRACKING ---
                const targetCamX = playerShip.position.x * 0.75;
                const targetCamY = playerShip.position.y * 0.70;
                
                camera.position.x += (targetCamX - camera.position.x) * 0.08;
                camera.position.y += (targetCamY - camera.position.y) * 0.08;
                
                camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, -(playerShip.position.x - camera.position.x) * 0.03, 0.08);
                camera.rotation.x = THREE.MathUtils.lerp(camera.rotation.x, -(playerShip.position.y - camera.position.y) * 0.03, 0.08);

                // --- 3. MANUAL CANNON FIRING ---
                const fireInterval = activeWeaponType === "BEAM" ? 75 : (activeWeaponType === "SPREAD" ? 180 : 130);
                if (isRightSideFiring && (time - lastShotTime > fireInterval)) {
                    firePlayerLaser();
                    lastShotTime = time;
                }

                // --- 4. AUTOMATIC HOMING MISSILE SYSTEM ---
                if (missileCount > 0 && (time - lastMissileFireTime > 2500)) {
                    fireHomingMissiles();
                    lastMissileFireTime = time;
                }

                // --- 5. UPDATE HOMING MISSILES ---
                for (let i = activeMissiles.length - 1; i >= 0; i--) {
                    const m = activeMissiles[i];
                    let targetPos = null;

                    if (currentBoss) targetPos = currentBoss.mesh.position;
                    else if (enemies.length > 0) targetPos = enemies[0].mesh.position;
                    else if (groundTurrets.length > 0) targetPos = groundTurrets[0].group.position;

                    if (targetPos) {
                        const desiredDir = new THREE.Vector3().subVectors(targetPos, m.mesh.position).normalize();
                        m.dir.lerp(desiredDir, 0.12).normalize();
                    }

                    m.mesh.position.addScaledVector(m.dir, 3.5);
                    m.mesh.rotation.x += 0.1;

                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (m.mesh.position.distanceTo(e.mesh.position) < 2.5) {
                            createExplosion(e.mesh.position);
                            sfx.playExplosion();
                            if (Math.random() < 0.25) spawnPowerUpDrop(e.mesh.position);
                            scene.remove(e.mesh); enemies.splice(j, 1);
                            scene.remove(m.mesh); activeMissiles.splice(i, 1);
                            score += 150; quotaDefeated++;
                            updateHUD();
                            break;
                        }
                    }

                    if (currentBoss && m.mesh && m.mesh.position.distanceTo(currentBoss.mesh.position) < 6.5) {
                        createExplosion(m.mesh.position);
                        sfx.playExplosion();
                        scene.remove(m.mesh); activeMissiles.splice(i, 1);
                        currentBoss.hp -= 3;
                        score += 150;
                        const pct = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100);
                        document.getElementById('boss-bar-fill').style.width = pct + '%';
                    } else if (m.mesh && m.mesh.position.z < -240) {
                        scene.remove(m.mesh); activeMissiles.splice(i, 1);
                    }
                }

                // --- 6. UPDATE POWERUPS (MAGNETIC & COLLISION PREVENTED) ---
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    
                    const distToPlayer = p.mesh.position.distanceTo(playerShip.position);

                    if (distToPlayer < 18.0) {
                        const magnetPullStrength = 0.14 * (1.0 - distToPlayer / 18.0) + 0.04;
                        p.mesh.position.lerp(playerShip.position, magnetPullStrength);
                    } else {
                        p.mesh.position.z += speed * 0.15;
                    }

                    p.cage.rotation.y += 0.05;
                    p.cage.rotation.x += 0.03;
                    p.ring.rotation.z -= 0.04;
                    
                    const pulse = 1.0 + Math.sin(time * 0.008) * 0.18;
                    p.core.scale.setScalar(pulse);

                    if (distToPlayer < 2.0) {
                        applyPowerUp(p.type);
                        scene.remove(p.mesh);
                        powerUps.splice(i, 1);
                        continue;
                    }

                    if (p.mesh.position.z > 12) {
                        scene.remove(p.mesh);
                        powerUps.splice(i, 1);
                    }
                }

                // --- 7. UPDATE TALL BUILDINGS ---
                for (let i = tallBuildings.length - 1; i >= 0; i--) {
                    const b = tallBuildings[i];
                    b.mesh.position.z += speed * 1.4;
                    b.bbox.setFromObject(b.mesh);

                    if (b.bbox.containsPoint(playerShip.position)) {
                        createExplosion(playerShip.position);
                        sfx.playExplosion();
                        scene.remove(b.mesh); tallBuildings.splice(i, 1);
                        triggerPlayerDamage(20);
                        continue;
                    }

                    if (b.mesh.position.z > 20) {
                        scene.remove(b.mesh); tallBuildings.splice(i, 1);
                    }
                }

                // --- 8. INDIVIDUAL DESTRUCTIBLE TURRET SIDE GUNS ---
                for (let i = groundTurrets.length - 1; i >= 0; i--) {
                    const t = groundTurrets[i];
                    t.group.position.z += speed * 1.4;

                    let activeGunsCount = 0;

                    t.guns.forEach(g => {
                        if (!g.active) return;
                        activeGunsCount++;

                        const gunWorldPos = new THREE.Vector3();
                        g.mesh.getWorldPosition(gunWorldPos);

                        g.mesh.lookAt(playerShip.position);

                        if (time - t.lastFireTime > t.fireInterval && t.group.position.z < -10) {
                            fireEnemyLaserFromPoint(gunWorldPos);
                        }

                        for (let j = playerLasers.length - 1; j >= 0; j--) {
                            const l = playerLasers[j];
                            if (l.mesh.position.distanceTo(gunWorldPos) < 2.0) {
                                createExplosion(gunWorldPos);
                                sfx.playExplosion();
                                scene.remove(l.mesh); playerLasers.splice(j, 1);

                                g.hp--;
                                if (g.hp <= 0) {
                                    g.active = false;
                                    g.mesh.visible = false;
                                    createExplosion(gunWorldPos);
                                    sfx.playExplosion();
                                    if (Math.random() < 0.3) spawnPowerUpDrop(gunWorldPos);
                                    score += 200;
                                    quotaDefeated++;
                                    updateHUD();
                                }
                                break;
                            }
                        }
                    });

                    if (activeGunsCount > 0 && time - t.lastFireTime > t.fireInterval) {
                        t.lastFireTime = time;
                    }

                    if (t.group.position.z > 20 || activeGunsCount === 0) {
                        if (activeGunsCount === 0) {
                            createExplosion(t.group.position);
                            sfx.playExplosion();
                        }
                        scene.remove(t.group);
                        groundTurrets.splice(i, 1);
                    }
                }

                // --- 9. SPAWN TIE SQUADRONS / TURRETS / BUILDINGS OR CHECK BOSS ---
                if (quotaDefeated >= targetQuota && !currentBoss && !isTransitioning) {
                    currentBoss = createBossForLocation(sectorLevel - 1);
                    document.getElementById('boss-name').innerText = BOSS_TYPES[(sectorLevel - 1) % BOSS_TYPES.length].name;
                    document.getElementById('boss-hud-container').style.opacity = '1';
                    
                    const alertEl = document.getElementById('hud-center-alert');
                    alertEl.innerText = "WARNING: BOSS ENGAGED";
                    alertEl.style.opacity = '1';
                    setTimeout(() => alertEl.style.opacity = '0', 1800);
                } 
                else if (!currentBoss && !isTransitioning) {
                    spawnTimer++;
                    const maxEnemies = Math.min(12, Math.floor(4 + difficultyLevel * 2));
                    const spawnInterval = Math.max(30, Math.floor(75 - difficultyLevel * 8));

                    if (spawnTimer % spawnInterval === 0 && enemies.length < maxEnemies) {
                        spawnTieSquadron();
                    }

                    if (spawnTimer % 95 === 0 && groundTurrets.length < 4) {
                        spawnGroundTurret();
                    }

                    if (spawnTimer % 115 === 0 && tallBuildings.length < 3) {
                        spawnTallBuildingStructure(-180);
                    }
                }

                // --- 10. BOSS COMBAT LOOP, PROGRESSIVE DIFFICULTY & TERRAIN COLLISION BOUNDS ---
                if (currentBoss) {
                    if (currentBoss.mesh.position.z < -50) {
                        currentBoss.mesh.position.z += 2.0;
                    } else {
                        currentBoss.mesh.position.x = Math.sin(time * 0.002) * 12.0;
                        currentBoss.mesh.position.y = Math.max(1.0, 3.0 + Math.cos(time * 0.0025) * 4.0);
                    }
                    currentBoss.mesh.rotation.y += 0.01;

                    keepAboveTerrain(currentBoss.mesh, 2.0);

                    if (time - currentBoss.lastFireTime > currentBoss.fireInterval) {
                        fireBossSalvo(currentBoss);
                        currentBoss.lastFireTime = time;
                    }

                    for (let j = playerLasers.length - 1; j >= 0; j--) {
                        const l = playerLasers[j];
                        if (l.mesh.position.distanceTo(currentBoss.mesh.position) < 6.5) {
                            createExplosion(l.mesh.position);
                            sfx.playExplosion();
                            scene.remove(l.mesh); playerLasers.splice(j, 1);
                            
                            currentBoss.hp--;
                            score += 50;

                            const pct = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100);
                            document.getElementById('boss-bar-fill').style.width = pct + '%';

                            if (currentBoss.hp <= 0) {
                                createExplosion(currentBoss.mesh.position, true);
                                sfx.playExplosion(true);
                                scene.remove(currentBoss.mesh);
                                currentBoss = null;
                                score += 5000;
                                document.getElementById('boss-hud-container').style.opacity = '0';
                                
                                triggerSectorTransition();
                                break;
                            }
                        }
                    }
                }

                // --- 11. UPDATE PLAYER LASERS ---
                for (let i = playerLasers.length - 1; i >= 0; i--) {
                    const l = playerLasers[i];
                    l.mesh.position.addScaledVector(l.dir, 4.2);
                    if (l.mesh.position.z < -240) {
                        scene.remove(l.mesh); playerLasers.splice(i, 1);
                    }
                }

                // --- 12. UPDATE ENEMY LASERS ---
                for (let i = enemyLasers.length - 1; i >= 0; i--) {
                    const el = enemyLasers[i];
                    el.mesh.position.addScaledVector(el.dir, el.speed);

                    if (el.mesh.position.distanceTo(playerShip.position) < 1.6) {
                        scene.remove(el.mesh); enemyLasers.splice(i, 1);
                        triggerPlayerDamage(6 + Math.floor(difficultyLevel * 2));
                        continue;
                    }

                    if (el.mesh.position.z > 10) {
                        scene.remove(el.mesh); enemyLasers.splice(i, 1);
                    }
                }

                // --- 13. TIE FIGHTERS & TERRAIN COLLISION BOUNDS ---
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];

                    if (e.state === 'ENTERING') {
                        e.mesh.position.z += speed * 2.2;
                        if (e.mesh.position.z >= -50) {
                            e.state = 'ENGAGING';
                            e.engageTimer = 0;
                        }
                    } 
                    else if (e.state === 'ENGAGING') {
                        e.engageTimer += 0.016;

                        e.mesh.position.x = e.baseX + Math.sin(time * e.sineFreqX + e.seed) * 9.0;
                        e.mesh.position.y = Math.max(MIN_SHIP_Y, e.baseY + Math.cos(time * e.sineFreqY + e.seed) * 4.5);
                        e.mesh.position.z = -50 + Math.sin(time * 0.002 + e.seed) * 5.0;

                        e.mesh.rotation.z = Math.sin(time * 0.003 + e.seed) * 0.25;

                        if (time - e.lastFireTime > e.fireInterval) {
                            fireEnemyLaser(e);
                            e.lastFireTime = time;
                        }

                        if (e.engageTimer > 7.5) {
                            e.state = 'EXITING';
                        }
                    }
                    else if (e.state === 'EXITING') {
                        e.mesh.position.z += speed * 2.5;
                        e.mesh.position.y += 0.08;

                        if (e.mesh.position.z > 20) {
                            scene.remove(e.mesh);
                            enemies.splice(i, 1);
                            continue;
                        }
                    }

                    keepAboveTerrain(e.mesh, -2.2);

                    for (let j = playerLasers.length - 1; j >= 0; j--) {
                        const l = playerLasers[j];
                        if (l.mesh.position.distanceTo(e.mesh.position) < 2.2) {
                            createExplosion(e.mesh.position);
                            sfx.playExplosion();
                            if (Math.random() < 0.22) spawnPowerUpDrop(e.mesh.position);
                            scene.remove(e.mesh); enemies.splice(i, 1);
                            scene.remove(l.mesh); playerLasers.splice(j, 1);
                            
                            score += 150;
                            quotaDefeated++;
                            updateHUD();
                            break;
                        }
                    }

                    if (e && e.mesh.position.distanceTo(playerShip.position) < 1.8) {
                        createExplosion(e.mesh.position);
                        sfx.playExplosion();
                        scene.remove(e.mesh); enemies.splice(i, 1);
                        triggerPlayerDamage(15);
                    }
                }

                // --- 14. UPDATE FIERY PARTICLE EXPLOSIONS ---
                for (let i = particleExplosions.length - 1; i >= 0; i--) {
                    const p = particleExplosions[i];
                    p.mesh.position.add(p.vel);
                    p.vel.multiplyScalar(0.92);
                    p.mesh.rotation.x += p.rotVel.x;
                    p.mesh.rotation.y += p.rotVel.y;
                    
                    p.life -= p.decay;
                    p.mesh.scale.multiplyScalar(0.95);
                    p.mesh.material.opacity = Math.max(0, p.life);

                    if (p.life <= 0 || p.mesh.scale.x < 0.02) {
                        scene.remove(p.mesh);
                        if (p.mesh.geometry) p.mesh.geometry.dispose();
                        if (p.mesh.material) p.mesh.material.dispose();
                        particleExplosions.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function applyPowerUp(pType) {
            if (!pType) return;
            sfx.playPowerup();

            switch(pType.id) {
                case "HEALTH":
                    health = Math.min(maxHealth, health + 30);
                    triggerPowerupPopup(pType.label);
                    break;
                case "MAX_HP":
                    maxHealth += 25;
                    health = Math.min(maxHealth, health + 25);
                    triggerPowerupPopup(pType.label);
                    break;
                case "SPREAD":
                    cannonSpreadLevel = Math.min(3, cannonSpreadLevel + 1);
                    triggerPowerupPopup(`CANNON SPREAD UP [LVL ${cannonSpreadLevel}]`);
                    break;
                case "TEMP_SHIELD":
                    tempShieldTimer = 10.0;
                    triggerPowerupPopup(pType.label);
                    break;
                case "WEAPON_SWAP":
                    if (activeWeaponType === "PLASMA") activeWeaponType = "SPREAD";
                    else if (activeWeaponType === "SPREAD") activeWeaponType = "BEAM";
                    else activeWeaponType = "PLASMA";
                    triggerPowerupPopup(`WEAPON UPGRADED: ${activeWeaponType}`);
                    break;
                case "HOMING_MISSILE":
                    missileCount = Math.min(6, missileCount + 1);
                    triggerPowerupPopup(`HOMING MISSILES (+${missileCount})`);
                    break;
            }

            if (extraCannonsGroup) {
                extraCannonsGroup.visible = (cannonSpreadLevel > 1);
            }
            if (missilePodsGroup) {
                missilePodsGroup.visible = (missileCount > 0);
            }

            updateHUD();
        }

        function firePlayerLaser() {
            const geo = new THREE.CylinderGeometry(0.08, 0.08, 1.8);
            const matColor = activeWeaponType === "BEAM" ? 0xffff00 : (activeWeaponType === "SPREAD" ? 0xff00ff : 0x00ffcc);
            const mat = new THREE.MeshBasicMaterial({ color: matColor });

            const startPosList = [];
            
            if (cannonSpreadLevel === 1) {
                startPosList.push(new THREE.Vector3(playerShip.position.x - 2.2, playerShip.position.y, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 2.2, playerShip.position.y, playerShip.position.z - 1));
            } else if (cannonSpreadLevel === 2) {
                startPosList.push(new THREE.Vector3(playerShip.position.x - 2.4, playerShip.position.y, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x, playerShip.position.y + 0.4, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 2.4, playerShip.position.y, playerShip.position.z - 1));
            } else {
                startPosList.push(new THREE.Vector3(playerShip.position.x - 2.8, playerShip.position.y - 0.2, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x - 1.0, playerShip.position.y + 0.4, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 1.0, playerShip.position.y + 0.4, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 2.8, playerShip.position.y - 0.2, playerShip.position.z - 1));
            }

            startPosList.forEach((start, idx) => {
                const aimOffset = currentAimWorldPoint.clone();
                if (activeWeaponType === "SPREAD") {
                    const offsetVal = (idx - (startPosList.length - 1) / 2) * 12.0;
                    aimOffset.x += offsetVal;
                }

                const dir = new THREE.Vector3().subVectors(aimOffset, start).normalize();
                const laser = new THREE.Mesh(geo, mat);
                laser.rotation.x = Math.PI / 2;
                laser.position.copy(start);

                scene.add(laser);
                playerLasers.push({ mesh: laser, dir: dir });
            });

            sfx.playLaser(activeWeaponType);
        }

        function fireHomingMissiles() {
            sfx.playMissileLaunch();
            for(let i=0; i<missileCount; i++) {
                const geo = new THREE.ConeGeometry(0.3, 1.4, 5);
                geo.rotateX(-Math.PI / 2);
                const mat = new THREE.MeshLambertMaterial({ color: 0xbd00ff, flatShading: true });
                const missile = new THREE.Mesh(geo, mat);

                missile.position.copy(playerShip.position);
                missile.position.x += (i - (missileCount - 1) / 2) * 1.5;

                const dir = new THREE.Vector3(0, 0, -1);
                scene.add(missile);
                activeMissiles.push({ mesh: missile, dir: dir });
            }
        }

        function fireEnemyLaser(enemy) {
            fireEnemyLaserFromPoint(enemy.mesh.position);
        }

        function fireEnemyLaserFromPoint(originPos) {
            const geo = new THREE.CylinderGeometry(0.12, 0.12, 2.2, 6);
            geo.rotateX(Math.PI / 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const laser = new THREE.Mesh(geo, mat);
            laser.position.copy(originPos);

            const dir = new THREE.Vector3().subVectors(playerShip.position, originPos).normalize();
            const shotSpeed = 1.1 + difficultyLevel * 0.25;

            scene.add(laser);
            enemyLasers.push({ mesh: laser, dir: dir, speed: shotSpeed });
            sfx.playEnemyLaser();
        }

        function fireBossSalvo(boss) {
            const laserCount = sectorLevel > 1 ? 4 : 2;
            for(let i = 0; i < laserCount; i++) {
                const geo = new THREE.CylinderGeometry(0.18, 0.18, 2.8, 6);
                geo.rotateX(Math.PI / 2);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const laser = new THREE.Mesh(geo, mat);
                laser.position.copy(boss.mesh.position);
                const xOffset = (i - (laserCount - 1) / 2) * 2.2;
                laser.position.x += xOffset;

                const dir = new THREE.Vector3().subVectors(playerShip.position, laser.position).normalize();
                scene.add(laser);
                enemyLasers.push({ mesh: laser, dir: dir, speed: 1.8 + difficultyLevel * 0.35 });
            }
            sfx.playEnemyLaser();
        }

        function spawnTieSquadron() {
            const formationType = Math.floor(Math.random() * 2);
            const leaderX = (Math.random() - 0.5) * 24;
            const leaderY = Math.random() * 5.0 + 1.0;
            const startZ = -180;

            const offsets = formationType === 0 ? 
                [{x:0, y:0, z:0}, {x:-3.5, y:1.5, z:4}, {x:3.5, y:1.5, z:4}] : 
                [{x:-4.5, y:0, z:0}, {x:0, y:0, z:0}, {x:4.5, y:0, z:0}];

            offsets.forEach(off => {
                const tieMesh = createTieFighter();
                tieMesh.position.set(leaderX + off.x, leaderY + off.y, startZ + off.z);
                
                const fireInterval = Math.max(1200, 4200 - difficultyLevel * 400 + Math.random() * 500);
                scene.add(tieMesh);

                enemies.push({
                    mesh: tieMesh,
                    state: 'ENTERING',
                    engageTimer: 0,
                    baseX: leaderX + off.x,
                    baseY: leaderY + off.y,
                    seed: Math.random() * 100,
                    sineFreqX: 0.002 + Math.random() * 0.001,
                    sineFreqY: 0.003 + Math.random() * 0.001,
                    lastFireTime: performance.now() + Math.random() * 800,
                    fireInterval: fireInterval
                });
            });
        }

        function spawnGroundTurret() {
            const turretObj = createGroundTurret();
            const posX = (Math.random() - 0.5) * 32;
            turretObj.mesh.position.set(posX, TRENCH_FLOOR_Y, -180);

            const fireInterval = Math.max(1200, 3600 - difficultyLevel * 350);
            scene.add(turretObj.mesh);
            groundTurrets.push({
                group: turretObj.mesh,
                guns: turretObj.guns,
                pedestalHeight: turretObj.pedestalHeight,
                hp: 4,
                lastFireTime: performance.now(),
                fireInterval: fireInterval
            });
        }

        function createExplosion(pos, isBoss = false) {
            const particleCount = isBoss ? 85 : 32;
            const fieryColors = [0xffffff, 0xffff00, 0xff7700, 0xff2200, 0x881100, 0x333333];

            for (let i = 0; i < particleCount; i++) {
                const color = fieryColors[Math.floor(Math.random() * fieryColors.length)];
                const size = (0.2 + Math.random() * (isBoss ? 0.9 : 0.5));
                const pGeo = Math.random() > 0.5 ? new THREE.IcosahedronGeometry(size, 0) : new THREE.TetrahedronGeometry(size);
                const pMat = new THREE.MeshBasicMaterial({ 
                    color: color, 
                    wireframe: Math.random() > 0.6,
                    transparent: true,
                    opacity: 1.0 
                });

                const pMesh = new THREE.Mesh(pGeo, pMat);
                pMesh.position.copy(pos);
                
                const speed = (isBoss ? 0.8 : 0.4) + Math.random() * (isBoss ? 1.2 : 0.8);
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.random() * Math.PI;

                const vel = new THREE.Vector3(
                    speed * Math.sin(phi) * Math.cos(theta),
                    speed * Math.sin(phi) * Math.sin(theta),
                    speed * Math.cos(phi)
                );

                const rotVel = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3,
                    (Math.random() - 0.5) * 0.3
                );

                scene.add(pMesh);
                particleExplosions.push({
                    mesh: pMesh,
                    vel: vel,
                    rotVel: rotVel,
                    life: 1.0,
                    decay: 0.02 + Math.random() * 0.025
                });
            }
        }

        function triggerPlayerDamage(amount) {
            if (tempShieldTimer > 0) return;

            sfx.playPlayerHit();

            if (cannonSpreadLevel > 1) {
                cannonSpreadLevel--;
                triggerPowerupPopup("WING CANNON DAMAGED!");
                createExplosion(playerShip.position);
                sfx.playExplosion();
                health -= Math.floor(amount * 0.5);
            } else {
                health -= amount;
            }

            if (extraCannonsGroup) {
                extraCannonsGroup.visible = (cannonSpreadLevel > 1);
            }

            const overlay = document.getElementById('damage-overlay');
            overlay.style.background = 'rgba(255, 0, 85, 0.45)';
            setTimeout(() => overlay.style.background = 'rgba(255, 0, 85, 0)', 120);

            updateHUD();
            if (health <= 0) triggerGameOver();
        }

        function triggerSectorTransition() {
            isTransitioning = true;
            sfx.playWarp();
            
            sectorLevel++;
            targetQuota += 10;

            const alertEl = document.getElementById('hud-center-alert');
            alertEl.innerText = `BOSS DESTROYED! WARPING TO SECTOR 0${sectorLevel}...`;
            alertEl.style.opacity = '1';

            setTimeout(() => {
                quotaDefeated = 0;
                document.getElementById('location-display').innerText = `TRENCH SECTOR 0${sectorLevel}`;
                
                setTimeout(() => {
                    alertEl.style.opacity = '0';
                    isTransitioning = false;
                    updateHUD();
                }, 800);
            }, 1200);
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('health-bar-fill').style.width = Math.max(0, (health / maxHealth) * 100) + '%';
            document.getElementById('weapon-display').innerText = `WEAPON: ${activeWeaponType} [LVL ${cannonSpreadLevel}]`;
            document.getElementById('missile-display').innerText = `MISSILES: ${missileCount}`;
            
            const pct = Math.min(100, (quotaDefeated / targetQuota) * 100);
            document.getElementById('quota-bar-fill').style.width = pct + '%';
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            saveHighScore(score);
            document.getElementById('hud').style.display = 'none';
            document.getElementById('final-score-text').innerText = "FINAL SCORE: " + score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function returnToTitle() {
            gameState = "TITLE";
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('title-screen').style.display = 'flex';
        }

        function getHighScores() {
            return JSON.parse(localStorage.getItem('POLYWING_HIGH_SCORES') || '[8500, 6000, 4200, 2500, 1000]');
        }

        function saveHighScore(newScore) {
            let scores = getHighScores();
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            localStorage.setItem('POLYWING_HIGH_SCORES', JSON.stringify(scores));
        }

        function showHighScores() {
            const scores = getHighScores();
            const container = document.getElementById('score-list-content');
            container.innerHTML = scores.map((s, i) => `<div class="score-item"><span>RANK 0${i+1}</span><span>${s} PTS</span></div>`).join('');
            document.getElementById('high-scores-modal').style.display = 'flex';
        }

        function hideHighScores() {
            document.getElementById('high-scores-modal').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initEngine);
    </script>
</body>
</html>
