<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>POLYWING: ADVANCED ARSENAL</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Courier New', Courier, monospace; color: #00ffcc; }
        
        #canvas3d { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; display: block; touch-action: none; }
        
        /* UI OVERLAYS */
        .overlay-screen {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 10;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            background: rgba(2, 2, 8, 0.92); text-align: center; padding: 20px; transition: opacity 0.5s ease;
        }

        h1.game-title {
            font-size: min(10vw, 44px); font-weight: 900; letter-spacing: 6px; color: #00ffcc;
            text-shadow: 0 0 15px #00ffcc, 0 0 35px #00ffcc; margin-bottom: 5px;
        }
        
        .subtitle { font-size: min(3.5vw, 13px); letter-spacing: 3px; color: #ff0055; margin-bottom: 30px; text-shadow: 0 0 10px #ff0055; }

        .btn {
            background: rgba(0, 255, 204, 0.12); border: 2px solid #00ffcc; color: #00ffcc;
            padding: 14px 28px; margin: 8px; font-size: min(4vw, 18px); font-weight: bold;
            letter-spacing: 2px; font-family: inherit; cursor: pointer; border-radius: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3); transition: all 0.2s ease; outline: none;
            width: min(80vw, 280px);
        }
        .btn:active { background: #00ffcc; color: #000; box-shadow: 0 0 25px #00ffcc; transform: scale(0.96); }

        /* HUD */
        #hud { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 5; pointer-events: none; display: none; }
        
        .hud-panel { position: absolute; padding: 12px; font-weight: bold; text-shadow: 0 0 8px currentColor; }
        #hud-top-left { top: 15px; left: 15px; color: #00ffcc; font-size: min(3.8vw, 15px); }
        #hud-top-right { top: 15px; right: 15px; color: #ff0055; text-align: right; font-size: min(3.8vw, 15px); }
        
        #hud-center-alert {
            position: absolute; top: 25%; left: 50%; transform: translate(-50%, -50%);
            font-size: min(6vw, 26px); font-weight: 900; letter-spacing: 3px; color: #ffff00;
            text-shadow: 0 0 15px #ffff00; text-align: center; opacity: 0; transition: opacity 0.5s ease;
        }

        /* POWERUP ANNOUNCEMENT NOTIFIER */
        #powerup-popup {
            position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);
            font-size: min(5vw, 20px); font-weight: 900; letter-spacing: 2px; color: #00ffcc;
            text-shadow: 0 0 12px #00ffcc; text-align: center; opacity: 0; transition: opacity 0.3s ease;
        }

        /* BOSS HEALTH BAR CONTAINER */
        #boss-hud-container {
            position: absolute; top: 18px; left: 50%; transform: translateX(-50%);
            width: min(70vw, 360px); text-align: center; opacity: 0; transition: opacity 0.4s ease;
        }
        #boss-name { font-size: 13px; font-weight: 900; letter-spacing: 2px; color: #ff0055; text-shadow: 0 0 10px #ff0055; margin-bottom: 4px; }
        #boss-bar-bg { width: 100%; height: 12px; background: rgba(255, 0, 85, 0.2); border: 2px solid #ff0055; border-radius: 4px; overflow: hidden; }
        #boss-bar-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.15s linear; box-shadow: 0 0 12px #ff0055; }

        #quota-bar-container {
            width: 150px; height: 8px; background: rgba(255, 255, 255, 0.15);
            border: 1px solid #00ffcc; margin-top: 6px; border-radius: 4px; overflow: hidden;
        }
        #quota-bar-fill { width: 0%; height: 100%; background: #00ffcc; transition: width 0.2s ease-out; }

        #health-bar-container {
            width: 140px; height: 10px; background: rgba(255, 0, 85, 0.2);
            border: 1px solid #ff0055; margin-top: 6px; border-radius: 4px; overflow: hidden;
        }
        #health-bar-fill { width: 100%; height: 100%; background: #ff0055; transition: width 0.2s ease-out; }

        /* TOUCH CONTROL ZONES HUD FEEDBACK */
        #right-touch-zone {
            position: absolute; right: 0; top: 0; width: 50vw; height: 100vh;
            border-left: 1px dashed rgba(0, 255, 204, 0.15); pointer-events: none;
        }

        /* DAMAGE FLASH OVERLAY */
        #damage-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 4;
            pointer-events: none; background: rgba(255, 0, 85, 0); transition: background 0.12s ease;
        }

        /* DYNAMIC RETICLE */
        #reticle {
            position: absolute; top: 50%; left: 50%; width: 44px; height: 40px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 6;
            will-change: top, left;
        }
        #reticle::before, #reticle::after {
            content: ''; position: absolute; background: #00ffcc; box-shadow: 0 0 10px #00ffcc;
        }
        #reticle::before { top: 19px; left: 0; width: 44px; height: 2px; }
        #reticle::after { top: 0; left: 21px; width: 2px; height: 40px; }

        /* HIGH SCORES MODAL */
        #high-scores-modal { display: none; z-index: 20; }
        .score-list { margin: 20px 0; text-align: left; width: min(80vw, 320px); font-size: min(4vw, 16px); line-height: 1.8; }
        .score-item { display: flex; justify-content: space-between; border-bottom: 1px dashed rgba(0, 255, 204, 0.3); }

        .pulse { animation: pulse-anim 1.5s infinite ease-in-out; }
        @keyframes pulse-anim { 0%, 100% { opacity: 0.4; } 50% { opacity: 1; } }
    </style>
    <script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
</head>
<body>

    <canvas id="canvas3d"></canvas>
    <div id="damage-overlay"></div>

    <!-- TITLE SCREEN -->
    <div id="title-screen" class="overlay-screen">
        <h1 class="game-title">POLYWING</h1>
        <div class="subtitle">// ADVANCED ARSENAL & GYRO AIM</div>
        <button class="btn" onclick="startRun()">BEGIN RUN</button>
        <button class="btn" onclick="showHighScores()">HIGH SCORES</button>
        <div class="pulse" style="margin-top: 25px; font-size: min(3vw, 12px); color: #888;">HOLD RIGHT SCREEN TO FIRE CANNONS</div>
    </div>

    <!-- HIGH SCORES SCREEN -->
    <div id="high-scores-modal" class="overlay-screen">
        <h1 class="game-title" style="font-size: min(7vw, 30px);">TOP PILOTS</h1>
        <div class="score-list" id="score-list-content"></div>
        <button class="btn" onclick="hideHighScores()">BACK</button>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="game-over-screen" class="overlay-screen" style="display: none;">
        <h1 class="game-title" style="color: #ff0055; text-shadow: 0 0 15px #ff0055;">CRAFT DESTROYED</h1>
        <div class="subtitle" id="final-score-text">FINAL SCORE: 0</div>
        <button class="btn" onclick="startRun()">REDEPLOY</button>
        <button class="btn" onclick="returnToTitle()">TITLE</button>
    </div>

    <!-- HUD -->
    <div id="hud">
        <div id="reticle"></div>
        <div id="right-touch-zone"></div>
        <div id="powerup-popup">MAX SHIELDS +25</div>
        
        <!-- BOSS HEALTH HUD -->
        <div id="boss-hud-container">
            <div id="boss-name">TITAN DREADNOUGHT</div>
            <div id="boss-bar-bg"><div id="boss-bar-fill"></div></div>
        </div>

        <div id="hud-top-left" class="hud-panel">
            <div>SCORE: <span id="score-display">0</span></div>
            <div style="font-size: 11px; margin-top: 4px; color: #aaa;" id="location-display">STARFIELD</div>
            <div id="quota-bar-container"><div id="quota-bar-fill"></div></div>
            <div style="font-size: 11px; margin-top: 6px; color: #00ffcc;" id="weapon-display">WEAPON: PLASMA</div>
            <div style="font-size: 11px; margin-top: 2px; color: #bd00ff;" id="missile-display">MISSILES: 0</div>
        </div>
        <div id="hud-top-right" class="hud-panel">
            <div>SHIELD</div>
            <div id="health-bar-container"><div id="health-bar-fill"></div></div>
            <div style="font-size: 11px; margin-top: 4px; color: #ff0055;" id="threat-level-display">THREAT: EASY</div>
        </div>
        <div id="hud-center-alert">WARNING: BOSS ENGAGED</div>
    </div>

    <script>
        // --- SYNTHESIZED WEB AUDIO SOUND FX ---
        class SoundSynth {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            
            playLaser(type = "PLASMA") {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                if (type === "BEAM") {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(1200, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(300, this.ctx.currentTime + 0.08);
                    gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                } else if (type === "SPREAD") {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(100, this.ctx.currentTime + 0.14);
                    gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                } else {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(850, this.ctx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(140, this.ctx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
                }
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            }

            playMissileLaunch() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(900, this.ctx.currentTime + 0.25);
                gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }

            playPowerup() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, this.ctx.currentTime);
                osc.frequency.setValueAtTime(880, this.ctx.currentTime + 0.08);
                osc.frequency.setValueAtTime(1320, this.ctx.currentTime + 0.16);
                gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.25);
            }

            playEnemyLaser() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(320, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(80, this.ctx.currentTime + 0.14);
                gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.14);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.14);
            }

            playExplosion() {
                if (!this.ctx) return;
                const bufSize = this.ctx.sampleRate * 0.35, buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
                const noise = this.ctx.createBufferSource(); noise.buffer = buf;
                const filter = this.ctx.createBiquadFilter(); filter.type = 'lowpass';
                filter.frequency.setValueAtTime(800, this.ctx.currentTime);
                filter.frequency.linearRampToValueAtTime(50, this.ctx.currentTime + 0.35);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.35);
                noise.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
                noise.start();
            }

            playPlayerHit() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(140, this.ctx.currentTime);
                osc.frequency.linearRampToValueAtTime(30, this.ctx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.2);
            }

            playWarp() {
                if (!this.ctx) return;
                const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(180, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1100, this.ctx.currentTime + 0.6);
                gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.6);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.6);
            }
        }

        const sfx = new SoundSynth();

        // --- EXTENDED SECTOR CONFIGURATION ---
        const BIOMES = [
            { name: "ORBITAL STARFIELD", fog: 0x01010a, light: 0x00ffcc, bg: 0x01010a, quota: 25, speed: 1.1, type: "starfield", wallX: 36, wallY: 16, hasFloor: false, bossName: "ORBITAL SUPER-STATION" },
            { name: "ASTEROID BELT HABITAT", fog: 0x0f0a14, light: 0xffaa00, bg: 0x0f0a14, quota: 30, speed: 1.2, type: "asteroids", wallX: 32, wallY: 15, hasFloor: false, bossName: "MEGA-DRILL HARVESTER" },
            { name: "STAR DESTROYER TRENCH", fog: 0x060c14, light: 0x00ffff, bg: 0x060c14, quota: 35, speed: 1.4, type: "trench_tech", wallX: 14.5, wallY: 7.2, hasFloor: true, bossName: "IMPERIAL EXECUTIONER" },
            { name: "ATMOSPHERIC APPROACH", fog: 0x021424, light: 0x00ff88, bg: 0x021424, quota: 32, speed: 1.3, type: "planet", wallX: 32, wallY: 15, hasFloor: false, bossName: "AERO-CARRIER TITAN" },
            { name: "CANYON TRENCH RUN", fog: 0x240a02, light: 0xff5500, bg: 0x240a02, quota: 38, speed: 1.5, type: "trench_canyon", wallX: 14.0, wallY: 6.8, hasFloor: true, bossName: "CRAG FORTRESS BEHEMOTH" },
            { name: "FOREST HABITAT CANOPY", fog: 0x01240c, light: 0x55ff55, bg: 0x01240c, quota: 36, speed: 1.4, type: "forest", wallX: 14.5, wallY: 7.0, hasFloor: true, bossName: "HIVE QUEEN COLOSSUS" },
            { name: "DESOLATE OBSIDIAN WASTES", fog: 0x140120, light: 0xaa00ff, bg: 0x140120, quota: 40, speed: 1.6, type: "desolate", wallX: 28, wallY: 14, hasFloor: false, bossName: "OBSIDIAN ARCH-MONOLITH" },
            { name: "BELLY OF THE BEAST", fog: 0x240110, light: 0xff0055, bg: 0x240110, quota: 45, speed: 1.7, type: "belly", wallX: 13.5, wallY: 6.2, hasFloor: true, bossName: "BIO-ORGANIC APEX CORE" }
        ];

        // POWERUP TYPES DEFINITION
        const POWERUP_TYPES = [
            { id: "HEALTH", label: "+25 HEALTH", color: 0x00ff55 },
            { id: "MAX_HP", label: "MAX SHIELD +25", color: 0xffff00 },
            { id: "SPREAD", label: "CANNON SPREAD UP", color: 0x00ffff },
            { id: "TEMP_SHIELD", label: "TEMPORARY SHIELD", color: 0x0088ff },
            { id: "WEAPON_SWAP", label: "WEAPON UPGRADED", color: 0xff0055 },
            { id: "HOMING_MISSILE", label: "+1 HOMING MISSILE", color: 0xbd00ff }
        ];

        // --- GLOBAL ENGINE & GAME STATE ---
        let scene, camera, renderer, playerShip, starParticlesSystem, planetMeshSystem, warpTunnelSystem, shieldBubbleMesh;
        let gameState = "TITLE";
        let score = 0, health = 100, maxHealth = 100, currentBiomeIndex = 0, quotaDefeated = 0;
        let isTransitioning = false, elapsedTime = 0, difficultyLevel = 0.5;

        // PLAYER ARSENAL & POWERUP STATES
        let activeWeaponType = "PLASMA"; // PLASMA, BEAM, SPREAD
        let cannonSpreadLevel = 1; // 1 to 3
        let tempShieldTimer = 0;
        let missileCount = 0;
        let lastMissileFireTime = 0;
        let isRightSideFiring = false;

        let currentBoss = null;

        let targetFogColor = new THREE.Color(BIOMES[0].fog);
        let currentFogColor = new THREE.Color(BIOMES[0].fog);

        const corridorSegments = [];
        const NUM_CORRIDOR_SEGMENTS = 12;
        const SEGMENT_LENGTH = 22;

        const playerLasers = [], enemyLasers = [], enemies = [], particleExplosions = [], powerUps = [], activeMissiles = [];
        let lastShotTime = 0, spawnTimer = 0;

        const currentAimWorldPoint = new THREE.Vector3(0, 0, -80);

        // FREE AIM & STEERING GYRO / TOUCH STATE
        let gyroPitch = 0, gyroRoll = 0, initialPitch = null, initialRoll = null;
        let reticleAimX = 0, reticleAimY = 0;
        let pointerTargetX = 0, pointerTargetY = 0, isTouchDragging = false;
        let previousPointerX = 0, previousPointerY = 0;

        // --- INITIALIZATION ---
        function initEngine() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('canvas3d'), antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            scene.fog = new THREE.FogExp2(BIOMES[0].fog, 0.0065);
            renderer.setClearColor(BIOMES[0].bg);

            const ambient = new THREE.AmbientLight(0xffffff, 0.75);
            scene.add(ambient);
            const sun = new THREE.DirectionalLight(0xffffff, 1.25);
            sun.position.set(10, 30, 20);
            scene.add(sun);

            buildStarfieldSystem();
            buildApproachingPlanet();
            buildWarpTunnel();

            playerShip = buildDetailedPlayerShip();
            playerShip.position.set(0, -1.0, -5);
            scene.add(playerShip);

            // Create Player Shield Bubble Mesh
            const shieldGeo = new THREE.IcosahedronGeometry(3.2, 2);
            const shieldMat = new THREE.MeshBasicMaterial({ color: 0x00aaff, wireframe: true, transparent: true, opacity: 0 });
            shieldBubbleMesh = new THREE.Mesh(shieldGeo, shieldMat);
            playerShip.add(shieldBubbleMesh);

            buildContinuousCorridorSegments();

            setupControls();
            window.addEventListener('resize', onWindowResize);
            
            requestAnimationFrame(animate);
        }

        // --- GREEBLE SURFACE BUILDER ---
        function createGreebleSurfaceGroup(width, height, length, isTech, isCanyon, isForest, isOrganic) {
            const group = new THREE.Group();
            
            if (isTech) {
                const baseMat = new THREE.MeshLambertMaterial({ color: 0x121a28, flatShading: true });
                const blockMatA = new THREE.MeshLambertMaterial({ color: 0x1c283c, flatShading: true });
                const blockMatB = new THREE.MeshLambertMaterial({ color: 0x090f18, flatShading: true });
                const pipeMat = new THREE.MeshLambertMaterial({ color: 0x00ffff, flatShading: true });

                const base = new THREE.Mesh(new THREE.BoxGeometry(width, height, length), baseMat);
                group.add(base);

                for (let i = 0; i < 20; i++) {
                    const type = Math.floor(Math.random() * 4);
                    const px = (Math.random() - 0.5) * (width * 0.85);
                    const pz = (Math.random() - 0.5) * (length * 0.85);

                    if (type === 0) {
                        const w = 1.0 + Math.random() * 3.0;
                        const h = 0.5 + Math.random() * 1.8;
                        const l = 1.5 + Math.random() * 4.0;
                        const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), blockMatA);
                        block.position.set(px, height / 2 + h / 2, pz);
                        group.add(block);
                    } else if (type === 1) {
                        const r = 0.15 + Math.random() * 0.3;
                        const pipe = new THREE.Mesh(new THREE.CylinderGeometry(r, r, length, 6), pipeMat);
                        pipe.rotation.x = Math.PI / 2;
                        pipe.position.set(px, height / 2 + r, 0);
                        group.add(pipe);
                    } else if (type === 2) {
                        const w = 1.5 + Math.random() * 2.5;
                        const h = 0.8 + Math.random() * 2.2;
                        const block = new THREE.Mesh(new THREE.BoxGeometry(w, h, w), blockMatB);
                        block.position.set(px, height / 2 + h / 2, pz);
                        group.add(block);
                    } else {
                        const rib = new THREE.Mesh(new THREE.BoxGeometry(width * 0.95, 0.4, 0.9), blockMatA);
                        rib.position.set(0, height / 2 + 0.2, pz);
                        group.add(rib);
                    }
                }
            } 
            else if (isCanyon) {
                const rockMat1 = new THREE.MeshLambertMaterial({ color: 0x48180a, flatShading: true });
                const rockMat2 = new THREE.MeshLambertMaterial({ color: 0x2e0e05, flatShading: true });

                const base = new THREE.Mesh(new THREE.BoxGeometry(width, height, length), rockMat1);
                group.add(base);

                for (let i = 0; i < 14; i++) {
                    const w = 2.0 + Math.random() * 4.0;
                    const h = 0.8 + Math.random() * 2.8;
                    const l = 2.5 + Math.random() * 5.0;
                    const px = (Math.random() - 0.5) * (width * 0.8);
                    const pz = (Math.random() - 0.5) * (length * 0.8);
                    const rock = new THREE.Mesh(new THREE.BoxGeometry(w, h, l), rockMat2);
                    rock.position.set(px, height / 2 + h / 2, pz);
                    group.add(rock);
                }
            } 
            else if (isForest) {
                const floorMat = new THREE.MeshLambertMaterial({ color: 0x1a330e, flatShading: true });
                const trunkMat = new THREE.MeshLambertMaterial({ color: 0x3d2611, flatShading: true });
                const leafMat = new THREE.MeshLambertMaterial({ color: 0x0d521f, flatShading: true });

                const base = new THREE.Mesh(new THREE.BoxGeometry(width, height, length), floorMat);
                group.add(base);

                for (let i = 0; i < 10; i++) {
                    const treeGroup = new THREE.Group();
                    const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.7, 5, 5), trunkMat);

        // --- CONTROLS WITH RIGHT-SIDE FIRING & DUAL GYRO/TOUCH AIMING ---
        function setupControls() {
            function handleOrientation(e) {
                if (e.beta === null || e.gamma === null) return;
                
                let rawBeta = e.beta;
                let rawGamma = e.gamma;
                let angle = (window.orientation !== undefined) ? window.orientation : (screen.orientation ? screen.orientation.angle : 0);
                
                let adjustedPitch = 0;
                let adjustedRoll = 0;

                if (angle === 90) {
                    adjustedPitch = -rawGamma;
                    adjustedRoll = rawBeta;
                } else if (angle === -90 || angle === 270) {
                    adjustedPitch = rawGamma;
                    adjustedRoll = -rawBeta;
                } else if (angle === 180) {
                    adjustedPitch = -rawBeta;
                    adjustedRoll = -rawGamma;
                } else {
                    adjustedPitch = rawBeta;
                    adjustedRoll = rawGamma;
                }

                if (initialPitch === null) {
                    initialPitch = adjustedPitch;
                    initialRoll = adjustedRoll;
                }

                let dPitch = adjustedPitch - initialPitch;
                let dRoll = adjustedRoll - initialRoll;

                if (dPitch > 180) dPitch -= 360;
                if (dPitch < -180) dPitch += 360;
                if (dRoll > 180) dRoll -= 360;
                if (dRoll < -180) dRoll += 360;

                dPitch = Math.max(-50, Math.min(50, dPitch));
                dRoll = Math.max(-50, Math.min(50, dRoll));

                gyroPitch = dPitch * 0.08;
                gyroRoll = dRoll * 0.08;
            }

            if ('ondeviceorientationabsolute' in window) window.addEventListener('deviceorientationabsolute', handleOrientation, true);
            else window.addEventListener('deviceorientation', handleOrientation, true);

            window.addEventListener('orientationchange', () => {
                initialPitch = null;
                initialRoll = null;
            });

            // SPLIT TOUCH ZONE HANDLING: LEFT SIDE = STEERING DRAG, RIGHT SIDE = HOLD TO FIRE
            window.addEventListener('pointerdown', (e) => {
                if (e.clientX > window.innerWidth * 0.48) {
                    isRightSideFiring = true;
                } else {
                    isTouchDragging = true;
                    previousPointerX = e.clientX;
                    previousPointerY = e.clientY;
                }
            });

            window.addEventListener('pointermove', (e) => {
                if (!isTouchDragging) return;
                const deltaX = e.clientX - previousPointerX;
                const deltaY = e.clientY - previousPointerY;
                previousPointerX = e.clientX; previousPointerY = e.clientY;
                
                pointerTargetX += deltaX * 0.06;
                pointerTargetY -= deltaY * 0.06;
            });

            const stopTouch = (e) => {
                if (e.clientX > window.innerWidth * 0.45) {
                    isRightSideFiring = false;
                }
                isTouchDragging = false;
            };

            window.addEventListener('pointerup', stopTouch);
            window.addEventListener('pointercancel', stopTouch);
        }

        function animate(time) {
            requestAnimationFrame(animate);

            if (gameState === "PLAYING") {
                elapsedTime += 0.016;
                
                difficultyLevel = 0.5 + (elapsedTime / 45) + (currentBiomeIndex * 0.22);
                
                const threatLabel = difficultyLevel < 1.2 ? "EASY" : (difficultyLevel < 2.0 ? "MEDIUM" : (difficultyLevel < 3.0 ? "HARD" : "EXTREME"));
                document.getElementById('threat-level-display').innerText = "THREAT: " + threatLabel;

                const currentBiome = BIOMES[currentBiomeIndex];
                const speed = currentBiome.speed;

                currentFogColor.lerp(targetFogColor, 0.04);
                scene.fog.color.copy(currentFogColor);
                renderer.setClearColor(currentFogColor);

                // Shield Timer Handling
                if (tempShieldTimer > 0) {
                    tempShieldTimer -= 0.016;
                    shieldBubbleMesh.material.opacity = 0.45 + Math.sin(time * 0.01) * 0.15;
                    shieldBubbleMesh.rotation.y += 0.03;
                } else {
                    shieldBubbleMesh.material.opacity = 0;
                }

                if (isTransitioning) {
                    warpTunnelSystem.material.opacity = Math.min(0.8, warpTunnelSystem.material.opacity + 0.05);
                    const pos = warpTunnelSystem.geometry.attributes.position.array;
                    for(let i=2; i<pos.length; i+=3) {
                        pos[i] += 8.0;
                        if(pos[i] > 10) pos[i] = -150;
                    }
                    warpTunnelSystem.geometry.attributes.position.needsUpdate = true;
                } else {
                    warpTunnelSystem.material.opacity = Math.max(0, warpTunnelSystem.material.opacity - 0.04);
                }

                for (let i = 0; i < corridorSegments.length; i++) {
                    const seg = corridorSegments[i];
                    seg.group.position.z += speed * 1.4;
                    
                    if (seg.group.position.z > 20) {
                        seg.group.position.z -= NUM_CORRIDOR_SEGMENTS * SEGMENT_LENGTH;
                        updateCorridorSegmentStyle(seg, currentBiome);
                    }
                }

                if (currentBiome.type === "planet" && planetMeshSystem.visible) {
                    const quotaPct = Math.min(1.0, quotaDefeated / currentBiome.quota);
                    const approachZ = -360 + quotaPct * 160;
                    planetMeshSystem.position.z += (approachZ - planetMeshSystem.position.z) * 0.04;
                    planetMeshSystem.rotation.y += 0.002;
                }

                // --- 1. FREE-AIM RETICLE & CENTERING SHIP CHASE LOGIC ---
                // Reticle moves freely across full wide boundaries driven by gyro + touch
                const aimLimitX = currentBiome.wallX * 1.35;
                const aimLimitY = currentBiome.wallY * 1.25;

                reticleAimX = pointerTargetX + gyroRoll * 12.0;
                reticleAimY = pointerTargetY - gyroPitch * 9.0;

                reticleAimX = Math.max(-aimLimitX, Math.min(aimLimitX, reticleAimX));
                reticleAimY = Math.max(-aimLimitY, Math.min(aimLimitY, reticleAimY));

                // Player ship smoothly chases aim target with inertia (stays mostly centered while guiding aim)
                playerShip.position.x += (reticleAimX * 0.85 - playerShip.position.x) * 0.08;
                playerShip.position.y += (reticleAimY * 0.82 - playerShip.position.y) * 0.08;
                
                playerShip.rotation.z = -(reticleAimX - playerShip.position.x) * 0.18;
                playerShip.rotation.x = (reticleAimY - playerShip.position.y) * 0.14;

                // --- 2. CAMERA TRACKING & SCREEN SHIFT ---
                const targetCamX = playerShip.position.x * 0.88;
                const targetCamY = playerShip.position.y * 0.82;
                
                camera.position.x += (targetCamX - camera.position.x) * 0.12;
                camera.position.y += (targetCamY - camera.position.y) * 0.12;
                
                camera.rotation.z = THREE.MathUtils.lerp(camera.rotation.z, -(playerShip.position.x - camera.position.x) * 0.04, 0.08);
                camera.rotation.x = THREE.MathUtils.lerp(camera.rotation.x, -(playerShip.position.y - camera.position.y) * 0.04, 0.08);

                // --- 3. DYNAMIC RETICLE PROJECTED ONTO 2D HUD ---
                currentAimWorldPoint.set(reticleAimX, reticleAimY, -80);
                
                const aimProj = currentAimWorldPoint.clone().project(camera);
                const reticleScreenX = (aimProj.x * 0.5 + 0.5) * window.innerWidth;
                const reticleScreenY = (-aimProj.y * 0.5 + 0.5) * window.innerHeight;

                const reticleEl = document.getElementById('reticle');
                if (reticleEl) {
                    reticleEl.style.left = `${reticleScreenX}px`;
                    reticleEl.style.top = `${reticleScreenY}px`;
                }

                // --- 4. MANUAL CANNON FIRING (HOLD RIGHT SIDE OF SCREEN) ---
                const fireInterval = activeWeaponType === "BEAM" ? 75 : (activeWeaponType === "SPREAD" ? 180 : 130);
                if (isRightSideFiring && (time - lastShotTime > fireInterval)) {
                    firePlayerLaser();
                    lastShotTime = time;
                }

                // --- 5. AUTOMATIC HOMING MISSILE SYSTEM (FIRED EVERY 2.5s IF STACKED) ---
                if (missileCount > 0 && (time - lastMissileFireTime > 2500)) {
                    fireHomingMissiles();
                    lastMissileFireTime = time;
                }

                // --- 6. UPDATE HOMING MISSILES ---
                for (let i = activeMissiles.length - 1; i >= 0; i--) {
                    const m = activeMissiles[i];
                    let targetPos = null;

                    if (currentBoss) targetPos = currentBoss.mesh.position;
                    else if (enemies.length > 0) targetPos = enemies[0].mesh.position;

                    if (targetPos) {
                        const desiredDir = new THREE.Vector3().subVectors(targetPos, m.mesh.position).normalize();
                        m.dir.lerp(desiredDir, 0.12).normalize();
                    }

                    m.mesh.position.addScaledVector(m.dir, 3.5);
                    m.mesh.rotation.x += 0.1;

                    // Missile collision with minion
                    for (let j = enemies.length - 1; j >= 0; j--) {
                        const e = enemies[j];
                        if (m.mesh.position.distanceTo(e.mesh.position) < 2.5) {
                            createExplosion(e.mesh.position);
                            if (Math.random() < 0.22) spawnPowerUpDrop(e.mesh.position);
                            scene.remove(e.mesh); enemies.splice(j, 1);
                            scene.remove(m.mesh); activeMissiles.splice(i, 1);
                            score += 150; quotaDefeated++;
                            sfx.playExplosion(); updateHUD();
                            break;
                        }
                    }

                    // Missile collision with boss
                    if (currentBoss && m.mesh && m.mesh.position.distanceTo(currentBoss.mesh.position) < 6.5) {
                        createExplosion(m.mesh.position);
                        scene.remove(m.mesh); activeMissiles.splice(i, 1);
                        currentBoss.hp -= 3;
                        score += 150;
                        sfx.playExplosion();
                        const pct = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100);
                        document.getElementById('boss-bar-fill').style.width = pct + '%';
                    } else if (m.mesh && m.mesh.position.z < -240) {
                        scene.remove(m.mesh); activeMissiles.splice(i, 1);
                    }
                }

                // --- 7. UPDATE POWERUP DROPS & PLAYER PICKUP CHECK ---
                for (let i = powerUps.length - 1; i >= 0; i--) {
                    const p = powerUps[i];
                    p.mesh.position.z += speed * 0.9;
                    p.mesh.rotation.y += 0.04;
                    p.mesh.rotation.x += 0.02;

                    // Collect powerup
                    if (p.mesh.position.distanceTo(playerShip.position) < 2.8) {
                        applyPowerUp(p.type);
                        scene.remove(p.mesh); powerUps.splice(i, 1);
                        continue;
                    }

                    if (p.mesh.position.z > 10) {
                        scene.remove(p.mesh); powerUps.splice(i, 1);
                    }
                }

                // --- 8. SPAWN MINIONS OR CHECK BOSS SPAWN ---
                if (quotaDefeated >= currentBiome.quota && !currentBoss && !isTransitioning) {
                    currentBoss = createBossForLocation(currentBiomeIndex);
                    document.getElementById('boss-name').innerText = currentBiome.bossName;
                    document.getElementById('boss-hud-container').style.opacity = '1';
                    
                    const alertEl = document.getElementById('hud-center-alert');
                    alertEl.innerText = "WARNING: BOSS ENGAGED";
                    alertEl.style.opacity = '1';
                    setTimeout(() => alertEl.style.opacity = '0', 1800);
                } 
                else if (!currentBoss && !isTransitioning) {
                    spawnTimer++;
                    const maxEnemies = Math.min(8, Math.floor(3 + difficultyLevel * 2));
                    const spawnInterval = Math.max(28, Math.floor(70 - difficultyLevel * 8));
                    if (spawnTimer % spawnInterval === 0 && enemies.length < maxEnemies) {
                        spawnEnemy();
                    }
                }

                // --- 9. BOSS COMBAT LOOP & AI ---
                if (currentBoss) {
                    if (currentBoss.mesh.position.z < -50) {
                        currentBoss.mesh.position.z += 2.0;
                    } else {
                        currentBoss.mesh.position.x = Math.sin(time * 0.002) * (currentBiome.wallX * 0.6);
                        currentBoss.mesh.position.y = Math.cos(time * 0.0025) * (currentBiome.wallY * 0.4);
                    }
                    currentBoss.mesh.rotation.y += 0.01;

                    if (time - currentBoss.lastFireTime > currentBoss.fireInterval) {
                        fireBossSalvo(currentBoss);
                        currentBoss.lastFireTime = time;
                    }

                    for (let j = playerLasers.length - 1; j >= 0; j--) {
                        const l = playerLasers[j];
                        if (l.mesh.position.distanceTo(currentBoss.mesh.position) < 6.5) {
                            createExplosion(l.mesh.position);
                            scene.remove(l.mesh); playerLasers.splice(j, 1);
                            
                            currentBoss.hp--;
                            score += 50;
                            sfx.playExplosion();

                            const pct = Math.max(0, (currentBoss.hp / currentBoss.maxHp) * 100);
                            document.getElementById('boss-bar-fill').style.width = pct + '%';

                            if (currentBoss.hp <= 0) {
                                for(let x=0; x<12; x++) createExplosion(currentBoss.mesh.position);
                                scene.remove(currentBoss.mesh);
                                currentBoss = null;
                                score += 5000;
                                document.getElementById('boss-hud-container').style.opacity = '0';
                                
                                triggerSectorTransition();
                                break;
                            }
                        }
                    }
                }

                // --- 10. UPDATE PLAYER LASERS ---
                for (let i = playerLasers.length - 1; i >= 0; i--) {
                    const l = playerLasers[i];
                    l.mesh.position.addScaledVector(l.dir, 4.2);
                    if (l.mesh.position.z < -240) {
                        scene.remove(l.mesh); playerLasers.splice(i, 1);
                    }
                }

                // --- 11. UPDATE ENEMY LASERS ---
                for (let i = enemyLasers.length - 1; i >= 0; i--) {
                    const el = enemyLasers[i];
                    el.mesh.position.addScaledVector(el.dir, el.speed);

                    if (el.mesh.position.distanceTo(playerShip.position) < 1.6) {
                        scene.remove(el.mesh); enemyLasers.splice(i, 1);
                        triggerPlayerDamage(6 + Math.floor(difficultyLevel * 2));
                        continue;
                    }

                    if (el.mesh.position.z > 10) {
                        scene.remove(el.mesh); enemyLasers.splice(i, 1);
                    }
                }

                // --- 12. UPDATE MINION ENEMIES ---
                for (let i = enemies.length - 1; i >= 0; i--) {
                    const e = enemies[i];
                    e.mesh.position.z += speed * 0.65;
                    e.mesh.rotation.x += 0.02; e.mesh.rotation.y += 0.03;

                    if (time - e.lastFireTime > e.fireInterval) {
                        fireEnemyLaser(e);
                        e.lastFireTime = time;
                    }

                    for (let j = playerLasers.length - 1; j >= 0; j--) {
                        const l = playerLasers[j];
                        if (l.mesh.position.distanceTo(e.mesh.position) < 2.2) {
                            createExplosion(e.mesh.position);
                            if (Math.random() < 0.22) spawnPowerUpDrop(e.mesh.position);
                            scene.remove(e.mesh); enemies.splice(i, 1);
                            scene.remove(l.mesh); playerLasers.splice(j, 1);
                            
                            score += 150;
                            quotaDefeated++;
                            sfx.playExplosion();
                            updateHUD();
                            break;
                        }
                    }

                    if (e && e.mesh.position.distanceTo(playerShip.position) < 1.8) {
                        createExplosion(e.mesh.position);
                        scene.remove(e.mesh); enemies.splice(i, 1);
                        triggerPlayerDamage(15);
                    } else if (e && e.mesh.position.z > 5) {
                        scene.remove(e.mesh); enemies.splice(i, 1);
                    }
                }

                // --- 13. UPDATE EXPLOSIONS ---
                for (let i = particleExplosions.length - 1; i >= 0; i--) {
                    const p = particleExplosions[i];
                    p.mesh.position.add(p.vel);
                    p.mesh.scale.multiplyScalar(0.91);
                    if (p.mesh.scale.x < 0.04) {
                        scene.remove(p.mesh); particleExplosions.splice(i, 1);
                    }
                }
            }

            renderer.render(scene, camera);
        }

        function applyPowerUp(pType) {
            sfx.playPowerup();
            triggerPowerupPopup(pType.label);

            switch(pType.id) {
                case "HEALTH":
                    health = Math.min(maxHealth, health + 25);
                    break;
                case "MAX_HP":
                    maxHealth += 25;
                    health += 25;
                    break;
                case "SPREAD":
                    cannonSpreadLevel = Math.min(3, cannonSpreadLevel + 1);
                    break;
                case "TEMP_SHIELD":
                    tempShieldTimer = 8.0;
                    break;
                case "WEAPON_SWAP":
                    if (activeWeaponType === "PLASMA") activeWeaponType = "SPREAD";
                    else if (activeWeaponType === "SPREAD") activeWeaponType = "BEAM";
                    else activeWeaponType = "PLASMA";
                    break;
                case "HOMING_MISSILE":
                    missileCount++;
                    break;
            }
            updateHUD();
        }

        function firePlayerLaser() {
            const geo = new THREE.CylinderGeometry(0.08, 0.08, 1.8);
            const matColor = activeWeaponType === "BEAM" ? 0xffff00 : (activeWeaponType === "SPREAD" ? 0xff0055 : 0x00ffcc);
            const mat = new THREE.MeshBasicMaterial({ color: matColor });

            const startPosList = [];
            
            if (cannonSpreadLevel === 1) {
                startPosList.push(new THREE.Vector3(playerShip.position.x - 2.2, playerShip.position.y, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 2.2, playerShip.position.y, playerShip.position.z - 1));
            } else if (cannonSpreadLevel === 2) {
                startPosList.push(new THREE.Vector3(playerShip.position.x - 2.4, playerShip.position.y, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x, playerShip.position.y + 0.4, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 2.4, playerShip.position.y, playerShip.position.z - 1));
            } else {
                startPosList.push(new THREE.Vector3(playerShip.position.x - 2.8, playerShip.position.y - 0.2, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x - 1.0, playerShip.position.y + 0.4, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 1.0, playerShip.position.y + 0.4, playerShip.position.z - 1));
                startPosList.push(new THREE.Vector3(playerShip.position.x + 2.8, playerShip.position.y - 0.2, playerShip.position.z - 1));
            }

            startPosList.forEach((start, idx) => {
                const aimOffset = currentAimWorldPoint.clone();
                if (activeWeaponType === "SPREAD") {
                    const offsetVal = (idx - (startPosList.length - 1) / 2) * 12.0;
                    aimOffset.x += offsetVal;
                }

                const dir = new THREE.Vector3().subVectors(aimOffset, start).normalize();
                const laser = new THREE.Mesh(geo, mat);
                laser.rotation.x = Math.PI / 2;
                laser.position.copy(start);

                scene.add(laser);
                playerLasers.push({ mesh: laser, dir: dir });
            });

            sfx.playLaser(activeWeaponType);
        }

        function fireHomingMissiles() {
            sfx.playMissileLaunch();
            for(let i=0; i<missileCount; i++) {
                const geo = new THREE.ConeGeometry(0.3, 1.4, 5);
                geo.rotateX(-Math.PI / 2);
                const mat = new THREE.MeshLambertMaterial({ color: 0xbd00ff, flatShading: true });
                const missile = new THREE.Mesh(geo, mat);

                missile.position.copy(playerShip.position);
                missile.position.x += (i - (missileCount - 1) / 2) * 1.5;

                const dir = new THREE.Vector3(0, 0, -1);
                scene.add(missile);
                activeMissiles.push({ mesh: missile, dir: dir });
            }
        }

        function fireEnemyLaser(enemy) {
            const geo = new THREE.CylinderGeometry(0.12, 0.12, 2.2, 6);
            geo.rotateX(Math.PI / 2);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055 });
            const laser = new THREE.Mesh(geo, mat);
            laser.position.copy(enemy.mesh.position);

            const dir = new THREE.Vector3().subVectors(playerShip.position, enemy.mesh.position).normalize();
            const shotSpeed = 1.1 + difficultyLevel * 0.25;

            scene.add(laser);
            enemyLasers.push({ mesh: laser, dir: dir, speed: shotSpeed });
            sfx.playEnemyLaser();
        }

        function fireBossSalvo(boss) {
            for(let i = -1; i <= 1; i += 2) {
                const geo = new THREE.CylinderGeometry(0.18, 0.18, 2.8, 6);
                geo.rotateX(Math.PI / 2);
                const mat = new THREE.MeshBasicMaterial({ color: 0xffff00 });
                const laser = new THREE.Mesh(geo, mat);
                laser.position.copy(boss.mesh.position);
                laser.position.x += i * 2.5;

                const dir = new THREE.Vector3().subVectors(playerShip.position, laser.position).normalize();
                scene.add(laser);
                enemyLasers.push({ mesh: laser, dir: dir, speed: 1.5 + difficultyLevel * 0.2 });
            }
            sfx.playEnemyLaser();
        }

        function spawnEnemy() {
            const enemyMesh = createLocationEnemy(currentBiomeIndex);
            const currentBiome = BIOMES[currentBiomeIndex];
            
            enemyMesh.position.set(
                (Math.random() - 0.5) * (currentBiome.wallX * 1.3),
                (Math.random() - 0.5) * (currentBiome.wallY * 1.2),
                -180
            );

            const fireInterval = Math.max(1200, 4500 - difficultyLevel * 450 + Math.random() * 600);

            scene.add(enemyMesh);
            enemies.push({ mesh: enemyMesh, lastFireTime: performance.now(), fireInterval: fireInterval });
        }

        function createExplosion(pos) {
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0055, wireframe: true });
            for (let i = 0; i < 9; i++) {
                const p = new THREE.Mesh(new THREE.TetrahedronGeometry(0.45), mat);
                p.position.copy(pos);
                const vel = new THREE.Vector3((Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.7, (Math.random() - 0.5) * 0.7);
                scene.add(p);
                particleExplosions.push({ mesh: p, vel: vel });
            }
        }

        function triggerPlayerDamage(amount) {
            if (tempShieldTimer > 0) return; // Invulnerable while shield active!

            health -= amount;
            sfx.playPlayerHit();
            
            const overlay = document.getElementById('damage-overlay');
            overlay.style.background = 'rgba(255, 0, 85, 0.45)';
            setTimeout(() => overlay.style.background = 'rgba(255, 0, 85, 0)', 120);

            updateHUD();
            if (health <= 0) triggerGameOver();
        }

        function triggerSectorTransition() {
            isTransitioning = true;
            sfx.playWarp();
            
            const alertEl = document.getElementById('hud-center-alert');
            alertEl.innerText = "BOSS DESTROYED! WARPING...";
            alertEl.style.opacity = '1';

            setTimeout(() => {
                quotaDefeated = 0;
                currentBiomeIndex = (currentBiomeIndex + 1) % BIOMES.length;
                updateBiomeVisualsSmooth();
                
                setTimeout(() => {
                    alertEl.style.opacity = '0';
                    isTransitioning = false;
                    updateHUD();
                }, 800);
            }, 1200);
        }

        function updateHUD() {
            document.getElementById('score-display').innerText = score;
            document.getElementById('health-bar-fill').style.width = Math.max(0, (health / maxHealth) * 100) + '%';
            document.getElementById('weapon-display').innerText = `WEAPON: ${activeWeaponType} (LVL ${cannonSpreadLevel})`;
            document.getElementById('missile-display').innerText = `MISSILES: ${missileCount}`;
            
            const targetQuota = BIOMES[currentBiomeIndex].quota;
            const pct = Math.min(100, (quotaDefeated / targetQuota) * 100);
            document.getElementById('quota-bar-fill').style.width = pct + '%';
        }

        function triggerGameOver() {
            gameState = "GAMEOVER";
            saveHighScore(score);
            document.getElementById('hud').style.display = 'none';
            document.getElementById('final-score-text').innerText = "FINAL SCORE: " + score;
            document.getElementById('game-over-screen').style.display = 'flex';
        }

        function returnToTitle() {
            gameState = "TITLE";
            document.getElementById('game-over-screen').style.display = 'none';
            document.getElementById('title-screen').style.display = 'flex';
        }

        // --- HIGH SCORES LOCALSTORAGE ---
        function getHighScores() {
            return JSON.parse(localStorage.getItem('POLYWING_HIGH_SCORES') || '[8500, 6000, 4200, 2500, 1000]');
        }

        function saveHighScore(newScore) {
            let scores = getHighScores();
            scores.push(newScore);
            scores.sort((a, b) => b - a);
            scores = scores.slice(0, 5);
            localStorage.setItem('POLYWING_HIGH_SCORES', JSON.stringify(scores));
        }

        function showHighScores() {
            const scores = getHighScores();
            const container = document.getElementById('score-list-content');
            container.innerHTML = scores.map((s, i) => `<div class="score-item"><span>RANK 0${i+1}</span><span>${s} PTS</span></div>`).join('');
            document.getElementById('high-scores-modal').style.display = 'flex';
        }

        function hideHighScores() {
            document.getElementById('high-scores-modal').style.display = 'none';
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        window.addEventListener('DOMContentLoaded', initEngine);
    </script>
</body>
</html>
