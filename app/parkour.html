<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VelocityX - 2.5D Parkour Action</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; overflow: hidden; }
        body, html { width: 100%; height: 100%; background: #050508; font-family: monospace; color: #fff; }
        #canvas { display: block; width: 100vw; height: 100vh; }
        #ui { position: absolute; top: 20px; left: 20px; pointer-events: none; z-index: 10; }
        #net-panel { position: absolute; top: 20px; right: 20px; background: rgba(0,0,0,0.8); padding: 15px; border: 1px solid #333; border-radius: 8px; z-index: 10; }
        input, button { background: #222; border: 1px solid #555; color: #fff; padding: 5px 10px; cursor: pointer; }
        .hud-bar { width: 200px; height: 15px; background: #333; margin-top: 5px; border-radius: 3px; }
        .hud-fill { height: 100%; width: 100%; background: #00ffcc; transition: width 0.1s; }
    </style>
</head>
<body>
    <div id="ui">
        <h2>VELOCITY-X</h2>
        <div>HEALTH</div>
        <div class="hud-bar"><div id="hp" class="hud-fill"></div></div>
        <div style="margin-top:10px;">SLOT 1 (RANGED): <span id="w-ranged">Handgun</span></div>
        <div>SLOT 2 (MELEE): <span id="w-melee">Katana</span></div>
        <div style="margin-top:10px; color:#aaa; font-size:12px;">
            [A/D] Move | [W/Space] Jump | [S] Slide | [E] Pick/Drop | [L-Click] Ranged | [R-Click] Melee
        </div>
    </div>

    <div id="net-panel">
        <div><strong>P2P MULTIPLAYER</strong></div>
        <div id="my-id">ID: Connecting...</div>
        <input type="text" id="peer-id-input" placeholder="Enter Host ID">
        <button onclick="connectToHost()">Connect</button>
    </div>

    <canvas id="canvas"></canvas>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let width = canvas.width = window.innerWidth;
let height = canvas.height = window.innerHeight;

window.addEventListener('resize', () => {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
});

// --- ENGINE CONFIG & CONSTANTS ---
const GRAVITY = 0.6;
const WORLD_SIZE = { width: 8000, height: 2000 };
const KEYS = {};

// --- WEAPON DATA ---
const WEAPONS = {
    handgun: { type: 'ranged', name: 'Handgun', fireRate: 15, damage: 15, speed: 20, color: '#ffcc00' },
    railgun: { type: 'ranged', name: 'Railgun', fireRate: 45, damage: 70, speed: 40, color: '#00ffff' },
    katana:  { type: 'melee',  name: 'Katana',  cooldown: 12, damage: 40, range: 60, color: '#ff0055' },
    bat:     { type: 'melee',  name: 'Baseball Bat', cooldown: 20, damage: 25, range: 50, color: '#brown' }
};

// --- PROCEDURAL WORLD GENERATION ---
const platforms = [];
const worldItems = [];

function generateWorld() {
    // Base floor
    platforms.push({ x: 0, y: 1600, w: WORLD_SIZE.width, h: 400, depth: 80 });

    // Procedural Parkour Structures
    let currX = 300;
    while (currX < WORLD_SIZE.width - 500) {
        let pWidth = 150 + Math.random() * 300;
        let pHeight = 200 + Math.random() * 400;
        let pY = 1600 - pHeight;
        
        platforms.push({ x: currX, y: pY, w: pWidth, h: pHeight, depth: 40 + Math.random() * 60 });

        // Random Weapon Drop
        if (Math.random() > 0.5) {
            const keys = Object.keys(WEAPONS);
            worldItems.push({
                type: keys[Math.floor(Math.random() * keys.length)],
                x: currX + pWidth / 2,
                y: pY - 30,
                vx: 0, vy: 0
            });
        }
        currX += pWidth + 80 + Math.random() * 180; // Gap for parkour wall jumps
    }
}
generateWorld();

// --- PLAYER CLASS ---
class Player {
    constructor(x, y, isLocal = false) {
        this.x = x; this.y = y;
        this.w = 30; this.h = 60;
        this.vx = 0; this.vy = 0;
        this.speed = 8;
        this.hp = 100;
        
        // State Flags
        this.isGrounded = false;
        this.isWallSliding = false;
        this.wallDir = 0;
        this.isLedgeGrabbing = false;
        this.isSliding = false;
        
        this.isLocal = isLocal;
        this.inventory = { ranged: 'handgun', melee: 'katana' };
        this.activeSlot = 'ranged';
        this.attackTimer = 0;
    }

    update() {
        if (this.attackTimer > 0) this.attackTimer--;

        // Parkour Mechanics & Physics
        if (!this.isLedgeGrabbing) {
            this.vy += GRAVITY;
        } else {
            this.vy = 0; this.vx = 0;
        }

        // Horizontal Movement / Friction
        if (this.isSliding) {
            this.vx *= 0.96;
            if (Math.abs(this.vx) < 1) this.isSliding = false;
        } else {
            this.vx *= 0.85;
        }

        this.x += this.vx;
        this.handleCollision(true); // Horizontal
        this.y += this.vy;
        this.handleCollision(false); // Vertical

        // Wall Slide Decay
        if (this.isWallSliding && this.vy > 2) this.vy = 2;
    }

    handleCollision(isHorizontal) {
        this.isGrounded = false;
        this.isWallSliding = false;

        for (let p of platforms) {
            if (this.x < p.x + p.w && this.x + this.w > p.x &&
                this.y < p.y + p.h && this.y + this.h > p.y) {
                
                if (isHorizontal) {
                    if (this.vx > 0) {
                        this.x = p.x - this.w;
                        this.wallDir = 1;
                    } else if (this.vx < 0) {
                        this.x = p.x + p.w;
                        this.wallDir = -1;
                    }
                    if (!this.isGrounded && KEYS['KeyA'] || KEYS['KeyD']) {
                        this.isWallSliding = true;
                    }
                } else {
                    if (this.vy > 0) {
                        this.y = p.y - this.h;
                        this.vy = 0;
                        this.isGrounded = true;
                    } else if (this.vy < 0) {
                        this.y = p.y + p.h;
                        this.vy = 0;
                    }
                }
            }
        }
    }

    jump() {
        if (this.isGrounded) {
            this.vy = -14;
        } else if (this.isWallSliding) {
            this.vy = -13;
            this.vx = -this.wallDir * 12; // Wall Jump bounce
        } else if (this.isLedgeGrabbing) {
            this.vy = -14;
            this.isLedgeGrabbing = false;
        }
    }

    slide() {
        if (this.isGrounded && !this.isSliding && Math.abs(this.vx) > 2) {
            this.isSliding = true;
            this.vx *= 1.8;
        }
    }

    draw(camX, camY) {
        // 2.5D Pseudo Depth Rendering
        const px = this.x - camX;
        const py = this.y - camY;

        // Shadow / Projection
        ctx.fillStyle = 'rgba(0,0,0,0.4)';
        ctx.fillRect(px + 10, py + 10, this.w, this.h);

        // Body Character Frame
        ctx.fillStyle = this.isLocal ? '#00ffcc' : '#ff0055';
        ctx.fillRect(px, py, this.w, this.isSliding ? this.h / 2 : this.h);
    }
}

// --- PROJECTILE & EFFECT SYSTEM ---
const projectiles = [];
function fireRanged(player, targetX, targetY) {
    const wData = WEAPONS[player.inventory.ranged];
    if (player.attackTimer > 0 || !wData) return;

    const angle = Math.atan2(targetY - (player.y - camera.y + 30), targetX - (player.x - camera.x + 15));
    projectiles.push({
        x: player.x + 15, y: player.y + 30,
        vx: Math.cos(angle) * wData.speed,
        vy: Math.sin(angle) * wData.speed,
        damage: wData.damage, color: wData.color,
        life: 100
    });
    player.attackTimer = wData.fireRate;
}

// --- CAMERA ENGINE ---
const camera = { x: 0, y: 0 };
const localPlayer = new Player(100, 1400, true);
const remotePlayers = {};

// --- INPUT LISTENERS ---
window.addEventListener('keydown', e => {
    KEYS[e.code] = true;
    if (e.code === 'KeyW' || e.code === 'Space') localPlayer.jump();
    if (e.code === 'KeyS') localPlayer.slide();
    if (e.code === 'KeyE') pickupOrDropItem();
});
window.addEventListener('keyup', e => KEYS[e.code] = false);
window.addEventListener('mousedown', e => {
    if (e.button === 0) fireRanged(localPlayer, e.clientX, e.clientY);
});
window.addEventListener('contextmenu', e => e.preventDefault());

function pickupOrDropItem() {
    // Pick up nearest item logic
    for (let i = worldItems.length - 1; i >= 0; i--) {
        let it = worldItems[i];
        if (Math.hypot(it.x - localPlayer.x, it.y - localPlayer.y) < 60) {
            let type = WEAPONS[it.type].type;
            localPlayer.inventory[type] = it.type;
            document.getElementById(`w-${type}`).innerText = WEAPONS[it.type].name;
            worldItems.splice(i, 1);
            break;
        }
    }
}

// --- GAME LOOP ---
function loop() {
    // Local Inputs
    if (KEYS['KeyA']) localPlayer.vx = -localPlayer.speed;
    if (KEYS['KeyD']) localPlayer.vx = localPlayer.speed;

    localPlayer.update();

    // Camera follow (Smooth lerp)
    camera.x += (localPlayer.x - width / 2 - camera.x) * 0.1;
    camera.y += (localPlayer.y - height / 2 - camera.y) * 0.1;

    // Clear Screen
    ctx.fillStyle = '#0a0a10';
    ctx.fillRect(0, 0, width, height);

    // Render 2.5D Environment (Platforms with extrusion depth)
    for (let p of platforms) {
        if (p.x + p.w < camera.x || p.x > camera.x + width) continue;
        
        let rx = p.x - camera.x;
        let ry = p.y - camera.y;

        // Extrusion (2.5D Depth)
        ctx.fillStyle = '#111122';
        ctx.beginPath();
        ctx.moveTo(rx, ry + p.h);
        ctx.lineTo(rx + p.depth, ry + p.h + p.depth);
        ctx.lineTo(rx + p.w + p.depth, ry + p.h + p.depth);
        ctx.lineTo(rx + p.w, ry + p.h);
        ctx.fill();

        // Front Face
        ctx.fillStyle = '#1e1e30';
        ctx.fillRect(rx, ry, p.w, p.h);
        ctx.strokeStyle = '#00ffcc';
        ctx.strokeRect(rx, ry, p.w, p.h);
    }

    // Render Items
    for (let it of worldItems) {
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(it.x - camera.x, it.y - camera.y, 15, 15);
    }

    // Render Projectiles
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.x += p.vx; p.y += p.vy; p.life--;
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x - camera.x, p.y - camera.y, 6, 6);
        if (p.life <= 0) projectiles.splice(i, 1);
    }

    // Render Players
    localPlayer.draw(camera.x, camera.y);
    for (let id in remotePlayers) {
        remotePlayers[id].draw(camera.x, camera.y);
    }

    // Sync state over PeerJS if connected
    broadcastState();

    requestAnimationFrame(loop);
}

// --- WEBRTC / PEERJS NETWORKING ---
let peer = new Peer();
let connections = [];

peer.on('open', id => {
    document.getElementById('my-id').innerText = `ID: ${id}`;
});

peer.on('connection', conn => {
    setupConnection(conn);
});

function connectToHost() {
    const hostId = document.getElementById('peer-id-input').value;
    const conn = peer.connect(hostId);
    setupConnection(conn);
}

function setupConnection(conn) {
    connections.push(conn);
    conn.on('data', data => {
        if (!remotePlayers[conn.peer]) {
            remotePlayers[conn.peer] = new Player(data.x, data.y, false);
        }
        Object.assign(remotePlayers[conn.peer], data);
    });
}

function broadcastState() {
    const state = { x: localPlayer.x, y: localPlayer.y, vx: localPlayer.vx, vy: localPlayer.vy, isSliding: localPlayer.isSliding };
    connections.forEach(conn => conn.open && conn.send(state));
}

loop();
</script>
</body>
</html>
